<!DOCTYPE html><html lang="sl">
<head>
  <meta charset="UTF-8">
  <title>Klepetalnica</title>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js"></script>
  <script src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }#mainContainer {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#userListContainer {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.user-item {
  display: flex;
  align-items: center;
  padding: 8px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

.user-item model-viewer {
  width: 40px;
  height: 40px;
  margin-right: 10px;
}

.user-info {
  display: flex;
  flex-direction: column;
}

#chatContainer {
  display: none;
  flex-direction: column;
  height: 100%;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  border-top: 1px solid #ccc;
  border-bottom: 1px solid #ccc;
}

#inputContainer {
  display: flex;
  padding: 10px;
}

#messageInput {
  flex: 1;
  padding: 10px;
}

#sendBtn {
  padding: 10px;
  margin-left: 5px;
}

#dock {
  display: flex;
  justify-content: space-around;
  border-top: 1px solid #ccc;
  padding: 10px;
}

#profileContainer {
  display: none;
  flex-direction: column;
  padding: 10px;
}

#profileContainer input, #profileContainer select {
  margin-bottom: 10px;
  padding: 8px;
  width: 100%;
}

  </style>
</head>
<body>
  <div id="mainContainer">
    <div id="userListContainer"></div><div id="chatContainer">
  <div id="messages"></div>
  <div id="inputContainer">
    <input type="text" id="messageInput" placeholder="Vnesi sporočilo">
    <button id="sendBtn">Pošlji</button>
  </div>
</div>

<div id="profileContainer">
  <model-viewer id="myAvatar" camera-controls></model-viewer>
  <input id="myBio" placeholder="Vnesi svoj bio">
  <select id="myStatus">
    <option value="">Izberi status</option>
    <option value="samski">Samski</option>
    <option value="v zvezi">V zvezi</option>
    <option value="porocen">Poročen</option>
    <option value="locen">Ločen</option>
  </select>
  <input id="myBirthdate" type="date">
  <button id="saveProfileBtn">Shrani profil</button>
</div>

<div id="dock">
  <button id="dockUsers">Seznam</button>
  <button id="dockProfile">Moj profil</button>
</div>

  </div>  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js';
    import { getDatabase, ref, onChildAdded, push, set, get, update } from 'https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth();

    let currentUser = null;
    let currentChatKey = 'messages';

    const userListContainer = document.getElementById('userListContainer');
    const chatContainer = document.getElementById('chatContainer');
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const dockUsers = document.getElementById('dockUsers');
    const dockProfile = document.getElementById('dockProfile');
    const profileContainer = document.getElementById('profileContainer');
    const myAvatar = document.getElementById('myAvatar');
    const myBio = document.getElementById('myBio');
    const myStatus = document.getElementById('myStatus');
    const myBirthdate = document.getElementById('myBirthdate');
    const saveProfileBtn = document.getElementById('saveProfileBtn');

    signInAnonymously(auth);

    onAuthStateChanged(auth, user => {
      if (user) {
        currentUser = user.uid;
        loadUsers();
        loadMyProfile();
        listenForMessages(currentChatKey);
      }
    });

    function loadUsers() {
      get(ref(db, 'uporabniki')).then(snapshot => {
        userListContainer.innerHTML = '';
        snapshot.forEach(childSnap => {
          const uid = childSnap.key;
          const user = childSnap.val();
          if (uid !== currentUser) {
            const userDiv = document.createElement('div');
            userDiv.className = 'user-item';

            const model = document.createElement('model-viewer');
            model.setAttribute('src', user.avatarURL2 || '');
            model.setAttribute('camera-controls', '');
            userDiv.appendChild(model);

            const info = document.createElement('div');
            info.className = 'user-info';
            info.innerHTML = `<strong>${user.displayName || uid}</strong><small>${user.bio || ''}</small>`;
            userDiv.appendChild(info);

            userDiv.onclick = () => openPrivateChat(uid);
            userListContainer.appendChild(userDiv);
          }
        });
      });
    }

    function openPrivateChat(uid2) {
      const chatId = [currentUser, uid2].sort().join('_');
      currentChatKey = 'privatemsgs/' + chatId;
      messagesDiv.innerHTML = '';
      chatContainer.style.display = 'flex';
      userListContainer.style.display = 'none';
      profileContainer.style.display = 'none';
      listenForMessages(currentChatKey);
    }

    function listenForMessages(path) {
      messagesDiv.innerHTML = '';
      const chatRef = ref(db, path);
      onChildAdded(chatRef, snapshot => {
        const msg = snapshot.val();
        const div = document.createElement('div');
        div.textContent = msg.sender + ': ' + msg.text;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      });
    }

    sendBtn.onclick = () => {
      const text = messageInput.value.trim();
      if (text) {
        const msgRef = push(ref(db, currentChatKey));
        set(msgRef, {
          sender: currentUser,
          text,
          timestamp: Date.now()
        });
        messageInput.value = '';
      }
    };

    dockUsers.onclick = () => {
      userListContainer.style.display = 'block';
      profileContainer.style.display = 'none';
      chatContainer.style.display = 'none';
    };

    dockProfile.onclick = () => {
      profileContainer.style.display = 'flex';
      userListContainer.style.display = 'none';
      chatContainer.style.display = 'none';
    };

    saveProfileBtn.onclick = () => {
      update(ref(db, 'uporabniki/' + currentUser), {
        bio: myBio.value,
        status: myStatus.value,
        birthdate: myBirthdate.value
      });
    };

    function loadMyProfile() {
      get(ref(db, 'uporabniki/' + currentUser)).then(snapshot => {
        const user = snapshot.val();
        if (user) {
          if (user.avatarURL2) myAvatar.setAttribute('src', user.avatarURL2);
          if (user.bio) myBio.value = user.bio;
          if (user.status) myStatus.value = user.status;
          if (user.birthdate) myBirthdate.value = user.birthdate;
        }
      });
    }
  </script></body>
</html>
