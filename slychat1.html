<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Javni in Privat Klepet</title>
  <style>
    body { margin:0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; background: #f9f9f9; }
    .sidebar {
      width: 25%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ddd;
      overflow-y: auto;
      box-shadow: 2px 0 5px rgb(0 0 0 / 0.05);
    }
    .user-panel {
      padding: 15px;
      border-bottom: 1px solid #eee;
      text-align: center;
      background: #fafafa;
    }
    .user-panel img {
      width: 60px; height: 60px; border-radius: 50%; object-fit: cover;
      border: 2px solid #007bff;
      margin-bottom: 8px;
    }
    .user-list {
      flex-grow: 1;
      overflow-y: auto;
    }
    .user {
      display: flex; flex-direction: column; align-items: center;
      padding: 12px 10px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
      transition: background-color 0.2s ease;
    }
    .user:hover {
      background-color: #e7f1ff;
    }
    .user img {
      width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
      border: 1.5px solid #007bff;
      margin-bottom: 5px;
    }
    .chat {
      width: 75%;
      display: flex;
      flex-direction: column;
      background: #fff;
      box-shadow: -2px 0 5px rgb(0 0 0 / 0.05);
    }
    .chat-header {
      padding: 15px 20px;
      background: #007bff;
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
      border-bottom: 1px solid #0056b3;
    }
    .chat-messages {
      flex-grow: 1;
      padding: 15px 20px;
      overflow-y: auto;
      background: #fefefe;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chat-input {
      display: flex;
      border-top: 1px solid #ddd;
      padding: 10px 15px;
      background: #fafafa;
    }
    .chat-input input {
      flex-grow: 1;
      padding: 12px 15px;
      border: 1px solid #ccc;
      font-size: 16px;
      border-radius: 25px;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .chat-input input:focus {
      border-color: #007bff;
    }
    .chat-input button {
      margin-left: 12px;
      padding: 12px 25px;
      border: none;
      background: #007bff;
      color: white;
      cursor: pointer;
      border-radius: 25px;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }
    .chat-input button:hover {
      background: #0056b3;
    }

    /* Sporočila z avatarjem */
    .message-wrapper {
      display: flex;
      align-items: flex-end;
      max-width: 70%;
      gap: 10px;
    }
    .message-wrapper.you {
      margin-left: auto;
      flex-direction: row-reverse;
    }
    .message-wrapper.other {
      margin-right: auto;
      flex-direction: row;
    }

    .message-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #007bff;
      flex-shrink: 0;
      background: #ccc;
    }
    .message {
      padding: 10px 15px;
      border-radius: 20px;
      font-weight: 500;
      line-height: 1.3;
      word-wrap: break-word;
      box-shadow: 0 1px 4px rgb(0 0 0 / 0.1);
      max-width: 100%;
    }
    .message.you {
      background-color: #cdece5;
      color: #034d40;
      text-align: right;
    }
    .message.other {
      background-color: #f8d7da;
      color: #721c24;
      text-align: left;
    }

    .chat-system {
      color: #666;
      font-style: italic;
      text-align: center;
      margin-bottom: 15px;
      font-size: 0.9rem;
    }

    button#public-chat-btn {
      margin-top: 12px;
      width: 100%;
      padding: 10px 0;
      font-weight: 700;
      border-radius: 8px;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button#public-chat-btn:hover {
      background: #0056b3;
    }
    button#logout-btn {
      margin-top: 12px;
      width: 100%;
      padding: 10px 0;
      background: #dc3545;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 700;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }
    button#logout-btn:hover {
      background: #a71d2a;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="user-panel" id="my-profile">
      <img src="" id="my-avatar" alt="moj avatar" />
      <div id="my-name"></div>
      <button id="logout-btn">Odjava</button>
      <button id="public-chat-btn">Javni klepet</button>
    </div>
    <div class="user-list" id="user-list"></div>
  </div>

  <div class="chat">
    <div class="chat-header" id="chat-with">Izberi klepet</div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input">
      <input type="text" id="message-input" placeholder="Vpiši sporočilo..." />
      <button id="send-btn">Pošlji</button>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
    };

    firebase.initializeApp(firebaseConfig);

    let currentUser = null;
    let selectedUser = null;
    let chatType = null; // 'public' ali 'private'
    let chatRef = null;

    const myAvatarEl = document.getElementById("my-avatar");
    const myNameEl = document.getElementById("my-name");
    const userListEl = document.getElementById("user-list");
    const chatWithEl = document.getElementById("chat-with");
    const chatMessagesEl = document.getElementById("chat-messages");
    const messageInputEl = document.getElementById("message-input");
    const sendBtn = document.getElementById("send-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const publicChatBtn = document.getElementById("public-chat-btn");

    let usersCache = {}; // shranjevanje uporabnikovih podatkov za lažji dostop

    firebase.auth().onAuthStateChanged(user => {
      if (!user) {
        window.location.href = "auth.html";
      } else {
        currentUser = user;
        loadMyProfile();
        loadUsers();
        openPublicChat(); // avtomatsko odpri javni klepet ob prijavi
      }
    });

    logoutBtn.onclick = () => firebase.auth().signOut();

    publicChatBtn.onclick = () => openPublicChat();

    sendBtn.onclick = () => sendMessage();

    function loadMyProfile() {
      firebase.database().ref("users/" + currentUser.uid).once("value").then(snapshot => {
        const data = snapshot.val();
        const avatar = data?.avatarURL2 || "https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png";
        myAvatarEl.src = avatar;
        myNameEl.textContent = data?.displayName || "Neznan uporabnik";

        // Shrani tudi v cache
        usersCache[currentUser.uid] = { displayName: myNameEl.textContent, avatarURL2: avatar };
      });
    }

    function loadUsers() {
      userListEl.innerHTML = "";
      firebase.database().ref("users").once("value").then(snapshot => {
        snapshot.forEach(child => {
          const uid = child.key;
          const data = child.val();
          if (uid === currentUser.uid) return; // ne prikaži sebe

          const avatar = data.avatarURL2 || "https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png";
          usersCache[uid] = { displayName: data.displayName || "Neznan", avatarURL2: avatar };

          const userDiv = document.createElement("div");
          userDiv.className = "user";
          userDiv.dataset.uid = uid;
          userDiv.innerHTML = `<img src="${avatar}" alt="avatar"><div>${data.displayName || "Neznan"}</div>`;
          userDiv.onclick = () => openPrivateChat(uid);
          userListEl.appendChild(userDiv);
        });
      });
    }

    function openPublicChat() {
      chatType = "public";
      selectedUser = null;
      chatWithEl.textContent = "Javni klepet";
      chatMessagesEl.innerHTML = "";
      if (chatRef) chatRef.off();

      chatRef = firebase.database().ref("publicMessages");
      chatRef.off();
      chatRef.on("child_added", snap => {
        const msg = snap.val();
        displayMessage(msg);
      });
    }

    function openPrivateChat(uid) {
      chatType = "private";
      selectedUser = uid;
      chatWithEl.textContent = "Zasebni klepet: " + (usersCache[uid]?.displayName || "Neznan");
      chatMessagesEl.innerHTML = "";
      if (chatRef) chatRef.off();

      // Za enostaven sistem klepeta uporabim pod ključem po abecedi UID-jev (da je vedno isti ključ)
      const chatId = [currentUser.uid, uid].sort().join("_");
      chatRef = firebase.database().ref("privateMessages/" + chatId);
      chatRef.off();
      chatRef.on("child_added", snap => {
        const msg = snap.val();
        displayMessage(msg);
      });
    }

    function sendMessage() {
      const text = messageInputEl.value.trim();
      if (!text) return;

      const messageData = {
        sender: currentUser.uid,
        text: text,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      };

      if (chatType === "public") {
        firebase.database().ref("publicMessages").push(messageData);
      } else if (chatType === "private" && selectedUser) {
        const chatId = [currentUser.uid, selectedUser].sort().join("_");
        firebase.database().ref("privateMessages/" + chatId).push(messageData);
      } else {
        alert("Najprej izberi klepet.");
        return;
      }

      messageInputEl.value = "";
    }

    function displayMessage(msg) {
      // Določimo, ali je sporočilo od nas ali drugih
      const isYou = msg.sender === currentUser.uid;

      // Pridobi podatke o pošiljatelju (avatar in ime)
      const userData = usersCache[msg.sender] || { displayName: "Neznan", avatarURL2: "https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png" };

      // Glavni div wrapper sporočila
      const wrapper = document.createElement("div");
      wrapper.className = "message-wrapper " + (isYou ? "you" : "other");

      // Avatar
      const avatarImg = document.createElement("img");
      avatarImg.className = "message-avatar";
      avatarImg.src = userData.avatarURL2;
      avatarImg.alt = userData.displayName;

      // Samo sporočilo
      const messageDiv = document.createElement("div");
      messageDiv.className = "message " + (isYou ? "you" : "other");
      messageDiv.textContent = msg.text;

      // Sestavimo skupaj (avatar + sporočilo)
      wrapper.appendChild(avatarImg);
      wrapper.appendChild(messageDiv);

      chatMessagesEl.appendChild(wrapper);

      // Scroll na dno
      chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
    }
  </script>
</body>
</html>
