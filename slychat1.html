<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Javni in Privat Klepet</title>
  <style>
    body { margin:0; font-family: sans-serif; display: flex; height: 100vh; }
    .sidebar {
      width: 25%;
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ccc;
      overflow-y: auto;
    }
    .user-panel {
      padding: 10px;
      border-bottom: 1px solid #ccc;
      text-align: center;
    }
    .user-panel img {
      width: 60px; height: 60px; border-radius: 50%; object-fit: cover;
    }
    .user-list {
      flex-grow: 1;
      overflow-y: auto;
    }
    .user {
      display: flex; flex-direction: column; align-items: center;
      padding: 10px; cursor: pointer; border-bottom: 1px solid #ddd;
    }
    .user img {
      width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
    }
    .chat {
      width: 75%;
      display: flex;
      flex-direction: column;
    }
    .chat-header {
      padding: 10px;
      background: #eee;
      border-bottom: 1px solid #ccc;
      font-weight: bold;
    }
    .chat-messages {
      flex-grow: 1;
      padding: 10px;
      overflow-y: auto;
      background: #fff;
    }
    .chat-input {
      display: flex;
      border-top: 1px solid #ccc;
    }
    .chat-input input {
      flex-grow: 1;
      padding: 10px;
      border: none;
      font-size: 16px;
    }
    .chat-input button {
      padding: 10px 20px;
      border: none;
      background: #007bff;
      color: white;
      cursor: pointer;
    }
    .message {
      margin-bottom: 8px;
      padding: 6px 10px;
      border-radius: 5px;
      max-width: 70%;
      word-wrap: break-word;
    }
    .message.you {
      background-color: #d1e7dd;
      margin-left: auto;
      font-weight: bold;
      text-align: right;
    }
    .message.other {
      background-color: #f8d7da;
      margin-right: auto;
    }
    .chat-system {
      color: #555;
      font-style: italic;
      text-align: center;
      margin-bottom: 10px;
    }
    button#public-chat-btn {
      margin-top: 8px;
      width: 100%;
      padding: 8px 0;
      font-weight: bold;
    }
    button#logout-btn {
      margin-top: 8px;
      width: 100%;
      padding: 8px 0;
      background: #dc3545;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="user-panel" id="my-profile">
      <img src="" id="my-avatar" alt="moj avatar" />
      <div id="my-name"></div>
      <button id="logout-btn">Odjava</button>
      <button id="public-chat-btn">Javni klepet</button>
    </div>
    <div class="user-list" id="user-list"></div>
  </div>

  <div class="chat">
    <div class="chat-header" id="chat-with">Izberi klepet</div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input">
      <input type="text" id="message-input" placeholder="Vpiši sporočilo..." />
      <button id="send-btn">Pošlji</button>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
    };

    firebase.initializeApp(firebaseConfig);

    let currentUser = null;
    let selectedUser = null;
    let chatType = null; // 'public' ali 'private'
    let chatRef = null;

    const myAvatarEl = document.getElementById("my-avatar");
    const myNameEl = document.getElementById("my-name");
    const userListEl = document.getElementById("user-list");
    const chatWithEl = document.getElementById("chat-with");
    const chatMessagesEl = document.getElementById("chat-messages");
    const messageInputEl = document.getElementById("message-input");
    const sendBtn = document.getElementById("send-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const publicChatBtn = document.getElementById("public-chat-btn");

    firebase.auth().onAuthStateChanged(user => {
      if (!user) {
        window.location.href = "auth.html";
      } else {
        currentUser = user;
        loadMyProfile();
        loadUsers();
      }
    });

    logoutBtn.onclick = () => firebase.auth().signOut();

    publicChatBtn.onclick = () => openPublicChat();

    sendBtn.onclick = () => sendMessage();

    function loadMyProfile() {
      firebase.database().ref("users/" + currentUser.uid).once("value").then(snapshot => {
        const data = snapshot.val();
        const avatar = data?.avatarURL2 || "https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png";
        myAvatarEl.src = avatar;
        myNameEl.textContent = data?.displayName || "Neznan uporabnik";
      });
    }

    function loadUsers() {
      userListEl.innerHTML = "";
      firebase.database().ref("users").once("value").then(snapshot => {
        snapshot.forEach(child => {
          const uid = child.key;
          const data = child.val();
          if (uid === currentUser.uid) return; // ne prikaži sebe

          const userDiv = document.createElement("div");
          userDiv.className = "user";
          const avatar = data.avatarURL2 || "https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png";
          const name = data.displayName || "Neznan uporabnik";

          userDiv.innerHTML = `
            <img src="${avatar}" alt="avatar" />
            <div>${name}</div>
          `;
          userDiv.onclick = () => openPrivateChat(uid, name);
          userListEl.appendChild(userDiv);
        });
      });
    }

    function openPrivateChat(uid, name) {
      if (chatRef) chatRef.off();

      selectedUser = uid;
      chatType = "private";
      chatWithEl.textContent = "Klepet z: " + name;
      chatMessagesEl.innerHTML = "";

      const chatId = currentUser.uid < uid
        ? currentUser.uid + "_" + uid
        : uid + "_" + currentUser.uid;

      chatRef = firebase.database().ref("privatemsgs/" + chatId);
      chatRef.on("child_added", snapshot => {
        const msg = snapshot.val();
        displayMessage(msg);
      });
    }

    function openPublicChat() {
      if (chatRef) chatRef.off();

      selectedUser = null;
      chatType = "public";
      chatWithEl.textContent = "Javni klepet";
      chatMessagesEl.innerHTML = "";

      chatRef = firebase.database().ref("messages");
      chatRef.on("child_added", snapshot => {
        const msg = snapshot.val();
        displayMessage(msg);
      });
    }

    function displayMessage(msg) {
      const msgEl = document.createElement("div");
      msgEl.className = "message";

      if (msg.uid === currentUser.uid) {
        msgEl.classList.add("you");
      } else {
        msgEl.classList.add("other");
      }
      msgEl.text
