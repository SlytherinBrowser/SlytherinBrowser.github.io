<!DOCTYPE html><html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klepetalnica</title>
  <script type="module" src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js"></script>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #header {
      background: #007bff;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    #publicBtn, #backBtn {
      background: #28a745;
      color: white;
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 6px;
      margin: 0.5rem;
      cursor: pointer;
    }
    #backBtn {
      background: #dc3545;
      display: none;
    }
    #userList {
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      flex: 1;
    }
    .user {
      display: flex;
      align-items: center;
      background: white;
      padding: 0.6rem;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      cursor: pointer;
    }
    .user model-viewer {
      width: 60px;
      height: 60px;
      margin-right: 1rem;
    }
    #chat {
      display: none;
      flex-direction: column;
      flex: 1;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      background: #ffffff;
    }
    .msg {
      padding: 0.5rem;
      margin-bottom: 0.5rem;
      background: #e1f5fe;
      border-radius: 8px;
    }
    .sender {
      font-weight: bold;
      margin-bottom: 0.2rem;
    }
    #inputArea {
      display: flex;
      padding: 1rem;
      background: white;
    }
    #messageInput {
      flex: 1;
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    #sendBtn {
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.5rem 1rem;
      margin-left: 0.5rem;
    }
  </style>
</head>
<body>
  <div id="header">
    <button id="publicBtn">Javni klepet</button>
    <button id="backBtn">Nazaj</button>
  </div>
  <div id="userList"></div>
  <div id="chat">
    <div id="messages"></div>
    <div id="inputArea">
      <input id="messageInput" placeholder="Vnesi sporočilo...">
      <button id="sendBtn">Pošlji</button>
    </div>
  </div>  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth();

    let currentUser = null;
    let currentChatKey = "messages";

    const userList = document.getElementById("userList");
    const chatBox = document.getElementById("chat");
    const messagesDiv = document.getElementById("messages");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const publicBtn = document.getElementById("publicBtn");
    const backBtn = document.getElementById("backBtn");

    function renderUsers() {
      const usersRef = ref(db, "users");
      onValue(usersRef, (snapshot) => {
        userList.innerHTML = "";
        snapshot.forEach(child => {
          const user = child.val();
          if (user.uid !== currentUser?.uid) {
            const div = document.createElement("div");
            div.className = "user";
            div.innerHTML = `
              <model-viewer src="${user.avatarURL2}" camera-controls></model-viewer>
              <div>${user.displayname}</div>
            `;
            div.onclick = () => openPrivateChat(currentUser.uid, user.uid, user.displayname);
            userList.appendChild(div);
          }
        });
      });
    }

    function openPrivateChat(uid1, uid2, recipientName) {
      const chatId = [uid1, uid2].sort().join("_");
      currentChatKey = "privatemsgs/" + chatId;
      userList.style.display = "none";
      publicBtn.style.display = "none";
      backBtn.style.display = "inline-block";
      chatBox.style.display = "flex";
      messagesDiv.innerHTML = "";
      listenForMessages(currentChatKey);
    }

    function openPublicChat() {
      currentChatKey = "messages";
      userList.style.display = "none";
      publicBtn.style.display = "none";
      backBtn.style.display = "inline-block";
      chatBox.style.display = "flex";
      messagesDiv.innerHTML = "";
      listenForMessages(currentChatKey);
    }

    function listenForMessages(path) {
      const chatRef = ref(db, path);
      onValue(chatRef, (snapshot) => {
        messagesDiv.innerHTML = "";
        snapshot.forEach(child => {
          const msg = child.val();
          const div = document.createElement("div");
          div.className = "msg";
          div.innerHTML = `<div class="sender">${msg.displayName || msg.sender}</div><div>${msg.text}</div>`;
          messagesDiv.appendChild(div);
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      });
    }

    sendBtn.onclick = () => {
      const text = messageInput.value.trim();
      if (text) {
        push(ref(db, currentChatKey), {
          sender: currentUser.uid,
          displayName: currentUser.displayName,
          text,
          timestamp: Date.now()
        });
        messageInput.value = "";
      }
    };

    backBtn.onclick = () => {
      chatBox.style.display = "none";
      userList.style.display = "block";
      publicBtn.style.display = "inline-block";
      backBtn.style.display = "none";
      messagesDiv.innerHTML = "";
    };

    publicBtn.onclick = openPublicChat;

    onAuthStateChanged(auth, user => {
      if (user) {
        currentUser = user;
        renderUsers();
      }
    });
  </script></body>
</html>
