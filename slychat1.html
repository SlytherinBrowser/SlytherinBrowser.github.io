<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Privat klepet</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      height: 100vh;
    }

    #userListContainer {
      width: 25%;
      border-right: 1px solid #ccc;
      overflow-y: auto;
      padding: 10px;
    }

    .user {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      cursor: pointer;
      gap: 10px;
    }

    .user img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }

    .user div {
      font-weight: bold;
    }

    #chatContainer {
      width: 75%;
      display: none;
      flex-direction: column;
      height: 100%;
    }

    #chatHeader {
      padding: 10px;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #ccc;
    }

    #chatHeader img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }

    #chatHeader button {
      margin-left: auto;
    }

    #messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      background: #fafafa;
    }

    #inputForm {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ccc;
    }

    #inputForm input {
      flex: 1;
      padding: 8px;
    }

    #inputForm button {
      padding: 8px 12px;
    }
  </style>
</head>
<body>

<div id="userListContainer"></div>

<div id="chatContainer">
  <div id="chatHeader">
    <img id="chatAvatar" src="" alt="">
    <div id="chatWithName"></div>
    <button onclick="goBack()">Nazaj</button>
  </div>
  <div id="messages"></div>
  <form id="inputForm" onsubmit="sendMessage(event)">
    <input id="messageInput" placeholder="Napiši sporočilo..." autocomplete="off">
    <button>Pošlji</button>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
    authDomain: "chater-cf682.firebaseapp.com",
    databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
    projectId: "chater-cf682",
    storageBucket: "chater-cf682.appspot.com",
    messagingSenderId: "233632075480",
    appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const auth = firebase.auth();

  const userListContainer = document.getElementById("userListContainer");
  const chatContainer = document.getElementById("chatContainer");
  const chatWithName = document.getElementById("chatWithName");
  const chatAvatar = document.getElementById("chatAvatar");
  const messagesDiv = document.getElementById("messages");
  const messageInput = document.getElementById("messageInput");

  const defaultAvatar = "https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png";
  let currentUser = null;
  let users = {};
  let chatId = "";
  let selectedUser = null;
  let messageListener = null;

  auth.signInAnonymously().then(() => {
    currentUser = auth.currentUser;
    const uid = currentUser.uid;
    db.ref("users/" + uid).once("value").then(snapshot => {
      if (!snapshot.exists()) {
        db.ref("users/" + uid).set({
          displayName: "Uporabnik " + uid.slice(0, 5),
          model: {
            avatar: {
              view: defaultAvatar
            }
          }
        });
      }
      loadUsers(uid);
    });
  });

  function loadUsers(currentUid) {
    db.ref("users").on("value", snapshot => {
      users = snapshot.val();
      userListContainer.innerHTML = "";

      for (const uid in users) {
        if (uid === currentUid) continue;
        const user = users[uid];
        const displayName = user.displayName || "Uporabnik";
        const avatar = user.model?.avatar?.view || defaultAvatar;

        const div = document.createElement("div");
        div.className = "user";
        div.innerHTML = `<img src="${avatar}" alt=""><div>${displayName}</div>`;
        div.onclick = () => startPrivateChat(uid);
        userListContainer.appendChild(div);
      }
    });
  }

  function getChatId(uid1, uid2) {
    return uid1 < uid2 ? uid1 + "_" + uid2 : uid2 + "_" + uid1;
  }

  function startPrivateChat(uid) {
    selectedUser = { uid, ...users[uid] };
    chatId = getChatId(currentUser.uid, uid);

    chatWithName.textContent = selectedUser.displayName || "Uporabnik";
    chatAvatar.src = selectedUser.model?.avatar?.view || defaultAvatar;

    userListContainer.style.display = "none";
    chatContainer.style.display = "flex";
    messagesDiv.innerHTML = "";

    listenForMessages();
  }

  function listenForMessages() {
    if (messageListener) db.ref("privatemsgs/" + chatId).off("value", messageListener);
    messageListener = db.ref("privatemsgs/" + chatId).on("value", snapshot => {
      const messages = snapshot.val() || {};
      messagesDiv.innerHTML = "";
      for (const id in messages) {
        const msg = messages[id];
        const div = document.createElement("div");
        div.textContent = (msg.uid === currentUser.uid ? "Jaz: " : (users[msg.uid]?.displayName || "Uporabnik") + ": ") + msg.text;
        messagesDiv.appendChild(div);
      }
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });
  }

  function sendMessage(e) {
    e.preventDefault();
    const text = messageInput.value.trim();
    if (!text) return;
    const msg = {
      uid: currentUser.uid,
      text,
      timestamp: Date.now()
    };
    db.ref("privatemsgs/" + chatId).push(msg);
    messageInput.value = "";
  }

  function goBack() {
    if (messageListener) db.ref("privatemsgs/" + chatId).off("value", messageListener);
    chatContainer.style.display = "none";
    userListContainer.style.display = "block";
  }
</script>
</body>
</html>
