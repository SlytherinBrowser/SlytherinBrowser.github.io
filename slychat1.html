<!DOCTYPE html><html lang="sl">
<head>
  <meta charset="UTF-8">
  <title>Klepetalnica</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js"></script>
  <script src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #publicChatBtn {
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      width: 100%;
      font-size: 16px;
    }
    #userList {
      overflow-y: auto;
      flex: 1;
      padding: 10px;
    }
    #userList div {
      cursor: pointer;
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      background: #f1f1f1;
      padding: 8px;
      border-radius: 8px;
    }
    model-viewer {
      width: 40px;
      height: 40px;
      margin-right: 10px;
    }
    .status {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: green;
      margin-left: auto;
    }
    #chatContainer {
      display: none;
      flex: 1;
      flex-direction: column;
      height: 100vh;
    }
    #messages {
      border-top: 1px solid #ccc;
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      background: #fafafa;
    }
    #inputContainer {
      display: flex;
      border-top: 1px solid #ccc;
      padding: 10px;
      background: #fff;
    }
    #messageInput {
      flex: 1;
      padding: 8px;
      font-size: 16px;
    }
    #sendBtn {
      margin-left: 10px;
      padding: 8px 12px;
    }
    #backBtn {
      padding: 10px;
      background: #ccc;
      width: 100%;
      border: none;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <button id="publicChatBtn">Javni klepet</button>
  <div id="userList"></div>  <div id="chatContainer">
    <button id="backBtn">Nazaj</button>
    <div id="messages"></div>
    <div id="inputContainer">
      <input type="text" id="messageInput" placeholder="Vnesi sporočilo">
      <button id="sendBtn">Pošlji</button>
    </div>
  </div>  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js';
    import { getDatabase, ref, onChildAdded, push, set, get } from 'https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth();

    let currentUser = null;
    let currentChatKey = 'messages';
    let userMap = {};

    const userList = document.getElementById('userList');
    const publicChatBtn = document.getElementById('publicChatBtn');
    const chatContainer = document.getElementById('chatContainer');
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const backBtn = document.getElementById('backBtn');

    publicChatBtn.onclick = () => {
      currentChatKey = 'messages';
      messagesDiv.innerHTML = '';
      chatContainer.style.display = 'flex';
      userList.style.display = 'none';
      publicChatBtn.style.display = 'none';
      listenForMessages(currentChatKey);
    };

    backBtn.onclick = () => {
      chatContainer.style.display = 'none';
      userList.style.display = 'block';
      publicChatBtn.style.display = 'block';
    };

    signInAnonymously(auth);
    onAuthStateChanged(auth, user => {
      if (user) {
        currentUser = user.uid;
        loadUsers();
        listenForMessages('messages');
      }
    });

    function loadUsers() {
      get(ref(db, 'users')).then(snapshot => {
        userList.innerHTML = '';
        snapshot.forEach(childSnap => {
          const uid = childSnap.key;
          const user = childSnap.val();
          userMap[uid] = user.displayName || uid;
          if (uid !== currentUser) {
            const div = document.createElement('div');
            const model = document.createElement('model-viewer');
            model.setAttribute('src', user.avatarURL2);
            model.setAttribute('camera-controls', '');
            const status = document.createElement('div');
            status.className = 'status';
            div.appendChild(model);
            div.appendChild(document.createTextNode(user.displayName || uid));
            div.appendChild(status);
            div.onclick = () => openPrivateChat(uid);
            userList.appendChild(div);
          }
        });
      });
    }

    function openPrivateChat(uid2) {
      const chatId = [currentUser, uid2].sort().join('_');
      currentChatKey = 'privatemsgs/' + chatId;
      messagesDiv.innerHTML = '';
      chatContainer.style.display = 'flex';
      userList.style.display = 'none';
      publicChatBtn.style.display = 'none';
      listenForMessages(currentChatKey);
    }

    function listenForMessages(path) {
      messagesDiv.innerHTML = '';
      const chatRef = ref(db, path);
      onChildAdded(chatRef, snapshot => {
        const msg = snapshot.val();
        const div = document.createElement('div');
        const name = userMap[msg.sender] || msg.sender;
        div.textContent = name + ': ' + msg.text;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      });
    }

    sendBtn.onclick = () => {
      const text = messageInput.value.trim();
      if (text) {
        const msgRef = push(ref(db, currentChatKey));
        set(msgRef, {
          sender: currentUser,
          text,
          timestamp: Date.now()
        });
        messageInput.value = '';
      }
    };
  </script></body>
</html>
