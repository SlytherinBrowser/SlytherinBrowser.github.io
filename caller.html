<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Napreden Video Klic</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    background: #121212;
    font-family: sans-serif;
    color: white;
    height: 100%;
    overflow: hidden;
  }
  #main {
    position: relative;
    width: 100%;
    height: 100%;
    background: black;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #myVideo {
    position: absolute;
    width: 150px;
    height: 200px;
    top: 10px;
    right: 10px;
    border: 2px solid #fff;
    border-radius: 8px;
    z-index: 10;
  }
  #controls {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    z-index: 20;
  }
  button {
    margin: 0 10px;
    padding: 10px 20px;
    font-size: 16px;
    border-radius: 5px;
    border: none;
    cursor: pointer;
  }
  button#endCall { background: red; color: white; }
  button#mute { background: gray; color: white; }
  button#camera { background: gray; color: white; }
  button#copyRoom { background: blue; color: white; }
</style>
</head>
<body>
<div id="main">
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="myVideo" autoplay muted playsinline></video>
  <div id="controls">
    <button id="mute">Utišaj</button>
    <button id="camera">Kamera</button>
    <button id="endCall">Prekini klic</button>
    <button id="copyRoom">Kopiraj ID sobe</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
  // Firebase konfiguracija
  const firebaseConfig = {
    apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
    authDomain: "chater-cf682.firebaseapp.com",
    databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
    projectId: "chater-cf682",
    storageBucket: "chater-cf682.appspot.com",
    messagingSenderId: "233632075480",
    appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Pridobi ID sobe ali ga generiraj
  let roomID = prompt("Vnesi ID sobe ali pusti prazno za novo:");
  if (!roomID) roomID = Math.random().toString(36).substring(2,10);

  alert("Tvoj ID sobe: " + roomID);

  const myVideo = document.getElementById('myVideo');
  const remoteVideo = document.getElementById('remoteVideo');

  let pc = new RTCPeerConnection({
    iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
  });

  let localStream;
  let isMuted = false;
  let cameraOff = false;

  // Zajem kamere in mikrofona
  navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
    localStream = stream;
    myVideo.srcObject = stream;
    stream.getTracks().forEach(track => pc.addTrack(track, stream));
  });

  // Remote stream
  let remoteStream = new MediaStream();
  remoteVideo.srcObject = remoteStream;

  pc.ontrack = event => {
    event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
  };

  // ICE kandidati
  pc.onicecandidate = event => {
    if (event.candidate) {
      const candidateData = JSON.stringify(event.candidate);
      db.ref(`rooms/${roomID}/candidates/${Math.random().toString(36).substr(2,9)}`).set(candidateData);
    }
  };

  // poslušanje ICE kandidatov
  db.ref(`rooms/${roomID}/candidates`).on('child_added', snapshot => {
    const candidate = JSON.parse(snapshot.val());
    pc.addIceCandidate(new RTCIceCandidate(candidate));
  });

  // SDP ponudba / odgovor
  async function initCall() {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    db.ref(`rooms/${roomID}/offer`).set(JSON.stringify(offer));

    db.ref(`rooms/${roomID}/answer`).on('value', async snap => {
      if (snap.exists() && !pc.currentRemoteDescription) {
        const answer = JSON.parse(snap.val());
        await pc.setRemoteDescription(answer);
      }
    });
  }

  db.ref(`rooms/${roomID}/offer`).once('value', async snap => {
    if (!snap.exists()) {
      initCall();
    } else {
      const offer = JSON.parse(snap.val());
      await pc.setRemoteDescription(offer);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      db.ref(`rooms/${roomID}/answer`).set(JSON.stringify(answer));
    }
  });

  // Gumbi
  document.getElementById('endCall').onclick = () => {
    pc.close();
    alert('Klic končan.');
    window.location.reload();
  };

  document.getElementById('mute').onclick = () => {
    isMuted = !isMuted;
    localStream.getAudioTracks()[0].enabled = !isMuted;
    document.getElementById('mute').innerText = isMuted ? 'Vklopi zvok' : 'Utišaj';
  };

  document.getElementById('camera').onclick = () => {
    cameraOff = !cameraOff;
    localStream.getVideoTracks()[0].enabled = !cameraOff;
    document.getElementById('camera').innerText = cameraOff ? 'Vklopi kamero' : 'Kamera';
  };

  document.getElementById('copyRoom').onclick = () => {
    navigator.clipboard.writeText(roomID).then(() => {
      alert('ID sobe kopiran v odložišče!');
    });
  };
</script>
</body>
</html>
