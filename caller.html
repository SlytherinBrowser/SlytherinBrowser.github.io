<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videoklic ala WhatsApp</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #dock {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
  }

  #localVideo {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 120px;
    height: 160px;
    border: 2px solid #fff;
    border-radius: 8px;
    z-index: 2;
  }

  #controls {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
    z-index: 2;
  }

  button {
    padding: 12px 20px;
    border: none;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    background: rgba(255,255,255,0.2);
    color: #fff;
    transition: background 0.2s;
  }

  button:hover {
    background: rgba(255,255,255,0.5);
  }
</style>
</head>
<body>
<div id="dock">
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay muted playsinline></video>

  <div id="controls">
    <button id="createBtn">Ustvari sobo</button>
    <button id="joinBtn">Pridruži sobi</button>
    <button id="hangupBtn" style="background:red;">Konec</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
  authDomain: "chater-cf682.firebaseapp.com",
  databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
  projectId: "chater-cf682",
  storageBucket: "chater-cf682.appspot.com",
  messagingSenderId: "233632075480",
  appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let pc;
let localStream;

const localVideo = document.getElementById('localVideo');
const remoteVideo = document.getElementById('remoteVideo');

async function initLocalStream() {
  localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  localVideo.srcObject = localStream;
}

function createPeerConnection(roomRef) {
  pc = new RTCPeerConnection();
  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  pc.ontrack = (event) => {
    remoteVideo.srcObject = event.streams[0];
  };

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      addDoc(collection(roomRef, 'candidates'), event.candidate.toJSON());
    }
  };
}

document.getElementById('createBtn').onclick = async () => {
  await initLocalStream();
  const roomRef = doc(db, 'rooms', crypto.randomUUID());
  createPeerConnection(roomRef);

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await setDoc(roomRef, { offer: { type: offer.type, sdp: offer.sdp } });

  onSnapshot(roomRef, snapshot => {
    const data = snapshot.data();
    if (!pc.currentRemoteDescription && data?.answer) {
      pc.setRemoteDescription(data.answer);
    }
  });

  onSnapshot(collection(roomRef, 'candidates'), snapshot => {
    snapshot.docChanges().forEach(change => {
      if (change.type === 'added') pc.addIceCandidate(change.doc.data());
    });
  });

  const roomLink = window.location.href + '?room=' + roomRef.id;
  navigator.clipboard.writeText(roomLink).then(() => {
    alert("Soba ustvarjena! Link je kopiran:\n" + roomLink);
  });
};

document.getElementById('joinBtn').onclick = async () => {
  const roomId = prompt("Vnesi ID sobe:");
  if (!roomId) return;

  await initLocalStream();
  const roomRef = doc(db, 'rooms', roomId);
  createPeerConnection(roomRef);

  const roomSnap = await getDoc(roomRef);
  if (!roomSnap.exists()) { alert("Soba ne obstaja!"); return; }

  const offer = roomSnap.data().offer;
  await pc.setRemoteDescription(offer);

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  await setDoc(roomRef, { answer: { type: answer.type, sdp: answer.sdp } }, { merge: true });

  onSnapshot(collection(roomRef, 'candidates'), snapshot => {
    snapshot.docChanges().forEach(change => {
      if (change.type === 'added') pc.addIceCandidate(change.doc.data());
    });
  });
};

document.getElementById('hangupBtn').onclick = () => {
  pc?.close();
  pc = null;
  remoteVideo.srcObject = null;
  localVideo.srcObject = null;
};
</script>
</body>
</html>
