<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Napredni WebRTC Klic</title>
<style>
    body {
        font-family: 'Arial', sans-serif;
        background: #1c1c1c;
        color: #fff;
        text-align: center;
        margin: 0;
        padding: 0;
    }

    h2 {
        margin-top: 20px;
        font-weight: 400;
    }

    .video-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        padding: 10px;
    }

    video {
        width: 45%;
        max-width: 400px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        background: black;
    }

    @media (max-width: 600px) {
        video { width: 90%; }
    }

    .controls {
        margin: 15px 0;
    }

    input, button {
        padding: 10px;
        margin: 5px;
        border-radius: 8px;
        border: none;
        font-size: 16px;
    }

    input {
        width: 200px;
    }

    button {
        background: #4caf50;
        color: white;
        cursor: pointer;
        transition: background 0.3s;
    }

    button:hover {
        background: #45a049;
    }
</style>
</head>
<body>
<h2>Napredni WebRTC Video Klic</h2>

<div class="video-container">
    <video id="localVideo" autoplay muted></video>
    <video id="remoteVideo" autoplay></video>
</div>

<div class="controls">
    <button id="createBtn">Ustvari sobo</button>
    <input id="roomInput" placeholder="ID sobe">
    <button id="joinBtn">Pridruži se sobi</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
// ----- FIREBASE KONFIGURACIJA -----
const firebaseConfig = {
    apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
    authDomain: "chater-cf682.firebaseapp.com",
    databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
    projectId: "chater-cf682",
    storageBucket: "chater-cf682.appspot.com",
    messagingSenderId: "233632075480",
    appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ----- GLOBALNE SPREMENLJIVKE -----
let localStream, remoteStream;
let pc;
const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

// HTML elementi
const localVideo = document.getElementById('localVideo');
const remoteVideo = document.getElementById('remoteVideo');

// ----- FUNKCIJE -----
async function initLocalStream() {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    localVideo.srcObject = localStream;
}

function createPeerConnection(roomRef) {
    pc = new RTCPeerConnection(servers);

    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    remoteStream = new MediaStream();
    remoteVideo.srcObject = remoteStream;
    pc.ontrack = event => event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));

    pc.onicecandidate = event => {
        if (event.candidate) roomRef.collection('candidates').add(event.candidate.toJSON());
    };
}

// ----- USTVARJANJE SOBE -----
document.getElementById('createBtn').onclick = async () => {
    await initLocalStream();
    const roomRef = db.collection('rooms').doc();
    createPeerConnection(roomRef);

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    await roomRef.set({ offer: { type: offer.type, sdp: offer.sdp } });

    roomRef.onSnapshot(snapshot => {
        const data = snapshot.data();
        if (!pc.currentRemoteDescription && data?.answer) {
            pc.setRemoteDescription(new RTCSessionDescription(data.answer));
        }
    });

    roomRef.collection('candidates').onSnapshot(snapshot => {
        snapshot.docChanges().forEach(change => {
            if (change.type === 'added') pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
        });
    });

    alert("ID sobe: " + roomRef.id);
};

// ----- PRIDRUŽITEV SOBI -----
document.getElementById('joinBtn').onclick = async () => {
    const roomId = document.getElementById('roomInput').value;
    if (!roomId) return alert("Vnesi ID sobe!");
    await initLocalStream();
    const roomRef = db.collection('rooms').doc(roomId);
    createPeerConnection(roomRef);

    const roomData = (await roomRef.get()).data();
    await pc.setRemoteDescription(new RTCSessionDescription(roomData.offer));

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await roomRef.update({ answer: { type: answer.type, sdp: answer.sdp } });

    roomRef.collection('candidates').onSnapshot(snapshot => {
        snapshot.docChanges().forEach(change => {
            if (change.type === 'added') pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
        });
    });
};
</script>
</body>
</html>
