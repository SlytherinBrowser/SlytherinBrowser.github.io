<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Zasebni klepet</title>
  <!-- 3D avatarji -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    :root{
      --bg:#0f1220; --card:#151a2e; --muted:#8b91a7; --text:#e9ecf3; --accent:#6aa6ff;
      --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom);
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color: transparent}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,Segoe UI,Roboto,Ubuntu,sans-serif}
    body{touch-action:manipulation}

    .app{display:flex;flex-direction:column;min-height:100%;}

    /* Topbar: sticky + večji tap targeti na mobilnikih */
    .topbar{
      position:sticky; top:0; z-index:10;
      display:flex; align-items:center; gap:10px;
      padding: calc(8px + var(--safe-top)) 12px 8px 12px;
      background:#0b1022; border-bottom:1px solid #283256;
    }
    .topbar .peer{display:flex;align-items:center;gap:8px;min-width:0}
    .topbar .peer .name{font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:52vw}
    .topbar .peer .status{font-size:12px;color:var(--muted)}
    .pill{font-size:12px;color:var(--muted);border:1px solid #283256;border-radius:999px;padding:2px 8px;white-space:nowrap}

    /* Dvojni avatar – mobilni default (manjši, širši) */
    .avatar-duo{
      width:120px; height:44px; border-radius:10px; overflow:hidden;
      border:1px solid #2a335a; display:grid; grid-template-columns:1fr 1fr; background:#0e1430;
      flex:0 0 auto;
    }
    .avatar-slot{position:relative;width:100%;height:100%}
    .avatar-slot model-viewer, .avatar-slot img{width:100%;height:100%;display:block;object-fit:cover}

    .chat{
      flex:1; overflow:auto; padding:10px 12px;
      scroll-behavior:smooth;
    }
    .msg{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
    .msg.me{flex-direction:row-reverse;text-align:right}
    .bubble{
      max-width:85vw;           /* širše mehurčke na telefonu */
      padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid #283256;
      word-wrap:break-word; overflow-wrap:anywhere;
    }
    .meta{font-size:12px;color:var(--muted);margin-top:4px}
    .avatar-sm{width:36px;height:36px;border-radius:50%;overflow:hidden;border:1px solid #2a335a;flex:0 0 auto}
    .avatar-sm img,.avatar-sm model-viewer{width:125%;height:125%;margin-left:-12%;margin-top:-18%;object-fit:cover}

    /* Spodnja vrstica: sticky, z varnim robom nad gesto/indikatorjem */
    .inputbar{
      position:sticky; bottom:0; z-index:10;
      display:flex; gap:8px; padding:8px 12px calc(8px + var(--safe-bottom)) 12px;
      border-top:1px solid #283256;background:#0b1022;
    }
    .inputbar input{
      flex:1;background:#0e1430;border:1px solid #273055;border-radius:12px;color:var(--text);
      padding:12px 12px; outline:none; font-size:16px; /* 16px za iOS, da ne zooma */
    }
    .inputbar button{
      border:0;border-radius:12px;padding:12px 14px;background:var(--accent);color:white;cursor:pointer;font-weight:600;
      min-width:84px;
    }

    /* Večji ekrani (tablet/desktop) */
    @media (min-width: 600px){
      .topbar{gap:12px; padding:12px 16px}
      .topbar .peer .name{font-size:16px; max-width:unset}
      .avatar-duo{width:160px; height:60px; border-radius:12px}
      .bubble{max-width:68ch}
      .avatar-sm{width:42px;height:42px}
      .inputbar{gap:10px; padding:12px 16px}
      .inputbar button{min-width:auto}
    }

    /* Manj animacij, če uporabnik ne želi gibanja */
    @media (prefers-reduced-motion: reduce){
      *{animation:none !important; transition:none !important}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <button id="backBtn" title="Nazaj"
        style="background:#223; border:1px solid #334; border-radius:10px; padding:10px 12px; color:#cfe; font-weight:600;">
        ←
      </button>

      <div class="peer">
        <div class="avatar-duo">
          <div id="meAvatarTop"   class="avatar-slot"></div>
          <div id="peerAvatarTop" class="avatar-slot"></div>
        </div>
        <div>
          <div class="name" id="peerName">Uporabnik</div>
          <div class="status"><span class="pill" id="roomIdPill"></span></div>
        </div>
      </div>

      <div style="margin-left:auto" class="pill">Zasebni chat</div>
    </div>

    <div id="chatBox" class="chat"></div>

    <div class="inputbar" id="inputBar">
      <input id="msgInput" placeholder="Napiši sporočilo…"/>
      <button id="sendBtn">Pošlji</button>
    </div>
  </div>

  <script type="module">
    // --- Firebase (isti projekt) ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { getDatabase, ref, onValue, get, update, push, orderByChild, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getDatabase(app);

    // --- UI refs ---
    const chatBox  = document.getElementById('chatBox');
    const msgInput = document.getElementById('msgInput');
    const sendBtn  = document.getElementById('sendBtn');
    const backBtn  = document.getElementById('backBtn');
    const peerNameEl        = document.getElementById('peerName');
    const meAvatarTopSlot   = document.getElementById('meAvatarTop');
    const peerAvatarTopSlot = document.getElementById('peerAvatarTop');
    const roomIdPill        = document.getElementById('roomIdPill');
    const inputBar          = document.getElementById('inputBar');

    // --- Params ---
    const params  = new URLSearchParams(location.search);
    const chatId  = params.get('chat');   // deterministični room id (uidA_uidB)
    let   peerUid = params.get('peer');   // opcijsko; če manjka, ga razberemo
    if(!chatId){ alert('Manjka chat parameter.'); }
    roomIdPill.textContent = `Room: ${chatId || '—'}`;

    backBtn.addEventListener('click', ()=> {
      history.length > 1 ? history.back() : location.href = '/profile.html';
    });

    // --- Helpers ---
    const isMobile = matchMedia('(max-width: 600px)').matches;
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    function mountAvatar(slotEl, url){
      slotEl.innerHTML = '';
      if(url && /\.glb($|\?)/i.test(url)){
        const mv = document.createElement('model-viewer');
        mv.setAttribute('disable-zoom','');
        mv.setAttribute('disable-pan','');
        mv.setAttribute('disable-tap','');
        mv.setAttribute('interaction-prompt','none');
        mv.setAttribute('src', url);
        mv.setAttribute('camera-target','0m 1.6m 0m');
        mv.setAttribute('min-camera-orbit','0deg 90deg 1.3m');
        mv.setAttribute('max-camera-orbit','0deg 90deg 1.3m');
        if(!isMobile && !reduceMotion){ mv.setAttribute('auto-rotate',''); }
        mv.setAttribute('crossorigin','anonymous');
        slotEl.appendChild(mv);
      } else if (url){
        const img = document.createElement('img');
        img.src = url;
        img.alt = 'avatar';
        img.referrerPolicy = 'no-referrer';
        slotEl.appendChild(img);
      } else {
        const p = document.createElement('div');
        p.style.width='100%'; p.style.height='100%';
        p.style.background='linear-gradient(135deg,#1a2140,#111833)';
        slotEl.appendChild(p);
      }
    }

    function msgBubble({me,text,ts}){
      const wrap = document.createElement('div');
      wrap.className = 'msg' + (me ? ' me' : '');
      const av = document.createElement('div');
      av.className = 'avatar-sm';
      const avSlot = document.createElement('div');
      avSlot.style.width='100%'; avSlot.style.height='100%';
      av.appendChild(avSlot);

      const bub = document.createElement('div');
      bub.className = 'bubble';
      bub.textContent = text;

      const meta = document.createElement('div');
      meta.className = 'meta';
      const d = new Date(ts||Date.now());
      meta.textContent = d.toLocaleString();

      const col = document.createElement('div');
      col.append(bub, meta);

      if(me){ wrap.append(col, av); } else { wrap.append(av, col); }

      return {wrap, avSlot};
    }

    function pickDisplayName(data){
      return data?.displayName || data?.username || data?.name || data?.nick || 'Uporabnik';
    }

    async function resolvePeerUid(db, myUid, chatId){
      if (chatId && chatId.includes('_')){
        const [a,b] = chatId.split('_');
        const candidate = (a === myUid) ? b : (b === myUid ? a : null);
        if (candidate){
          const snap = await get(ref(db, `users/${candidate}`));
          if (snap.exists()) return candidate;
        }
        for (const id of [a,b]){
          if (id !== myUid){
            const s = await get(ref(db, `users/${id}`));
            if (s.exists()) return id;
          }
        }
      }
      if (chatId){
        const msgs = await get(ref(db, `messages_private/${chatId}`));
        if (msgs.exists()){
          const by = new Set();
          Object.values(msgs.val()||{}).forEach(m => m?.uid && by.add(m.uid));
          for (const id of by){
            if (id !== myUid){
              const us = await get(ref(db, `users/${id}`));
              if (us.exists()) return id;
            }
          }
        }
      }
      return null;
    }

    // Pomaga pri mobilni tipkovnici: med fokusom drži obod spodaj
    function keepInputVisible(){
      if(!('visualViewport' in window)) return;
      const vv = window.visualViewport;
      const onVv = ()=>{
        // dodaj spodnji padding chatBoxu, da se ne prekrije
        const extra = (window.innerHeight - vv.height) > 100 ? 8 : 0;
        chatBox.style.paddingBottom = (inputBar.offsetHeight + extra + 12) + 'px';
        chatBox.scrollTop = chatBox.scrollHeight;
      };
      vv.addEventListener('resize', onVv);
      vv.addEventListener('scroll', onVv);
      window.addEventListener('orientationchange', onVv);
      onVv();
    }

    // --- Auth & boot ---
    onAuthStateChanged(auth, async (u)=>{
      if(!u){ chatBox.innerHTML = '<div class="meta">Ni prijave.</div>'; return; }

      keepInputVisible();

      // Moj avatar (levo)
      try{
        const meSnap = await get(ref(db, `users/${u.uid}`));
        const me = meSnap.val() || {};
        mountAvatar(meAvatarTopSlot, me.avatarURL2 || me.avatar || me.photoURL);
      }catch(e){ console.warn('Napaka pri branju mojega profila:', e); }

      // Zanesljivo določi peerUid iz users/chatId
      try{
        const resolved = await resolvePeerUid(db, u.uid, chatId);
        peerUid = resolved || peerUid || null;
      }catch(e){ console.warn('resolvePeerUid error:', e); }

      // Peer ime + avatar (desno)
      if (peerUid){
        try{
          const peerSnap = await get(ref(db, `users/${peerUid}`));
          const pdata = peerSnap.val() || {};
          peerNameEl.textContent = pickDisplayName(pdata);
          mountAvatar(peerAvatarTopSlot, pdata.avatarURL2 || pdata.avatar || pdata.photoURL);
        }catch(e){
          console.warn('Peer profil napaka:', e);
          peerNameEl.textContent = 'Uporabnik';
          mountAvatar(peerAvatarTopSlot, null);
        }
      } else {
        peerNameEl.textContent = 'Uporabnik';
        mountAvatar(peerAvatarTopSlot, null);
      }

      // Poslušaj sporočila
      const roomRef = ref(db, `messages_private/${chatId}`);
      const q = query(roomRef, orderByChild('timestamp'), limitToLast(300));
      onValue(q, async (snap)=>{
        chatBox.innerHTML = '';
        const all = snap.val() || {};
        const keys = Object.keys(all).sort((a,b)=> (all[a].timestamp||0)-(all[b].timestamp||0));
        for(const k of keys){
          const m = all[k];
          const isMe = m.uid === u.uid;
          const {wrap, avSlot} = msgBubble({me:isMe, text:m.text, ts:m.timestamp});
          try{
            const us = await get(ref(db, `users/${m.uid}`));
            const ud = us.val()||{};
            mountAvatar(avSlot, ud.avatarURL2 || ud.avatar || ud.photoURL);
          }catch(e){
            mountAvatar(avSlot, null);
          }
          chatBox.appendChild(wrap);
        }
        chatBox.scrollTop = chatBox.scrollHeight;
      });

      // Pošiljanje
      async function send(){
        const t = (msgInput.value||'').trim();
        if(!t) return;
        const data = { uid: u.uid, text: t, timestamp: Date.now() };
        await push(ref(db, `messages_private/${chatId}`), data);
        await update(ref(db, `users/${u.uid}`), { lastMessageId: true }).catch(()=>{});
        msgInput.value='';
        chatBox.scrollTop = chatBox.scrollHeight;
      }
      sendBtn.addEventListener('click', send);
      msgInput.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey) send(); });

      // Na fokus vnosnega polja pomakni pogled na dno (mobilna tipkovnica)
      msgInput.addEventListener('focus', ()=> setTimeout(()=>{ chatBox.scrollTop = chatBox.scrollHeight; }, 50));
    });
  </script>
</body>
</html>
