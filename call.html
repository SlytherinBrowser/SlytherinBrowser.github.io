<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>WebRTC Klic z Iskanjem in Kontrolami</title>
  <style>
    body {
      font-family: sans-serif;
      background: #121212;
      color: white;
      text-align: center;
      padding: 20px;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 5px;
      border-radius: 6px;
      cursor: pointer;
    }
    ul {
      list-style: none;
      padding: 0;
      max-width: 300px;
      margin: 10px auto;
      background: #1e1e1e;
      border-radius: 6px;
      max-height: 150px;
      overflow-y: auto;
    }
    li {
      padding: 8px;
      cursor: pointer;
      border-bottom: 1px solid #333;
    }
    li:hover {
      background: #333;
    }
    video {
      width: 45%;
      margin: 10px;
      background: black;
      border-radius: 6px;
    }
    #callControls {
      margin-top: 10px;
    }
    #incomingCall {
      margin: 20px auto;
      max-width: 300px;
      background: #222;
      padding: 15px;
      border-radius: 6px;
    }
    #incomingCall button {
      margin: 5px;
    }
  </style>
</head>
<body>
  <h1>WebRTC Klic z Iskanjem in Kontrolami</h1>

  <input type="text" id="userSearch" placeholder="Vpiši ime..." oninput="searchUsers()" autocomplete="off" />
  <ul id="suggestions"></ul>

  <div id="callArea"></div>

  <div>
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>

  <div id="callControls" style="display:none;">
    <button id="toggleCameraBtn">Izklopi kamero</button>
    <button id="toggleMicBtn">Izklopi mikrofon</button>
    <button id="hangupBtn" style="background:#b33;">Prekini klic</button>
  </div>

  <div id="incomingCall" style="display:none;">
    <p><strong>Dohodni klic od <span id="callerName"></span></strong></p>
    <button id="acceptCallBtn" style="background:#3a3;">Sprejmi</button>
    <button id="rejectCallBtn" style="background:#b33;">Zavrni</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let localStream, remoteStream, pc;
    const servers = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

    let selectedUserId = null;
    let callId = null;
    let isCaller = false;
    let callRef = null;

    // Elementi
    const localVideo = document.getElementById("localVideo");
    const remoteVideo = document.getElementById("remoteVideo");
    const callControls = document.getElementById("callControls");
    const toggleCameraBtn = document.getElementById("toggleCameraBtn");
    const toggleMicBtn = document.getElementById("toggleMicBtn");
    const hangupBtn = document.getElementById("hangupBtn");

    const incomingCallDiv = document.getElementById("incomingCall");
    const callerNameSpan = document.getElementById("callerName");
    const acceptCallBtn = document.getElementById("acceptCallBtn");
    const rejectCallBtn = document.getElementById("rejectCallBtn");

    // Prijava anonimna
    auth.signInAnonymously().then(() => {
      console.log("Prijavljen kot:", auth.currentUser.uid);
    });

    // Iskanje uporabnikov (predlogi)
    async function searchUsers() {
      const input = document.getElementById("userSearch").value.toLowerCase();
      const suggestionsBox = document.getElementById("suggestions");
      suggestionsBox.innerHTML = '';

      if (input.length < 2) return;

      const snapshot = await db.ref("users").once("value");
      const users = snapshot.val();

      for (const uid in users) {
        if (uid === auth.currentUser.uid) continue;
        const name = users[uid].displayName?.toLowerCase();
        if (name && name.includes(input)) {
          const li = document.createElement("li");
          li.textContent = users[uid].displayName;
          li.onclick = () => selectUser(uid, users[uid].displayName);
          suggestionsBox.appendChild(li);
        }
      }
    }

    function selectUser(uid, name) {
      document.getElementById("userSearch").value = name;
      document.getElementById("suggestions").innerHTML = '';
      selectedUserId = uid;
      const area = document.getElementById("callArea");
      area.innerHTML = '';
      const btn = document.createElement("button");
      btn.textContent = "📞 Pokliči " + name;
      btn.onclick = () => initiateCallTo(uid, name);
      area.appendChild(btn);
    }

    function generateCallId() {
      return Math.random().toString(36).substr(2, 9);
    }

    async function initiateCallTo(uid, name) {
      if (!auth.currentUser.uid) {
        alert("Počakaj na prijavo.");
        return;
      }
      isCaller = true;
      callId = generateCallId();
      await db.ref("callRequests/" + uid).set({
        from: auth.currentUser.uid,
        fromName: "Tvoj uporabnik",  // PO potrebi nastavi pravo ime
        callId,
        timestamp: Date.now()
      });
      startWebRTC(true, callId);
      showCallControls(true);
    }

    // Prikaži/gumbi za klic
    function showCallControls(show) {
      callControls.style.display = show ? "block" : "none";
    }

    // Dohodni klic poslušalec
    db.ref("callRequests/" + auth.currentUser.uid).on("value", snapshot => {
      const data = snapshot.val();
      if (data && !callId) { // samo če ni klica že v teku
        callerNameSpan.textContent = data.fromName || data.from;
        incomingCallDiv.style.display = "block";

        // Shrani podatke za sprejem/zavrnitev
        incomingCallDiv.dataset.callId = data.callId;
        incomingCallDiv.dataset.fromUid = data.from;
      }
    });

    acceptCallBtn.onclick = () => {
      isCaller = false;
      callId = incomingCallDiv.dataset.callId;
      startWebRTC(false, callId);
      incomingCallDiv.style.display = "none";
      showCallControls(true);
    };

    rejectCallBtn.onclick = () => {
      const fromUid = incomingCallDiv.dataset.fromUid;
      if (fromUid) {
        db.ref("callRequests/" + auth.currentUser.uid).remove();
      }
      incomingCallDiv.style.display = "none";
      callId = null;
    };

    // Start WebRTC povezave
    async function startWebRTC(caller, callIdParam) {
      callId = callIdParam;
      pc = new RTCPeerConnection(servers);
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      remoteStream = new MediaStream();

      localVideo.srcObject = localStream;
      remoteVideo.srcObject = remoteStream;

      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      pc.ontrack = event => {
        event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
      };

      pc.onicecandidate = e => {
        if (e.candidate) {
          const path = caller ? 'offerCandidates' : 'answerCandidates';
          db.ref(`calls/${callId}/${path}`).push(e.candidate.toJSON());
        }
      };

      callRef = db.ref("calls/" + callId);

      if (caller) {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await callRef.set({ offer });
        callRef.child("answer").on("value", async snap => {
          if (snap.exists() && !pc.currentRemoteDescription) {
            await pc.setRemoteDescription(new RTCSessionDescription(snap.val()));
          }
        });
      } else {
        const offerSnap = await callRef.child("offer").get();
        await pc.setRemoteDescription(new RTCSessionDescription(offerSnap.val()));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await callRef.child("answer").set(answer);
      }

      callRef.child("offerCandidates").on("child_added", snap => {
        if (!caller) pc.addIceCandidate(new RTCIceCandidate(snap.val()));
      });
      callRef.child("answerCandidates").on("child_added", snap => {
        if (caller) pc.addIceCandidate(new RTCIceCandidate(snap.val()));
      });
    }

    // Gumbi za kamero/mikrofon
    toggleCameraBtn.onclick = () => {
      if (!localStream) return;
      const videoTrack = localStream.getVideoTracks()[0];
      if (!videoTrack) return;

      videoTrack.enabled = !videoTrack.enabled;
      toggleCameraBtn.textContent = videoTrack.enabled ? "Izklopi kamero" : "Vklopi kamero";
    };

    toggleMicBtn.onclick = () => {
      if (!localStream) return;
      const audioTrack = localStream.getAudioTracks()[0];
      if (!audioTrack) return;

      audioTrack.enabled = !audioTrack.enabled;
      toggleMicBtn.textContent = audioTrack.enabled ? "Izklopi mikrofon" : "Vklopi mikrofon";
    };

    hangupBtn.onclick = async () => {
      if (pc) {
        pc.close();
        pc = null;
      }
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      if (remoteStream) {
        remoteStream.getTracks().forEach(t => t.stop());
        remoteStream = null;
      }
      if (callRef) {
        await callRef.remove();
        callRef = null;
      }
      callId = null;
      selectedUserId = null;
      isCaller = false;
      showCallControls(false);
      incomingCallDiv.style.display = "none";
      localVideo.srcObject = null;
      remoteVideo.srcObject = null;
      document.getElementById("callArea").innerHTML = "";
      document.getElementById("userSearch").value = "";
      toggleCameraBtn.textContent = "Izklopi kamero";
      toggleMicBtn.textContent = "Izklopi mikrofon";
    };
  </script>
</body>
</html>
