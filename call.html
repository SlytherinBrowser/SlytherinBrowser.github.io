<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>WebRTC Klic z Iskanjem in Kontrolami</title>
  <style>
    body {
      font-family: sans-serif;
      background: #121212;
      color: white;
      text-align: center;
      padding: 20px;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 5px;
      border-radius: 6px;
      cursor: pointer;
    }
    ul {
      list-style: none;
      padding: 0;
      max-width: 300px;
      margin: 10px auto;
      background: #1e1e1e;
      border-radius: 6px;
      max-height: 150px;
      overflow-y: auto;
    }
    li {
      padding: 8px;
      cursor: pointer;
      border-bottom: 1px solid #333;
    }
    li:hover {
      background: #333;
    }
    video {
      width: 45%;
      margin: 10px;
      background: black;
      border-radius: 6px;
    }
    #callControls {
      margin-top: 10px;
    }
    #incomingCall {
      margin: 20px auto;
      max-width: 300px;
      background: #222;
      padding: 15px;
      border-radius: 6px;
    }
    #incomingCall button {
      margin: 5px;
    }
  </style>
</head>
<body>
  <h1>WebRTC Klic z Iskanjem in Kontrolami</h1>

  <input type="text" id="userSearch" placeholder="Vpiši ime..." oninput="searchUsers()" autocomplete="off" />
  <ul id="suggestions"></ul>

  <div id="callArea"></div>

  <div>
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>

  <div id="callControls" style="display:none;">
    <button id="toggleCameraBtn">Izklopi kamero</button>
    <button id="toggleMicBtn">Izklopi mikrofon</button>
    <button id="hangupBtn" style="background:#b33;">Prekini klic</button>
  </div>

  <div id="incomingCall" style="display:none;">
    <p><strong>Dohodni klic od <span id="callerName"></span></strong></p>
    <button id="acceptCallBtn" style="background:#3a3;">Sprejmi</button>
    <button id="rejectCallBtn" style="background:#b33;">Zavrni</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // ---- Spremenljivke ----
let localStream = null;
let remoteStream = null;
let peerConnection = null;

const servers = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

let callRef = null;
let callId = null;
let isCaller = false;
let isCalling = false;
let isInCall = false;

let videoTrack = null;
let audioTrack = null;

// Uporabniški podatki (nastavi sam)
const currentUserId = "user1";              // npr. Firebase UID ali displayName
const currentUserDisplayName = "User 1";    // prikazno ime

// ---- Elementi iz DOM-a ----
const userSearchInput = document.getElementById("userSearch");
const callBtn = document.getElementById("callBtn");
const acceptCallBtn = document.getElementById("acceptCallBtn");
const rejectCallBtn = document.getElementById("rejectCallBtn");
const hangupCallBtn = document.getElementById("hangupCallBtn");
const toggleCameraBtn = document.getElementById("toggleCameraBtn");
const toggleMicBtn = document.getElementById("toggleMicBtn");

const incomingCallDiv = document.getElementById("incomingCall");
const incomingCallUserSpan = document.getElementById("incomingCallUser");

const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");

// ---- Funkcija za zagon lokalnega streama ----
async function startLocalStream() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    localVideo.srcObject = localStream;
    videoTrack = localStream.getVideoTracks()[0];
    audioTrack = localStream.getAudioTracks()[0];
  } catch (err) {
    console.error("Napaka pri dostopu do kamere/mikrofona:", err);
    alert("Napaka pri dostopu do kamere ali mikrofona.");
  }
}

// Pokličemo takoj ob zagonu strani
startLocalStream();

// ---- Funkcija za ustvarjanje RTCPeerConnection ----
function createPeerConnection() {
  peerConnection = new RTCPeerConnection(servers);

  // Dodamo lokalni stream v peer connection
  localStream.getTracks().forEach(track => {
    peerConnection.addTrack(track, localStream);
  });

  // Ko dobimo track od druge strani, ga prikažemo v remote video
  peerConnection.ontrack = (event) => {
    if (!remoteStream) {
      remoteStream = new MediaStream();
      remoteVideo.srcObject = remoteStream;
    }
    remoteStream.addTrack(event.track);
  };

  // ICE kandidati: pošljemo jih v Firebase
  peerConnection.onicecandidate = (event) => {
    if (event.candidate) {
      callRef.child("iceCandidates").push(event.candidate.toJSON());
    }
  };
}

// ---- Funkcija za začetek klica ----
async function startCall(calleeId) {
  isCalling = true;
  isCaller = true;

  createPeerConnection();

  // Ustvarimo unikaten ID za klic
  callId = database.ref("calls").push().key;
  callRef = database.ref(`calls/${callId}`);

  // Shranimo podatke o klicu
  await callRef.set({
    from: currentUserId,
    fromDisplayName: currentUserDisplayName,
    to: calleeId,
    status: "calling"
  });

  // Poslušamo za ICE kandidate od druge strani
  callRef.child("iceCandidates").on("child_added", snapshot => {
    const candidate = snapshot.val();
    if (candidate) {
      peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
    }
  });

  // Ustvarimo ponudbo (offer)
  const offer = await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);

  // Shranimo ponudbo v Firebase
  await callRef.update({ offer: { type: offer.type, sdp: offer.sdp } });

  listenForAnswer();
}

// ---- Poslušamo odgovor klica ----
function listenForAnswer() {
  callRef.child("answer").on("value", async snapshot => {
    const answer = snapshot.val();
    if (answer && peerConnection.signalingState !== "stable") {
      const rtcAnswer = new RTCSessionDescription(answer);
      await peerConnection.setRemoteDescription(rtcAnswer);
      isInCall = true;
      isCalling = false;
      showCallControls(true);
    }
  });
}

// ---- Poslušamo dohodne klice ----
database.ref("calls").on("child_added", async (snapshot) => {
  const data = snapshot.val();
  const key = snapshot.key;

  // Če je dohodni klic za nas, in še nismo v klicu ali ne kličemo
  if (data.to === currentUserId && !isInCall && !isCalling) {
    callId = key;
    callRef = snapshot.ref;
    isCaller = false;

    incomingCallUserSpan.textContent = data.fromDisplayName || data.from;
    incomingCallDiv.style.display = "block";

    // Čakamo, da uporabnik sprejme ali zavrne
  }
});

// ---- Sprejem klica ----
async function acceptCall() {
  incomingCallDiv.style.display = "none";
  isInCall = true;

  createPeerConnection();

  // Poslušamo ICE kandidate od klicatelja
  callRef.child("iceCandidates").on("child_added", snapshot => {
    const candidate = snapshot.val();
    if (candidate) {
      peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
    }
  });

  // Nastavimo ponudbo iz Firebase kot remote description
  const callData = (await callRef.once("value")).val();
  const offerDesc = new RTCSessionDescription(callData.offer);
  await peerConnection.setRemoteDescription(offerDesc);

  // Ustvarimo odgovor (answer)
  const answer = await peerConnection.createAnswer();
  await peerConnection.setLocalDescription(answer);

  // Posodobimo Firebase z odgovorom
  await callRef.update({ answer: { type: answer.type, sdp: answer.sdp }, status: "in_call" });

  showCallControls(true);
}

// ---- Zavrnitev klica ----
async function rejectCall() {
  if (!callRef) return;
  await callRef.remove();
  incomingCallDiv.style.display = "none";
  resetCallState();
}

// ---- Prekini klic ----
async function hangUpCall() {
  if (peerConnection) {
    peerConnection.close();
    peerConnection = null;
  }

  if (localStream) {
    // NE ustavimo trackov, ker jih želimo držati za naslednji klic
    // Če želiš, lahko pa jih ustaviš tukaj
  }

  if (remoteStream) {
    remoteStream.getTracks().forEach(t => t.stop());
    remoteStream = null;
    remoteVideo.srcObject = null;
  }

  if (callRef) {
    await callRef.remove();
    callRef = null;
  }

  resetCallState();
  showCallControls(false);
}

// ---- Ponastavi stanje klica ----
function resetCallState() {
  callId = null;
  isCaller = false;
  isCalling = false;
  isInCall = false;
  incomingCallDiv.style.display = "none";
  userSearchInput.value = "";
  toggleCameraBtn.textContent = "Izklopi kamero";
  toggleMicBtn.textContent = "Izklopi mikrofon";
}

// ---- Prikaz kontrol za klic ----
function showCallControls(show) {
  hangupCallBtn.style.display = show ? "inline-block" : "none";
  toggleCameraBtn.style.display = show ? "inline-block" : "none";
  toggleMicBtn.style.display = show ? "inline-block" : "none";
  callBtn.disabled = show;  // med klicem ne dovolimo novega klica
}

// ---- Gumbi za toggle kamere/mikrofona ----
toggleCameraBtn.onclick = () => {
  if (!videoTrack) return;
  videoTrack.enabled = !videoTrack.enabled;
  toggleCameraBtn.textContent = videoTrack.enabled ? "Izklopi kamero" : "Vklopi kamero";
};

toggleMicBtn.onclick = () => {
  if (!audioTrack) return;
  audioTrack.enabled = !audioTrack.enabled;
  toggleMicBtn.textContent = audioTrack.enabled ? "Izklopi mikrofon" : "Vklopi mikrofon";
};

// ---- Dogodki za gumb ----
callBtn.onclick = () => {
  const calleeId = userSearchInput.value.trim();
  if (!calleeId) {
    alert("Vpiši uporabniško ime za klic.");
    return;
  }
  if (calleeId === currentUserId) {
    alert("Ne moreš klicati samega sebe.");
    return;
  }
  startCall(calleeId);
};

acceptCallBtn.onclick = () => acceptCall();
rejectCallBtn.onclick = () => rejectCall();
hangupCallBtn.onclick = () => hangUpCall();
  </script>
</body>
</html>
