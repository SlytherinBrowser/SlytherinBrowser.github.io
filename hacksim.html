{"README.md": {"type": "text", "data": "hackPVPsim - TERMINAL REIGN fork (Firebase-backed)\n\nThis project is a prototype terminal-only multiplayer game \"hackPVPsim\".\nIt uses Firebase Realtime Database via REST for simple multiplayer events.\n\nIMPORTANT:\n- This scaffold includes your Firebase config locally in config.json.\n- Do NOT publish or commit config.json with private data to public repos.\n- For production, use a secure server to handle privileged actions.\n\nQuick start:\n1) Install dependencies:\n   pip install -r requirements.txt\n2) Run the client:\n   python main.py\n3) Build an EXE on Windows (requires pyinstaller):\n   pip install pyinstaller\n   build.bat\n\nFiles in this project:\n- main.py            : terminal REPL client\n- firebase_helper.py : minimal Firebase REST helper (email/password auth)\n- config.json        : your Firebase config (local)\n- quickEntry.mnk     : example MonkLang script\n- requirements.txt   : required python libs (requests)\n- build.bat          : convenience script to build hackPVPsim.exe using PyInstaller\n"}, "config.json": {"type": "text", "data": "{\n  \"apiKey\": \"AIzaSyAg4A0XMqu0C4FqbuKOdSxYSKdixOQp3gI\",\n  \"authDomain\": \"bank-e0ff6.firebaseapp.com\",\n  \"projectId\": \"bank-e0ff6\",\n  \"storageBucket\": \"bank-e0ff6.firebasestorage.app\",\n  \"messagingSenderId\": \"742754807887\",\n  \"appId\": \"1:742754807887:web:d88ecb6cb5cb30bd7a3a3a\",\n  \"measurementId\": \"G-ED31C26W08\",\n  \"databaseURL\": \"https://bank-e0ff6.firebaseio.com\"\n}"}, "requirements.txt": {"type": "text", "data": "requests\n"}, "LICENSE.txt": {"type": "text", "data": "MIT License\n\n(c) Prototype\n"}, "quickEntry.mnk": {"type": "text", "data": "# quickEntry.mnk - fictional demo script\nPROBE bank_node42 2\nOPENGATE bank_node42 tokenChain\nFORGETRANS acct_879 acct_me 100000\nMASK 3\n"}, "firebase_helper.py": {"type": "text", "data": "# Minimal Firebase helpers using REST API (for prototype/demo only)\n# Uses email/password auth (Identity Toolkit) to sign in and gets an ID token.\nimport requests, time, json, os\n\nclass FirebaseHelper:\n    def __init__(self, config_path=\"config.json\"):\n        if not os.path.exists(config_path):\n            raise FileNotFoundError(\"Please create config.json from config.example.json and fill project values.\")\n        with open(config_path, \"r\") as f:\n            self.cfg = json.load(f)\n        self.api_key = self.cfg.get(\"apiKey\")\n        self.db_url = self.cfg.get(\"databaseURL\", \"\").rstrip(\"/\")\n        self.id_token = None\n        self.local_id = None\n        self.token_expiry = 0\n\n    def signup(self, email, password):\n        url = f\"https://identitytoolkit.googleapis.com/v1/accounts:signUp?key={self.api_key}\"\n        payload = {\"email\": email, \"password\": password, \"returnSecureToken\": True}\n        r = requests.post(url, json=payload)\n        r.raise_for_status()\n        return r.json()\n\n    def signin(self, email, password):\n        url = f\"https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key={self.api_key}\"\n        payload = {\"email\": email, \"password\": password, \"returnSecureToken\": True}\n        r = requests.post(url, json=payload)\n        r.raise_for_status()\n        data = r.json()\n        self.id_token = data[\"idToken\"]\n        self.local_id = data[\"localId\"]\n        self.token_expiry = time.time() + int(data.get(\"expiresIn\",3600)) - 30\n        return data\n\n    def _ensure_token(self):\n        if not self.id_token or time.time() > self.token_expiry:\n            raise RuntimeError(\"ID token missing or expired. Call signin() again.\")\n\n    def db_get(self, path):\n        self._ensure_token()\n        url = f\"{self.db_url}/{path}.json?auth={self.id_token}\"\n        r = requests.get(url)\n        r.raise_for_status()\n        return r.json()\n\n    def db_put(self, path, value):\n        self._ensure_token()\n        url = f\"{self.db_url}/{path}.json?auth={self.id_token}\"\n        r = requests.put(url, json=value)\n        r.raise_for_status()\n        return r.json()\n\n    def db_patch(self, path, value):\n        self._ensure_token()\n        url = f\"{self.db_url}/{path}.json?auth={self.id_token}\"\n        r = requests.patch(url, json=value)\n        r.raise_for_status()\n        return r.json()\n\n    def db_push(self, path, value):\n        self._ensure_token()\n        url = f\"{self.db_url}/{path}.json?auth={self.id_token}\"\n        r = requests.post(url, json=value)\n        r.raise_for_status()\n        return r.json()\n"}, "main.py": {"type": "text", "data": "# hackPVPsim - terminal multiplayer client (prototype)\n# Safe fictional demo: does NOT perform real network attacks.\nimport os, json, threading, time\nfrom firebase_helper import FirebaseHelper\n\nSTATE = {\"player\": None, \"balance\": 0, \"heat\": 0}\n\ndef prompt(msg=\"> \"):\n    try:\n        return input(msg).strip()\n    except EOFError:\n        return \"\"\n\ndef print_help():\n    print(\"\"\"Available commands:\nsignup <email> <password>        - create a demo user (Firebase Email/Password)\nsignin <email> <password>        - sign in and get an ID token\nstatus                           - show local status\nprobeNet <target> <depth>        - probe a node (writes to /rooms/<room>/events)\nopenGate <node> <method>         - attempt to open a gate (writes event)\nforgeTransfer <from> <to> <amt>  - request a transfer (creates job)\nmaskTrace <level>                - attempt to mask traces (local) \nrun <script>                     - run a local MonkLang script file (demo)\njoin <room>                      - join a multiplayer room\nlisten                           - start listening to room events (polling)\nhelp                             - this help\nquit                             - exit\n\"\"\")\n\ndef run_script_file(fname, fb, room=None):\n    if not os.path.exists(fname):\n        print(\"script not found:\", fname); return\n    with open(fname) as f:\n        for line in f:\n            line = line.strip()\n            if not line or line.startswith(\"#\"): continue\n            parts = line.split()\n            cmd = parts[0].lower()\n            args = parts[1:]\n            print(\"->\", line)\n            handle_command_line(\" \".join([cmd] + args), fb, room)\n            time.sleep(0.2)\n\ndef handle_command_line(line, fb, current_room):\n    parts = line.split()\n    if not parts: return\n    cmd = parts[0].lower()\n    args = parts[1:]\n    if cmd == \"signup\":\n        email, pw = args[0], args[1]\n        print(\"Signing up...\")\n        res = fb.signup(email, pw)\n        print(\"signup:\", res.get(\"localId\"))\n    elif cmd == \"signin\":\n        email, pw = args[0], args[1]\n        print(\"Signing in...\")\n        res = fb.signin(email, pw)\n        STATE[\"player\"] = res.get(\"localId\")\n        STATE[\"balance\"] = 5000\n        print(\"signed in as\", STATE[\"player\"])\n    elif cmd == \"status\":\n        print(json.dumps(STATE, indent=2))\n    elif cmd == \"probenet\":\n        if len(args) < 2: print(\"usage: probeNet <target> <depth>\"); return\n        target, depth = args[0], int(args[1])\n        ev = {\"type\":\"probe\",\"by\":STATE.get(\"player\"),\"target\":target,\"depth\":depth,\"ts\":int(time.time())}\n        fb.db_push(f\"rooms/{current_room}/events\", ev)\n        print(\"probe event pushed:\", ev)\n    elif cmd == \"opengate\":\n        if len(args) < 2: print(\"usage: openGate <node> <method>\"); return\n        node, method = args[0], args[1]\n        ev = {\"type\":\"openGate\",\"by\":STATE.get(\"player\"),\"node\":node,\"method\":method,\"ts\":int(time.time())}\n        fb.db_push(f\"rooms/{current_room}/events\", ev)\n        print(\"openGate event pushed:\", ev)\n    elif cmd == \"forgetrans\":\n        if len(args) < 3: print(\"usage: forgeTransfer <from> <to> <amt>\"); return\n        fr, to, amt = args[0], args[1], int(args[2])\n        job = {\"type\":\"transfer\",\"from\":fr,\"to\":to,\"amt\":amt,\"by\":STATE.get(\"player\"),\"ts\":int(time.time()),\"status\":\"pending\"}\n        fb.db_push(f\"rooms/{current_room}/jobs\", job)\n        print(\"transfer requested:\", job)\n    elif cmd == \"masktrace\":\n        lvl = int(args[0]) if args else 1\n        STATE[\"heat\"] = max(0, STATE.get(\"heat\",0) - lvl)\n        print(\"local heat ->\", STATE[\"heat\"])\n    elif cmd == \"run\":\n        fname = args[0]\n        run_script_file(fname, fb, current_room)\n    elif cmd == \"join\":\n        room = args[0] if args else \"global\"\n        fb.db_put(f\"rooms/{room}/members/{STATE.get('player')}\", {\"joined\": int(time.time())})\n        print(\"joined room\", room)\n        return room\n    elif cmd == \"listen\":\n        print(\"Starting polling listener for room events (Ctrl-C to stop)\")\n        try:\n            while True:\n                events = fb.db_get(f\"rooms/{current_room}/events\") or {}\n                print(\"events:\", events)\n                time.sleep(2)\n        except KeyboardInterrupt:\n            print(\"stopped listener\")\n    else:\n        print(\"Unknown command. Type 'help'.\")\n\ndef interactive_loop():\n    print(\"hackPVPsim - terminal multiplayer client (prototype)\")\n    fb = FirebaseHelper()\n    current_room = \"global\"\n    print_help()\n    while True:\n        try:\n            line = prompt(\"tr> \")\n            if not line: continue\n            if line.strip().lower() == \"quit\": break\n            if line.strip().startswith(\"join \"):\n                new_room = handle_command_line(line, fb, current_room)\n                if new_room: current_room = new_room\n            else:\n                handle_command_line(line, fb, current_room)\n        except Exception as e:\n            print(\"ERROR:\", e)\n\nif __name__ == '__main__':\n    interactive_loop()\n"}, "build.bat": {"type": "text", "data": "@echo off\nREM Build hackPVPsim.exe using PyInstaller\nREM Make sure you have activated your Python environment and installed required packages.\npip install pyinstaller\npyinstaller --onefile --name hackPVPsim main.py --add-data \"config.json;.\"\necho Build finished. Check the dist\\ folder for hackPVPsim.exe\npause\n"}}
;
document.querySelectorAll('.filelink').forEach(a=>{
  a.addEventListener('click',e=>{
    e.preventDefault();
    const f = a.getAttribute('data-file');
    const item = assets[f];
    const content = document.getElementById('content');
    if(item.type==='image'){
      content.innerHTML = '<h4>'+f+'</h4><img src="'+item.data+'" style="max-width:100%">';
    } else if(item.type==='text'){
      content.innerHTML = '<h4>'+f+'</h4><pre>'+escapeHtml(item.data||'')+'</pre>';
    } else {
      content.innerHTML = '<h4>'+f+'</h4><p>Large or binary file. Download from the project ZIP.</p>';
    }
  });
});
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
