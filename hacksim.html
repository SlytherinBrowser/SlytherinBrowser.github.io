<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Terminal HackSim — multiplayer</title>
  <style>
    :root{--bg:#0b0f14;--txt:#cfe7ff;--accent:#65f0c7}
    html,body{height:100%;margin:0;background:linear-gradient(180deg,#02040a 0,#071325 100%);font-family:monospace;color:var(--txt)}
    .wrap{display:flex;flex-direction:column;height:100vh;padding:12px;box-sizing:border-box}
    #screen{flex:1;background:#06111a33;border-radius:6px;padding:12px;overflow:auto;white-space:pre-wrap}
    #prompt{display:flex;gap:8px;padding-top:8px;align-items:center}
    #input{flex:1;background:transparent;border:0;border-bottom:1px solid #123;padding:8px;color:var(--txt);outline:none;font-family:monospace}
    .sys{color:#9be7ff}.ok{color:#9fffae}.err{color:#ffb3b3}.meta{color:#9f9fb3}.cmd{color:var(--accent)}
    .small{font-size:12px;opacity:.8}.chip{background:#0f2430;padding:6px;border-radius:6px;color:#bde;font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">
    <div id="screen"></div>
    <div id="prompt">
      <div class="chip" id="status">not connected</div>
      <input id="input" autocomplete="off" placeholder="unesi komandu (help za listu)..." />
    </div>
  </div>

  <!-- ✅ Modularni SDK; nema globalnog `firebase` -->
  <script type="module">
    /************ Firebase imports (modular) ************/
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.24.0/firebase-app.js";
    import {
      getAuth, onAuthStateChanged,
      createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, signOut
    } from "https://www.gstatic.com/firebasejs/9.24.0/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, setDoc, updateDoc, addDoc,
      collection, getDocs, onSnapshot, query, where, limit, orderBy
    } from "https://www.gstatic.com/firebasejs/9.24.0/firebase-firestore.js";

    /************ Tvoj config ************/
    const firebaseConfig = {
      apiKey: "AIzaSyAg4A0XMqu0C4FqbuKOdSxYSKdixOQp3gI",
      authDomain: "bank-e0ff6.firebaseapp.com",
      projectId: "bank-e0ff6",
      storageBucket: "bank-e0ff6.appspot.com",
      messagingSenderId: "742754807887",
      appId: "1:742754807887:web:d88ecb6cb5cb30bd7a3a3a",
      measurementId: "G-ED31C26W08"
    };

    /************ Init ************/
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    /************ UI helpers ************/
    const screen = document.getElementById('screen');
    const input = document.getElementById('input');
    const statusChip = document.getElementById('status');

    function print(text, cls='') {
      const el = document.createElement('div');
      el.innerHTML = text;
      if (cls) el.classList.add(cls);
      screen.appendChild(el);
      screen.scrollTop = screen.scrollHeight;
    }
    const prettyCmd = (cmd)=>`<span class="cmd">${cmd}</span>`;
    const safeJSON = (obj)=>JSON.stringify(obj,null,2);

    /************ Game consts ************/
    const ROLES = ['mafijski','policijski','security'];
    const START_FILES = Object.freeze({
      '/home/readme.txt': 'Dobrodošao u HackSim — ovo je simulacija. Koristi help za listu komandi.',
      '/home/notes.txt': 'Tvoje beleške...'
    });

    /************ State ************/
    let me = null;      // snapshot podataka iz players/{uid}
    let unsubPlayer = null;

    /************ Utils ************/
    const randIP = ()=>`${Math.floor(Math.random()*223)+1}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`;
    const nowISO = ()=>new Date().toISOString();
    const uidShort = ()=>Math.random().toString(36).slice(2,9);

    /************ Auth flows ************/
    async function register(email, password, displayName){
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await updateProfile(cred.user, { displayName });
      const playerDoc = {
        uid: cred.user.uid,
        displayName,
        role: null,
        ip: randIP(),
        vpnOn: false,
        companyId: null,
        fs: {...START_FILES},
        money: 1000,
        scripts: {},
        logs: [],
        createdAt: nowISO()
      };
      await setDoc(doc(db, 'players', cred.user.uid), playerDoc);
      print(`<span class="ok">Registrovan: ${displayName} (${email})</span>`);
      attachPlayerListener(cred.user.uid);
    }

    async function login(email, password){
      const cred = await signInWithEmailAndPassword(auth, email, password);
      print(`<span class="ok">Prijavljen kao ${cred.user.displayName || cred.user.email}</span>`);
      attachPlayerListener(cred.user.uid);
    }

    async function logout(){
      if (unsubPlayer) unsubPlayer();
      await signOut(auth);
      me = null;
      statusChip.textContent = 'not connected';
      statusChip.classList.remove('ok');
      print('<span class="meta">Odjavljen</span>');
    }

    /************ Real-time sync svog profila ************/
    function attachPlayerListener(uid){
      if (unsubPlayer) unsubPlayer();
      unsubPlayer = onSnapshot(doc(db,'players',uid), (snap)=>{
        if(!snap.exists()) return;
        me = snap.data();
        statusChip.textContent = `${me.displayName} | ${me.role || 'role:nedef.'} | ${me.ip}${me.vpnOn ? ' (vpn)' : ''}`;
        statusChip.classList.add('ok');
        print(`<span class="sys">[sync] data synced @ ${new Date().toLocaleTimeString()}</span>`);
      }, (err)=> print(`<span class="err">Sync greška: ${err.message}</span>`));
    }

    /************ Core helpers ************/
    async function updateMe(fields){
      if(!me || !me.uid){ print('<span class="err">Nisi prijavljen.</span>'); return; }
      await updateDoc(doc(db,'players',me.uid), fields);
    }

    async function fetchPlayerByName(name){
      const q = query(collection(db,'players'), where('displayName','==',name), limit(1));
      const qs = await getDocs(q);
      if (qs.empty) return null;
      return qs.docs[0].data();
    }

    async function pushGlobalLog(text){
      await addDoc(collection(db,'events'), {text, ts: nowISO()});
    }

    /************ SimJS (lažna kompilacija) ************/
    function compileSimJS(code){
      if(typeof code !== 'string' || code.length<4) throw new Error('skripta prekratka');
      let power = 0;
      for(let i=0;i<code.length;i++) power = (power*31 + code.charCodeAt(i))%1000;
      return {ok:true,power};
    }

    /************ Komande ************/
    const COMMANDS = {};

    // account
    COMMANDS.register = {
      fn: async ([email,password,name])=>{
        if(!email||!password||!name){ print('Usage: register <email> <password> <displayName>'); return; }
        try{ await register(email,password,name); }
        catch(e){ print(`<span class="err">${e.message}</span>`); }
      },
      help: 'register <email> <password> <displayName>'
    };
    COMMANDS.login = {
      fn: async ([email,password])=>{
        if(!email||!password){ print('Usage: login <email> <password>'); return; }
        try{ await login(email,password); }
        catch(e){ print(`<span class="err">${e.message}</span>`); }
      },
      help: 'login <email> <password>'
    };
    COMMANDS.logout = { fn: async ()=>{ try{ await logout(); } catch(e){ print(`<span class="err">${e.message}</span>`);} }, help:'logout' };
    COMMANDS.whoami = { fn: async ()=>{ if(!me){ print('Nisi prijavljen'); return;} print(safeJSON({displayName:me.displayName,role:me.role,ip:me.ip,vpnOn:me.vpnOn,company:me.companyId,money:me.money})); }, help:'whoami' };

    // roles
    COMMANDS.setrole = { fn: async ([role])=>{ if(!ROLES.includes(role)){ print('Role: mafijski, policijski, security'); return;} await updateMe({role}); print(`<span class="ok">Role set: ${role}</span>`); }, help:'setrole <mafijski|policijski|security>' };
    COMMANDS.roles = { fn:()=>print('Dostupne role: mafijski, policijski, security'), help:'roles' };

    // company
    COMMANDS.mkcompany = { fn: async (args)=>{ const name=args.join(' '); if(!name){print('Usage: mkcompany <ime>'); return;} if(!me){print('Prijavi se'); return;} const id='co_'+uidShort(); await setDoc(doc(db,'companies',id),{id,name,owner:me.uid,members:[me.uid],createdAt:nowISO()}); await updateMe({companyId:id}); print(`<span class="ok">Company ${name} created (id:${id})</span>`); }, help:'mkcompany <ime>' };
    COMMANDS.joincompany = { fn: async ([id])=>{ if(!id){print('Usage: joincompany <companyId>');return;} const snap=await getDoc(doc(db,'companies',id)); if(!snap.exists()){print('Company ne postoji'); return;} const data=snap.data(); if((data.members||[]).includes(me.uid)){print('Već si član'); return;} const members=[...(data.members||[]), me.uid]; await updateDoc(doc(db,'companies',id),{members}); await updateMe({companyId:id}); print(`<span class="ok">Pridružio si se ${data.name}</span>`); }, help:'joincompany <companyId>' };
    COMMANDS.companyinfo = { fn: async ([id])=>{ const cid=id||me?.companyId; if(!cid){print('Nema company'); return;} const snap=await getDoc(doc(db,'companies',cid)); if(!snap.exists()){print('Ne postoji'); return;} print(safeJSON(snap.data())); }, help:'companyinfo [id]' };

    // filesystem
    COMMANDS.ls = { fn: async ([path])=>{ const p=path||'/home'; if(!me){print('Prijavi se');return;} const files=Object.keys(me.fs||{}).filter(x=>x.startsWith(p)).map(x=>x.replace(p+'/','')).filter(Boolean); if(!files.length) print('(prazno)'); else files.forEach(f=>print(f)); }, help:'ls [path]' };
    COMMANDS.cat = { fn: async ([path])=>{ if(!path){print('Usage: cat <path>');return;} if(!me){print('Prijavi se');return;} const content=me.fs[path]; if(content==null){print('Nema fajla');return;} print(`<span class="meta">--- ${path} ---</span>\n${content}`); }, help:'cat <path>' };
    COMMANDS.write = { fn: async ([path,...rest])=>{ if(!path){print('Usage: write <path> <text>');return;} if(!me){print('Prijavi se');return;} const text=rest.join(' '); const fs={...(me.fs||{})}; fs[path]=text; await updateMe({fs}); print(`<span class="ok">Zapisano ${path}</span>`); }, help:'write <path> <text>' };
    COMMANDS.rm = { fn: async ([path])=>{ if(!path){print('Usage: rm <path>');return;} if(!me){print('Prijavi se');return;} const fs={...(me.fs||{})}; delete fs[path]; await updateMe({fs}); print(`<span class="ok">Obrisano ${path}</span>`); }, help:'rm <path>' };
    COMMANDS.mv = { fn: async ([src,dst])=>{ if(!src||!dst){print('Usage: mv <src> <dst>');return;} if(!me){print('Prijavi se');return;} const fs={...(me.fs||{})}; if(!fs[src]){print('src ne postoji');return;} fs[dst]=fs[src]; delete fs[src]; await updateMe({fs}); print('<span class="ok">Moved</span>'); }, help:'mv <src> <dst>' };

    // scripts
    COMMANDS.mkscript = { fn: async ([name,...codeParts])=>{ const code=codeParts.join(' '); if(!name||!code){print('Usage: mkscript <name> <code>');return;} try{ const {power}=compileSimJS(code); const scripts={...(me.scripts||{})}; scripts[name]={name,code,owner:me.uid,createdAt:nowISO(),power,version:1}; await updateMe({scripts}); print(`<span class="ok">Skript ${name} kreirana (power ${power})</span>`); }catch(e){print(`<span class="err">${e.message}</span>`);} }, help:'mkscript <name> <code>' };
    COMMANDS.lsscripts = { fn: ()=>{ if(!me){print('Prijavi se');return;} const s=Object.keys(me.scripts||{}); if(!s.length) print('(nema skripti)'); else s.forEach(x=>print(x)); }, help:'lsscripts' };
    COMMANDS.catcript = { fn: ([name])=>{ if(!name){print('Usage: catcript <name>');return;} if(!me){print('Prijavi se');return;} const s=me.scripts?.[name]; if(!s){print('Nema skripte');return;} print(`${s.name} (v${s.version}) power:${s.power}\n${s.code}`); }, help:'catcript <name>' };

    // deploy / AV
    COMMANDS.deploy = { fn: async ([scriptName,target,type='virus'])=>{ if(!me||!scriptName){print('Usage: deploy <scriptName> [targetDisplayName] <virus|upgrade|antivirus>');return;} const s=me.scripts?.[scriptName]; if(!s){print('Skripta ne postoji');return;} await addDoc(collection(db,'deploys'),{by:me.displayName,script:scriptName,type,power:s.power,ts:nowISO(),target:target||null}); print(`<span class="ok">Deployed ${type} ${scriptName} (power ${s.power}) ${target?('-> '+target):''}</span>`); await pushGlobalLog(`${me.displayName} je deploy-ovao ${type} ${scriptName} ${target?('na '+target):''}`); }, help:'deploy <script> [target] <virus|upgrade|antivirus>' };
    COMMANDS.mkuppdate = { fn: async ([name,sname])=>{ if(!name||!sname){print('Usage: mkuppdate <updateName> <scriptName>');return;} if(!me){print('Prijavi se');return;} const script=me.scripts?.[sname]; if(!script){print('Nema skripte');return;} await addDoc(collection(db,'antivirus-updates'),{name,script:sname,author:me.displayName,power:script.power,ts:nowISO()}); print(`<span class="ok">Update ${name} napravljen</span>`); }, help:'mkuppdate <name> <scriptName>' };
    COMMANDS.updateav = { fn: async ()=>{ const qs=await getDocs(collection(db,'antivirus-updates')); const updates=qs.docs.map(d=>d.data()); await updateMe({av:updates}); print(`<span class="ok">Antivirus ažuriran: ${updates.length} updates</span>`); }, help:'updateav' };

    // network
    COMMANDS.vpn = { fn: async ([state])=>{ if(!me){print('Prijavi se');return;} if(state==='on'){ await updateMe({vpnOn:true,ip:randIP()}); print('<span class="ok">VPN uključen</span>'); } else if(state==='off'){ await updateMe({vpnOn:false,ip:randIP()}); print('<span class="ok">VPN isključen</span>'); } else { print('Usage: vpn <on|off>'); } }, help:'vpn <on|off>' };
    COMMANDS.ip = { fn: ()=>{ if(!me){print('Prijavi se');return;} print('IP: '+me.ip + (me.vpnOn? ' (via vpn)':'')); }, help:'ip' };

    // messaging / players
    COMMANDS.msg = { fn: async ([who,...txt])=>{ const text=txt.join(' '); if(!who||!text){print('Usage: msg <displayName> <text>');return;} const target=await fetchPlayerByName(who); if(!target){print('Nema igrača');return;} await addDoc(collection(db,'messages'),{from:me.displayName,to:who,text,ts:nowISO()}); print(`<span class="ok">Poslato poruku ${who}</span>`); }, help:'msg <displayName> <text>' };
    COMMANDS.readmsgs = { fn: async ()=>{ if(!me){print('Prijavi se');return;} const qs=await getDocs(query(collection(db,'messages'), where('to','==',me.displayName))); if(qs.empty){print('(nema poruka)');return;} qs.forEach(d=>print(`${d.data().ts} | ${d.data().from}: ${d.data().text}`)); }, help:'readmsgs' };
    COMMANDS.players = { fn: async ()=>{ const qs=await getDocs(collection(db,'players')); if(qs.empty){print('(nema igrača)');return;} qs.forEach(d=>{ const p=d.data(); print(`${p.displayName} | ${p.role||'?' } | ${p.ip}`); }); }, help:'players' };

    // simulated attacks
    COMMANDS.scan = { fn: async ([who])=>{ if(!who){print('Usage: scan <displayName>');return;} const t=await fetchPlayerByName(who); if(!t){print('Cilj ne postoji');return;} print(`<span class="meta">Skener: ${t.displayName} | IP: ${t.ip} | company: ${t.companyId || 'none'} | hasAV: ${t.av? (t.av.length):0}</span>`); }, help:'scan <displayName>' };
    COMMANDS.exploit = { fn: async ([who,scriptName])=>{ if(!who||!scriptName){print('Usage: exploit <displayName> <scriptName>');return;} const t=await fetchPlayerByName(who); if(!t){print('Cilj ne postoji');return;} const s=me.scripts?.[scriptName]; if(!s){print('Nemate takvu skriptu');return;} const chance=Math.max(5, Math.min(95, s.power % 100)); const roll=Math.floor(Math.random()*100)+1; if(roll<=chance){ const tFiles=Object.keys(t.fs||{}); const stolen=tFiles.length? tFiles[Math.floor(Math.random()*tFiles.length)] : null; if(stolen){ const fs={...(me.fs||{})}; fs['/loot/'+stolen.replace(/\//g,'_')]=`STOLEN from ${t.displayName} @ ${nowISO()}\n\n${t.fs[stolen]||'<empty>'}`; await updateMe({fs}); print(`<span class="ok">Exploit uspeo! Preuzeo ${stolen} u /loot/</span>`); await pushGlobalLog(`${me.displayName} je uspešno exploit-ovao ${t.displayName} i preuzeo ${stolen}`); } else { print('<span class="meta">Exploit uspeo ali nema fajlova</span>'); } } else { print(`<span class="err">Exploit fail (roll ${roll} > ${chance})</span>`); await addDoc(collection(db,'traces'),{attacker:me.displayName,target:t.displayName,ts:nowISO()}); } }, help:'exploit <displayName> <scriptName>' };
    COMMANDS.ddos = { fn: async ([who])=>{ if(!who){print('Usage: ddos <displayName>');return;} const t=await fetchPlayerByName(who); if(!t){print('no target');return;} await addDoc(collection(db,'attacks'),{type:'ddos',by:me.displayName,target:t.displayName,ts:nowISO()}); print('<span class="ok">DDoS initiated (simulated)</span>'); }, help:'ddos <displayName>' };

    // police/security
    COMMANDS.traces = { fn: async ()=>{ if(!me){print('Prijavi se');return;} const qs=await getDocs(query(collection(db,'traces'), where('target','==',me.displayName))); if(qs.empty){print('(nema tragova)');return;} qs.forEach(d=>print(safeJSON(d.data()))); }, help:'traces' };
    COMMANDS.hunt = { fn: async ()=>{ if(me?.role!=='policijski'){print('Samo policijski heker može hunt-ovati');return;} const qs=await getDocs(collection(db,'traces')); if(qs.empty){print('Nema tragova');return;} const map={}; qs.forEach(d=>{ const a=d.data().attacker; map[a]=(map[a]||0)+1; }); const best=Object.keys(map).sort((a,b)=>map[b]-map[a])[0]; print(`<span class="ok">Najaktivniji napadač: ${best} (${map[best]} tragova)</span>`); }, help:'hunt' };

    // logs & economy
    COMMANDS.log = { fn: async ([n])=>{ const num=parseInt(n||'10'); const qs=await getDocs(query(collection(db,'events'), orderBy('ts','desc'), limit(num))); if(qs.empty){print('(nema događaja)');return;} qs.forEach(d=>print(`${d.data().ts} | ${d.data().text}`)); }, help:'log [n]' };
    COMMANDS.balance = { fn: async ()=>{ if(!me){print('Prijavi se');return;} print(`Money: ${me.money||0}`); }, help:'balance' };
    COMMANDS.transfer = { fn: async ([who,amt])=>{ const amount=parseInt(amt); if(!who||!amount){print('Usage: transfer <displayName> <amount>');return;} const t=await fetchPlayerByName(who); if(!t){print('Target not found');return;} if((me.money||0)<amount){print('Nemaš dovoljno');return;} await updateDoc(doc(db,'players',me.uid),{money: (me.money-amount)}); await updateDoc(doc(db,'players',t.uid),{money:(t.money||0)+amount}); print(`<span class="ok">Poslato ${amount} gamecoins to ${who}</span>`); }, help:'transfer <displayName> <amount>' };

    // file transfer
    COMMANDS.pushfile = { fn: async ([who,path])=>{ if(!who||!path){print('Usage: pushfile <displayName> <localPath>');return;} const t=await fetchPlayerByName(who); if(!t){print('No target');return;} if(!me.fs?.[path]){print('Local fajl ne postoji');return;} await addDoc(collection(db,'incoming'),{to:t.displayName,from:me.displayName,path,pathContent:me.fs[path],ts:nowISO()}); print(`<span class="ok">Fajl poslat ${t.displayName}</span>`); }, help:'pushfile <displayName> <localPath>' };
    COMMANDS.incoming = { fn: async ()=>{ if(!me){print('Prijavi se');return;} const qs=await getDocs(query(collection(db,'incoming'), where('to','==',me.displayName))); if(qs.empty){print('(nema incoming fajlova)');return;} qs.forEach(d=>print(`${d.data().ts} | from ${d.data().from} -> ${d.data().path}`)); }, help:'incoming' };
    COMMANDS.acceptfile = { fn: async ([ts])=>{ if(!ts){print('Usage: acceptfile <ts>');return;} const qs=await getDocs(query(collection(db,'incoming'), where('to','==',me.displayName), where('ts','==',ts), limit(1))); if(qs.empty){print('Nema takvog');return;} const d=qs.docs[0].data(); const fs={...(me.fs||{})}; fs[d.path]=d.pathContent; await updateMe({fs}); print(`<span class="ok">Primljen ${d.path}</span>`); }, help:'acceptfile <ts>' };

    // system & fun
    COMMANDS.help = { fn: ()=>{ print('<span class="sys">--- HackSim komande ---</span>'); Object.keys(COMMANDS).sort().forEach(k=> print(`${prettyCmd(k)} — ${COMMANDS[k].help||''}`)); }, help:'help' };
    COMMANDS.ping = { fn: ()=>print('pong'), help:'ping' };
    COMMANDS.clear = { fn: ()=>{ screen.innerHTML=''; }, help:'clear' };
    COMMANDS.meow = { fn: ()=>print('(=^.^=) virtual cat'), help:'meow' };
    COMMANDS.version = { fn: ()=>print('HackSim v1.0 (simulated) — modular Firebase'), help:'version' };
    COMMANDS.resetfs = { fn: async ()=>{ if(!me){print('Prijavi se');return;} await updateMe({fs:{...START_FILES}}); print('FS resetovan'); }, help:'resetfs' };
    COMMANDS.spawn = { fn: async ([n])=>{ const count=parseInt(n||'1'); for(let i=0;i<count;i++){ const id='bot_'+uidShort(); await setDoc(doc(db,'players',id),{uid:id,displayName:'BOT_'+id,role:ROLES[Math.floor(Math.random()*ROLES.length)],ip:randIP(),vpnOn:false,fs:{...START_FILES},money:100,createdAt:nowISO()}); } print(`Spawn-ovano ${count} bota`); }, help:'spawn <n>' };

    // aliasi
    [
      ['who','whoami'],['mkco','mkcompany'],['joinco','joincompany'],['ci','companyinfo'],
      ['sf','scan'],['ex','exploit'],['ds','deploy'],['ms','mkscript'],['lsf','ls'],['catf','cat'],
      ['wf','write'],['rf','rm'],['mvf','mv'],['ss','lsscripts'],['cs','catcript'],
      ['avup','mkuppdate'],['updav','updateav'],['msgs','readmsgs'],['pl','players'],['lg','log'],
      ['bal','balance'],['xfer','transfer'],['pf','pushfile'],['inc','incoming'],['af','acceptfile'],
      ['tr','traces'],['huntme','hunt'],['vpnstatus','ip']
    ].forEach(([a,b])=>{ if(COMMANDS[b]) COMMANDS[a]={fn:COMMANDS[b].fn,help:'alias for '+b}; });

    // flavor komande
    [
      'virus.scan','virus.infect','virus.silent','virus.wipe','virus.encrypt','virus.ransom',
      'upgrade.firewall','upgrade.patch','upgrade.hardening','antivirus.scan','antivirus.clean',
      'social.phish','social.spoof','traceback','forensic','backup','restore','fork','merge',
      'compile','run','stop','status','reboot','shutdown','monitor','tail','grep','find','netstat',
      'ports','route','proxy','sniff','encrypt','decrypt','sign','verify','keygen','authcheck'
    ].forEach(name=>{
      COMMANDS[name] = { fn: ()=>print(`<span class="meta">Simulated action: ${name} (use deploy / mkscript)</span>`), help: name };
    });

    /************ Terminal handling ************/
    input.addEventListener('keydown', async (ev)=>{
      if(ev.key === 'Enter'){
        const raw = input.value.trim();
        if(!raw) return;
        print(`> ${raw}`, 'small');
        input.value = '';
        const parts = raw.split(' ').filter(Boolean);
        const cmd = parts[0].toLowerCase();
        const args = parts.slice(1);
        const entry = COMMANDS[cmd];
        if(entry){
          try{ await entry.fn(args); }
          catch(e){ print(`<span class="err">Command error: ${e.message}</span>`); }
        } else {
          print(`<span class="err">Nepoznata komanda: ${cmd} — koristi help</span>`);
        }
      }
    });
    window.addEventListener('click', ()=>input.focus());
    input.focus();

    onAuthStateChanged(auth, (user)=>{
      if(user){ attachPlayerListener(user.uid); }
      else { statusChip.textContent='not connected'; statusChip.classList.remove('ok'); }
    });

    print(`<span class="sys">HackSim — Multiplayer Terminal Game (simulated)</span>`);
    print(`<span class="meta">Upiši ${prettyCmd('help')} za listu komandi. Registrovanje: ${prettyCmd('register')}</span>`);
  </script>
</body>
</html>
