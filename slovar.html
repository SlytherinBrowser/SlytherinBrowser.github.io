<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>Dushra Codex – Demonski Prevajalnik</title>
  <style>
    /* ===== GLOBAL ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: radial-gradient(circle at top, #1a0b13 0, #050308 50%, #000 100%);
      color: #f3e6da;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 2000px;
      user-select: none;
    }

    /* ===== BOOK SHELL ===== */
    .book-container {
      width: 820px;
      max-width: 92vw;
      height: 540px;
      max-height: 85vh;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
    }

    .book-outer {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background: linear-gradient(145deg, #1b0c0f, #2b131b, #100508);
      box-shadow:
        0 0 40px rgba(0, 0, 0, 0.9),
        0 0 60px rgba(255, 0, 0, 0.25),
        inset 0 0 40px rgba(255, 60, 30, 0.15);
      overflow: hidden;
      border: 2px solid rgba(255, 80, 40, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.9s ease, box-shadow 0.9s ease, border-color 0.9s ease;
      transform-origin: left center;
    }

    .book-container.closed .book-outer {
      transform: rotateY(0deg);
    }

    .book-container.opened .book-outer {
      transform: rotateY(-140deg);
      box-shadow:
        0 0 80px rgba(255, 50, 10, 0.7),
        0 0 140px rgba(255, 0, 0, 0.6);
      border-color: rgba(255, 120, 90, 0.9);
    }

    .book-cover-symbol {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 4px solid rgba(255, 120, 90, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow:
        0 0 35px rgba(255, 60, 30, 0.9),
        inset 0 0 40px rgba(255, 210, 190, 0.15);
      animation: heartPulse 3.2s ease-in-out infinite;
    }

    .book-cover-symbol::before {
      content: "";
      position: absolute;
      width: 120%;
      height: 120%;
      border-radius: 50%;
      border: 1px solid rgba(255, 90, 60, 0.2);
      box-shadow: 0 0 35px rgba(255, 90, 60, 0.4);
      filter: blur(1px);
    }

    .book-cover-rune {
      font-family: "Georgia", serif;
      font-size: 52px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-align: center;
      color: #ffb9a0;
      text-shadow:
        0 0 10px rgba(255, 210, 180, 0.9),
        0 0 25px rgba(255, 60, 20, 0.95);
    }

    @keyframes heartPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 35px rgba(255, 60, 30, 0.8); }
      40% { transform: scale(1.06); box-shadow: 0 0 60px rgba(255, 80, 50, 1); }
      60% { transform: scale(1.02); box-shadow: 0 0 45px rgba(255, 70, 40, 0.9); }
    }

    .cover-cracks {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 10%, rgba(255, 90, 40, 0.55) 0, transparent 36%),
                  radial-gradient(circle at 80% 80%, rgba(255, 50, 20, 0.45) 0, transparent 32%);
      mix-blend-mode: screen;
      opacity: 0.7;
      pointer-events: none;
      filter: blur(1px);
    }

    /* ===== INNER CODEX ===== */
    .codex-inner {
      position: absolute;
      inset: 0;
      margin-left: 20px;
      background: linear-gradient(135deg, #f5e8ce 0, #e0cfaa 40%, #d1b88b 100%);
      border-radius: 8px;
      box-shadow:
        18px 0 25px rgba(0, 0, 0, 0.9),
        inset 0 0 24px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      opacity: 0;
      transform: translateX(40px) scale(0.98);
      transform-origin: center;
      transition: opacity 0.9s ease 0.2s, transform 0.9s ease 0.2s;
      pointer-events: none;
    }

    .book-container.opened .codex-inner {
      opacity: 1;
      transform: translateX(0) scale(1);
      pointer-events: auto;
      cursor: default;
    }

    .codex-inner::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(90deg,
          rgba(0, 0, 0, 0.12) 0,
          rgba(0, 0, 0, 0.12) 1px,
          transparent 1px,
          transparent 6px);
      mix-blend-mode: multiply;
      opacity: 0.25;
      pointer-events: none;
    }

    .codex-content {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 18px 26px 20px 26px;
      color: #2c1206;
    }

    .codex-header {
      text-align: center;
      margin-bottom: 10px;
      position: relative;
      padding-bottom: 6px;
    }

    .codex-title-main {
      font-family: "Cinzel", "Georgia", serif;
      font-size: 28px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #5d110b;
      text-shadow:
        0 0 6px rgba(255, 170, 110, 0.8),
        0 0 16px rgba(180, 40, 0, 0.8);
    }

    .codex-title-sub {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      margin-top: 6px;
      color: #7d2615;
    }

    .codex-header::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 200px;
      height: 2px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, transparent, #8a3616, transparent);
      opacity: 0.8;
    }

    /* ===== SIGILS (MODES) ===== */
    .mode-sigils {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin: 10px 0 12px;
    }

    .sigil {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle, #fdf2d6 0, #e3caa2 40%, #a66e42 100%);
      box-shadow:
        0 0 12px rgba(0, 0, 0, 0.4),
        0 0 18px rgba(180, 50, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .sigil::before {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      border: 1px solid rgba(120, 60, 30, 0.4);
    }

    .sigil:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow:
        0 0 18px rgba(0, 0, 0, 0.7),
        0 0 28px rgba(210, 80, 10, 0.9);
      filter: brightness(1.08);
    }

    .sigil.active {
      box-shadow:
        0 0 20px rgba(0, 0, 0, 0.85),
        0 0 38px rgba(220, 40, 10, 0.95);
      transform: translateY(-2px) scale(1.05);
    }

    .sigil-icon {
      font-size: 26px;
    }

    .sigil-label {
      margin-top: 4px;
      font-size: 11px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #6a200b;
    }

    /* ===== MAIN AREA (PAGES) ===== */
    .codex-body {
      flex: 1;
      display: grid;
      grid-template-columns: 1.2fr 1.2fr;
      gap: 14px;
      margin-top: 4px;
    }

    .page {
      position: relative;
      background: radial-gradient(circle at top left, #fdf6e3 0, #e9d6b5 42%, #d6ba8c 100%);
      border-radius: 8px;
      padding: 14px 14px 12px;
      box-shadow:
        0 0 12px rgba(0, 0, 0, 0.25),
        inset 0 0 12px rgba(255, 255, 255, 0.3);
      overflow: hidden;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
            180deg,
            rgba(0, 0, 0, 0.04) 0,
            rgba(0, 0, 0, 0.04) 1px,
            transparent 1px,
            transparent 14px
        );
      pointer-events: none;
    }

    .page-header {
      font-family: "Cinzel", "Georgia", serif;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-bottom: 6px;
      color: #7d2615;
    }

    .page-scroll {
      position: relative;
      max-height: calc(100% - 20px);
      overflow-y: auto;
      padding-right: 4px;
      font-size: 13px;
      line-height: 1.5;
      color: #3a1506;
    }

    .page-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .page-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .page-scroll::-webkit-scrollbar-thumb {
      background: rgba(100, 60, 30, 0.5);
      border-radius: 10px;
    }

    .muted {
      opacity: 0.7;
      font-size: 12px;
    }

    .small {
      font-size: 11px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      background: rgba(250, 241, 220, 0.9);
      border-radius: 6px;
      border: 1px solid rgba(110, 70, 36, 0.7);
      padding: 8px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      color: #2b1006;
      outline: none;
    }

    textarea:focus {
      box-shadow: 0 0 0 1px rgba(160, 55, 20, 0.8);
      border-color: rgba(160, 55, 20, 0.9);
    }

    .ghost-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #9a5a2f;
      margin-bottom: 4px;
    }

    .result-block {
      background: rgba(255, 248, 228, 0.95);
      border-radius: 6px;
      border: 1px solid rgba(100, 60, 30, 0.7);
      padding: 6px 8px;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 13px;
      margin-top: 4px;
    }

    .inline-pill {
      display: inline-block;
      background: rgba(121, 45, 14, 0.12);
      border-radius: 999px;
      padding: 1px 7px 2px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      margin-right: 4px;
      color: #6e2b13;
    }

    .direction-toggle {
      display: flex;
      gap: 4px;
      margin-bottom: 6px;
      font-size: 11px;
    }

    .direction-pill {
      flex: 1;
      text-align: center;
      padding: 3px 6px;
      border-radius: 999px;
      border: 1px solid rgba(115, 60, 26, 0.6);
      background: rgba(250, 238, 210, 0.75);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      transition: background 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }

    .direction-pill.active {
      background: radial-gradient(circle, #fdf2d6 0, #e5b987 60%, #b26537 100%);
      box-shadow:
        0 0 11px rgba(140, 54, 22, 0.8),
        0 0 15px rgba(180, 76, 26, 0.8);
      transform: translateY(-1px);
      color: #3a1408;
    }

    /* ===== SEARCH / EYE MODE ===== */
    .eye-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 16px;
    }

    .eye-left, .eye-right {
      flex: 1;
      position: relative;
    }

    .demonic-eye {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffe8b4 0, #ffb98a 30%, #6b0b02 65%, #0b0000 100%);
      margin: 0 auto;
      margin-top: 10px;
      box-shadow:
        0 0 25px rgba(150, 20, 8, 0.9),
        0 0 50px rgba(255, 60, 24, 0.8);
      position: relative;
      overflow: hidden;
    }

    .demonic-eye::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 2px solid rgba(255, 200, 160, 0.35);
      box-shadow: 0 0 20px rgba(255, 210, 160, 0.6);
    }

    .demonic-pupil {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 80px;
      background: radial-gradient(circle at 50% 10%, #ffdfc4 0, #570303 48%, #220000 100%);
      transform: translate(-50%, -50%) rotate(8deg);
      border-radius: 50% 50% 50% 50%;
      box-shadow:
        0 0 30px rgba(0, 0, 0, 0.8),
        0 0 30px rgba(255, 80, 40, 0.8);
    }

    .eye-ring {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 50%, transparent 50%, rgba(255, 130, 60, 0.24) 62%, transparent 80%);
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .eye-search-input {
      margin-top: 10px;
    }

    .eye-search-input input {
      width: 100%;
      border-radius: 999px;
      border: 1px solid rgba(120, 70, 30, 0.7);
      padding: 6px 9px;
      font-size: 13px;
      background: rgba(250, 238, 214, 0.9);
      outline: none;
      color: #2a0f05;
    }

    .eye-search-input input:focus {
      box-shadow: 0 0 0 1px rgba(150, 70, 28, 0.9);
    }

    .eye-hint {
      margin-top: 4px;
      font-size: 11px;
      color: #7a3e1d;
    }

    .search-pages {
      position: relative;
      margin-top: 10px;
      height: calc(100% - 90px);
    }

    .search-page {
      position: absolute;
      inset: 0;
      border-radius: 8px;
      background: radial-gradient(circle at top left, #fdf6e3 0, #e9d6b5 42%, #d6ba8c 100%);
      box-shadow:
        0 0 10px rgba(0, 0, 0, 0.25),
        inset 0 0 12px rgba(255, 255, 255, 0.3);
      padding: 10px;
      opacity: 0;
      transform-origin: left center;
      transform: rotateY(-45deg) translateX(-15px);
      transition: opacity 0.45s ease, transform 0.45s ease;
      overflow: hidden;
    }

    .search-page.visible {
      opacity: 1;
      transform: rotateY(0deg) translateX(0);
    }

    .search-page-header {
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #7d2615;
      margin-bottom: 4px;
    }

    .search-page-body {
      font-size: 13px;
      line-height: 1.5;
      color: #3a1506;
      max-height: calc(100% - 22px);
      overflow: auto;
    }

    /* ===== RULES FLIP STACK ===== */
    .rules-stack {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .rules-page {
      position: absolute;
      inset: 0;
      border-radius: 8px;
      background: radial-gradient(circle at top left, #fdf6e3 0, #e9d6b5 40%, #d7bc90 100%);
      box-shadow:
        0 0 11px rgba(0, 0, 0, 0.25),
        inset 0 0 12px rgba(255, 255, 255, 0.3);
      padding: 10px;
      opacity: 0;
      transform-origin: left center;
      transform: rotateY(-25deg) translateX(-16px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .rules-page.visible {
      opacity: 1;
      transform: rotateY(0deg) translateX(0);
    }

    .rules-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      margin-bottom: 4px;
      color: #7d2615;
    }

    .rules-body {
      font-size: 13px;
      max-height: calc(100% - 24px);
      overflow-y: auto;
    }

    .rules-footer {
      position: absolute;
      bottom: 4px;
      right: 10px;
      font-size: 11px;
      color: #80401e;
    }

    .rules-footer span {
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(127, 72, 37, 0.15);
    }

    .rules-footer span:hover {
      background: rgba(127, 72, 37, 0.4);
    }

    /* ===== FOOT ===== */
    .codex-footer {
      margin-top: 2px;
      font-size: 10px;
      color: #7a3c1a;
      text-align: right;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 900px) {
      .codex-body {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .book-container {
        transform: scale(0.9);
      }
    }
  </style>
</head>
<body>
<div id="app">
  <div class="book-container closed" id="bookContainer">
    <!-- CLOSED COVER -->
    <div class="book-outer">
      <div class="book-cover-symbol">
        <div class="book-cover-rune">
          ᛞᚢᛋ<br>ᛖᚱ
        </div>
      </div>
      <div class="cover-cracks"></div>
    </div>

    <!-- INNER CODEX -->
    <div class="codex-inner">
      <div class="codex-content">
        <header class="codex-header">
          <div class="codex-title-main">DUSHRA CODEX</div>
          <div class="codex-title-sub">DEMONSKI JEZIK &bull; PREVAJALNIK &bull; PRAVILA</div>
        </header>

        <section class="mode-sigils">
          <div class="sigil active" data-mode="translate">
            <div class="sigil-icon">✒</div>
            <div class="sigil-label">Pisanje</div>
          </div>
          <div class="sigil" data-mode="rules">
            <div class="sigil-icon">🔥</div>
            <div class="sigil-label">Pravila</div>
          </div>
          <div class="sigil" data-mode="search">
            <div class="sigil-icon">👁</div>
            <div class="sigil-label">Iskanje</div>
          </div>
        </section>

        <!-- MAIN AREA -->
        <section class="codex-body">
          <!-- LEFT PAGE -->
          <article class="page" id="leftPage">
            <div class="page-header" id="leftPageHeader">Prevajanje</div>
            <div class="page-scroll" id="leftPageScroll"></div>
          </article>

          <!-- RIGHT PAGE -->
          <article class="page" id="rightPage">
            <div class="page-header" id="rightPageHeader">Rezultat</div>
            <div class="page-scroll" id="rightPageScroll"></div>
          </article>
        </section>

        <footer class="codex-footer">
          &copy; Dushra Codex &mdash; Demotski jezik (Level 2)
        </footer>
      </div>
    </div>
  </div>
</div>

<script>
  // ===================== CORE DOM ELEMENTS =====================
  const bookContainer = document.getElementById('bookContainer');
  const sigils = document.querySelectorAll('.sigil');

  const leftPage = document.getElementById('leftPage');
  const rightPage = document.getElementById('rightPage');
  const leftPageHeader = document.getElementById('leftPageHeader');
  const rightPageHeader = document.getElementById('rightPageHeader');
  const leftPageScroll = document.getElementById('leftPageScroll');
  const rightPageScroll = document.getElementById('rightPageScroll');

  let currentMode = 'translate';
  let currentDirection = 'sl2dem';

  // elements reused v translate modu
  const directionToggle = document.createElement('div');
  directionToggle.className = 'direction-toggle';
  directionToggle.id = 'directionToggle';
  directionToggle.innerHTML = `
    <div class="direction-pill active" data-dir="sl2dem">Slovenščina → Demotika (L2)</div>
    <div class="direction-pill" data-dir="dem2sl">Demotika (L2) → Slovenščina</div>
  `;

  const inputLabel = document.createElement('div');
  inputLabel.className = 'ghost-label';
  inputLabel.id = 'inputLabel';

  const outputLabel = document.createElement('div');
  outputLabel.className = 'ghost-label';
  outputLabel.id = 'outputLabel';

  const inputText = document.createElement('textarea');
  inputText.id = 'inputText';
  inputText.placeholder = 'Vpiši besedo, stavek ali cel odstavek...';

  const outputText = document.createElement('div');
  outputText.className = 'result-block';
  outputText.id = 'outputText';

  // ===================== OPEN BOOK =====================
  bookContainer.addEventListener('click', (ev) => {
    if (bookContainer.classList.contains('closed')) {
      bookContainer.classList.remove('closed');
      bookContainer.classList.add('opened');
      ev.stopPropagation();
    }
  }, { capture: true });

  document.querySelector('.codex-inner').addEventListener('click', (ev) => {
    ev.stopPropagation();
  });

  // ===================== MODE SWITCHING =====================
  sigils.forEach(sigil => {
    sigil.addEventListener('click', () => {
      sigils.forEach(s => s.classList.remove('active'));
      sigil.classList.add('active');
      const mode = sigil.dataset.mode;
      switchMode(mode);
    });
  });

  function switchMode(mode) {
    currentMode = mode;
    leftPageScroll.innerHTML = '';
    rightPageScroll.innerHTML = '';

    if (mode === 'translate') {
      leftPageHeader.textContent = 'Prevajanje';
      rightPageHeader.textContent = 'Rezultat';
      buildTranslateMode();
    } else if (mode === 'rules') {
      leftPageHeader.textContent = 'Glavna pravila (L2)';
      rightPageHeader.textContent = 'Sklop pravil';
      buildRulesMode();
    } else if (mode === 'search') {
      leftPageHeader.textContent = 'Oko razodetja';
      rightPageHeader.textContent = 'Razlaga v listih';
      buildSearchMode();
    }
  }

  // ===================== TRANSLATE MODE =====================
  function buildTranslateMode() {
    const left = document.createElement('div');
    left.className = 'translate-left';

    left.appendChild(directionToggle);

    inputLabel.textContent = 'Vnos (slovenščina)';
    left.appendChild(inputLabel);

    inputText.value = '';
    inputText.placeholder = 'Vpiši besedo ali stavek v slovenščini...';
    left.appendChild(inputText);

    const info = document.createElement('p');
    info.className = 'muted small';
    info.style.marginTop = '6px';
    info.innerHTML = `
      Algoritem demotike Level 2:
      <span class="inline-pill">r→rr</span>
      <span class="inline-pill">v→gh</span>
      <span class="inline-pill">h→kh</span>
      <span class="inline-pill">s→z</span>
      <span class="inline-pill">č/š→sh</span>
      <span class="inline-pill">ž→zh</span>
      <span class="inline-pill">j→y</span>
      +
      <span class="inline-pill">e→ae</span>
      <span class="inline-pill">o→oa</span>
      <span class="inline-pill">u→uu</span>
      +
      posebne oblike za majhne funkcijske besede (jaz, ti, ne, in, je, sem, bo ...).
    `;
    left.appendChild(info);
    leftPageScroll.appendChild(left);

    const right = document.createElement('div');
    right.className = 'translate-right';

  // ===================== FUNCTION WORDS & ALGORITHMS (LEVEL 2) =====================
  const functionWordsSlToDem = {
    'jaz': 'azh',
    'ti': 'tha',
    'on': 'ron',
    'ona': 'rona',
    'mi': 'mir',
    'vi': 'vir',
    'se': 'esh',
    'ne': 'nor',
    'in': 'nar',
    'da': 'dor',
    'je': 'zae',
    'si': 'zae',
    'sem': 'zaem',
    'bo': 'zgho',
    'te': 'tae',
    'me': 'mae'
  };

  const functionWordsDemToSl = {};
  for (const [sl, dem] of Object.entries(functionWordsSlToDem)) {
    functionWordsDemToSl[dem.toLowerCase()] = sl.toLowerCase();
  }

  function slovenianToDemotic(text) {
    const converted = text.split(/(\s+)/).map(token => {
      if (/\s+/.test(token)) return token;

      // ločila na robovih
      const match = token.match(/^([\.,;:\!\?\(\)\[\]\{\}"']*)(.+?)([\.,;:\!\?\(\)\[\]\{\}"']*)$/);
      let prefix = '', word = token, suffix = '';
      if (match) {
        prefix = match[1];
        word = match[2];
        suffix = match[3];
      }

      const lower = word.toLowerCase();

      // funkcijske besede
      if (functionWordsSlToDem[lower]) {
        const dem = functionWordsSlToDem[lower];
        return prefix + preserveCase(word, dem) + suffix;
      }

      // splošni L2 algoritem
      const demWord = transformSlWordToDem(word);
      return prefix + demWord + suffix;
    }).join('');

    return addSentenceParticleKa(converted);
  }

  function demoticToSlovenian(text) {
    // najprej odstrani 'ka pred ločili
    let cleaned = text.replace(/'ka([\.!\?])/g, '$1');

    return cleaned.split(/(\s+)/).map(token => {
      if (/\s+/.test(token)) return token;

      const match = token.match(/^([\.,;:\!\?\(\)\[\]\{\}"']*)(.+?)([\.,;:\!\?\(\)\[\]\{\}"']*)$/);
      let prefix = '', word = token, suffix = '';
      if (match) {
        prefix = match[1];
        word = match[2];
        suffix = match[3];
      }

      const lower = word.toLowerCase();

      // funkcijske besede (obratno)
      if (functionWordsDemToSl[lower]) {
        const sl = functionWordsDemToSl[lower];
        return prefix + preserveCase(word, sl) + suffix;
      }

      const slWord = transformDemWordToSl(word);
      return prefix + slWord + suffix;
    }).join('');
  }

  function preserveCase(original, targetLower) {
    if (!original) return targetLower;
    if (original === original.toUpperCase()) {
      return targetLower.toUpperCase();
    }
    if (original[0] === original[0].toUpperCase()) {
      return targetLower[0].toUpperCase() + targetLower.slice(1);
    }
    return targetLower;
  }

  function transformSlWordToDem(word) {
    const original = word;
    let w = original.toLowerCase();

    // šumniki v digrafe
    w = w
      .replace(/č/g, 'sh')
      .replace(/š/g, 'sh')
      .replace(/ž/g, 'zh');

    // soglasniki
    w = w
      .replace(/j/g, 'y')
      .replace(/r/g, 'rr')
      .replace(/v/g, 'gh')
      .replace(/h/g, 'kh')
      .replace(/s/g, 'z');

    // samoglasniki
    w = w
      .replace(/e/g, 'ae')
      .replace(/o/g, 'oa')
      .replace(/u/g, 'uu');

    return w;
  }

  function transformDemWordToSl(word) {
    let w = word.toLowerCase();

    // najprej razširjeni samoglasniki nazaj
    w = w
      .replace(/uu/g, 'u')
      .replace(/oa/g, 'o')
      .replace(/ae/g, 'e');

    // digrafi soglasnikov nazaj
    w = w
      .replace(/sh/g, 'š')
      .replace(/zh/g, 'ž')
      .replace(/gh/g, 'v')
      .replace(/kh/g, 'h')
      .replace(/rr/g, 'r');

    // enojni glasovi
    w = w
      .replace(/z/g, 's')
      .replace(/y/g, 'j');

    return w;
  }

  function addSentenceParticleKa(str) {
    // doda 'ka pred . ! ? če ga še ni
    return str.replace(/([^\s\.!\?]+)([\.!\?])/g, (match, word, punct) => {
      if (word.endsWith("'ka") || word.endsWith("’ka")) return word + punct;
      return word + "'ka" + punct;
    });
  }

  // ===================== SEARCH EXPLANATION ENGINE =====================
  function explainQuery(query) {
    const q = query.trim();
    const lowerFull = q.toLowerCase();

    const parts = lowerFull.split(/\s+/).filter(Boolean);
    const main = parts[0] || lowerFull;

    let ruleHtml = '';
    let meaningHtml = '';
    let translationHtml = '';

    const isProbablyDemotic =
      /kh|gh|rr|sh|zh|’|'/.test(main);

    if (isProbablyDemotic) {
      const slGuess = demoticToSlovenian(q);
      const demGuessBack = slovenianToDemotic(slGuess);

      ruleHtml = `
        <p class="small">
          Vnos <b>${q}</b> prepoznan kot demotika Level 2 (vsebuje vsaj en od vzorcev: kh, gh, rr, sh, zh ali ').<br>
          Oko uporabi obratna L2 pravila: najprej odstrani 'ka na koncu stavkov, nato vrne
          ae→e, oa→o, uu→u, sh→š, zh→ž, gh→v, kh→h, rr→r, z→s, y→j
          ter preveri funkcijske besede (azh, tha, nor, nar, zae...).
        </p>
      `;
      meaningHtml = `
        <p class="small">
          Približen slovenski zapis:
          <br><b>${slGuess}</b>
        </p>
        <p class="small">
          Ker je prevod algoritemski, je to “čist” približek glede na L2 pravila, ne umetniški prevod.
        </p>
      `;
      translationHtml = `
        <p class="small">
          <b>Demotika (L2) → Slovenščina:</b><br>
          ${q} → <b>${slGuess}</b>
        </p>
        <p class="small" style="margin-top:4px;">
          <b>Slovenščina → Demotika (L2, nazaj):</b><br>
          ${slGuess} → <b>${demGuessBack}</b>
        </p>
      `;
    } else {
      const demGuess = slovenianToDemotic(q);
      const backGuess = demoticToSlovenian(demGuess);

      ruleHtml = `
        <p class="small">
          Vnos <b>${q}</b> je obravnavan kot slovenski tekst.
          Oko uporabi Level 2 algoritem: soglasniki r→rr, v→gh, h→kh, s→z, č/š→sh, ž→zh, j→y,
          samoglasniki e→ae, o→oa, u→uu, funkcijske besede (jaz, ti, ne, in, je...) spremeni v stalne demonske oblike
          ter doda delček 'ka na koncu stavkov.
        </p>
      `;
      meaningHtml = `
        <p class="small">
          Algoritmična demotska oblika:
          <br><b>${demGuess}</b>
        </p>
        <p class="small">
          Ta oblika pokaže, kako L2 pravila preoblikujejo tvoj stavek v demonsko različico.
        </p>
      `;
      translationHtml = `
        <p class="small">
          <b>Slovenščina → Demotika (L2):</b><br>
          ${q} → <b>${demGuess}</b>
        </p>
        <p class="small" style="margin-top:4px;">
          <b>Demotika (L2) → Slovenščina (obrat):</b><br>
          ${demGuess} → <b>${backGuess}</b>
        </p>
      `;
    }

    return {
      rule: ruleHtml,
      meaning: meaningHtml,
      translation: translationHtml
    };
  }

  // ===================== TTS (TEXT-TO-SPEECH) =====================
  function setupTTS() {
    const inputBtn = document.getElementById('speakInputBtn');
    const outputBtn = document.getElementById('speakOutputBtn');

    if (!inputBtn || !outputBtn) return;
    if (!('speechSynthesis' in window)) {
      inputBtn.disabled = true;
      outputBtn.disabled = true;
      inputBtn.textContent = '🔈 Ni podpore za TTS';
      outputBtn.textContent = '🔊 Ni podpore za TTS';
      return;
    }

    inputBtn.onclick = () => {
      const text = inputText.value;
      if (!text) return;
      speakText(text, 'sl-SI');
    };

    outputBtn.onclick = () => {
      const text = outputText.textContent;
      if (!text) return;
      speakText(text, 'sl-SI');
    };
  }

  function speakText(text, lang) {
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = lang || 'sl-SI';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  }

  // ===================== INIT =====================
  buildTranslateMode();
</script>
</body>
</html>
