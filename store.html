<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <title>Trgovina</title>
  <style>
    button { margin: 5px; padding: 8px 12px; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>
  <h2>Tvoji kovanci: <span id="coinDisplay">...</span></h2>

  <div id="storeItems">
    <h3>Efekti pošiljanja</h3>
    <button onclick="buyEffect('sendAnimation', 'sparkle', 50)">Iskrice ✨ (50 kovancev)</button>
    <button onclick="buyEffect('sendAnimation', 'zoom', 30)">Zoom 🔍 (30 kovancev)</button>

    <h3>Okvirji avatarjev</h3>
    <button onclick="buyEffect('avatarFrame', 'gold', 40)">Zlati okvir 🏅 (40 kovancev)</button>
    <button onclick="buyEffect('avatarFrame', 'neon', 60)">Neon okvir 💡 (60 kovancev)</button>
  </div>

  <p id="storeStatus"></p>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    const coinDisplay = document.getElementById('coinDisplay');
    const storeStatus = document.getElementById('storeStatus');

    auth.onAuthStateChanged(user => {
      if (user) {
        const coinsRef = database.ref('users/' + user.uid + '/coins');
        coinsRef.on('value', snapshot => {
          coinDisplay.textContent = snapshot.val() || 0;
        });
      }
    });

    function buyEffect(type, value, cost) {
      const user = auth.currentUser;
      if (!user) return alert("Prijavi se najprej");

      const userRef = database.ref('users/' + user.uid);
      const coinsRef = userRef.child('coins');
      const effectRef = userRef.child('effects/' + type);

      coinsRef.once('value').then(snapshot => {
        const currentCoins = snapshot.val() || 0;
        if (currentCoins >= cost) {
          coinsRef.set(currentCoins - cost);
          effectRef.set(value);
          storeStatus.textContent = `Kupil si ${type === 'sendAnimation' ? 'efekt' : 'okvir'}: ${value}`;
        } else {
          storeStatus.textContent = "Premalo kovancev!";
        }
      });
    }

    // Za testiranje: anonimna prijava
    auth.signInAnonymously().catch(console.error);
  </script>
</body>
</html>
