<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>Trgovina</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f0f0f0; }
    #coinDisplay { font-size: 1.2em; margin-bottom: 20px; }
    .item {
      background: white;
      padding: 10px 15px;
      margin-bottom: 10px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
    button.buyBtn {
      background: #28a745;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    button.buyBtn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div id="coinDisplay">Kovanci: <span id="coinCount">0</span></div>

  <div id="storeItems"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.24.0/firebase-app.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/9.24.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.24.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "tvoj-api-key",
      authDomain: "tvoj-auth-domain",
      databaseURL: "tvoj-database-url",
      projectId: "tvoj-project-id",
      storageBucket: "tvoj-storage-bucket",
      messagingSenderId: "tvoj-messaging-sender-id",
      appId: "tvoj-app-id"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    const coinCount = document.getElementById('coinCount');
    const storeItems = document.getElementById('storeItems');

    let userId;
    let userData = null;

    const itemsForSale = [
      { id: 'frame_red', name: 'Rdeči okvir za avatar', price: 15, type: 'frame' },
      { id: 'frame_blue', name: 'Modri okvir za avatar', price: 15, type: 'frame' },
      { id: 'anim_send', name: 'Animacija ob pošiljanju sporočila', price: 20, type: 'animation' },
      { id: 'anim_show', name: 'Animacija ob prikazu sporočila', price: 20, type: 'animation' }
    ];

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        userId = user.uid;
        await loadUserData();
        renderStore();
      } else {
        coinCount.textContent = 'Za dostop do trgovine se morate prijaviti.';
        storeItems.innerHTML = '';
      }
    });

    async function loadUserData() {
      const userRef = ref(db, 'users/' + userId);
      const snapshot = await get(userRef);
      if (snapshot.exists()) {
        userData = snapshot.val();
        if (!userData.coins) userData.coins = 0;
        if (!userData.items) userData.items = {};
        coinCount.textContent = userData.coins;
      } else {
        // ustvari uporabnika z začetnimi podatki, če še ne obstaja
        userData = { coins: 0, lastClaimDate: null, items: {} };
        await update(ref(db, 'users/' + userId), userData);
        coinCount.textContent = 0;
      }
    }

    function renderStore() {
      storeItems.innerHTML = '';

      itemsForSale.forEach(item => {
        const owned = userData.items[item.id] || false;
        const itemDiv = document.createElement('div');
        itemDiv.className = 'item';

        itemDiv.innerHTML = `
          <span>${item.name} - ${item.price} kovancev</span>
          <button class="buyBtn" ${owned ? 'disabled' : ''} data-id="${item.id}">
            ${owned ? 'Kupljeno' : 'Kupi'}
          </button>
        `;

        storeItems.appendChild(itemDiv);
      });

      document.querySelectorAll('.buyBtn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-id');
          await buyItem(id);
        });
      });
    }

    async function buyItem(id) {
      const item = itemsForSale.find(i => i.id === id);
      if (!item) return alert('Artikel ne obstaja.');
      if (userData.items[id]) return alert('Artikel je že kupljen.');
      if (userData.coins < item.price) return alert('Nimate dovolj kovancev.');

      userData.coins -= item.price;
      userData.items[id] = true;

      await update(ref(db, 'users/' + userId), {
        coins: userData.coins,
        items: userData.items
      });

      coinCount.textContent = userData.coins;
      renderStore();

      alert(`Uspešno ste kupili: ${item.name}`);
    }
  </script>
</body>
</html>
