<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>Store z nakupom funkcij</title>
  <style>
    #toast {
      visibility: hidden;
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #333;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      font-family: sans-serif;
      z-index: 1000;
      transition: visibility 0.3s;
    }
    #store {
      margin-top: 20px;
    }
    .item {
      border: 1px solid #aaa;
      padding: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item button {
      padding: 5px 10px;
    }
    .bought {
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Kovanci: <span id="coinDisplay">0</span></h2>

  <div id="store">
    <h3>Trgovina</h3>
    <div id="itemsContainer"></div>
  </div>

  <div id="toast"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    // Firebase konfiguracija - zamenjaj s svojo
    const firebaseConfig = {
      apiKey: "tvoja_api_key",
      authDomain: "tvoj_project.firebaseapp.com",
      databaseURL: "https://tvoj_project-default-rtdb.firebaseio.com",
      projectId: "tvoj_project",
      storageBucket: "tvoj_project.appspot.com",
      messagingSenderId: "sender_id",
      appId: "app_id"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.database();

    let uid = null;
    let currentCoins = 0;
    let userFeatures = {};

    // Definicija funkcij za nakup
    const storeItems = [
      { key: "fade_in_animacija", name: "Fade In Animacija", cost: 10 },
      { key: "zoom_animacija", name: "Zoom Animacija", cost: 15 },
      { key: "mavrica_animacija", name: "Mavrica Animacija", cost: 20 },
      { key: "zlati_okvir", name: "Zlati okvir", cost: 25 },
      { key: "neon_okvir", name: "Neon okvir", cost: 30 },
      { key: "ognjeni_okvir", name: "Ognjeni okvir", cost: 35 },
    ];

    // Toast obvestilo
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.style.visibility = "visible";
      setTimeout(() => {
        toast.style.visibility = "hidden";
      }, 3000);
    }

    // Prijava anonimno in nalaganje podatkov
    auth.signInAnonymously()
      .then(() => {
        auth.onAuthStateChanged(user => {
          if (user) {
            uid = user.uid;
            loadCoins();
            loadUserFeatures();
          }
        });
      })
      .catch(err => console.error("Napaka pri prijavi:", err));

    // Naloži kovance in prikaži
    function loadCoins() {
      db.ref("users/" + uid + "/coins").on("value", snapshot => {
        currentCoins = snapshot.val() || 0;
        document.getElementById("coinDisplay").textContent = currentCoins;
        renderStore();
      });
    }

    // Naloži kupljene funkcije in prikaži
    function loadUserFeatures() {
      db.ref("users/" + uid + "/features").on("value", snapshot => {
        userFeatures = snapshot.val() || {};
        renderStore();
      });
    }

    // Prikaži store z gumbi
    function renderStore() {
      const container = document.getElementById("itemsContainer");
      container.innerHTML = "";

      storeItems.forEach(item => {
        const div = document.createElement("div");
        div.classList.add("item");

        const nameSpan = document.createElement("span");
        nameSpan.textContent = `${item.name} (${item.cost} kovancev)`;
        div.appendChild(nameSpan);

        const btn = document.createElement("button");
        if (userFeatures[item.key]) {
          btn.textContent = "Kupljeno";
          btn.disabled = true;
          btn.classList.add("bought");
        } else {
          btn.textContent = "Kupi";
          btn.disabled = currentCoins < item.cost;
          btn.onclick = () => buyItem(item.key, item.cost);
        }

        div.appendChild(btn);
        container.appendChild(div);
      });
    }

    // Nakup funkcije
    function buyItem(itemKey, cost) {
      if (currentCoins < cost) {
        showToast("Nimaš dovolj kovancev!");
        return;
      }

      const userRef = db.ref("users/" + uid);

      userRef.transaction(userData => {
        if (!userData) {
          userData = { coins: 0, features: {} };
        }
        if (!userData.features) {
          userData.features = {};
        }
        if (userData.coins >= cost) {
          if (userData.features[itemKey]) {
            // Funkcija že kupljena
            return;
          }
          userData.coins -= cost;
          userData.features[itemKey] = true;
          return userData;
        }
        return; // prekini transakcijo, ker ni dovolj kovancev
      }, (error, committed, snapshot) => {
        if (error) {
          showToast("Napaka pri nakupu!");
          console.error(error);
        } else if (!committed) {
          showToast("Nimaš dovolj kovancev!");
        } else {
          showToast(`Uspešno kupljeno: ${itemKey.replace(/_/g, " ")}`);
        }
      });
    }
  </script>

</body>
</html>
