<!DOCTYPE html>

<head>

    <style type="text/css">
      body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background-color: #f4f4f9;
}


#appContainer {
    display: flex;
    flex-wrap: wrap;
    gap: 40px;
    align-items: center;
    justify-content: center;
}

.category {
    width: 100%;
    max-width: 500px;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 15px;
    background-color: #fff;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

.category h3 {
    text-align: center;
    margin-bottom: 10px;
}

.appWrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
}

.arrow {
    font-size: 24px;
    color: #0078d4;
    background-color: transparent;
    border: none;
    cursor: pointer;
    transition: transform 0.3s;
}

.arrow:hover {
    transform: scale(1.2);
}

.appContent {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100px;
}

.appItem {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 5px;
    transition: background-color 0.3s;
}

.appItem:hover {
    background-color: #f0f0f0;
}

.appItem img {
    width: 30px;
    height: 30px;
    object-fit: contain;
}
#changeColorBtn {
  position: fixed;
  bottom: 0;
  width: 100%;
  left: 0;  
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        #changeColorBtn:active {
            background-color: #45a049;
        }

        #colorPicker {
          width: 30%;
          left: 0;
          width: 100%;
          position: fixed;
          bottom: 30px;
            margin-top: 20px;
            display: none; /* Skrije izbiro barve na začetku */
        }
    </style>
</head>

const categories = ["applications", "raz", "shop", "games", "my", "hor", "other"];
let appIndex = {
    applications: 0,
    raz: 0,
    shop: 0,
    games: 0,
    my: 0,
    hor: 0,
    other: 0
};

function displayApp(category) {
    const app = appData[category][appIndex[category]];
    const appContent = document.getElementById(category).querySelector(".appContent");
    appContent.innerHTML = `
        <div class="appItem">
            <img src="${app.img}" alt="${app.name}">
            <span>${app.name}</span>
            <a href="${app.link}" target="_blank" class="arrow">&#8594;</a>
        </div>
    `;
}

function changeApp(category, direction) {
    appIndex[category] = (appIndex[category] + direction + appData[category].length) % appData[category].length;
    displayApp(category);
}

function searchApps() {
    const searchValue = document.getElementById("searchInput").value.toLowerCase();
    
    categories.forEach(category => {
        appData[category] = appData[category].filter(app => app.name.toLowerCase().includes(searchValue));
        displayApp(category);
    });
}

// Initialize the app display
categories.forEach(category => displayApp(category));






 const changeColorBtn = document.getElementById('changeColorBtn');
        const colorPicker = document.getElementById('colorPicker');
        const colorBoxes = document.querySelectorAll('.category');

        let isColorChangeActive = false;  // Spreminjanje barve je onemogočeno na začetku
        let selectedColor = '#000000';    // Privzeta barva (črna)

        // Preveri, če so barve že shranjene v localStorage
        if (localStorage.getItem('color1')) {
            document.getElementById('games').style.backgroundColor = localStorage.getItem('color1');
        }
        if (localStorage.getItem('color2')) {
            document.getElementById('applications').style.backgroundColor = localStorage.getItem('color2');
        }
        if (localStorage.getItem('color6')) {
            document.getElementById('raz').style.backgroundColor = localStorage.getItem('color6');
        }
        if (localStorage.getItem('color3')) {
            document.getElementById('my').style.backgroundColor = localStorage.getItem('color3');
        }
 if (localStorage.getItem('color4')) {
            document.getElementById('hor').style.backgroundColor = localStorage.getItem('color4');
        } 
        if (localStorage.getItem('color5')) {
            document.getElementById('other').style.backgroundColor = localStorage.getItem('color5');
        }
         if (localStorage.getItem('color7')) {
            document.getElementById('shop').style.backgroundColor = localStorage.getItem('color7');
        }
        // Aktivacija za spreminjanje barve ob dolgotrajnem pritisku
        changeColorBtn.addEventListener('mousedown', () => {
            isColorChangeActive = true;
            colorPicker.style.display = 'inline';  // Pokaže izbiro barve
        });

        // Ko sprostiš gumb, zaklene funkcionalnost
        changeColorBtn.addEventListener('mouseup', () => {
            if (isColorChangeActive) {
                // Shrani barve v localStorage
                localStorage.setItem('color1', document.getElementById('games').style.backgroundColor);
                 localStorage.setItem('color6', document.getElementById('raz').style.backgroundColor);
                 localStorage.setItem('color7', document.getElementById('shop').style.backgroundColor);
                localStorage.setItem('color2', document.getElementById('applications').style.backgroundColor);
                localStorage.setItem('color3', document.getElementById('my').style.backgroundColor);
                 localStorage.setItem('color4', document.getElementById('hor').style.backgroundColor);
                  localStorage.setItem('color5', document.getElementById('other').style.backgroundColor);

                // Zaklepanje funkcionalnosti
                isColorChangeActive = false;
                console.log('Funkcionalnost zaklenjena');
            }
            colorPicker.style.display = 'none';  // Skrij izbiro barve
        });

        // Ko izbereš barvo, nastavi izbrano barvo
        colorPicker.addEventListener('input', (e) => {
            selectedColor = e.target.value;
            console.log('Izbrana barva:', selectedColor);
        });

        // Klik na element za spreminjanje barve
        colorBoxes.forEach(box => {
            box.addEventListener('click', () => {
                if (isColorChangeActive) {
                    box.style.backgroundColor = selectedColor;
                }
            });
        });
