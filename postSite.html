<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>Objave - Slychat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: url('slika.png') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      color: white;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 10px;
    }

    .container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn {
      padding: 10px 15px;
      background-color: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover {
      background-color: rgba(255, 255, 255, 0.25);
    }

    .post {
      background-color: rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .post img {
      width: 100%;
      border-radius: 8px;
    }

    .email {
      font-weight: 500;
      color: #ffd700;
    }

    .comment-section {
      background-color: rgba(255, 255, 255, 0.05);
      padding: 8px;
      border-radius: 8px;
    }

    .comment {
      margin-bottom: 5px;
      color: #ddd;
      font-size: 0.9em;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .modal-content {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
      max-width: 400px;
      width: 90%;
    }

    .modal-content img {
      max-width: 100%;
      border-radius: 8px;
    }

    #fileInput {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <button class="btn" onclick="goBackToChat()">Nazaj v klepet</button>
      <button class="btn" onclick="document.getElementById('fileInput').click()">+ Dodaj objavo</button>
      <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)">
    </div>
    <div id="posts"></div>
  </div>

  <!-- Modal -->
  <div id="imageModal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <img id="previewImg" src="" alt="Predogled">
      <button class="btn" onclick="uploadImage()">Objavi</button>
    </div>
  </div>

  <script>
   const firebaseConfig = {
    apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
    authDomain: "chater-cf682.firebaseapp.com",
    databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
    projectId: "chater-cf682",
    storageBucket: "chater-cf682.firebasestorage.app",
    messagingSenderId: "233632075480",
    appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad",
    measurementId: "G-32E3BYYLKS"
  };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    const storage = firebase.storage();

    const postsDiv = document.getElementById("posts");
    const fileInput = document.getElementById("fileInput");
    const imageModal = document.getElementById("imageModal");
    const previewImg = document.getElementById("previewImg");

    let selectedFile = null;

    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location.href = "auth.html";
      } else {
        db.ref("posts").on("child_added", snapshot => {
          const postId = snapshot.key;
          const post = snapshot.val();
          renderPost(postId, post);
        });
      }
    });

    function goBackToChat() {
      window.location.href = "Slychat.html"; // ali tvoj dejanski chat.html
    }

    function previewImage(event) {
      selectedFile = event.target.files[0];
      if (!selectedFile) return;
      const reader = new FileReader();
      reader.onload = e => {
        previewImg.src = e.target.result;
        imageModal.style.display = "flex";
      };
      reader.readAsDataURL(selectedFile);
    }

    function closeModal(event) {
      if (event.target === imageModal) {
        imageModal.style.display = "none";
        selectedFile = null;
      }
    }

    function uploadImage() {
      const user = auth.currentUser;
      if (!selectedFile || !user) return;

      const storageRef = storage.ref("posts/" + Date.now() + "-" + selectedFile.name);
      storageRef.put(selectedFile).then(snapshot => {
        snapshot.ref.getDownloadURL().then(url => {
          db.ref("posts").push({
            email: user.email,
            imageUrl: url,
            timestamp: Date.now()
          });
          selectedFile = null;
          imageModal.style.display = "none";
        });
      });
    }

    function renderPost(postId, post) {
      const postEl = document.createElement("div");
      postEl.className = "post";

      const emailEl = document.createElement("div");
      emailEl.className = "email";
      emailEl.textContent = post.email;

      const imgEl = document.createElement("img");
      imgEl.src = post.imageUrl;

      const likeBtn = document.createElement("button");
      likeBtn.className = "btn";
      likeBtn.textContent = "Všečkaj";

      const likesEl = document.createElement("div");
      likesEl.textContent = "Všečki: 0";

      const commentInput = document.createElement("input");
      commentInput.type = "text";
      commentInput.placeholder = "Dodaj komentar...";

      const commentBtn = document.createElement("button");
      commentBtn.className = "btn";
      commentBtn.textContent = "Komentiraj";

      const commentsContainer = document.createElement("div");
      commentsContainer.className = "comment-section";

      likeBtn.onclick = () => {
        const user = auth.currentUser;
        if (!user) return;
        db.ref(`likes/${postId}/${user.uid}`).set(true);
      };

      commentBtn.onclick = () => {
        const user = auth.currentUser;
        const comment = commentInput.value.trim();
        if (!comment) return;
        db.ref(`comments/${postId}`).push({
          user: user.email,
          text: comment
        });
        commentInput.value = "";
      };

      db.ref(`likes/${postId}`).on("value", snapshot => {
        const likes = snapshot.val() || {};
        likesEl.textContent = "Všečki: " + Object.keys(likes).length;
      });

      db.ref(`comments/${postId}`).on("child_added", snapshot => {
        const c = snapshot.val();
        const cEl = document.createElement("div");
        cEl.className = "comment";
        cEl.textContent = `${c.user}: ${c.text}`;
        commentsContainer.appendChild(cEl);
      });

      postEl.appendChild(emailEl);
      postEl.appendChild(imgEl);
      postEl.appendChild(likesEl);
      postEl.appendChild(likeBtn);
      postEl.appendChild(commentInput);
      postEl.appendChild(commentBtn);
      postEl.appendChild(commentsContainer);

      postsDiv.prepend(postEl);
    }
  </script>
</body>
</html>
