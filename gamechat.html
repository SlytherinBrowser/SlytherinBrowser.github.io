<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Chat Game z Babylon.js</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden; background: black;
      font-family: sans-serif;
      color: white;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #healthBar {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 200px;
      height: 20px;
      background: red;
      border: 2px solid #fff;
      z-index: 100;
    }
    #healthBarInner {
      width: 100%;
      height: 100%;
      background: lime;
      transition: width 0.3s ease;
    }
    #inventory {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: white;
      z-index: 100;
    }
    /* Login obrazec */
    #loginForm {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #222;
      padding: 20px;
      border-radius: 8px;
      z-index: 200;
      width: 300px;
      box-sizing: border-box;
    }
    #loginForm input {
      width: 100%;
      margin: 8px 0;
      padding: 8px;
      border-radius: 4px;
      border: none;
      box-sizing: border-box;
    }
    #loginForm button {
      width: 100%;
      padding: 10px;
      border-radius: 4px;
      border: none;
      background-color: #4CAF50;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    #loginError {
      color: red;
      margin-top: 10px;
      font-size: 0.9em;
      height: 1.2em;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas" style="display:none;"></canvas>

  <div id="loginForm">
    <h2>Prijava</h2>
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Geslo" required />
    <button id="loginBtn">Prijavi se</button>
    <div id="loginError"></div>
  </div>

  <div id="healthBar" style="display:none;"><div id="healthBarInner"></div></div>
  <div id="inventory" style="display:none;">Inventory: <span id="weapons"></span></div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <!-- Babylon.js -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylon.glTF2FileLoader.min.js"></script>

  <script>
    // Firebase konfiguracija in inicializacija
    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
    };
    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.database();

    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const loginError = document.getElementById("loginError");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");

    const canvas = document.getElementById("renderCanvas");
    const healthBar = document.getElementById("healthBar");
    const healthBarInner = document.getElementById("healthBarInner");
    const inventory = document.getElementById("inventory");

    // Preveri, če je uporabnik že prijavljen
    auth.onAuthStateChanged(user => {
      if (user) {
        // Prijavljen - skrij login in pokaži canvas ter UI
        loginForm.style.display = "none";
        canvas.style.display = "block";
        healthBar.style.display = "block";
        inventory.style.display = "block";

        // Shranimo UID
        localStorage.setItem("uid", user.uid);

        // Zaženi igro
        startGame(user.uid);
      } else {
        // Ni prijave - pokaži login, skrij canvas in UI
        loginForm.style.display = "block";
        canvas.style.display = "none";
        healthBar.style.display = "none";
        inventory.style.display = "none";
        localStorage.removeItem("uid");
      }
    });

    loginBtn.addEventListener("click", () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      loginError.textContent = "";

      if (!email || !password) {
        loginError.textContent = "Vnesi email in geslo.";
        return;
      }

      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          // Uspešna prijava, auth state listener bo sprožil začetek igre
        })
        .catch(error => {
          loginError.textContent = "Napaka pri prijavi: " + error.message;
        });
    });

    function startGame(playerId) {
      // Če je igra že teče, jo resetiramo
      if (window.engine) {
        window.engine.dispose();
        window.scene.dispose();
      }

      // Babylon.js nastavitev
      const engine = new BABYLON.Engine(canvas, true);
      window.engine = engine;
      const scene = new BABYLON.Scene(engine);
      window.scene = scene;

      const camera = new BABYLON.UniversalCamera("playerCamera", new BABYLON.Vector3(0, 3, -10), scene);
      camera.attachControl(canvas, true);
      camera.speed = 0.1;
      camera.inertia = 0.2;

      const light = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0, 1, 0), scene);
      light.intensity = 0.9;

      const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 50, height: 50}, scene);
      ground.checkCollisions = true;

      let health = 100;
      updateHealthBar();

      let playerMesh = null;
      const players = {};
      const moveSpeed = 0.15;

      // Naloži svoj avatar iz Firebase
      db.ref("users/" + playerId).once("value").then(snapshot => {
        const playerData = snapshot.val();
        if (!playerData || !playerData.avatarURL2) {
          alert("Ni avatarja za uporabnika.");
          throw new Error("Ni avatarja");
        }

        BABYLON.SceneLoader.ImportMesh("", "", playerData.avatarURL2, scene, function(meshes) {
          playerMesh = BABYLON.Mesh.MergeMeshes(meshes, true, true, undefined, false, true);
          playerMesh.position = new BABYLON.Vector3(0, 0, 0);
          playerMesh.scaling = new BABYLON.Vector3(1, 1, 1);
          playerMesh.checkCollisions = true;

          camera.lockedTarget = playerMesh;

          updateMyState();
          listenToOtherPlayers();
        });
      });

      function updateMyState() {
        if (!playerMesh) return;
        db.ref("players/" + playerId).set({
          position: {
            x: playerMesh.position.x,
            y: playerMesh.position.y,
            z: playerMesh.position.z
          },
          health: health,
          shooting: false
        });
        updateHealthBar();
      }

      function listenToOtherPlayers() {
        db.ref("players").on("value", snapshot => {
          const allPlayers = snapshot.val() || {};
          for (const id in allPlayers) {
            if (id === playerId) continue;
            const data = allPlayers[id];

            if (!players[id]) {
              db.ref("users/" + id).once("value").then(snap => {
                const u = snap.val();
                if (u && u.avatarURL2) {
                  BABYLON.SceneLoader.ImportMesh("", "", u.avatarURL2, scene, function(meshes) {
                    const mesh = BABYLON.Mesh.MergeMeshes(meshes, true, true, undefined, false, true);
                    mesh.position = new BABYLON.Vector3(data.position.x, data.position.y, data.position.z);
                    mesh.scaling = new BABYLON.Vector3(1, 1, 1);
                    players[id] = { mesh: mesh, health: 100 };
                  });
                }
              });
            } else {
              players[id].mesh.position = new BABYLON.Vector3(data.position.x, data.position.y, data.position.z);
              players[id].health = data.health;

              if (players[id].health < 30) {
                players[id].mesh.material = new BABYLON.StandardMaterial("lowHealthMat", scene);
                players[id].mesh.material.diffuseColor = new BABYLON.Color3(1, 0, 0);
              } else {
                players[id].mesh.material = new BABYLON.StandardMaterial("normalMat", scene);
                players[id].mesh.material.diffuseColor = new BABYLON.Color3(1, 1, 1);
              }
            }
          }

          for (const id in players) {
            if (!allPlayers[id]) {
              if (players[id].mesh) players[id].mesh.dispose();
              delete players[id];
            }
          }
        });
      }

      const inputMap = {};
      scene.actionManager = new BABYLON.ActionManager(scene);
      scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyDownTrigger, evt => {
        inputMap[evt.sourceEvent.key.toLowerCase()] = true;
      }));
      scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyUpTrigger, evt => {
        inputMap[evt.sourceEvent.key.toLowerCase()] = false;
      }));

      scene.onBeforeRenderObservable.add(() => {
        if (!playerMesh) return;

        let moved = false;
        if (inputMap["w"]) { playerMesh.position.z += moveSpeed; moved = true; }
        if (inputMap["s"]) { playerMesh.position.z -= moveSpeed; moved = true; }
        if (inputMap["a"]) { playerMesh.position.x -= moveSpeed; moved = true; }
        if (inputMap["d"]) { playerMesh.position.x += moveSpeed; moved = true; }

        if (moved) updateMyState();
      });

      function updateHealthBar() {
        healthBarInner.style.width = health + "%";
      }

      // Simulacija streljanja in padanja zdravja
      window.addEventListener("click", () => {
        health -= 10;
        if (health < 0) health = 100;
        updateHealthBar();
        updateMyState();
      });

      engine.runRenderLoop(() => {
        scene.render();
      });

      window.addEventListener("resize", () => {
        engine.resize();
      });
    }
  </script>
</body>
</html>
