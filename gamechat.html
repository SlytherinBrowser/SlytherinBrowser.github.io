<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3D Igra z Babylon.js, Ready Player Me & Firebase Chat</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; }
  #renderCanvas { width: 100%; height: 100%; display: block; }
  #chatContainer {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    background: rgba(0,0,0,0.6);
    padding: 5px;
    display: flex;
  }
  #chatInput {
    flex: 1;
    font-size: 18px;
    padding: 5px;
  }
  #chatSend {
    font-size: 18px;
    padding: 5px 10px;
  }
  #chatBubble {
    position: absolute;
    background: white;
    padding: 6px 10px;
    border-radius: 10px;
    font-size: 14px;
    pointer-events: none;
    display: none;
    max-width: 200px;
    word-wrap: break-word;
  }
</style>
</head>
<body>

<canvas id="renderCanvas"></canvas>

<div id="chatBubble"></div>

<div id="chatContainer">
  <input type="text" id="chatInput" placeholder="Napiši sporočilo..." />
  <button id="chatSend">Pošlji</button>
</div>

<!-- Babylon.js CDN -->
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

<!-- Firebase CDN -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
  // Firebase konfiguracija - tukaj vnesi svojo config
   const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
    };
    
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Babylon.js scena
  const canvas = document.getElementById("renderCanvas");
  const engine = new BABYLON.Engine(canvas, true);

  let scene, camera, avatar, avatarAnimationGroup;
  let chatBubble = document.getElementById("chatBubble");
  let chatTimeout;

  function createScene() {
    scene = new BABYLON.Scene(engine);

    // Kamera - Follow + Orbit z miško
    camera = new BABYLON.ArcRotateCamera("Camera", 
      BABYLON.Tools.ToRadians(0), BABYLON.Tools.ToRadians(75), 
      8, BABYLON.Vector3.Zero(), scene);
    camera.attachControl(canvas, true);
    camera.lowerRadiusLimit = 5;
    camera.upperRadiusLimit = 15;
    camera.wheelPrecision = 50;
    camera.useBouncingBehavior = true;

    // Svetloba
    const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

    // Tla (velik plane za svet)
    const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 100, height: 100}, scene);
    ground.checkCollisions = true;

    // Uvozi Ready Player Me avatar glTF - tu primer javnega avatarja
    BABYLON.SceneLoader.ImportMeshAsync("", "https://models.readyplayer.me/63e4b54e5f4ff6513d0fca26/", "avatar.glb", scene).then((result) => {
      avatar = result.meshes[0];
      avatar.position = new BABYLON.Vector3(0, 0, 0);
      avatar.scaling.scaleInPlace(1.5);

      // Poišči animacije in zaženi hojo
      avatarAnimationGroup = scene.animationGroups[0]; // predpostavimo, da je prva animacija hoja
      if(avatarAnimationGroup){
        avatarAnimationGroup.start(true, 1.0, avatarAnimationGroup.from, avatarAnimationGroup.to, false);
      }
    });

    // Kamera sledi avatarju
    scene.onBeforeRenderObservable.add(() => {
      if(avatar){
        camera.target = avatar.position;
      }
    });

    // Premikanje avatarja z WASD
    const inputMap = {};
    scene.actionManager = new BABYLON.ActionManager(scene);
    scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyDownTrigger, evt => {
      inputMap[evt.sourceEvent.key.toLowerCase()] = true;
    }));
    scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyUpTrigger, evt => {
      inputMap[evt.sourceEvent.key.toLowerCase()] = false;
    }));

    scene.onBeforeRenderObservable.add(() => {
      if(!avatar) return;
      let speed = 0.1;
      let move = new BABYLON.Vector3.Zero();

      if(inputMap["w"]) move.z += 1;
      if(inputMap["s"]) move.z -= 1;
      if(inputMap["a"]) move.x -= 1;
      if(inputMap["d"]) move.x += 1;

      if(move.length() > 0) {
        move = move.normalize().scale(speed);
        avatar.position.addInPlace(move);

        // avatar naj gleda smer gibanja
        avatar.rotation.y = Math.atan2(move.x, move.z);
      }
    });

    return scene;
  }

  const sceneInstance = createScene();

  engine.runRenderLoop(() => {
    sceneInstance.render();

    // Prikaz chat oblačka nad avatarjem
    if(avatar && chatBubble.style.display === "block") {
      let pos = BABYLON.Vector3.Project(
        avatar.position.add(new BABYLON.Vector3(0, 2.2, 0)), 
        BABYLON.Matrix.Identity(),
        scene.getTransformMatrix(),
        camera.viewport.toGlobal(
          engine.getRenderWidth(),
          engine.getRenderHeight()
        )
      );
      chatBubble.style.left = pos.x + "px";
      chatBubble.style.top = pos.y + "px";
    }
  });

  window.addEventListener("resize", () => {
    engine.resize();
  });

  // Chat funkcionalnost
  const chatInput = document.getElementById("chatInput");
  const chatSend = document.getElementById("chatSend");

  chatSend.addEventListener("click", sendMessage);
  chatInput.addEventListener("keydown", e => {
    if(e.key === "Enter") sendMessage();
  });

  function showChatBubble(message){
    chatBubble.textContent = message;
    chatBubble.style.display = "block";

    if(chatTimeout) clearTimeout(chatTimeout);
    chatTimeout = setTimeout(() => {
      chatBubble.style.display = "none";
    }, 10000);
  }

  // Firebase chat - zapis sporočil
  function sendMessage() {
    const msg = chatInput.value.trim();
    if(msg === "") return;
    // Zapiši v Firebase
    db.ref("chatMessages").push({
      message: msg,
      timestamp: Date.now()
    });
    chatInput.value = "";
  }

  // Prikaži zadnje sporočilo nad avatarjem
  db.ref("chatMessages").limitToLast(1).on("child_added", snapshot => {
    const data = snapshot.val();
    showChatBubble(data.message);
  });
</script>

</body>
</html>
