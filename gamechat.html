<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ready Player Me avatar + Sketchfab okolje (URL naloži)</title>
<style>
  body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
  #overlay {
    position: absolute;
    bottom: 10px; left: 50%; transform: translateX(-50%);
    width: 300px; background: rgba(0,0,0,0.5); border-radius: 5px;
    padding: 10px; color: white; font-size: 16px;
  }
  #message {
    position: absolute;
    color: white; background: rgba(0,0,0,0.7);
    padding: 5px 10px; border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="overlay">
  <input type="text" id="chatInput" placeholder="Napiši sporočilo..." style="width: 100%; padding: 8px; font-size: 16px;" />
</div>

<div id="message" style="display:none;"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.153.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.153.0/examples/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.153.0/examples/jsm/controls/OrbitControls.js';

let scene, camera, renderer, controls;
let avatar, environment;
let messageDiv = document.getElementById('message');
let chatInput = document.getElementById('chatInput');

init();
animate();

function init() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0, 1.7, 3);

  renderer = new THREE.WebGLRenderer({antialias: true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1, 0);
  controls.update();

  const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
  hemiLight.position.set(0, 20, 0);
  scene.add(hemiLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(-3, 10, -10);
  scene.add(dirLight);

  const loader = new GLTFLoader();

  // Naloži Sketchfab okolje (brez prenosa, iz URL)
  // Primer: https://sketchfab.com/3d-models/simplified-forest-4f91e7a255774c67965e5b16a82b5f93
  // Neposreden GLB link (vadi URL: spodaj vzorčni)
  loader.load('https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models@master/2.0/Sponza/glTF/Sponza.gltf',
    (gltf) => {
      environment = gltf.scene;
      environment.scale.set(0.02, 0.02, 0.02); // prilagodi po potrebi
      environment.position.set(0, 0, 0);
      scene.add(environment);
    },
    undefined,
    (error) => {
      console.error('Napaka pri nalaganju okolja:', error);
    }
  );

  // Naloži Ready Player Me avatar iz demo URL-ja (sample glb avatar)
  loader.load('https://models.readyplayer.me/63eb16281e994c1409719e32.glb',
    (gltf) => {
      avatar = gltf.scene;
      avatar.scale.set(1, 1, 1);
      avatar.position.set(0, 0, 0);
      scene.add(avatar);
    },
    undefined,
    (error) => {
      console.error('Napaka pri nalaganju avatarja:', error);
    }
  );

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  window.addEventListener('keydown', (e) => {
    if(!avatar) return;

    const step = 0.1;
    switch(e.key.toLowerCase()) {
      case 'w': avatar.position.z -= step; break;
      case 's': avatar.position.z += step; break;
      case 'a': avatar.position.x -= step; break;
      case 'd': avatar.position.x += step; break;
    }
  });

  chatInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') {
      const text = chatInput.value.trim();
      if(text && avatar) {
        showMessageAboveAvatar(text);
        chatInput.value = '';
      }
    }
  });
}

function showMessageAboveAvatar(text) {
  if(!avatar) return;

  messageDiv.style.display = 'block';
  messageDiv.textContent = text;

  const vector = new THREE.Vector3();
  const canvas = renderer.domElement;

  function updatePosition() {
    vector.copy(avatar.position);
    vector.y += 2;
    vector.project(camera);

    const x = (vector.x * 0.5 + 0.5) * canvas.clientWidth;
    const y = (-vector.y * 0.5 + 0.5) * canvas.clientHeight;

    messageDiv.style.transform = `translate(-50%, -100%) translate(${x}px,${y}px)`;
  }

  updatePosition();

  let frameId;
  function animateMessage() {
    updatePosition();
    frameId = requestAnimationFrame(animateMessage);
  }
  animateMessage();

  setTimeout(() => {
    messageDiv.style.display = 'none';
    cancelAnimationFrame(frameId);
  }, 10000);
}

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
</script>

</body>
</html>
