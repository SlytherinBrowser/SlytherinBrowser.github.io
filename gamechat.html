<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>3D multiplayer igra z Babylon.js in Firebase prijava</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      font-family: Arial, sans-serif;
      background: #a0d6a0;
    }
    #renderCanvas {
      width: 100%; height: 100%; display: block;
    }
    #login {
      position: absolute;
      top: 10px; left: 10px;
      background: rgba(255,255,255,0.95);
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 10px #00000033;
      z-index: 10;
      width: 250px;
    }
    #login input {
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    #login button {
      width: 100%;
      padding: 10px;
      background-color: #2e7d32;
      color: white;
      border: none;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    #login button:hover {
      background-color: #276129;
    }
  </style>
<script>
window.addEventListener("error", function(event) {
  console.error("Napaka v JavaScriptu!");
  console.error("Sporočilo:", event.message);
  console.error("Datoteka:", event.filename);
  console.error("Vrstica:", event.lineno, "Stolpec:", event.colno);
  alert(`Napaka v JS:\n${event.message}\nV datoteki: ${event.filename}\nVrstica: ${event.lineno}`);
});</script>
</head>
<body>

<div id="login">
  <h3>Prijava</h3>
  <input type="email" id="email" placeholder="Email" autocomplete="username" />
  <input type="password" id="password" placeholder="Geslo" autocomplete="current-password" />
  <button id="loginBtn">Prijavi se</button>
</div>

<canvas id="renderCanvas"></canvas>

<!-- Babylon.js -->
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
  // --- Firebase konfiguracija ---
  const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
    };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  const loginBtn = document.getElementById('loginBtn');

  let avatarURL = null;
  let userId = null;

  // Objekt za shranjevanje ostalih igralcev (uid => mesh)
  let otherPlayers = {};

  loginBtn.onclick = () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      alert("Prosim vnesi email in geslo.");
      return;
    }

    auth.signInWithEmailAndPassword(email, password)
      .then(() => {
        const user = auth.currentUser;
        userId = user.uid;
        return db.ref('users/' + user.uid + '/avatarURL2').once('value');
      })
      .then(snapshot => {
        avatarURL = snapshot.val() || null;
        if (!avatarURL) avatarURL = 'https://i.pravatar.cc/128';
        document.getElementById('login').style.display = 'none';
        startGame();
      })
      .catch(err => {
        alert('Napaka pri prijavi: ' + err.message);
      });
  };

  // ----- Babylon.js scena -----

  let canvas = document.getElementById("renderCanvas");
  let engine = new BABYLON.Engine(canvas, true);

  let scene, camera, avatar;
  let inputMap = {};
  let avatarRotationY = 0;  // za obračanje avatarja in kamere

  function startGame() {
    scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color3(0.63, 0.82, 0.63);

    // Kamera tretjeosebni pogled (sledimo avatarju)
    camera = new BABYLON.UniversalCamera("cam", new BABYLON.Vector3(0, 5, -10), scene);
    camera.attachControl(canvas, true);

    // Svetloba
    const light = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, -1), scene);
    light.position = new BABYLON.Vector3(20, 40, 20);
    light.intensity = 1;

    // Večja zemlja
    const ground = BABYLON.MeshBuilder.CreateGround("ground", {width:200, height:200}, scene);
    const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
    groundMat.diffuseColor = new BABYLON.Color3(0.13, 0.55, 0.13);
    ground.material = groundMat;

    // Drevesa
    for(let i=0; i<30; i++) {
      let tree = new BABYLON.TransformNode("tree" + i, scene);

      let trunk = BABYLON.MeshBuilder.CreateCylinder("trunk"+i, {height: 2, diameterTop: 0.3, diameterBottom: 0.3}, scene);
      let trunkMat = new BABYLON.StandardMaterial("trunkMat"+i, scene);
      trunkMat.diffuseColor = new BABYLON.Color3(0.55, 0.27, 0.07);
      trunk.material = trunkMat;
      trunk.position.y = 1;
      trunk.parent = tree;

      let leaves = BABYLON.MeshBuilder.CreateSphere("leaves"+i, {diameter: 2}, scene);
      let leavesMat = new BABYLON.StandardMaterial("leavesMat"+i, scene);
      leavesMat.diffuseColor = new BABYLON.Color3(0.13, 0.55, 0.13);
      leaves.material = leavesMat;
      leaves.position.y = 3;
      leaves.parent = tree;

      tree.position.x = (Math.random() - 0.5) * 180;
      tree.position.z = (Math.random() - 0.5) * 180;
    }

    // Skale
    for(let i=0; i<10; i++) {
      let rock = BABYLON.MeshBuilder.CreateBox("rock"+i, {size: 1 + Math.random()*2}, scene);
      let rockMat = new BABYLON.StandardMaterial("rockMat"+i, scene);
      let grey = 0.4 + Math.random()*0.4;
      rockMat.diffuseColor = new BABYLON.Color3(grey, grey, grey);
      rock.material = rockMat;
      rock.position.x = (Math.random() - 0.5) * 180;
      rock.position.z = (Math.random() - 0.5) * 180;
      rock.position.y = 0.5;
      rock.rotation.y = Math.random() * Math.PI * 2;
      rock.scaling.x = 1 + Math.random();
      rock.scaling.z = 1 + Math.random();
    }

   // Avatar z avatar teksturo iz avatarURL
const avatarMat = new BABYLON.StandardMaterial("avatarMat", scene);
avatarMat.diffuseTexture = new BABYLON.Texture(avatarURL, scene);
avatarMat.diffuseTexture.hasAlpha = true;

avatar = BABYLON.MeshBuilder.CreateBox("avatar", {height: 2, width: 1, depth: 0.5}, scene);
avatar.material = avatarMat;
avatar.position.y = 1;

let useGamepad = false;

function updateCameraAndAvatar() {
  const radius = 8;
  const height = 5;

  let camX = avatar.position.x + Math.sin(avatarRotationY) * radius;
  let camZ = avatar.position.z + Math.cos(avatarRotationY) * radius;
  let camY = avatar.position.y + height;

  camera.position = BABYLON.Vector3.Lerp(camera.position, new BABYLON.Vector3(camX, camY, camZ), 0.1);
  camera.setTarget(BABYLON.Vector3.Lerp(camera.getTarget(), avatar.position, 0.1));

  avatar.rotation.y = avatarRotationY;
}

function updateMyPositionInFirebase() {
  if (!userId) return;
  db.ref('players/' + userId).set({
    x: avatar.position.x,
    y: avatar.position.y,
    z: avatar.position.z,
    rotationY: avatarRotationY,
    avatarURL: avatarURL,
    lastUpdated: Date.now()
  });
}

// Funkcija, ki preveri gamepad in nastavi inputMap ter avatarRotationY glede na kontroler
function updateGamepadInput() {
  const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
  if (!gamepads) return false;

  const gp = gamepads[0];
  if (!gp) return false;

  const deadzone = 0.2;

  // Preveri, če je gamepad aktiven
  let active = false;
  for (let i = 0; i < gp.axes.length; i++) {
    if (Math.abs(gp.axes[i]) > deadzone) active = true;
  }
  for (let i = 0; i < gp.buttons.length; i++) {
    if (gp.buttons[i].pressed) active = true;
  }
  if (!active) return false;

  useGamepad = true;

  // Levi analog: osi 0 (X) in 1 (Y) za premikanje
  let moveX = Math.abs(gp.axes[0]) > deadzone ? gp.axes[0] : 0;
  let moveY = Math.abs(gp.axes[1]) > deadzone ? gp.axes[1] : 0;

  inputMap["w"] = moveY < -deadzone;
  inputMap["s"] = moveY > deadzone;
  inputMap["a"] = moveX < -deadzone;
  inputMap["d"] = moveX > deadzone;

  // Desni analog: os 2 (X) za obračanje avatarja
  let rotateX = Math.abs(gp.axes[2]) > deadzone ? gp.axes[2] : 0;
  avatarRotationY += rotateX * 0.05;

  return true;
}

// Event listenerji za tipkovnico
window.addEventListener("keydown", (event) => {
  inputMap[event.key.toLowerCase()] = true;
  useGamepad = false; // če uporabljamo tipkovnico, gamepad ne uporabljamo
});
window.addEventListener("keyup", (event) => {
  inputMap[event.key.toLowerCase()] = false;
});

scene.registerBeforeRender(() => {
  let delta = engine.getDeltaTime() / 1000;
  let speed = 5;

  // Če gamepad ni aktiven, se uporablja tipkovnica
  if (!updateGamepadInput()) {
    useGamepad = false;
  }

  let forward = new BABYLON.Vector3(
    Math.sin(avatarRotationY),
    0,
    Math.cos(avatarRotationY)
  );

  if(inputMap["w"]) {
    avatar.position.addInPlace(forward.scale(speed * delta));
  }
  if(inputMap["s"]) {
    avatar.position.subtractInPlace(forward.scale(speed * delta));
  }
  // Če uporabljamo tipkovnico, obračamo z A in D
  if(!useGamepad) {
    if(inputMap["a"]) {
      avatarRotationY -= delta * 3;
    }
    if(inputMap["d"]) {
      avatarRotationY += delta * 3;
    }
  }

  updateCameraAndAvatar();
  updateMyPositionInFirebase();
});

    // Input map za tipkovnico
    scene.actionManager = new BABYLON.ActionManager(scene);
    scene.actionManager.registerAction(
      new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyDownTrigger, function (evt) {
        inputMap[evt.sourceEvent.key.toLowerCase()] = true;
      })
    );
    scene.actionManager.registerAction(
      new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyUpTrigger, function (evt) {
        inputMap[evt.sourceEvent.key.toLowerCase()] = false;
      })
    );

    // Funkcija za kreiranje avatarjev drugih igralcev
    function createOrUpdateOtherPlayer(uid, data) {
      if(uid === userId) return; // svoj avatar ne rišemo tukaj

      let mesh = otherPlayers[uid];
      if(!mesh) {
        // Kreiramo box z unikatno barvo
        mesh = BABYLON.MeshBuilder.CreateBox("player_" + uid, {height: 2, width: 1, depth: 0.5}, scene);
        let mat = new BABYLON.StandardMaterial("mat_" + uid, scene);
        mat.diffuseColor = new BABYLON.Color3(Math.random()*0.7+0.3, Math.random()*0.7+0.3, Math.random()*0.7+0.3);
        mesh.material = mat;
        mesh.position.y = 1;
        otherPlayers[uid] = mesh;
      }
      mesh.position.x = data.x;
      mesh.position.y = data.y;
      mesh.position.z = data.z;
      mesh.rotation.y = data.rotationY;
    }

    // Brisanje odjavljenih igralcev po timeoutu 30 sekund
    function cleanOldPlayers(snapshot) {
      let players = snapshot.val() || {};
      let now = Date.now();
      for(let uid in otherPlayers) {
        if(!players[uid] || now - players[uid].lastUpdated > 30000) {
          otherPlayers[uid].dispose();
          delete otherPlayers[uid];
        }
      }
    }

    // Poslušamo vse igralce v bazi
    db.ref('players').on('value', snapshot => {
      let players = snapshot.val() || {};
      for(let uid in players) {
        createOrUpdateOtherPlayer(uid, players[uid]);
      }
      cleanOldPlayers(snapshot);
    });

    // Ob odjavi, izbrišemo svoj zapis iz baze
    window.addEventListener('beforeunload', () => {
      if(userId) {
        db.ref('players/' + userId).remove();
      }
    });

    engine.runRenderLoop(() => {
      scene.render();
    });

    window.addEventListener('resize', function(){
      engine.resize();
    });
  }


// Globalne spremenljivke let isChallenge1Active = false; let isChallenge2Active = false; let challenge1Tagger = null; let challenge1StartTime = null; let caughtPlayers = new Set(); let totalPlayers = 0;

let ball = null; let goals = {}; let scores = {};

// Posodobi seznam igralcev function updateTotalPlayers(players) { totalPlayers = Object.keys(players).length; }

// IZZIV 1 - Lovljenje window.addEventListener("keydown", (event) => { if (event.key.toLowerCase() === "l" && !isChallenge1Active && totalPlayers >= 2) { startTagChallenge(); } if (event.key.toLowerCase() === "f" && !isChallenge2Active && totalPlayers >= 2) { startFootballChallenge(); } });

function startTagChallenge() { isChallenge1Active = true; challenge1Tagger = userId; challenge1StartTime = Date.now(); caughtPlayers = new Set(); alert("IZZIV 1: Začet lov! Imate 5 minut, da ujamete vse!");

setTimeout(() => { if (caughtPlayers.size >= totalPlayers - 1) { alert("IZZIV 1 USPEŠNO OPRAVLJEN!"); } else { alert("IZZIV 1 NI USPELO :("); } isChallenge1Active = false; }, 300000); // 5 minut }

// Detekcija dotika za lovljenje scene.registerBeforeRender(() => { if (isChallenge1Active && userId === challenge1Tagger) { for (let uid in otherPlayers) { let other = otherPlayers[uid]; if (!caughtPlayers.has(uid) && BABYLON.Vector3.Distance(avatar.position, other.position) < 1) { caughtPlayers.add(uid); alert(Ujet igralec: ${uid}); if (caughtPlayers.size >= totalPlayers - 1) { isChallenge1Active = false; alert("IZZIV 1 USPEŠNO OPRAVLJEN!"); } } } } });

// IZZIV 2 - Nogomet function startFootballChallenge() { isChallenge2Active = true; scores = {}; alert("IZZIV 2: Nogomet! Prvi do 10 golov zmaga!");

// Ustvari gol if (!goals.left) { goals.left = BABYLON.MeshBuilder.CreateBox("goalLeft", {width: 4, height: 2, depth: 0.5}, scene); goals.left.position = new BABYLON.Vector3(-20, 1, 0); goals.left.isVisible = false; goals.left.checkCollisions = false; } if (!goals.right) { goals.right = BABYLON.MeshBuilder.CreateBox("goalRight", {width: 4, height: 2, depth: 0.5}, scene); goals.right.position = new BABYLON.Vector3(20, 1, 0); goals.right.isVisible = false; goals.right.checkCollisions = false; }

// Ustvari žogo if (!ball) { ball = BABYLON.MeshBuilder.CreateSphere("ball", {diameter: 1}, scene); ball.position = new BABYLON.Vector3(0, 1, 0); let ballMat = new BABYLON.StandardMaterial("ballMat", scene); ballMat.diffuseColor = BABYLON.Color3.Yellow(); ball.material = ballMat;

ball.physicsImpostor = new BABYLON.PhysicsImpostor(ball, BABYLON.PhysicsImpostor.SphereImpostor, {
  mass: 1,
  restitution: 0.9,
  friction: 0.5
}, scene);

}

scene.registerBeforeRender(checkGoal); }

// Preveri, če je žoga v golu function checkGoal() { if (!isChallenge2Active || !ball) return;

if (BABYLON.Vector3.Distance(ball.position, goals.left.position) < 2) { incrementScore("right"); resetBall(); } else if (BABYLON.Vector3.Distance(ball.position, goals.right.position) < 2) { incrementScore("left"); resetBall(); } 

function incrementScore(team) { scores[team] = (scores[team] || 0) + 1; alert(Ekipa ${team} je zadela! Rezultat: ${scores[team]});

if (scores[team] >= 10) { alert(IZZIV 2: Ekipa ${team} ZMAGA!); isChallenge2Active = false; ball.dispose(); ball = null; } }

function resetBall() { ball.position = new BABYLON.Vector3(0, 1, 0); ball.physicsImpostor.setLinearVelocity(new BABYLON.Vector3(0, 0, 0)); ball.physicsImpostor.setAngularVelocity(new BABYLON.Vector3(0, 0, 0)); }


// Globalne spremenljivke za izziv 3
let challenge3Active = false;
let challenge3Timer = 300; // 5 minut
let zombieBots = {};
let zombieSpeed = 2; // hitrost zombijev

// Funkcija za sprožitev izziva 3 s tipko Z
window.addEventListener("keydown", (event) => {
  if(event.key.toLowerCase() === "z") {
    if(!challenge3Active) {
      startChallenge3();
    }
  }
});

function startChallenge3() {
  if(challenge3Active) return;

  challenge3Active = true;
  challenge3Timer = 300;

  // Če je samo igralec, ustvarimo zombije
  if(Object.keys(otherPlayers).length === 0) {
    createZombies(3); // npr. 3 zombiji
  }

  scene.registerBeforeRender(updateChallenge3);
  console.log("Izziv 3 začel: Preživi 5 minut brez, da te zombiji ulovijo!");
}

// Ustvari n zombije
function createZombies(n) {
  for(let i=0; i<n; i++) {
    let mesh = BABYLON.MeshBuilder.CreateBox("zombie_" + i, {height: 2, width: 1, depth: 0.5}, scene);
    let mat = new BABYLON.StandardMaterial("mat_zombie_" + i, scene);
    mat.diffuseColor = new BABYLON.Color3(0.1, 0.8, 0.1); // zelena barva za zombije
    mesh.material = mat;
    mesh.position = new BABYLON.Vector3(
      Math.random() * 20 - 10,
      1,
      Math.random() * 20 - 10
    );
    zombieBots[i] = { mesh };
  }
}

function updateChallenge3() {
  if(!challenge3Active) return;

  let delta = engine.getDeltaTime() / 1000;
  challenge3Timer -= delta;

  if(challenge3Timer <= 0) {
    endChallenge3(true); // zmaga, če preživiš 5 minut
    return;
  }

  for(let id in zombieBots) {
    let zombie = zombieBots[id].mesh;
    let direction = avatar.position.subtract(zombie.position);
    direction.y = 0; // ignoriramo višino

    let distance = direction.length();

    if(distance < 1.5) {
      // Dotik zombija in igralca - izgubi izziv
      endChallenge3(false);
      return;
    }

    direction.normalize();
    zombie.position.addInPlace(direction.scale(zombieSpeed * delta));
  }
}

function endChallenge3(won) {
  challenge3Active = false;
  console.log("Izziv 3 končan. Rezultat: " + (won ? "ZMAGAL" : "IZGUBIL"));

  // Odstrani zombije
  for(let id in zombieBots) {
    zombieBots[id].mesh.dispose();
  }
  zombieBots = {};

  // Odstrani registerBeforeRender za izziv
  scene.unregisterBeforeRender(updateChallenge3);

  if(won) {
    alert("Čestitke! Preživel si izziv z zombiji.");
  } else {
    alert("Izgubil si izziv z zombiji.");
  }
}


</script>

</body>
</html>
