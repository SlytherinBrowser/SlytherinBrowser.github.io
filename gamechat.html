<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8" />
<title>Ready Player Me avatar + napreden svet + premikanje</title>
<style>
  body { margin: 0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.153.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.153.0/examples/jsm/controls/OrbitControls.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.153.0/examples/jsm/loaders/GLTFLoader.js';
import { RGBELoader } from 'https://cdn.jsdelivr.net/npm/three@0.153.0/examples/jsm/loaders/RGBELoader.js';

// Scena in renderer
const scene = new THREE.Scene();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

// Kamera (začnemo na lokaciji, ki je za avatarjem)
const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 2, 5);

// Kontrole orbite (za rotiranje okoli avatarja)
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// Poljubni materiali za naravo
const groundMat = new THREE.MeshStandardMaterial({ color: 0x446633, roughness: 1 });
const treeMat = new THREE.MeshStandardMaterial({ color: 0x228822, roughness: 0.8 });
const rockMat = new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.9 });

// Tla (z rahlim reliefom z geometrijo)
const groundGeo = new THREE.PlaneGeometry(20, 20, 64, 64);
for(let i = 0; i < groundGeo.attributes.position.count; i++) {
  const y = Math.sin(i*0.3)*0.1 + Math.cos(i*0.5)*0.1;
  groundGeo.attributes.position.setY(i, y);
}
groundGeo.computeVertexNormals();
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Dodamo nekaj "dreves" (stožci + debla)
function addTree(x, z) {
  const tree = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.6), new THREE.MeshStandardMaterial({ color: 0x664422 }));
  trunk.position.y = 0.3;
  const leaves = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1, 8), treeMat);
  leaves.position.y = 1;
  tree.add(trunk);
  tree.add(leaves);
  tree.position.set(x, 0, z);
  scene.add(tree);
}
addTree(3, 2);
addTree(-2, -3);
addTree(5, -1);
addTree(-4, 4);

// Dodamo nekaj skal (kroglice)
function addRock(x, z, size) {
  const rock = new THREE.Mesh(new THREE.IcosahedronGeometry(size || 0.3, 0), rockMat);
  rock.position.set(x, 0.15, z);
  rock.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
  scene.add(rock);
}
addRock(1, 1);
addRock(-3, 0.5, 0.5);
addRock(2, -2);

// Osnovna svetloba
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
hemiLight.position.set(0, 10, 0);
scene.add(hemiLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(-5, 10, -5);
dirLight.castShadow = true;
scene.add(dirLight);

// HDRI okolje (venice sunset iz Poly Haven)
new RGBELoader()
  .setPath('https://cdn.polyhaven.com/hdris/1k/')
  .load('venice_sunset_1k.hdr', function(texture) {
    texture.mapping = THREE.EquirectangularReflectionMapping;
    scene.environment = texture;
    scene.background = texture;
  });

// Naloži avatar
const loader = new GLTFLoader();
const avatarURL = 'https://models.readyplayer.me/64025ac4c4a0d9018b8d3c28.glb';
let avatar;

loader.load(avatarURL, (gltf) => {
  avatar = gltf.scene;
  avatar.position.set(0, 0, 0);
  avatar.scale.set(1,1,1);
  scene.add(avatar);
});

// Premikanje avatarja
let clock = new THREE.Clock();
let speed = 1; // enota na sekundo
let direction = 1;

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();

  if (avatar) {
    // Avatar hodi sem in tja po osi X med -5 in +5
    avatar.position.x += direction * speed * delta;

    if (avatar.position.x > 5) {
      direction = -1;
      avatar.rotation.y = Math.PI; // obrni avatar nazaj
    } else if (avatar.position.x < -5) {
      direction = 1;
      avatar.rotation.y = 0; // obrni avatar naprej
    }
  }

  // Kamera naj sledi avatarju (iz tretje osebe - rahlo nad in za njim)
  if (avatar) {
    const camPos = new THREE.Vector3(avatar.position.x, avatar.position.y + 2, avatar.position.z + 5);
    camera.position.lerp(camPos, 0.1);
    controls.target.lerp(avatar.position.clone().setY(1), 0.1);
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();

// Prilagajanje velikosti okna
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
