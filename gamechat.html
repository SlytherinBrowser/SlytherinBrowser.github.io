<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Multiplayer igra z avatarji in klepetom</title>
<style>
  body, html {
    margin: 0; padding: 0; overflow: hidden; background: #222;
    font-family: Arial, sans-serif;
    color: white;
  }
  #gameCanvas {
    background: #444;
    display: block;
    margin: 0 auto;
  }
  #chatInput {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 400px;
    font-size: 18px;
    padding: 8px;
    border-radius: 5px;
    border: none;
    outline: none;
  }
  #loginForm {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: #333;
    padding: 20px;
    border-radius: 10px;
    display: flex; flex-direction: column;
    width: 300px;
  }
  #loginForm input {
    margin-bottom: 10px;
    padding: 10px;
    font-size: 16px;
    border-radius: 5px;
    border: none;
  }
  #loginForm button {
    padding: 10px;
    font-size: 16px;
    background: #007bff;
    border: none;
    border-radius: 5px;
    color: white;
    cursor: pointer;
  }
  #loginForm button:hover {
    background: #0056b3;
  }
</style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<input type="text" id="chatInput" placeholder="Vnesi sporočilo..." disabled />

<div id="loginForm">
  <input type="email" id="email" placeholder="Email" />
  <input type="password" id="password" placeholder="Geslo" />
  <button id="loginBtn">Prijava / Registracija</button>
  <div id="loginError" style="color:#f55;margin-top:10px;display:none;"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
  // Firebase konfiguracija - prilagodi svoji
  const firebaseConfig = {
    apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
    authDomain: "chater-cf682.firebaseapp.com",
    databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
    projectId: "chater-cf682",
    storageBucket: "chater-cf682.appspot.com",
    messagingSenderId: "233632075480",
    appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
  };

  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  const db = firebase.database();

  // Globalne spremenljivke
  let localPlayer = null; // trenutno prijavljen uporabnik
  let players = {}; // vsi igralci v igri
  let canvas, ctx;
  let keys = {};
  const speed = 3;
  const chatMessages = {};

  // SCENA: preprosta ozadje (npr. zelena tla in nekaj ovir)
  const scene = {
    width: 1600,
    height: 1200,
    obstacles: [
      {x: 300, y: 300, w: 100, h: 50},
      {x: 600, y: 500, w: 200, h: 100},
      {x: 1000, y: 800, w: 150, h: 150}
    ]
  };

  // Avatar slike cache
  const avatarCache = {};

  // Pridobi sliko avatarja (s cache)
  function getAvatarImage(url) {
    if (!avatarCache[url]) {
      const img = new Image();
      img.src = url;
      avatarCache[url] = img;
    }
    return avatarCache[url];
  }

  // Inicializacija igre in canvas
  function initGame() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');

    // Dodaj poslušalce tipk
    window.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
    });
    window.addEventListener('keyup', e => {
      keys[e.key.toLowerCase()] = false;
    });

    // Input za chat
    const chatInput = document.getElementById('chatInput');
    chatInput.disabled = false;
    chatInput.addEventListener('keydown', e => {
      if (e.key === "Enter" && chatInput.value.trim() !== "") {
        sendChatMessage(chatInput.value.trim());
        chatInput.value = "";
      }
    });

    // Poslušaj spremembe v bazi za igralce
    db.ref('players').on('value', snapshot => {
      players = snapshot.val() || {};
    });

    // Poslušaj spremembe v bazi za sporočila
    db.ref('chatMessages').on('value', snapshot => {
      const data = snapshot.val() || {};
      for (const [uid, msgData] of Object.entries(data)) {
        chatMessages[uid] = msgData;
        // Zamik za brisanje sporočila po 10s
        if (msgData.timestamp && Date.now() - msgData.timestamp > 10000) {
          delete chatMessages[uid];
          db.ref('chatMessages/' + uid).remove();
        }
      }
    });

    requestAnimationFrame(gameLoop);
  }

  // Pošlji chat sporočilo v bazo
  function sendChatMessage(text) {
    if (!localPlayer) return;
    const msgData = {
      text,
      timestamp: Date.now()
    };
    db.ref('chatMessages/' + localPlayer.uid).set(msgData);
    // Ob 10s sporočilo samodejno zbriši v bazi (to zgoraj poslušamo)
    setTimeout(() => {
      db.ref('chatMessages/' + localPlayer.uid).remove();
    }, 10000);
  }

  // Posodobi svojega igralca v bazi
  function updateLocalPlayer() {
    if (!localPlayer) return;

    // Premikanje
    if (keys['w'] || keys['arrowup']) localPlayer.y -= speed;
    if (keys['s'] || keys['arrowdown']) localPlayer.y += speed;
    if (keys['a'] || keys['arrowleft']) localPlayer.x -= speed;
    if (keys['d'] || keys['arrowright']) localPlayer.x += speed;

    // Omeji premik znotraj scene
    localPlayer.x = Math.max(0, Math.min(scene.width, localPlayer.x));
    localPlayer.y = Math.max(0, Math.min(scene.height, localPlayer.y));

    // Posodobi v bazi
    db.ref('players/' + localPlayer.uid).set(localPlayer);
  }

  // Kamera - sledi igralcu
  function getCameraOffset() {
    let offsetX = localPlayer.x - canvas.width / 2;
    let offsetY = localPlayer.y - canvas.height / 2;

    // Omeji, da ne gre izven scene
    offsetX = Math.max(0, Math.min(offsetX, scene.width - canvas.width));
    offsetY = Math.max(0, Math.min(offsetY, scene.height - canvas.height));

    return {offsetX, offsetY};
  }

  // Nariši sceno
  function drawScene(offsetX, offsetY) {
    // Ozadje
    ctx.fillStyle = "#228B22"; // zelena trava
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Ovire
    ctx.fillStyle = "#555";
    for (const o of scene.obstacles) {
      const ox = o.x - offsetX;
      const oy = o.y - offsetY;
      ctx.fillRect(ox, oy, o.w, o.h);
    }
  }

  // Nariši vse igralce
  function drawPlayers(offsetX, offsetY) {
    for (const uid in players) {
      const p = players[uid];
      if (!p.x || !p.y) continue;

      const screenX = p.x - offsetX;
      const screenY = p.y - offsetY;

      // Risanje avatarja kot kroga z sliko znotraj
      ctx.save();
      ctx.beginPath();
      ctx.arc(screenX, screenY, 25, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();

      const avatarUrl = p.avatarURL2 || "https://i.pravatar.cc/64";
      const avatarImg = getAvatarImage(avatarUrl);

      if (avatarImg.complete) {
        ctx.drawImage(avatarImg, screenX - 25, screenY - 25, 50, 50);
      } else {
        avatarImg.onload = () => {
          ctx.drawImage(avatarImg, screenX - 25, screenY - 25, 50, 50);
        };
      }
      ctx.restore();

      // Ime uporabnika pod avatarjem
      ctx.fillStyle = "white";
      ctx.font = "14px Arial";
      ctx.textAlign = "center";
      ctx.fillText(p.name || "Igralec", screenX, screenY + 40);

      // Če ima igralec aktivno sporočilo, nariši oblaček nad avatarjem
      if (chatMessages[uid] && chatMessages[uid].text) {
        const msg = chatMessages[uid].text;
        const maxWidth = 200;
        ctx.font = "16px Arial";
        const textWidth = ctx.measureText(msg).width;
        const bubbleWidth = Math.min(maxWidth, textWidth + 20);
        const bubbleHeight = 30;

        // Oblaček ozadje
        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.strokeStyle = "white";
        ctx.lineWidth = 2;
        const bx = screenX - bubbleWidth/2;
        const by = screenY - 60;
        ctx.fillRect(bx, by, bubbleWidth, bubbleHeight);
        ctx.strokeRect(bx, by, bubbleWidth, bubbleHeight);

        // Besedilo
        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.fillText(msg, screenX, by + bubbleHeight/1.6);
      }
    }
  }

  // Glavna zanka igre
  function gameLoop() {
    if (!localPlayer) {
      requestAnimationFrame(gameLoop);
      return;
    }

    updateLocalPlayer();

    const {offsetX, offsetY} = getCameraOffset();

    drawScene(offsetX, offsetY);
    drawPlayers(offsetX, offsetY);

    requestAnimationFrame(gameLoop);
  }

  // Prijava / registracija uporabnika
  document.getElementById('loginBtn').addEventListener('click', () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorDiv = document.getElementById('loginError');
    errorDiv.style.display = "none";

    if (!email || !password) {
      errorDiv.textContent = "Vnesi email in geslo.";
      errorDiv.style.display = "block";
      return;
    }

    // Najprej poskusi prijavo
    auth.signInWithEmailAndPassword(email, password)
      .then(cred => {
        onUserLoggedIn(cred.user);
      })
      .catch(err => {
        // Če uporabnik ne obstaja, ga registriraj
        if (err.code === 'auth/user-not-found') {
          auth.createUserWithEmailAndPassword(email, password)
            .then(cred => {
              onUserLoggedIn(cred.user, true);
            })
            .catch(e => {
              errorDiv.textContent = e.message;
              errorDiv.style.display = "block";
            });
        } else {
          errorDiv.textContent = err.message;
          errorDiv.style.display = "block";
        }
      });
  });

  // Ko je uporabnik prijavljen
  function onUserLoggedIn(user, isNew=false) {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('chatInput').disabled = false;

    // Pridobi podatke o uporabniku
    db.ref('users/' + user.uid).once('value').then(snap => {
      let data = snap.val() || {};
      if (!data.avatarURL2) {
        // Nastavi default avatar, če ni
        data.avatarURL2 = "https://i.pravatar.cc/64?u=" + user.uid;
      }
      if (!data.name) {
        data.name = user.email.split('@')[0];
      }

      // Shranimo nazaj če je nov uporabnik
      if (isNew) {
        db.ref('users/' + user.uid).set(data);
      }

      // Lokalni igralec
      localPlayer = {
        uid: user.uid,
        name: data.name,
        avatarURL2: data.avatarURL2,
        x: scene.width / 2 + Math.random() * 100 - 50,
        y: scene.height / 2 + Math.random() * 100 - 50,
      };

      // Zapiši v bazo igralcev
      db.ref('players/' + localPlayer.uid).set(localPlayer);

      // Ob brisanju strani izbriši igralca iz baze
      window.addEventListener('beforeunload', () => {
        db.ref('players/' + localPlayer.uid).remove();
        db.ref('chatMessages/' + localPlayer.uid).remove();
      });

      initGame();
    });
  }

  // Odjava ob zaprtju strani
  auth.onAuthStateChanged(user => {
    if (!user) {
      // Če uporabnik ni prijavljen, pokaži prijavo
      document.getElementById('loginForm').style.display = 'flex';
      document.getElementById('chatInput').disabled = true;
      localPlayer = null;
      players = {};
      chatMessages = {};
      if (canvas) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }
  });
</script>

</body>
</html>
