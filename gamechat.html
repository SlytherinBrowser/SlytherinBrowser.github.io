
<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Chat Game</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
      background: black;
    }
    canvas {
      display: block;
    }
    #healthBar {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 200px;
      height: 20px;
      background: red;
      border: 2px solid #fff;
    }
    #healthBarInner {
      width: 100%;
      height: 100%;
      background: lime;
    }
    #inventory {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: white;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <div id="healthBar"><div id="healthBarInner"></div></div>
  <div id="inventory">Inventory: <span id="weapons"></span></div>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/examples/js/controls/PointerLockControls.js"></script>
  <script>
  firebase.auth().onAuthStateChanged((user) => {
    if (!user) {
      window.location.href = "auth.html"; // ali kamor želiš preusmeriti, če ni prijavljen
    } else {
      console.log("Uporabnik v igri:", user.displayName);
      // tukaj lahko inicializiraš igro
    }
  });
</script>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let uid = localStorage.getItem("uid");
    if (!uid) {
      alert("Uporabnik ni prijavljen.");
      throw new Error("Ni UID.");
    }

    const playerRef = db.ref("users/" + uid);
    playerRef.once("value").then(snapshot => {
      const user = snapshot.val();
      if (!user || !user.avatarURL2) {
        alert("Ni avatarja.");
        return;
      }

      initGame(user);
    });

    function initGame(user) {
      // Setup scene
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer();
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const light = new THREE.HemisphereLight(0xffffff, 0x444444);
      light.position.set(0, 200, 0);
      scene.add(light);

      const loader = new THREE.GLTFLoader();
      loader.load(user.avatarURL2, function(gltf) {
        const avatar = gltf.scene;
        avatar.scale.set(1, 1, 1);
        scene.add(avatar);
        avatar.position.set(0, 0, 0);
        camera.position.set(0, 2, 5);
        animate();
      });

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
    }
  </script>
</body>
</html>
