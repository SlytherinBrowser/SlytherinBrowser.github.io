<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>BabylonJS 3D igra z avatarjem iz Firebase</title>
  <style>
    html, body { margin:0; padding:0; overflow:hidden; height:100%; }
    #renderCanvas { width: 100%; height: 100%; display: block; }
  </style>
  <!-- Babylon.js -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <script>
    // Firebase konfiguracija (prilagodi s svojimi podatki)
     const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
    };
    firebase.initializeApp(firebaseConfig);

    // Anonimna prijava
    async function firebaseSignIn() {
      return new Promise((resolve, reject) => {
        firebase.auth().onAuthStateChanged(user => {
          if (user) {
            console.log("✅ Prijavljen:", user.uid);
            resolve(user);
          } else {
            firebase.auth().signInAnonymously()
              .then(result => {
                console.log("✅ Anonimna prijava uspešna:", result.user.uid);
                resolve(result.user);
              })
              .catch(err => {
                console.error("❌ Napaka pri anonimni prijavi:", err);
                reject(err);
              });
          }
        });
      });
    }

    // Preberi avatar URL iz Firebase realtime DB
    async function preberiAvatarZaIgro(userId) {
      try {
        const snapshot = await firebase.database().ref("users/" + userId + "/avatarURL2").get();
        if (snapshot.exists()) {
          const avatarUrl = snapshot.val();
          console.log("Avatar za igro prebran:", avatarUrl);
          return avatarUrl;
        } else {
          console.log("Avatar URL za igro ne obstaja.");
          return null;
        }
      } catch (error) {
        console.error("Napaka pri branju avatarja za igro:", error);
        return null;
      }
    }

    async function createScene(engine, canvas, user) {
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color3(0.4, 0.7, 0.9);

      // Večja ravna zemlja (ground)
      const ground = BABYLON.MeshBuilder.CreateGround("ground", {width:200, height:200}, scene);
      const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
      groundMat.diffuseColor = new BABYLON.Color3(0.1, 0.5, 0.1);
      ground.material = groundMat;

      // Drevesa (enostavni valji + krogle)
      function dodajDrevo(x, z) {
        const deblo = BABYLON.MeshBuilder.CreateCylinder("deblo", {height: 4, diameterTop: 0.5, diameterBottom: 0.5}, scene);
        deblo.position = new BABYLON.Vector3(x, 2, z);
        const matDeblo = new BABYLON.StandardMaterial("matDeblo", scene);
        matDeblo.diffuseColor = new BABYLON.Color3(0.55, 0.27, 0.07);
        deblo.material = matDeblo;

        const krošnja = BABYLON.MeshBuilder.CreateSphere("krošnja", {diameter: 3}, scene);
        krošnja.position = new BABYLON.Vector3(x, 5, z);
        const matKrošnja = new BABYLON.StandardMaterial("matKrošnja", scene);
        matKrošnja.diffuseColor = new BABYLON.Color3(0, 0.5, 0);
        krošnja.material = matKrošnja;
      }

      // Skale (kroglice)
      function dodajSkalo(x, z) {
        const skala = BABYLON.MeshBuilder.CreateSphere("skala", {diameter: 2}, scene);
        skala.position = new BABYLON.Vector3(x, 1, z);
        const matSkala = new BABYLON.StandardMaterial("matSkala", scene);
        matSkala.diffuseColor = new BABYLON.Color3(0.4, 0.4, 0.4);
        skala.material = matSkala;
      }

      // Dodaj nekaj dreves in skal naokoli
      for (let i = 0; i < 20; i++) {
        const x = Math.random() * 180 - 90;
        const z = Math.random() * 180 - 90;
        dodajDrevo(x, z);
      }
      for (let i = 0; i < 15; i++) {
        const x = Math.random() * 180 - 90;
        const z = Math.random() * 180 - 90;
        dodajSkalo(x, z);
      }

      // Ustvari avatar mesh - preprost box
      const avatar = BABYLON.MeshBuilder.CreateBox("avatar", {size: 2}, scene);

      // Preberi avatar URL
      let avatarURL2 = "https://i.pravatar.cc/128"; // privzeti avatar
      if (user) {
        const url = await preberiAvatarZaIgro(user.uid);
        if (url) avatarURL2 = url;
      }

      // Naloži teksturo avatarja
      const avatarMaterial = new BABYLON.StandardMaterial("avatarMaterial", scene);
      avatarMaterial.diffuseTexture = new BABYLON.Texture(avatarURL2, scene);
      avatar.material = avatarMaterial;

      avatar.position.y = 1;

      // Kamera 3.osebe z lagom za sledenje avatarju
      const camera = new BABYLON.ArcRotateCamera("camera", Math.PI / 2, Math.PI / 3, 10, avatar.position, scene);
      camera.attachControl(canvas, true);
      camera.lowerBetaLimit = 0.1;
      camera.upperBetaLimit = Math.PI / 2.2;
      camera.lowerRadiusLimit = 5;
      camera.upperRadiusLimit = 20;

      // OnBeforeRender za premikanje avatarja in kamere
      const inputMap = {};
      scene.actionManager = new BABYLON.ActionManager(scene);
      scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(
        BABYLON.ActionManager.OnKeyDownTrigger, evt => {
          inputMap[evt.sourceEvent.key.toLowerCase()] = true;
        }
      ));
      scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(
        BABYLON.ActionManager.OnKeyUpTrigger, evt => {
          inputMap[evt.sourceEvent.key.toLowerCase()] = false;
        }
      ));

      scene.onBeforeRenderObservable.add(() => {
        // Obrnjeno W in S
        if (inputMap["w"]) {
          avatar.position.addInPlace(avatar.forward.negate().scale(0.1)); // W premik nazaj
        }
        if (inputMap["s"]) {
          avatar.position.addInPlace(avatar.forward.scale(0.1)); // S premik naprej
        }
        if (inputMap["a"]) {
          avatar.rotation.y -= 0.03;
        }
        if (inputMap["d"]) {
          avatar.rotation.y += 0.03;
        }

        // Kamera sledi avatarju z lagom
        const desiredPosition = avatar.position.add(new BABYLON.Vector3(0, 4, -10));
        camera.target = avatar.position;
        camera.alpha += (Math.PI / 2 - camera.alpha) * 0.05; // rahlo poravnaj pogled na avatar (rotacija)
        camera.beta += (Math.PI / 3 - camera.beta) * 0.05;
        camera.radius += (10 - camera.radius) * 0.05;
      });

      return scene;
    }

    async function startGame() {
      const canvas = document.getElementById("renderCanvas");
      const engine = new BABYLON.Engine(canvas, true);

      try {
        const user = await firebaseSignIn();
        const scene = await createScene(engine, canvas, user);

        engine.runRenderLoop(() => {
          scene.render();
        });

        window.addEventListener("resize", () => {
          engine.resize();
        });
      } catch (error) {
        console.error("Napaka pri zaganjanju igre:", error);
      }
    }

    startGame();
  </script>
</body>
</html>
