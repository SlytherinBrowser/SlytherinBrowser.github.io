
<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Chat Game</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
      background: black;
    }
    canvas {
      display: block;
    }
    #healthBar {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 200px;
      height: 20px;
      background: red;
      border: 2px solid #fff;
    }
    #healthBarInner {
      width: 100%;
      height: 100%;
      background: lime;
    }
    #inventory {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: white;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <div id="healthBar"><div id="healthBarInner"></div></div>
  <div id="inventory">Inventory: <span id="weapons"></span></div>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/examples/js/controls/PointerLockControls.js"></script>
 <script>
  // Firebase config in inicializacija
  const firebaseConfig = {
    apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
    authDomain: "chater-cf682.firebaseapp.com",
    databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
    projectId: "chater-cf682",
    storageBucket: "chater-cf682.appspot.com",
    messagingSenderId: "233632075480",
    appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Pripravi THREE.js sceno
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer();
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const light = new THREE.HemisphereLight(0xffffff, 0x444444);
  light.position.set(0, 200, 0);
  scene.add(light);

  camera.position.set(0, 2, 10);

  const loader = new THREE.GLTFLoader();

  // Funkcija za pozicioniranje avatarjev, da se ne prekrivajo
  function getPosition(index) {
    const spacing = 3; // razmik med avatarji
    const x = (index % 5) * spacing - 6;    // postavi max 5 avatarjev v vrstico, centrirano
    const z = Math.floor(index / 5) * spacing - 6;
    return { x, y: 0, z };
  }

  // Naloži vse avatarje uporabnikov in jih prikaži v sceni
  db.ref("users").once("value").then(snapshot => {
    const users = snapshot.val();
    if (!users) {
      alert("V bazi ni uporabnikov.");
      return;
    }

    let index = 0;
    for (const uid in users) {
      const user = users[uid];
      if (user.avatarURL2) {
        loader.load(user.avatarURL2,
          function(gltf) {
            const avatar = gltf.scene;
            avatar.scale.set(1, 1, 1);
            const pos = getPosition(index);
            avatar.position.set(pos.x, pos.y, pos.z);
            scene.add(avatar);
            index++;
          },
          undefined,
          function(error) {
            console.error("Napaka pri nalaganju avatarja:", error);
          }
        );
      }
    }
  });

  // Animacija
  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();

  // Ob spremembi velikosti okna
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
