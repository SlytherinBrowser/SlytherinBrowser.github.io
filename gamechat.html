<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Babylon.js 3D Avatar z Firebase prijavo</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #renderCanvas { width: 100%; height: 100%; touch-action: none; display: block; }
    #loginDiv {
      position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.9); padding: 10px; border-radius: 8px;
      font-family: Arial, sans-serif; z-index: 10;
      width: 300px;
    }
    #loginDiv input, #loginDiv button {
      width: 100%; margin: 5px 0; padding: 8px; font-size: 14px;
    }
    #statusMsg { font-size: 14px; color: red; min-height: 20px; }
  </style>
</head>
<body>

<div id="loginDiv">
  <h3>Prijava</h3>
  <input type="email" id="email" placeholder="Email" />
  <input type="password" id="password" placeholder="Geslo" />
  <button id="loginBtn">Prijavi se</button>
  <button id="logoutBtn" style="display:none;">Odjavi se</button>
  <div id="statusMsg"></div>
</div>

<canvas id="renderCanvas"></canvas>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- Babylon.js -->
<script src="https://cdn.babylonjs.com/babylon.js"></script>

<script>
  // Firebase konfiguracija - zamenjaj s svojo!
  const firebaseConfig = {
    apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
    authDomain: "chater-cf682.firebaseapp.com",
    databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
    projectId: "chater-cf682",
    storageBucket: "chater-cf682.appspot.com",
    messagingSenderId: "233632075480",
    appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const database = firebase.database();

  // UI elementi
  const loginDiv = document.getElementById('loginDiv');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const statusMsg = document.getElementById('statusMsg');

  // Babylon.js setup
  const canvas = document.getElementById("renderCanvas");
  const engine = new BABYLON.Engine(canvas, true);
  let scene;
  let avatarRoot = null;

  // Nastavi sceno
  function createScene() {
    const scene = new BABYLON.Scene(engine);

    // Kamera - third person
    const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI / 2, Math.PI / 3, 10, BABYLON.Vector3.Zero(), scene);
    camera.attachControl(canvas, true);
    camera.lowerBetaLimit = 0.1;
    camera.upperBetaLimit = Math.PI / 2.2;
    camera.lowerRadiusLimit = 5;
    camera.upperRadiusLimit = 20;

    // Svetloba
    const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
    light.intensity = 0.9;

    // Teren (velik 200x200)
    const ground = BABYLON.MeshBuilder.CreateGround("ground", {width:200, height:200}, scene);
    const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
    groundMat.diffuseColor = new BABYLON.Color3(0.1, 0.6, 0.1);
    ground.material = groundMat;

    return scene;
  }

  // Naloži 3D avatar model iz URL (glb/gltf)
  function loadAvatarModel(url) {
    if (avatarRoot) {
      avatarRoot.dispose();
      avatarRoot = null;
    }
    BABYLON.SceneLoader.ImportMesh(null, "", url, scene,
      function(meshes) {
        avatarRoot = new BABYLON.TransformNode("avatarRoot", scene);
        meshes.forEach(m => m.parent = avatarRoot);

        avatarRoot.position = new BABYLON.Vector3(0, 0, 0);
        avatarRoot.rotation = new BABYLON.Vector3(0, 0, 0);

        statusMsg.textContent = "Avatar naložen.";
      },
      null,
      function(scene, message, exception) {
        statusMsg.textContent = "Napaka pri nalaganju avatarja.";
        console.error("Napaka pri nalaganju avatarja:", message, exception);
      }
    );
  }

  // Pridobi avatar URL iz Firebase DB in naloži avatar
  function loadAvatarForUser(uid) {
    const ref = database.ref(`uporabniki/${uid}/avatarURL2`);
    ref.once('value').then(snapshot => {
      const url = snapshot.val();
      if (url) {
        loadAvatarModel(url);
      } else {
        statusMsg.textContent = "Uporabnik nima nastavljenega avatarja.";
      }
    });
  }

  // Kontrole avatarja (premikanje in rotacija s tipkami)
  const inputMap = {};
  window.addEventListener("keydown", evt => inputMap[evt.key.toLowerCase()] = true);
  window.addEventListener("keyup", evt => inputMap[evt.key.toLowerCase()] = false);

  function avatarControls() {
    if (!avatarRoot) return;

    const speed = 0.1;
    // Rotacija z q/e
    if (inputMap["q"]) avatarRoot.rotation.y -= 0.05;
    if (inputMap["e"]) avatarRoot.rotation.y += 0.05;

    // Premikanje v smer, kamor gleda avatar (forward/back)
    let forward = new BABYLON.Vector3(Math.sin(avatarRoot.rotation.y), 0, Math.cos(avatarRoot.rotation.y));
    forward.normalize();

    if (inputMap["w"]) avatarRoot.position.addInPlace(forward.scale(speed));
    if (inputMap["s"]) avatarRoot.position.subtractInPlace(forward.scale(speed));

    // Levo/desno premikanje (strafe)
    let right = new BABYLON.Vector3(forward.z, 0, -forward.x);
    if (inputMap["a"]) avatarRoot.position.subtractInPlace(right.scale(speed));
    if (inputMap["d"]) avatarRoot.position.addInPlace(right.scale(speed));

    // Omejitev gibanja na teren 100x100 v x/z osi (pol-terena)
    avatarRoot.position.x = Math.min(100, Math.max(-100, avatarRoot.position.x));
    avatarRoot.position.z = Math.min(100, Math.max(-100, avatarRoot.position.z));
  }

  // Prikaz scene in glavni loop
  scene = createScene();

  engine.runRenderLoop(() => {
    avatarControls();

    // Kamera sledi avatarju (druga oseba)
    if (avatarRoot) {
      let target = avatarRoot.position.clone();
      target.y += 1.5;
      scene.activeCamera.target = BABYLON.Vector3.Lerp(scene.activeCamera.target, target, 0.1);
    }

    scene.render();
  });

  window.addEventListener("resize", () => {
    engine.resize();
  });

  // Firebase prijava/odjava
  loginBtn.addEventListener("click", () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();
    if (!email || !password) {
      statusMsg.textContent = "Prosim vnesi email in geslo.";
      return;
    }
    loginBtn.disabled = true;
    statusMsg.textContent = "Prijavljam...";

    auth.signInWithEmailAndPassword(email, password)
      .then(userCredential => {
        statusMsg.textContent = "Prijava uspešna.";
        loginDiv.style.display = "none";
        logoutBtn.style.display = "block";
        loadAvatarForUser(userCredential.user.uid);
      })
      .catch(error => {
        statusMsg.textContent = "Napaka: " + error.message;
      })
      .finally(() => loginBtn.disabled = false);
  });

  logoutBtn.addEventListener("click", () => {
    auth.signOut().then(() => {
      statusMsg.textContent = "Odjava uspešna.";
      loginDiv.style.display = "block";
      logoutBtn.style.display = "none";
      if (avatarRoot) {
        avatarRoot.dispose();
        avatarRoot = null;
      }
    });
  });

  // Ob spremembi prijave (reload strani ipd)
  auth.onAuthStateChanged(user => {
    if (user) {
      loginDiv.style.display = "none";
      logoutBtn.style.display = "block";
      loadAvatarForUser(user.uid);
    } else {
      loginDiv.style.display = "block";
      logoutBtn.style.display = "none";
    }
  });
</script>
</body>
</html>
