<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Chat Game z Babylon.js</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden; background: black;
      font-family: sans-serif;
      color: white;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #healthBar {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 200px;
      height: 20px;
      background: red;
      border: 2px solid #fff;
      z-index: 100;
    }
    #healthBarInner {
      width: 100%;
      height: 100%;
      background: lime;
      transition: width 0.3s ease;
    }
    #inventory {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: white;
      z-index: 100;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="healthBar"><div id="healthBarInner"></div></div>
  <div id="inventory">Inventory: <span id="weapons"></span></div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <!-- Babylon.js -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylon.glTF2FileLoader.min.js"></script>

  <script>
    // Firebase konfiguracija in inicializacija
    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Osnovne spremenljivke Babylon.js
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);
    const scene = new BABYLON.Scene(engine);

    // Kamera z orjentacijo prve osebe
    const camera = new BABYLON.UniversalCamera("playerCamera", new BABYLON.Vector3(0, 3, -10), scene);
    camera.attachControl(canvas, true);
    camera.speed = 0.1;
    camera.inertia = 0.2;

    // Svetloba
    const light = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0, 1, 0), scene);
    light.intensity = 0.9;

    // Osnovna podlaga
    const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 50, height: 50}, scene);
    ground.checkCollisions = true;

    // Zdravje in inventory
    let health = 100;
    const healthBarInner = document.getElementById("healthBarInner");

    // Igralčevi podatki
    let playerId = localStorage.getItem("uid");
    if (!playerId) {
      alert("Nisi prijavljen.");
      throw new Error("Ni UID");
    }

    let playerMesh = null;
    const players = {}; // ostali igralci: id -> {mesh, health}

    // Hitrost gibanja
    const moveSpeed = 0.15;

    // Naloži svoj avatar iz Firebase in scene
    db.ref("users/" + playerId).once("value").then(snapshot => {
      const playerData = snapshot.val();
      if (!playerData || !playerData.avatarURL2) {
        alert("Ni avatarja za uporabnika.");
        throw new Error("Ni avatarja");
      }

      // Naloži glTF model igralca
      BABYLON.SceneLoader.ImportMesh("", "", playerData.avatarURL2, scene, function(meshes) {
        playerMesh = BABYLON.Mesh.MergeMeshes(meshes, true, true, undefined, false, true);
        playerMesh.position = new BABYLON.Vector3(0, 0, 0);
        playerMesh.scaling = new BABYLON.Vector3(1, 1, 1);
        playerMesh.checkCollisions = true;

        // Kamera sledi igralcu
        camera.lockedTarget = playerMesh;

        // Pošlji začetno stanje v bazo
        updateMyState();

        // Začni poslušati ostale igralce
        listenToOtherPlayers();
      });
    });

    // Posodobi svoje stanje v Firebase
    function updateMyState() {
      if (!playerMesh) return;
      db.ref("players/" + playerId).set({
        position: {
          x: playerMesh.position.x,
          y: playerMesh.position.y,
          z: playerMesh.position.z
        },
        health: health,
        shooting: false
      });
      updateHealthBar();
    }

    // Poslušaj ostale igralce
    function listenToOtherPlayers() {
      db.ref("players").on("value", snapshot => {
        const allPlayers = snapshot.val() || {};
        for (const id in allPlayers) {
          if (id === playerId) continue;
          const data = allPlayers[id];

          if (!players[id]) {
            // Naloži avatar ostalih igralcev
            db.ref("users/" + id).once("value").then(snap => {
              const u = snap.val();
              if (u && u.avatarURL2) {
                BABYLON.SceneLoader.ImportMesh("", "", u.avatarURL2, scene, function(meshes) {
                  const mesh = BABYLON.Mesh.MergeMeshes(meshes, true, true, undefined, false, true);
                  mesh.position = new BABYLON.Vector3(data.position.x, data.position.y, data.position.z);
                  mesh.scaling = new BABYLON.Vector3(1, 1, 1);
                  players[id] = { mesh: mesh, health: 100 };
                });
              }
            });
          } else {
            // Posodobi pozicijo in zdravje
            players[id].mesh.position = new BABYLON.Vector3(data.position.x, data.position.y, data.position.z);
            players[id].health = data.health;

            // Barvni indikator zdravja
            if (players[id].health < 30) {
              players[id].mesh.material = new BABYLON.StandardMaterial("lowHealthMat", scene);
              players[id].mesh.material.diffuseColor = new BABYLON.Color3(1, 0, 0);
            } else {
              players[id].mesh.material = new BABYLON.StandardMaterial("normalMat", scene);
              players[id].mesh.material.diffuseColor = new BABYLON.Color3(1, 1, 1);
            }
          }
        }

        // Odstrani igralce, ki so odšli
        for (const id in players) {
          if (!allPlayers[id]) {
            if (players[id].mesh) {
              players[id].mesh.dispose();
            }
            delete players[id];
          }
        }
      });
    }

    // Premikanje igralca - uporabimo tipke WASD za premik kamere in igralca
    const inputMap = {};
    scene.actionManager = new BABYLON.ActionManager(scene);
    scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyDownTrigger, evt => {
      inputMap[evt.sourceEvent.key.toLowerCase()] = true;
    }));
    scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyUpTrigger, evt => {
      inputMap[evt.sourceEvent.key.toLowerCase()] = false;
    }));

    scene.onBeforeRenderObservable.add(() => {
      if (!playerMesh) return;

      let forward = new BABYLON.Vector3(0, 0, 1);
      let right = new BABYLON.Vector3(1, 0, 0);

      if (inputMap["w"]) playerMesh.position.addInPlace(forward.scale(-moveSpeed));
      if (inputMap["s"]) playerMesh.position.addInPlace(forward.scale(moveSpeed));
      if (inputMap["a"]) playerMesh.position.addInPlace(right.scale(-moveSpeed));
      if (inputMap["d"]) playerMesh.position.addInPlace(right.scale(moveSpeed));

      updateMyState();
    });

    // Posodobi health bar na UI
    function updateHealthBar() {
      healthBarInner.style.width = health + "%";
    }

    // Streljanje: klik z miško preveri zadetek na druge igralce
    window.addEventListener("click", evt => {
      if (!playerMesh) return;

      // Raycast iz kamere na klik
      const pickResult = scene.pick(scene.pointerX, scene.pointerY);

      if (pickResult.hit) {
        for (const id in players) {
          if (!players[id].mesh) continue;

          if (pickResult.pickedMesh === players[id].mesh) {
            console.log("Zadel si igralca:", id);

            let newHealth = Math.max(0, players[id].health - 20);
            db.ref("players/" + id + "/health").set(newHealth);

            if (newHealth === 0) {
              // Respawn po 3 sekundah
              setTimeout(() => {
                db.ref("players/" + id).remove();
                db.ref("players/" + id + "/health").set(100);
              }, 3000);
            }
          }
        }
      }
    });

    // Zagon scene in render loop
    engine.runRenderLoop(() => {
      scene.render();
    });

    window.addEventListener("resize", () => {
      engine.resize();
    });

  </script>
</body>
</html>
