<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinamična obvestila</title>
    <style>
        /* Osnovni slog za obvestilo */
        #notification {
            position: fixed;
            bottom: 20px; /* Prikaže se 20px od spodaj */
            left: 50%;
            transform: translateX(-50%);
            background-color: #323232;
            color: white;
            padding: 15px 20px;
            border-radius: 16px;
            font-size: 16px;
            font-family: 'Arial', sans-serif;
            z-index: 9999;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: opacity 0.5s, bottom 0.5s, transform 0.3s ease;
            cursor: pointer;
            width: 300px;
            max-height: 60px;
            overflow: hidden;
        }

        /* Animacija za prikaži obvestila */
        #notification.show {
            opacity: 1;
            bottom: 20px; /* Pokaže se na 20px od spodaj */
        }

        /* Slog za gumb */
        #notifyButton {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #notifyButton:hover {
            background-color: #45a049;
        }

        /* Podrobnosti, ki se prikažejo ob povečanju */
        .details {
            display: none;
            font-size: 14px;
            margin-top: 10px;
        }

        /* Obvestilo, ki je povečano */
        #notification.expanded {
            max-height: 300px;
        }

        #notification.expanded .details {
            display: block;
        }
    </style>
</head>
<body>

    <button id="notifyButton">Prikaži random obvestilo</button>

    <div id="notification">
        To je testno obvestilo!
        <div class="details">
            Tukaj so podrobnosti obvestila. Lahko vsebujejo dodatne informacije ali navodila.
        </div>
    </div>

    <script>
        // Seznam naključnih obvestil
        const notifications = [
            "Nova posodobitev je na voljo!",
            "Imate nove naloge v sistemu.",
            "Ne pozabite na prihajajoči sestanek.",
            "Prejeli ste novo sporočilo.",
            "Vaša seja je bila uspešno zaključena.",
            "Pozdravljeni, dobrodošli nazaj!",
            "Na voljo so nove funkcionalnosti!",
            "Obvestilo o vzdrževanju sistema."
        ];

        // Funkcija za naključno izbiro obvestila iz seznama
        function getRandomNotification() {
            const randomIndex = Math.floor(Math.random() * notifications.length);
            return notifications[randomIndex];
        }

        // Funkcija za prikaz obvestila z animacijo
        function showNotification() {
            const notification = document.getElementById('notification');
            notification.textContent = getRandomNotification();  // Nastavi naključno obvestilo

            // Prikaz obvestila
            notification.classList.add('show');
        }

        // Dogodek za klik na gumb
        document.getElementById('notifyButton').addEventListener('click', showNotification);

        // Onemogoči "Pull-to-refresh" na mobilnih napravah
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) return; // Preprečimo več dotikov
            const touchStart = e.touches[0].clientY;
            let touchMove;
            const notification = document.getElementById('notification');
            let direction = null;

            // Dogodek za gibanje prsta po zaslonu
            window.addEventListener('touchmove', function(e) {
                touchMove = e.touches[0].clientY;
                const diff = touchMove - touchStart;

                // Prepreči osvežitev strani
                if (window.scrollY === 0) {
                    e.preventDefault();
                }

                // Zaznavanje smeri poteze
                if (diff > 0) {
                    direction = 'down'; // Poteza dol
                } else if (diff < 0) {
                    direction = 'up'; // Poteza gor
                }

                // Premik obvestila glede na potezo
                if (Math.abs(diff) > 50) {
                    notification.style.transform = `translateY(${diff}px)`;
                }
            });

            // Dogodek za zaključek poteze (spuščanje prsta)
            window.addEventListener('touchend', function() {
                const diff = touchMove - touchStart;

                // Poteza dol za skritje
                if (Math.abs(diff) > 100 && direction === 'down') {
                    notification.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
                    notification.style.transform = 'translateY(100%)'; // Skrije obvestilo dol
                    setTimeout(() => {
                        notification.style.transition = 'none';
                        notification.style.opacity = 0;
                    }, 300);
                } 
                // Poteza gor za povečanje in prikaz podrobnosti
                else if (direction === 'up') {
                    notification.classList.add('expanded');
                    notification.style.transform = 'translateY(0)';
                } else {
                    // Če ni bilo dovolj velikega premika, obvestilo vrnemo na svoje mesto
                    notification.style.transition = 'transform 0.3s ease';
                    notification.style.transform = 'translateY(0)';
                }
            });
        });
    </script>

</body>
</html>
