<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ready Player Me + Udarci & Skok</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
    }

    #gameArea {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: url('https://i.imgur.com/7yUvePI.png') center/cover no-repeat;
    }

    #avatar {
      position: absolute;
      width: 64px;
      height: 64px;
      background: url('https://i.imgur.com/vPLOypn.png') no-repeat;
      background-size: 256px 256px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: idle 0.3s steps(1) infinite;
    }

    @keyframes walk-down { 0% { background-position: 0 0; } 100% { background-position: -192px 0; } }
    @keyframes walk-left { 0% { background-position: 0 -64px; } 100% { background-position: -192px -64px; } }
    @keyframes walk-right { 0% { background-position: 0 -128px; } 100% { background-position: -192px -128px; } }
    @keyframes walk-up { 0% { background-position: 0 -192px; } 100% { background-position: -192px -192px; } }
    @keyframes idle { 0% { background-position: 0 0; } }

    /* Jump animation */
    .jumping {
      animation: jump 0.4s ease;
    }

    @keyframes jump {
      0% { transform: translate(-50%, -50%) translateY(0); }
      50% { transform: translate(-50%, -50%) translateY(-30px); }
      100% { transform: translate(-50%, -50%) translateY(0); }
    }

    /* Punch animation - fake frame shift */
    .punching {
      animation: punch 0.3s steps(1) forwards;
    }

    @keyframes punch {
      0% { filter: brightness(1); transform: translate(-50%, -50%) scale(1); }
      50% { filter: brightness(1.5); transform: translate(-50%, -50%) scale(1.2); }
      100% { filter: brightness(1); transform: translate(-50%, -50%) scale(1); }
    }

    #joystick {
      position: absolute;
      bottom: 30px;
      left: 30px;
      width: 100px;
      height: 100px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      touch-action: none;
    }

    #stick {
      width: 40px;
      height: 40px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      top: 30px;
      left: 30px;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="gameArea">
    <div id="avatar"></div>
    <div id="joystick"><div id="stick"></div></div>
  </div>

  <script>
    const avatar = document.getElementById("avatar");
    const joystick = document.getElementById("joystick");
    const stick = document.getElementById("stick");

    let centerX = joystick.offsetLeft + joystick.offsetWidth / 2;
    let centerY = joystick.offsetTop + joystick.offsetHeight / 2;
    let moveInterval;

    function getDirection(dx, dy) {
      const angle = Math.atan2(dy, dx) * 180 / Math.PI;
      if (angle >= -45 && angle <= 45) return 'right';
      if (angle > 45 && angle < 135) return 'down';
      if (angle >= 135 || angle <= -135) return 'left';
      if (angle > -135 && angle < -45) return 'up';
    }

    function setAnimation(dir) {
      avatar.style.animation = `walk-${dir} 0.4s steps(3) infinite`;
    }

    function stopAnimation() {
      avatar.style.animation = `idle 0.3s steps(1) infinite`;
    }

    function moveAvatar(dx, dy) {
      const currentTop = avatar.offsetTop;
      const currentLeft = avatar.offsetLeft;
      const speed = 2;
      avatar.style.top = `${currentTop + dy * speed}px`;
      avatar.style.left = `${currentLeft + dx * speed}px`;
    }

    function startMoving(dx, dy) {
      const dir = getDirection(dx, dy);
      setAnimation(dir);
      clearInterval(moveInterval);
      moveInterval = setInterval(() => {
        moveAvatar(dx, dy);
      }, 20);
    }

    function stopMoving() {
      clearInterval(moveInterval);
      stopAnimation();
    }

    function handleJoystickStart(e) {
      document.addEventListener("touchmove", handleJoystickMove);
      document.addEventListener("touchend", handleJoystickEnd);
      document.addEventListener("mousemove", handleJoystickMove);
      document.addEventListener("mouseup", handleJoystickEnd);
    }

    function handleJoystickMove(e) {
      let clientX, clientY;
      if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }

      const dx = clientX - centerX;
      const dy = clientY - centerY;
      const maxDist = 40;
      const dist = Math.min(maxDist, Math.hypot(dx, dy));
      const angle = Math.atan2(dy, dx);
      const x = dist * Math.cos(angle);
      const y = dist * Math.sin(angle);
      stick.style.left = `${30 + x}px`;
      stick.style.top = `${30 + y}px`;
      const normX = x / maxDist;
      const normY = y / maxDist;
      startMoving(normX, normY);
    }

    function handleJoystickEnd() {
      stick.style.left = "30px";
      stick.style.top = "30px";
      stopMoving();
      document.removeEventListener("touchmove", handleJoystickMove);
      document.removeEventListener("touchend", handleJoystickEnd);
      document.removeEventListener("mousemove", handleJoystickMove);
      document.removeEventListener("mouseup", handleJoystickEnd);
    }

    // Jump logic
    function jump() {
      if (!avatar.classList.contains('jumping')) {
        avatar.classList.add('jumping');
        setTimeout(() => {
          avatar.classList.remove('jumping');
        }, 400);
      }
    }

    // Punch logic
    function punch() {
      if (!avatar.classList.contains('punching')) {
        avatar.classList.add('punching');
        setTimeout(() => {
          avatar.classList.remove('punching');
        }, 300);
      }
    }

    // Key controls
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') jump();
      if (e.key.toLowerCase() === 'f') punch();
    });

    // Touch zones
    document.getElementById("gameArea").addEventListener("touchstart", (e) => {
      const x = e.touches[0].clientX;
      const y = e.touches[0].clientY;
      if (x > window.innerWidth * 0.66) {
        punch();
      } else if (y < window.innerHeight * 0.4) {
        jump();
      }
    });

    stick.addEventListener("mousedown", handleJoystickStart);
    stick.addEventListener("touchstart", handleJoystickStart);
  </script>
</body>
</html>
