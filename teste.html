<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinamična obvestila</title>
    <style>
        /* Osnovni slog za obvestilo */
        #notification {
            position: fixed;
            bottom: -100px; /* Začne izven zaslona spodaj */
            left: 50%;
            transform: translateX(-50%);
            background-color: #333;
            color: white;
            padding: 15px;
            border-radius: 5px;
            font-size: 16px;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.5s, bottom 0.5s;
            cursor: pointer;
        }

        /* Slog za prikaži animacijo obvestila */
        #notification.show {
            opacity: 1;
            bottom: 20px; /* Prikaže se na 20px od spodaj */
        }

        /* Slog za gumb */
        #notifyButton {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #notifyButton:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <button id="notifyButton">Prikaži random obvestilo</button>

    <div id="notification">
        To je testno obvestilo!
    </div>

    <script>
        // Seznam naključnih obvestil
        const notifications = [
            "Nova posodobitev je na voljo!",
            "Imate nove naloge v sistemu.",
            "Ne pozabite na prihajajoči sestanek.",
            "Prejeli ste novo sporočilo.",
            "Vaša seja je bila uspešno zaključena.",
            "Pozdravljeni, dobrodošli nazaj!",
            "Na voljo so nove funkcionalnosti!",
            "Obvestilo o vzdrževanju sistema."
        ];

        // Funkcija za naključno izbiro obvestila iz seznama
        function getRandomNotification() {
            const randomIndex = Math.floor(Math.random() * notifications.length);
            return notifications[randomIndex];
        }

        // Funkcija za prikaz obvestila z animacijo
        function showNotification() {
            const notification = document.getElementById('notification');
            notification.textContent = getRandomNotification();  // Nastavi naključno obvestilo

            // Pokaži obvestilo
            notification.classList.add('show');

            // Po 3 sekundah skrij obvestilo
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Premikanje obvestila
        let isDragging = false;
        let startY = 0;
        let initialBottom = 0;

        const notification = document.getElementById('notification');

        notification.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            initialBottom = parseInt(window.getComputedStyle(notification).bottom, 10);
            isDragging = true;
        });

        notification.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const currentY = e.touches[0].clientY;
            const diff = currentY - startY;
            notification.style.bottom = `${initialBottom - diff}px`;  // Premakni obvestilo
        });

        notification.addEventListener('touchend', () => {
            if (parseInt(notification.style.bottom, 10) > 100) {
                notification.classList.remove('show'); // Če je pomaknjeno dovolj navzdol, skrij
            } else {
                notification.style.bottom = '20px';  // Pojdi nazaj na začetno pozicijo
            }
            isDragging = false;
        });

        // Dogodek za klik na gumb
        document.getElementById('notifyButton').addEventListener('click', showNotification);
    </script>

</body>
</html>
