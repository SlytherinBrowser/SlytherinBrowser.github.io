<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinamična obvestila</title>
    <style>
        /* Osnovni slog za obvestilo */
        #notification {
            position: fixed;
            bottom: 20px; /* Prikaže se 20px od spodaj */
            left: 50%;
            transform: translateX(-50%);
            background-color: #323232;
            color: white;
            padding: 15px 20px;
            border-radius: 16px;
            font-size: 16px;
            font-family: 'Arial', sans-serif;
            z-index: 9999;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: opacity 0.5s, bottom 0.5s, transform 0.3s ease;
            cursor: pointer;
            width: 300px;
        }

        /* Animacija za prikaži obvestila */
        #notification.show {
            opacity: 1;
            bottom: 20px; /* Pokaže se na 20px od spodaj */
        }

        /* Slog za gumb */
        #notifyButton {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #notifyButton:hover {
            background-color: #45a049;
        }

        /* Slog za tiho obvestilo (ikona na levem robu) */
        #silentMode {
            position: fixed;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            background-color: #323232;
            color: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
            z-index: 10000;
        }

        #silentMode.active {
            background-color: #e53935; /* Rdeča za aktivni tiho način */
        }

        #silentMode i {
            font-size: 24px;
        }
    </style>
</head>
<body>

    <button id="notifyButton">Prikaži random obvestilo</button>

    <div id="notification">
        To je testno obvestilo!
    </div>

    <div id="silentMode">
        <i class="fa fa-volume-off"></i> <!-- Ikona za tih način -->
    </div>

    <script>
        // Seznam naključnih obvestil
        const notifications = [
            "Nova posodobitev je na voljo!",
            "Imate nove naloge v sistemu.",
            "Ne pozabite na prihajajoči sestanek.",
            "Prejeli ste novo sporočilo.",
            "Vaša seja je bila uspešno zaključena.",
            "Pozdravljeni, dobrodošli nazaj!",
            "Na voljo so nove funkcionalnosti!",
            "Obvestilo o vzdrževanju sistema."
        ];

        // Funkcija za naključno izbiro obvestila iz seznama
        function getRandomNotification() {
            const randomIndex = Math.floor(Math.random() * notifications.length);
            return notifications[randomIndex];
        }

        // Funkcija za prikaz obvestila z animacijo
        function showNotification() {
            const notification = document.getElementById('notification');
            notification.textContent = getRandomNotification();  // Nastavi naključno obvestilo

            // Pokaži obvestilo
            notification.classList.add('show');
        }

        // Dogodek za klik na gumb
        document.getElementById('notifyButton').addEventListener('click', showNotification);

        // Tiho obvestilo - preveri ali je tiho način omogočen
        let silentMode = JSON.parse(localStorage.getItem('silentMode')) || false;

        // Funkcija za preklop tihega načina
        function toggleSilentMode() {
            silentMode = !silentMode;
            localStorage.setItem('silentMode', JSON.stringify(silentMode));

            const silentModeButton = document.getElementById('silentMode');
            if (silentMode) {
                silentModeButton.classList.add('active');
            } else {
                silentModeButton.classList.remove('active');
            }
        }

        // Ko uporabnik dolgo pritisne na obvestilo, preklopi v tiho obvestilo
        const notification = document.getElementById('notification');
        let pressTimer;

        notification.addEventListener('mousedown', () => {
            pressTimer = setTimeout(() => {
                toggleSilentMode();  // Preklopi tiho obvestilo
            }, 1000);  // Dolg pritisk (1 sekunda)
        });

        notification.addEventListener('mouseup', () => {
            clearTimeout(pressTimer);  // Prekliči dolg pritisk, če ni trajal 1 sekundo
        });

        // Funkcija za spremljanje položaja ikone za tiho obvestilo
        const silentModeButton = document.getElementById('silentMode');
        silentModeButton.addEventListener('click', toggleSilentMode);

        // Če je tiho obvestilo omogočeno, prikaži ikono na levem robu
        if (silentMode) {
            silentModeButton.classList.add('active');
        } else {
            silentModeButton.classList.remove('active');
        }

        // Onemogoči "Pull-to-refresh" na mobilnih napravah
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) return; // Preprečimo več dotikov
            const touchStart = e.touches[0].clientX;
            let touchMove;
            const notification = document.getElementById('notification');
            let direction = null;

            // Dogodek za gibanje prsta po zaslonu
            window.addEventListener('touchmove', function(e) {
                touchMove = e.touches[0].clientX;
                const diff = touchMove - touchStart;

                // Prepreči osvežitev strani
                if (window.scrollY === 0) {
                    e.preventDefault();
                }

                // Zaznavanje smeri poteze
                if (diff > 0) {
                    direction = 'right'; // Poteza desno
                } else if (diff < 0) {
                    direction = 'left'; // Poteza levo
                }

                // Premik obvestila glede na potezo
                if (Math.abs(diff) > 50) {
                    if (direction === 'right') {
                        notification.style.transform = `translateX(${diff}px)`; // Premik desno
                    } else if (direction === 'left') {
                        notification.style.transform = `translateX(${diff}px)`; // Premik levo (takoj začne levo)
                    }
                }
            });

            // Dogodek za zaključek poteze (spuščanje prsta)
            window.addEventListener('touchend', function() {
                const diff = touchMove - touchStart;

                // Če je premik dovolj velik (več kot 100px), obvestilo izgine
                if (Math.abs(diff) > 100) {
                    if (direction === 'right') {
                        notification.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
                        notification.style.transform = 'translateX(100%)'; // Skrije obvestilo desno
                    } else if (direction === 'left') {
                        notification.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
                        notification.style.transform = 'translateX(-100%)'; // Skrije obvestilo levo
                    }

                    // Po animaciji skrijemo obvestilo
                    setTimeout(() => {
                        notification.style.transition = 'none';
                        notification.style.opacity = 0;
                    }, 300);
                } else {
                    // Če ni bilo dovolj velikega premika, obvestilo vrnemo na svoje mesto
                    notification.style.transition = 'transform 0.3s ease';
                    notification.style.transform = 'translateX(-50%)';
                }
            });
        });
    </script>

</body>
</html>
