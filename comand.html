    body {
    background: black;
    color: cyan;

}

#chatContainer {
    text-align: center;
    position: fixed;
    bottom: 20px;
    width: 100%;
    display: flex;
    justify-content: center;
}

/* Chat okvir */
.chat-box {
    width: 80%;
    max-width: 500px;
    border: 2px solid cyan;
    box-shadow: 0 0 10px cyan;
    border-radius: 10px;
    background: rgba(0, 255, 255, 0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
}

.chat-area {
        width: 80%;
        max-width: 300px;
        min-height: 50px;
        max-height: 300px;
        overflow-y: auto;
        background: rgba(0, 255, 255, 0.1);
        border: 2px solid cyan;
        box-shadow: 0 0 10px cyan;
        border-radius: 10px;
        margin: 10px auto;
        padding: 10px;
        text-align: left;
        display: none; /* Skrito privzeto */
    }
/* Container za input in gumbe */
.chat-controls {
    display: flex;
    width: 100%;
    align-items: center;
    gap: 5px; /* Razmik med elementi */
}

/* Nov container za input in gumb */
.input-container {
    position: relative;
    display: flex;
    width: 100%;
    align-items: center;
}

/* Vhod za sporočila */
.chat-input {
    width: 100%;
    padding: 10px;
    border: 2px solid cyan;
    background: transparent;
    color: cyan;
    font-size: 16px;
    text-align: center;
    outline: none;
    border-radius: 5px;
}

/* Gumb za pošiljanje znotraj inputa */
#sendButton {
    position: absolute;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
    padding: 10px;
    border: none;
    background: rgba(0, 255, 255, 0.2);
    color: cyan;
    font-size: 16px;
    cursor: pointer;
    border-radius: 5px;
    transition: background 0.3s;
}

/* Gumb za pošiljanje hover efekt */
#sendButton:hover {
    background: rgba(0, 255, 255, 0.3);
}

/* Gumbi za kalkulator in koledar */
.popup-button {
    padding: 10px;
    border: 2px solid cyan;
    background: rgba(0, 255, 255, 0.2);
    color: cyan;
    font-size: 16px;
    cursor: pointer;
    border-radius: 5px;
    transition: background 0.3s;
}

.popup-button:hover {
    background: rgba(0, 255, 255, 0.3);
}

/* Gumb za kalkulator (levo) */
#calculatorButton {
    order: -1; /* Postavi ga na levo stran */
}

/* Gumb za koledar (desno) */
#calendarButton {
    order: 1; /* Postavi ga na desno stran */
}

/* Popup za koledar */
.popup {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 300px;
    background: rgba(0, 255, 255, 0.1);
    border: 2px solid cyan;
    box-shadow: 0 0 10px cyan;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
}

/* Koledar */
.calendar {
    font-family: Arial, sans-serif;
    color: cyan;
}

.calendar-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.calendar-button {
    padding: 10px;
    background-color: rgba(0, 255, 255, 0.2);
    border: none;
    color: cyan;
    font-size: 16px;
    cursor: pointer;
    border-radius: 5px;
    transition: background-color 0.3s ease;
}

.calendar-button:hover {
    background-color: rgba(0, 255, 255, 0.3);
}

.calendar-month {
    font-size: 20px;
    font-weight: bold;
}

/* Dnevi v koledarju */
.calendar-days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    padding: 10px 0;
}

.calendar-days span {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 40px;
    width: 40px;
    background-color: rgba(0, 255, 255, 0.1);
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

.calendar-days span:hover {
    background-color: rgba(0, 255, 255, 0.3);
}

.calendar-days span.empty {
    background-color: transparent;
    cursor: default;
}
/* Glava koledarja z oznakami dni */
.calendar-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    font-weight: bold;
    margin-bottom: 5px;
    padding: 5px 0;
    text-transform: uppercase;
}

.calendar-header span {
    text-align: center;
    font-size: 14px;
    padding: 5px;
    color: cyan;
    opacity: 0.8;
}
/* Kalkulator */

}

.calc-display {
    width: 98%;
    height: 50px;

    color: cyan;
    border-radius: 5px;

.calc-buttons {

.calc-btn {

.close-btn {

    padding: 5px 10px;

<script>


 function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();


// Kalkulator funkcije
// Funkcija za odprtje pop-up okna (Kalkulator)
function showPopup(popupId) {
    document.getElementById(popupId).style.display = 'block';
    document.addEventListener('click', outsideClickListener);
}

// Funkcija za zaprtje pop-up okna (Kalkulator)
function closePopup(popupId) {
    document.getElementById(popupId).style.display = 'none';
    document.removeEventListener('click', outsideClickListener);
}

// Funkcija za skrivanje ob kliku izven (le kalkulator se skrije)
function outsideClickListener(event) {
    const calculatorPopup = document.getElementById('calculator-popup');
    if (!calculatorPopup.contains(event.target)) {
        closePopup('calculator-popup');
    }
}

// Kalkulator funkcionalnosti
function appendToDisplay(value) {
    document.getElementById('calcDisplay').value += value;
}

function calculateResult() {
    let display = document.getElementById('calcDisplay');
    try {
        display.value = eval(display.value);
    } catch (e) {
        display.value = 'Napaka';
    }
}

function clearDisplay() {
    document.getElementById('calcDisplay').value = '';
}

// Inicializacija trenutnega meseca
let currentMonth = new Date();

// Seznam mesecev in oznake dni (Ponedeljek prvi)
let months = ["Januar", "Februar", "Marec", "April", "Maj", "Junij", "Julij", "Avgust", "September", "Oktober", "November", "December"];
let weekDays = ["P", "T", "S", "Č", "P", "S", "N"]; // Prve črke dni

// Prikaz glave s prvimi črkami dnevov
function createCalendarHeader() {
    let headerHTML = '';
    weekDays.forEach(day => {
        headerHTML += `<span>${day}</span>`;
    });
    document.getElementById('calendarHeader').innerHTML = headerHTML;
}

// Prikaz koledarja za trenutni mesec
function showCalendar() {
    let monthDays = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0).getDate();
    let firstDay = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1).getDay();

    // Popravimo indeks prvega dne (da ponedeljek začne teden)
    firstDay = (firstDay === 0) ? 6 : firstDay - 1;

    let calendarDays = '';

    // Prazna polja na začetku meseca
    for (let i = 0; i < firstDay; i++) {
        calendarDays += '<span class="empty"></span>';
    }

    // Dnevi v mesecu
    for (let day = 1; day <= monthDays; day++) {
        calendarDays += `<span>${day}</span>`;
    }

    // Posodobi vsebino koledarja
    document.getElementById('calendarDays').innerHTML = calendarDays;

    // Posodobi naslov meseca
    document.getElementById('currentMonth').textContent = `${months[currentMonth.getMonth()]} ${currentMonth.getFullYear()}`;
}

// Sprememba meseca (prejšnji/naslednji)
function changeMonth(increment) {
    currentMonth.setMonth(currentMonth.getMonth() + increment);
    showCalendar();
}

// Prikaz koledarja ob nalaganju strani
createCalendarHeader();
showCalendar();

// Funkcija za prikaz popup okna
function showPopup(id) {
    document.getElementById(id).style.display = 'block';
    if (id === 'calendar-popup') {
        showCalendar();
    }
}

// Funkcija za skritje koledarja, ko klikneš izven njega
document.addEventListener('click', function(event) {
    const calendarPopup = document.getElementById('calendar-popup');
    if (!calendarPopup.contains(event.target) && !event.target.matches('#calendarButton')) {
        calendarPopup.style.display = 'none';
    }
});

// Gumb za zapiranje popup okna
document.querySelectorAll('.popup').forEach(function(popup) {
    popup.addEventListener('click', function(e) {
        if (e.target === popup) {
            popup.style.display = 'none';
        }
    });
});

// Funkcija za prikazovanje in dodajanje sporočil
document.getElementById('sendButton').addEventListener('click', function() {
    const chatArea = document.getElementById('chatArea');
    const chatInput = document.getElementById('chatInput').value;

    if (chatInput.trim()) {
        chatArea.innerHTML += `<div class="message">${chatInput}</div>`; // Dodaj sporočilo
        document.getElementById('chatInput').value = ''; // Pošlji input
    }
});

let botName = localStorage.getItem("botName") || "Chatbot"; // Privzeto ime chatbota
let history = {}; // Zgodovina odgovorov za vsako vprašanje

// Funkcija za izvajanje matematičnih operacij
function calculateExpression(expression) {
    const validExpression = /^[\d+\-*/().=\s]*$/;

    if (validExpression.test(expression)) {
        try {
            const cleanedExpression = expression.replace("=", "").trim();
            return Function('return ' + cleanedExpression)();
        } catch (e) {
            return "Oprosti, ne morem izračunati tega.";
        }
    } else {
        return "Oprosti, ta izraz vsebuje nedovoljene znake.";
    }
}

// Funkcija za oceno podobnosti dveh nizov
function similarity(s1, s2) {
    s1 = s1.toLowerCase();
    s2 = s2.toLowerCase();
    let longer = s1.length > s2.length ? s1 : s2;
    let shorter = s1.length > s2.length ? s2 : s1;
    let longerLength = longer.length;
    if (longerLength === 0) return 1.0;
    return (longerLength - editDistance(longer, shorter)) / longerLength;
}

// Funkcija za izračun razdalje (Levenshtein Distance)
function editDistance(s1, s2) {
    let costs = new Array();
    for (let i = 0; i <= s1.length; i++) {
        let lastValue = i;
        for (let j = 0; j <= s2.length; j++) {
            if (i === 0)
                costs[j] = j;
            else if (j > 0) {
                let newValue = costs[j - 1];
                if (s1.charAt(i - 1) !== s2.charAt(j - 1))
                    newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                costs[j - 1] = lastValue;
                lastValue = newValue;
            }
        }
        if (i > 0) costs[s2.length] = lastValue;
    }
    return costs[s2.length];
}

// Funkcija za dešifriranje s ključno besedo
function decryptWithKey(text, key) {
    const numberResult = numbersToText(text);
    const rot13Result = rot13(numberResult);
    return vigenereDecrypt(rot13Result, key);
}

// Funkcija za iskanje najbližjega odgovora
function getResponse(userInput) {
    const threshold = 0.5;
    let bestMatch = null;
    let highestSimilarity = 0;

    // Preveri, ali je izraz matematičen in vsebuje "="
    if (userInput.includes("=")) {
        return calculateExpression(userInput);
    }

    // Preveri, ali uporabnik spremenil ime chatbota
    if (userInput.toLowerCase().startsWith("ime ti je")) {
        let name = userInput.slice(8).trim(); // Odstranimo "ime ti je" in pridobimo ime
        setBotName(name);
        return `Hvala! Moje ime je zdaj ${botName}.`;
    }

    // Poišči najboljši odgovor
    for (let key in botResponses) {
        const similarityScore = similarity(userInput, key);
        if (similarityScore > highestSimilarity && similarityScore >= threshold) {
            highestSimilarity = similarityScore;
            bestMatch = key;
        }
    }

    if (bestMatch) {
        if (!history[bestMatch]) {
            history[bestMatch] = [];
        }

        let randomIndex;
        let response;
        do {
            randomIndex = Math.floor(Math.random() * botResponses[bestMatch].length);
            response = botResponses[bestMatch][randomIndex];
        } while (history[bestMatch].includes(response));

        history[bestMatch].push(response);
        if (history[bestMatch].length > botResponses[bestMatch].length) {
            history[bestMatch].shift();
        }
        return response;
    } else {
        return `Oprosti, nisem prepričan, kaj si vprašal. Poskusi drugače!`;
    }
}

// Funkcija za obravnavo pošiljanja sporočil
function handleMessage() {
    const userInput = document.getElementById("chatInput").value.trim();
    const chatArea = document.getElementById("chatArea");

    if (userInput) {
        let botReply;
        
        // Preveri, ali uporabnik želi dešifrirati (vnos oblike ":kljuc:sifra")
        if (userInput.startsWith(":")) {
            const parts = userInput.split(":");
            if (parts.length === 3) {
                const key = parts[1].trim();
                const encryptedText = parts[2].trim();
                botReply = decryptWithKey(encryptedText, key);
            } else {
                botReply = "Neveljaven format za dešifriranje. Uporabite ':kljuc:sifra'.";
            }
        } else {
            botReply = getResponse(userInput);
        }

        chatArea.innerHTML += `<div><strong>Ti:</strong> ${userInput}</div>`;
        chatArea.innerHTML += `<div><strong>${botName}:</strong> ${botReply}</div>`;

        document.getElementById("chatInput").value = "";
        chatArea.scrollTop = chatArea.scrollHeight;
    }
}

// Funkcija za nastavitev imena chatbota
function setBotName(inputName) {
    if (inputName && inputName.trim()) {
        botName = inputName.trim();
        localStorage.setItem("botName", botName); // Shrani ime v localStorage
    } else {
        alert("Prosimo, vnesite veljavno ime.");
    }
}

document.getElementById("chatInput").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        handleMessage();
    }
