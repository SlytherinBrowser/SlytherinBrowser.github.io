<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zate, ljubezen moja</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(to bottom, #ffdde1, #ee9ca7);
            color: #fff;
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            text-align: center;
        }

        h1 {
            font-size: 3.5rem;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
            color: #fff5f5;
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 3s infinite;
        }

        h2 {
            font-size: 2.5rem;
            color: #ffebf0;
            margin: 0;
            animation: fadeIn 4s forwards;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .thoughts {
            font-size: 1.8rem;
            max-width: 70%;
            margin: 20px auto;
            padding: 20px;
            color: #ffeff3;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            animation: fadeIn 4s forwards;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .heart {
            position: absolute;
            top: -10vh;
            color: #ff6b81;
            font-size: 1.8rem;
            animation: fall 5s linear infinite, wiggle 2s ease-in-out infinite;
            opacity: 0.9;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(10deg); }
        }

        .footer {
            position: absolute;
            bottom: 10px;
            font-size: 1rem;
            color: #fff;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <h1>Zate, moja ljubezen</h1>
    <h2>Nika ❤️</h2>
    <div class="thoughts" id="romanticThoughts"></div>
    <div id="timeTogether" class="thoughts"></div>
    <div class="footer">Ljubim te bolj kot vse na svetu. ❤️</div>

    <script>
        // Romantične misli
        const thoughts = [
            "Ti si moje sonce, ki mi osvetljuje dan.",
            "Vsak trenutek s teboj je kot sanje, ki jih ne želim končati.",
            "Tvoje srce je moje zatočišče, kjer najdem mir.",
            "Ljubezen do tebe je neskončna, kot morje in nebo.",
            "Hvala, ker si del mojega življenja in mojega srca.",
            "Tvoja ljubezen me greje tudi v najhladnejših dneh.",
            "V tvojih očeh vidim prihodnost, ki si jo želim.",
            "Brez tebe je moje življenje kot nebo brez zvezd.",
            "Tvoj nasmeh je razlog, zakaj se vsako jutro zbudim srečen.",
            "Zate bi prehodil tisoč milj in premagal vse ovire.",
            "Moje srce bije v ritmu tvoje ljubezni.",
            "S tabo so moji najlepši spomini šele začetek.",
            "Ko te pogledam, vem, da sem našel svoje pravo mesto.",
            "Vsak dotik tvoje roke mi pove več kot tisoč besed.",
            "Ti si moj navdih in moja večna sreča.",
            "Vsaka sekunda brez tebe je kot večnost.",
            "V tvojih objemih najdem svoj dom.",
            "Hvala, ker si me naučila, kaj pomeni prava ljubezen.",
            "S teboj je vse lepše, celo najtemnejši trenutki.",
            "Moje srce pripada tebi in vedno bo."  
        ];

        // Dinamično izpisovanje misli
        const thoughtsContainer = document.getElementById('romanticThoughts');
        let index = 0;

        function displayThoughts() {
            thoughtsContainer.textContent = thoughts[index];
            index = (index + 1) % thoughts.length;
        }
        displayThoughts();
        setInterval(displayThoughts, 4000);

        // Štetje časa, odkar sta skupaj
        const startDate = new Date("2024-12-04T16:43:23"); // Nastavi datum in čas vajine zveze
        const timeTogetherContainer = document.getElementById('timeTogether');

        function calculateTimeTogether() {
            const now = new Date();
            const diff = now - startDate;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            timeTogetherContainer.textContent = `Skupaj sva že ${days} dni, ${hours} ur, ${minutes} minut in ${seconds} sekund.`;
        }
        setInterval(calculateTimeTogether, 1000);

        // Padajoči srčki
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }
        setInterval(createHeart, 300);
    </script>
</body>
</html>
