<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stego-krivka: akrostih + napredna pot</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; line-height: 1.35; margin: 24px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  fieldset { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin-bottom: 16px; }
  legend { padding: 0 6px; }
  label { display: block; margin: 8px 0 4px; font-weight: 600; }
  input[type="text"], input[type="number"], textarea, select {
    width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #bbb; border-radius: 6px; font-size: 14px;
  }
  textarea { min-height: 80px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    padding: 10px 14px; border: 1px solid #666; background: #111; color: #fff; border-radius: 8px; cursor: pointer;
  }
  button.secondary { background: #fff; color: #111; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .muted { color: #555; }
  .badge { display: inline-block; padding: 2px 6px; border: 1px solid #999; border-radius: 6px; font-size: 12px; margin-left: 8px;}
  .out { white-space: pre-wrap; background: #f7f7f7; padding: 12px; border-radius: 8px; border: 1px solid #e1e1e1; }
  .tip { font-size: 13px; color: #444; }
</style>
</head>
<body>
  <h1>Steganografska krinka (SL) — akrostih & napredna pot</h1>

  <fieldset>
    <legend>Vhod</legend>
    <label for="plaintext">Sporočilo za skritje (plaintext)</label>
    <textarea id="plaintext" placeholder="npr. rad imam čokolado"></textarea>

    <div class="row">
      <div>
        <label for="key">Ključ (poljubno besedilo)</label>
        <input id="key" type="text" placeholder="npr. marela" />
      </div>
      <div>
        <label for="mode">Način</label>
        <select id="mode">
          <option value="simple">Preprosta (prve črke)</option>
          <option value="advanced">Napredna (položaji + dummy)</option>
        </select>
      </div>
    </div>

    <div id="advancedOptions" style="display:none; margin-top:8px;">
      <div class="row">
        <div>
          <label for="posPattern">Vzorec položajev (vejicami): <span class="muted">(npr. 1,2,1,3)</span></label>
          <input id="posPattern" type="text" value="1,2,1,3" />
        </div>
        <div>
          <label for="dummyEvery">Dummy vsaka N-ta beseda <span class="muted">(0 = brez)</span></label>
          <input id="dummyEvery" type="number" min="0" value="5" />
        </div>
      </div>
    </div>

    <div class="btns" style="margin-top:10px;">
      <button id="btnEncode">Šifriraj → Ustvari krinko</button>
      <button id="btnDecode" class="secondary">Dešifriraj iz krinke</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>Izhod</legend>
    <label for="ciphertext">Krinka (berljiv slovenski tekst)</label>
    <textarea id="ciphertext" class="mono" placeholder="Tukaj se pojavi generirano besedilo ali sem prilepiš besedilo za dešifriranje."></textarea>

    <label for="recovered">Obnovljeno sporočilo (dešifrirano)</label>
    <div id="recovered" class="out mono"></div>
    <div class="tip">Opomba: to je <b>steganografija</b>, ne močna kriptografija. Za resno varnost uporabi še AEAD (npr. ChaCha20-Poly1305) nad plaintextom pred vgradnjo.</div>
  </fieldset>

<script>
// ======= Utility: normalizacija slovenskih črk =======
const norm = (s) => s
  .toLowerCase()
  .replace(/\s+/g, ' ')
  .trim();

// Podprte črke (slovenska abeceda + šumniki); presledek obravnavamo posebej.
const ABC = 'a b c č d e f g h i j k l m n o p r s š t u v z ž'.split(' ');

// ======= PRNG (xorshift32) + hash za seed =======
function fnv1a(str) {
  let h = 0x811c9dc5 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h >>> 0;
}
function XorShift32(seed) {
  let x = seed >>> 0 || 2463534242;
  return () => {
    x ^= x << 13; x >>>= 0;
    x ^= x >>> 17; x >>>= 0;
    x ^= x << 5; x >>>= 0;
    return x >>> 0;
  };
}
function prngChoice(rng, arr) {
  if (!arr || arr.length === 0) return null;
  const n = arr.length;
  const idx = Math.floor((rng() / 0x100000000) * n);
  return arr[idx];
}

// ======= Mini leksikon (SL) =======
// Za realno rabo razširi sezname. Tu je lahka demonstracija (dovolj različnih dolžin).
const LEX = {
  a: ["ali","ampak","absolutno","aktualno","ambiciozno","anonimno","avtentično","akribično"],
  b: ["brez","baje","bolj","bogato","brž","briljantno","berljivo","bistro"],
  c: ["celo","citat","cvet","celovit","celovito","cvetoče"],
  "č": ["če","čeprav","čisto","čarno","čudno","čezmerno","čistoča"],
  d: ["danes","dovolj","drugače","drzno","dovršeno","dobesedno","dosledno"],
  e: ["enkrat","ena","enostavno","enigmatično","elegantno"],
  f: ["fino","fantastično","formalno","fer","frekventno"],
  g: ["glej","glede","globoko","glasno","gosto","ganljivo","gibko"],
  h: ["hitra","hvaležno","hrabro","humorno","harmonično"],
  i: ["imam","in","isto","iskreno","izvrstno","izdatno","iskro"],
  j: ["jaz","ja","jutri","je","jedrnato","jasno","jadrno","javno"],
  k: ["kaj","kadar","kako","kjer","kmalu","kratko","kul","krepko"],
  l: ["lahko","le","lepo","logično","likovno","lagodno","ljubko"],
  m: ["malo","morda","močno","mirno","majhno","mehko","mislim","mnenje","moj"],
  n: ["nikoli","nežno","natančno","naravno","načeloma","navadno"],
  o: ["občasno","odlično","očito","očitno","oceloteno","ogromno","okorno"],
  p: ["pa","prav","precej","pogosto","pošteno","pozorno","prijetno","poleti"],
  r: ["res","resnično","rad","ravno","raje","redno","razločno"],
  s: ["seveda","skoraj","senca","srčno","sproti","sijajno","spet"],
  "š": ["še","široko","šibko","šumno","šahovsko","šaljivo"],
  t: ["takrat","tako","tudi","trenutno","trdno","temeljito"],
  u: ["upam","učinkovito","urejeno","upravičeno","umirjeno"],
  v: ["vedno","včasih","verjetno","vredno","vsekakor","vendarle"],
  z: ["zelo","zato","znova","zvesto","zanesljivo","zapuščeno"],
  "ž": ["žal","živo","žareče","željno","žgoče"],

  // Nekaj krajših samostalnikov/glagolov za naravnejše stavke
  _dummy: ["pa","in","ter","a","vendar","torej","kaj","kjer","ko","ker","mimogrede","res","skoraj","nekako","potem","najbrž"],
};

// Indeks za napredno izbiro po dolžini in črki na položaju
const INDEX = (() => {
  const idx = {}; // idx[len][targetChar] = [word...], kjer word ima targetChar na poziciji pos (1-indexed)
  function addWord(w) {
    const L = w.length;
    if (!idx[L]) idx[L] = {};
    for (let p = 0; p < L; p++) {
      const ch = w[p];
      if (!idx[L][ch]) idx[L][ch] = [];
      idx[L][ch].push(w);
    }
  }
  for (const k of Object.keys(LEX)) {
    if (k === "_dummy") continue;
    for (const w of LEX[k]) addWord(w);
  }
  // Dodaj še nekaj splošnih besed za več razponov
  const EXTRA = ["beseda","stavki","primer","zgled","vaja","nit","misel","slovar","poved","oblika","moč","delo","oreh","barva","nota","tiho","glas","smeh","mesto","sreda","zapis","odnos","zbor","črka","čebelar","širok","žarek"];
  EXTRA.forEach(addWord);
  return idx;
})();

// Pomožne: je črka iz ABC?
const isLetter = (ch) => ABC.includes(ch);

// ================== ENCODE: Preprosta varianta (prve črke) ==================
function encodeSimple(plaintext, key) {
  const rng = XorShift32(fnv1a(key || ""));
  const p = norm(plaintext)
    .replace(/[^a-zA-Zčšž ČŠŽ]/g, '') // ohrani šumnike in presledke
    .replace(/ +/g, ' ');
  const out = [];
  for (const ch of p) {
    if (ch === ' ') {
      // občasno vstavi veznik/vejico
      if ((rng() % 3) === 0) out.push(prngChoice(rng, LEX._dummy));
      continue;
    }
    if (!isLetter(ch)) continue;
    const list = LEX[ch] || [];
    const w = prngChoice(rng, list) || ch; // fallback: črka sama
    out.push(w);
  }
  // Dodaj nekaj ločil za naravnost
  const sentences = [];
  let acc = [];
  for (let i = 0; i < out.length; i++) {
    acc.push(out[i]);
    if (acc.length > 8 && (i % 7 === 0)) {
      sentences.push(acc.join(' ') + '.');
      acc = [];
    }
  }
  if (acc.length) sentences.push(acc.join(' ') + '.');
  // Prva črka prve besede veliko
  return sentences.join(' ').replace(/^([a-zčšž])/u, m => m.toUpperCase());
}

// ================== DECODE: Preprosta varianta (prve črke) ==================
function decodeSimple(ciphertext) {
  const words = (ciphertext || '').toLowerCase()
    .replace(/[^a-zA-Zčšž ČŠŽ\-]/g, ' ')
    .split(/\s+/)
    .filter(Boolean);
  const letters = words.map(w => w[0]).filter(c => isLetter(c)).join('');
  return letters;
}

// ================== ENCODE: Napredna pot (položaji + dummy) ==================
function parsePattern(s) {
  return s.split(',').map(x => parseInt(x.trim(), 10)).filter(n => Number.isFinite(n) && n > 0);
}

function pickWordWithLetterAt(targetChar, pos, rng) {
  // poiščemo besedo dolžine >= pos, kjer je na (pos) tarčna črka
  for (let L = Math.max(pos, 2); L <= Math.max(pos+6, 12); L++) {
    const bucket = (INDEX[L] && INDEX[L][targetChar]) || null;
    if (bucket && bucket.length) {
      return prngChoice(rng, bucket);
    }
  }
  // če ne najdemo, poskusimo drugačen L ali vrnemo zasilno besedo, ki vsebuje črko
  const fallback = [];
  for (const len in INDEX) {
    const bucket = INDEX[len][targetChar];
    if (bucket) fallback.push(...bucket);
  }
  if (fallback.length) return prngChoice(rng, fallback);
  // skrajni fallback: vrni samo tarčno črko (ne idealno, a naj ne pade)
  return targetChar;
}

function encodeAdvanced(plaintext, key, opts) {
  const rng = XorShift32(fnv1a(key || ""));
  const pattern = parsePattern(opts.posPattern || "1,2,1,3");
  const dummyEvery = Math.max(0, parseInt(opts.dummyEvery || 0, 10) || 0);

  // Normaliziraj: obdržimo samo črke + presledke
  const p = norm(plaintext)
    .replace(/[^a-zA-Zčšž ČŠŽ]/g, '')
    .replace(/ +/g, ' ');

  // Sporočilo → zaporedje simbolov (črk); presledek shranimo kot posebni simbol ' ' in ga kodiramo z besedo iz _dummy
  const symbols = [];
  for (const ch of p) {
    if (ch === ' ') { symbols.push(' '); continue; }
    if (isLetter(ch)) symbols.push(ch);
  }

  const out = [];
  let ptr = 0; // indeks v symbols
  let step = 0;

  while (ptr < symbols.length) {
    const pos = pattern[step % pattern.length]; // npr. 1,2,1,3 ...
    const isDummySlot = (dummyEvery > 0) && ((out.length + 1) % dummyEvery === 0);

    if (isDummySlot) {
      // vstavi dummy besedo
      out.push(prngChoice(rng, LEX._dummy));
    } else {
      const sym = symbols[ptr++];
      if (sym === ' ') {
        // presledek: vstavi naravni veznik ali piko/vejico
        if ((rng() % 4) === 0) out.push(prngChoice(rng, LEX._dummy));
        else out.push(prngChoice(rng, ["in","pa","ter","ampak","vendar"]));
      } else {
        const word = pickWordWithLetterAt(sym, pos, rng);
        out.push(word);
      }
    }
    step++;
    // Občasna ločila
    if (out.length > 8 && (rng() % 13) === 0) out.push((rng() % 2) ? "," : ".");
  }

  // Pospravi ločila in pika na koncu
  let text = out.join(' ').replace(/\s+([,.!?])/g, '$1').trim();
  if (!/[.!?]$/.test(text)) text += '.';
  return text.replace(/^([a-zčšž])/u, m => m.toUpperCase());
}

// ================== DECODE: Napredna pot ==================
function decodeAdvanced(ciphertext, key, opts) {
  const rng = XorShift32(fnv1a(key || ""));
  const pattern = parsePattern(opts.posPattern || "1,2,1,3");
  const dummyEvery = Math.max(0, parseInt(opts.dummyEvery || 0, 10) || 0);

  const tokens = (ciphertext || '')
    .toLowerCase()
    .replace(/[^a-zA-Zčšž ČŠŽ,.\-!?]/g, ' ')
    .split(/\s+/)
    .filter(Boolean)
    .map(w => w.replace(/[,.!?]+$/,''));

  const symbols = [];
  let step = 0;
  for (let i = 0; i < tokens.length; i++) {
    const isDummySlot = (dummyEvery > 0) && ((i + 1) % dummyEvery === 0);
    if (isDummySlot) { step++; continue; }
    const pos = pattern[step % pattern.length];
    const w = tokens[i];
    // preskoči tipične veznike/“dummy” besede (heuristika)
    if (LEX._dummy.includes(w)) { step++; continue; }
    if (w.length >= pos) {
      const ch = w[pos - 1];
      // če ni slovenska črka, preskoči
      if (isLetter(ch)) symbols.push(ch);
      else {
        // nič — mehki fallback
      }
    }
    step++;
  }
  // Združi; poskusi normalizirati zaporedja dummy veznikov v presledke (heuristika)
  return symbols.join('');
}

// ================== Povezava na UI ==================
const plaintextEl = document.getElementById('plaintext');
const keyEl = document.getElementById('key');
const modeEl = document.getElementById('mode');
const posPatternEl = document.getElementById('posPattern');
const dummyEveryEl = document.getElementById('dummyEvery');
const advBox = document.getElementById('advancedOptions');

modeEl.addEventListener('change', () => {
  advBox.style.display = modeEl.value === 'advanced' ? 'block' : 'none';
});

document.getElementById('btnEncode').addEventListener('click', () => {
  const msg = plaintextEl.value || '';
  const key = keyEl.value || '';
  let out = '';
  if (modeEl.value === 'simple') {
    out = encodeSimple(msg, key);
  } else {
    out = encodeAdvanced(msg, key, { posPattern: posPatternEl.value, dummyEvery: dummyEveryEl.value });
  }
  document.getElementById('ciphertext').value = out;
  document.getElementById('recovered').textContent = '';
});

document.getElementById('btnDecode').addEventListener('click', () => {
  const c = document.getElementById('ciphertext').value || '';
  const key = keyEl.value || '';
  let rec = '';
  if (modeEl.value === 'simple') {
    rec = decodeSimple(c);
  } else {
    rec = decodeAdvanced(c, key, { posPattern: posPatternEl.value, dummyEvery: dummyEveryEl.value });
  }
  document.getElementById('recovered').textContent = rec || '—';
});
</script>
</body>
</html>
