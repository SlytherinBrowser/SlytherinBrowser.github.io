<!DOCTYPE html>
<html>
<head>
  <title>Ustvari Avatar</title>
  <style>
    iframe {
      width: 100%;
      height: 600px;
      border: none;
    }
    #avatarDisplay {
      margin-top: 20px;
    }
    .avatar-full, .avatar-head {
      display: inline-block;
      margin: 10px;
    }
    .avatar-full img {
      width: 200px;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    .avatar-head img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
  </style>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>

<h2>Ustvari svoj avatar</h2>
<iframe id="rpm-frame" src="https://readyplayer.me/avatar?frameApi" allow="camera *; microphone *;"></iframe>

<div id="avatarDisplay">
  <h3>Prikaz avatarja:</h3>
  <div class="avatar-full" id="avatarFullBody"></div>
  <div class="avatar-head" id="avatarHeadOnly"></div>
</div>

<div style="margin-top: 30px;">
  <h3>Ročni vnos avatar URL-ja</h3>
  <input type="text" id="manualAvatarUrl" placeholder="Vnesi avatar .glb link" style="width: 60%;">
  <button onclick="saveManualUrl()">Shrani URL</button>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
    authDomain: "chater-cf682.firebaseapp.com",
    databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
    projectId: "chater-cf682",
    storageBucket: "chater-cf682.appspot.com",
    messagingSenderId: "233632075480",
    appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
  };

  firebase.initializeApp(firebaseConfig);

  let currentUser;

  firebase.auth().signInAnonymously().then(() => {
    currentUser = firebase.auth().currentUser;
    console.log("✅ Prijavljen:", currentUser.uid);

    // Naloži avatar, če že obstaja
    firebase.database().ref("users/" + currentUser.uid + "/avatar").once("value", snapshot => {
      const url = snapshot.val();
      if (url) displayAvatar(url);
    });
  });

  const frame = document.getElementById("rpm-frame");

  frame.addEventListener("load", () => {
    frame.contentWindow.postMessage(
      JSON.stringify({
        target: "readyplayerme",
        type: "subscribe",
        eventName: "v1.avatar.exported"
      }),
      "*"
    );
  });

  window.addEventListener("message", async (event) => {
    let json;
    try {
      json = JSON.parse(event.data);
    } catch (e) {
      return;
    }

    if (json.source !== "readyplayerme") return;

    console.log("🎯 Prejet dogodek:", json);

    if (json.eventName === "v1.avatar.exported") {
      const avatarUrl = json.data.url;
      console.log("✅ Avatar URL:", avatarUrl);

      await saveAvatarUrl(avatarUrl);
      displayAvatar(avatarUrl);
    }
  });

  async function saveAvatarUrl(avatarUrl) {
    if (!currentUser) return;
    await firebase.database().ref("users/" + currentUser.uid).update({ avatar: avatarUrl });
    console.log("✅ Avatar shranjen v Firebase.");
  }

  async function saveManualUrl() {
    const input = document.getElementById("manualAvatarUrl");
    const url = input.value.trim();
    if (!url) return alert("Vnesi veljaven URL.");
    await saveAvatarUrl(url);
    displayAvatar(url);
  }

  function displayAvatar(avatarUrl) {
    // Render celotno telo
    const fullRender = `https://render.readyplayer.me/render?url=${encodeURIComponent(avatarUrl)}&scene=full-body-portrait-v1-transparent`;

    // Render glava do prsi
    const headRender = `https://render.readyplayer.me/render?url=${encodeURIComponent(avatarUrl)}&scene=half-body-portrait-v1`;

    document.getElementById("avatarFullBody").innerHTML = `<img src="${fullRender}" alt="Avatar - celo telo">`;
    document.getElementById("avatarHeadOnly").innerHTML = `<img src="${headRender}" alt="Avatar - glava">`;
  }
</script>

</body>
</html>
