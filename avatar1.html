<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Avatar Creator</title>
  <style>
    iframe {
      width: 100%;
      height: 600px;
      border: none;
    }
    #avatarDisplay {
      margin-top: 20px;
    }
    .avatar-preview {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }
    .avatar-rectangle, .avatar-circle {
      border: 2px solid #333;
    }
    .avatar-rectangle {
      width: 200px;
      height: 400px;
    }
    .avatar-circle {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      overflow: hidden;
    }
    .avatar-rectangle img,
    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

<h2>Ustvari svoj avatar</h2>
<iframe id="rpm-frame" src="https://readyplayer.me/avatar?frameApi" allow="camera *; microphone *;"></iframe>

<!-- Manual avatar URL input -->
<div style="margin-top: 20px;">
  <input type="text" id="avatarUrlInput" placeholder="Vnesi avatar URL" style="width: 60%;">
  <button onclick="useManualAvatar()">Uporabi avatar</button>
</div>

<div id="avatarDisplay"></div>

<script>
  const frame = document.getElementById("rpm-frame");

  // Pošlji zahtevo za "export" dogodek
  frame.addEventListener("load", () => {
    frame.contentWindow.postMessage(
      JSON.stringify({
        target: "readyplayerme",
        type: "subscribe",
        eventName: "v1.avatar.exported"
      }),
      "*"
    );
  });

  // Sprejmi sporočilo z avatarjem
  window.addEventListener("message", (event) => {
    let json;
    try {
      json = JSON.parse(event.data);
    } catch (e) {
      return;
    }

    if (json.source !== "readyplayerme") return;

    if (json.eventName === "v1.avatar.exported") {
      const avatarUrl = json.data.url;
      console.log("✅ Avatar URL:", avatarUrl);
      showAvatarPreviews(avatarUrl);
    }
  });

  function useManualAvatar() {
    const url = document.getElementById("avatarUrlInput").value.trim();
    if (url) showAvatarPreviews(url);
  }

  function showAvatarPreviews(avatarUrl) {
    const fullBody = `https://render.readyplayer.me/render?url=${encodeURIComponent(avatarUrl)}&scene=full-body-portrait-v1-transparent`;
    const halfBody = `https://render.readyplayer.me/render?url=${encodeURIComponent(avatarUrl)}&scene=half-body-portrait-v1`;

    document.getElementById("avatarDisplay").innerHTML = `
      <h3>Tvoj avatar:</h3>
      <div class="avatar-preview">
        <div class="avatar-rectangle"><img src="${fullBody}" alt="Full body"></div>
        <div class="avatar-circle"><img src="${halfBody}" alt="Headshot"></div>
      </div>
    `;
  }
</script>

</body>
</html>
