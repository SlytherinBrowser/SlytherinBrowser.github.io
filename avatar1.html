<!DOCTYPE html>
<html>
<head>
  <title>Ustvari Avatar</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    iframe {
      width: 100%;
      height: 600px;
      border: none;
    }

    #avatarDisplay {
      margin-top: 20px;
    }

    .viewer-wrapper {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
      flex-wrap: wrap;
      gap: 20px;
    }

    model-viewer {
      width: 300px;
      height: 400px;
    }

    .round {
      border-radius: 50%;
      overflow: hidden;
      width: 200px;
      height: 200px;
      position: relative;
      background: #eee;
    }

    .round model-viewer {
      width: 100%;
      height: 100%;
      object-fit: cover;
      --model-viewer-touch-action: none;
      camera-controls: true;
    }

    input, button {
      margin-top: 10px;
      padding: 8px;
      font-size: 16px;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>

<h2>Ustvari svoj avatar</h2>
<iframe id="rpm-frame" src="https://readyplayer.me/avatar?frameApi" allow="camera *; microphone *;"></iframe>

<div id="avatarDisplay"></div>

<input type="text" id="linkInput" placeholder="Vnesi avatar URL ročno">
<button onclick="shraniAvatar()">Shrani ročno</button>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
    authDomain: "chater-cf682.firebaseapp.com",
    databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
    projectId: "chater-cf682",
    storageBucket: "chater-cf682.appspot.com",
    messagingSenderId: "233632075480",
    appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
  };

  firebase.initializeApp(firebaseConfig);

  firebase.auth().signInAnonymously().then(() => {
    console.log("✅ Prijavljen si.");
  });

  const frame = document.getElementById("rpm-frame");

  frame.addEventListener("load", () => {
    frame.contentWindow.postMessage(
      JSON.stringify({
        target: "readyplayerme",
        type: "subscribe",
        eventName: "v1.avatar.exported"
      }),
      "*"
    );
  });

  window.addEventListener("message", async (event) => {
    try {
      const json = JSON.parse(event.data);
      if (json.source !== "readyplayerme") return;

      if (json.eventName === "v1.avatar.exported") {
        const avatarUrl = json.data.url;
        console.log("✅ Avatar URL: ", avatarUrl);

        const user = firebase.auth().currentUser;
        if (user) {
          const userId = user.uid;
          await firebase.database().ref("users/" + userId).update({
            avatar: avatarUrl
          });
          prikaziAvatar(avatarUrl);
        }
      }
    } catch (err) {
      console.warn("Neveljavno sporočilo ali format.", err);
    }
  });

  async function shraniAvatar() {
    const avatarUrl = document.getElementById("linkInput").value;
    const user = firebase.auth().currentUser;
    if (user && avatarUrl) {
      const userId = user.uid;
      await firebase.database().ref("users/" + userId).update({
        avatar: avatarUrl
      });
      prikaziAvatar(avatarUrl);
    }
  }

  function prikaziAvatar(url) {
    document.getElementById("avatarDisplay").innerHTML = `
      <h3>Tvoj avatar:</h3>
      <div class="viewer-wrapper">
        <model-viewer src="${url}" camera-controls auto-rotate
          disable-zoom disable-pan disable-tap
          min-camera-orbit="auto 90deg auto"
          max-camera-orbit="auto 90deg auto">
        </model-viewer>

       <div class="round">
  <model-viewer
    src="${url}"
    camera-controls
    auto-rotate
    disable-zoom
    disable-pan
    disable-tap
    min-camera-orbit="0deg 90deg 0.8m"
    max-camera-orbit="360deg 90deg 0.8m"
    camera-target="0m 1.65m 0m"
    field-of-view="20deg"
    ar
    style="width: 100%; height: 100%;">
  </model-viewer>
</div>
    `;
  }
</script>

</body>
</html>
