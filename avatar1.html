<!DOCTYPE html>
<html>
<head>
  <title>Ustvari Avatar</title>
  <style>
    iframe {
      width: 100%;
      height: 600px;
      border: none;
    }
    #avatarDisplay {
      margin-top: 20px;
    }
    .avatar-wrapper {
      display: flex;
      gap: 40px;
      margin-top: 20px;
      align-items: center;
    }
    .avatar-rect {
      width: 200px;
      height: 400px;
      background-color: #f0f0f0;
      overflow: hidden;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar-round {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      overflow: hidden;
      background-color: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar-rect img, .avatar-round img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>

<h2>Ustvari svoj avatar</h2>
<iframe id="rpm-frame" src="https://readyplayer.me/avatar?sk_live_339mFDSGcXj7CTL3xozk6ywjjERKN06cogHu" allow="camera *; microphone *;"></iframe>

<div id="avatarDisplay"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
    authDomain: "chater-cf682.firebaseapp.com",
    databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
    projectId: "chater-cf682",
    storageBucket: "chater-cf682.appspot.com",
    messagingSenderId: "233632075480",
    appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
  };

  firebase.initializeApp(firebaseConfig);

  firebase.auth().signInAnonymously().then(() => {
    console.log("Prijavljen si.");
  });

  const frame = document.getElementById("rpm-frame");

  frame.addEventListener("load", () => {
    frame.contentWindow.postMessage(
      JSON.stringify({
        target: "readyplayerme",
        type: "subscribe",
        eventName: "v1.avatar.exported"
      }),
      "*"
    );
  });

  window.addEventListener("message", async (event) => {
    const json = JSON.parse(event.data);

    if (json.source !== "readyplayerme") return;

    if (json.eventName === "v1.avatar.exported") {
      const avatarUrl = json.data.url;
      console.log("✅ Avatar URL:", avatarUrl);

      const user = firebase.auth().currentUser;
      if (user) {
        const userId = user.uid;
        await firebase.database().ref("users/" + userId).update({
          avatar: avatarUrl
        });

        // 🔁 Prikaz avatarjev
        const fullBody = `https://render.readyplayer.me/render?url=${encodeURIComponent(avatarUrl)}&scene=full-body-portrait-v1-transparent`;
        const halfBody = `https://render.readyplayer.me/render?url=${encodeURIComponent(avatarUrl)}&scene=half-body-portrait-v1`;

        document.getElementById("avatarDisplay").innerHTML = `
          <h3>Tvoj avatar:</h3>
          <div class="avatar-wrapper">
            <div class="avatar-rect">
              <img src="${fullBody}" alt="Celo telo">
            </div>
            <div class="avatar-round">
              <img src="${halfBody}" alt="Glava in prsi">
            </div>
          </div>
        `;
      }
    }
  });
</script>

</body>
</html>
