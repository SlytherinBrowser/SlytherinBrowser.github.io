<!DOCTYPE html>
<html>
<head>
  <title>Ustvari Avatar</title>
  <style>
    iframe {
      width: 100%;
      height: 600px;
      border: none;
    }
    #avatarDisplay {
      margin-top: 20px;
      display: flex;
      gap: 20px;
      justify-content: center;
    }
    .rectangle, .round {
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }
    .rectangle {
      width: 300px;
      height: 600px;
    }
    .round {
      width: 300px;
      height: 400px;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
    }
    .round model-viewer {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: block;
    }
    .rectangle model-viewer {
      width: 100%;
      height: 100%;
      display: block;
    }
    img.avatar-img {
      width: 300px;
      border-radius: 0;
    }
    label, input, button {
      display: block;
      margin: 10px auto;
      width: 300px;
      font-size: 16px;
    }
    button {
      cursor: pointer;
      padding: 10px;
      background-color: #007bff;
      border: none;
      color: white;
      border-radius: 5px;
    }
  </style>
  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>

<h2>Ustvari svoj avatar</h2>

<!-- Iframe za Ready Player Me -->
<iframe id="rpm-frame" src="https://readyplayer.me/avatar?sk_live_339mFDSGcXj7CTL3xozk6ywjjERKN06cogHu" allow="camera *; microphone *;"></iframe>

<!-- Prikaz avatarja -->
<div id="avatarDisplay">
  <div class="rectangle" id="rectangleAvatar">
    <!-- Pravokotni avatar -->
  </div>
  <div class="round" id="roundAvatar">
    <!-- Okrogli avatar -->
  </div>
  <div id="fullBodyImage" style="width:300px; height:600px;">
    <!-- Slika celotnega telesa -->
  </div>
</div>

<!-- Input za ročni vnos URL avatarja -->
<label for="avatarURLInput">Vnesi link do avatarja (URL):</label>
<input type="text" id="avatarURLInput" placeholder="https://...">
<button id="saveAvatarURLBtn">Shrani URL v Firebase</button>

<script>
  // Firebase konfiguracija
  const firebaseConfig = {
    apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
    authDomain: "chater-cf682.firebaseapp.com",
    databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
    projectId: "chater-cf682",
    storageBucket: "chater-cf682.appspot.com",
    messagingSenderId: "233632075480",
    appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
  };

  firebase.initializeApp(firebaseConfig);

  // Prijava anonimna
  firebase.auth().signInAnonymously().then(() => {
    console.log("Prijavljen si.");
    loadAvatarURL2();
  });

  const frame = document.getElementById("rpm-frame");

  // Pošlji zahtevek za dogodke iframe-u
  frame.addEventListener("load", () => {
    frame.contentWindow.postMessage(
      JSON.stringify({
        target: "readyplayerme",
        type: "subscribe",
        eventName: "v1.avatar.exported"
      }),
      "*"
    );
  });

  // Ko je avatar izbran v iframe, shrani URL v avatarURL2 in prikaži
  window.addEventListener("message", async (event) => {
    if (!event.data) return;
    let json;
    try {
      json = JSON.parse(event.data);
    } catch(e) {
      return; // Ni JSON, ignoriraj
    }

    if (json.source !== "readyplayerme") return;

    if (json.eventName === "v1.avatar.exported") {
      const avatarUrl = json.data.url;
      console.log("✅ Avatar URL iz iframe:", avatarUrl);

      const user = firebase.auth().currentUser;
      if (user) {
        const userId = user.uid;
        // Shranimo v avatarURL2
        await firebase.database().ref("users/" + userId).update({
          avatarURL2: avatarUrl
        });
        loadAvatarURL2();
      }
    }
  });

  // Funkcija za nalaganje avatarja iz avatarURL2 iz Firebase in prikaz
  async function loadAvatarURL2() {
    const user = firebase.auth().currentUser;
    if (!user) return;

    const userId = user.uid;
    const snapshot = await firebase.database().ref("users/" + userId + "/avatarURL2").get();

    if (snapshot.exists()) {
      const url = snapshot.val();
      console.log("Naložen avatarURL2 iz Firebase:", url);
      displayAvatar(url);
      document.getElementById("avatarURLInput").value = url;
    } else {
      console.log("Ni najden avatarURL2 v Firebase.");
    }
  }

  // Funkcija za prikaz avatarjev (pravokotni, okrogli, slika)
  function displayAvatar(url) {
    // Prikaz pravokotnega (celotno telo) z model-viewer
    document.getElementById("rectangleAvatar").innerHTML = `
      <model-viewer
        src="${url}"
        camera-controls
        auto-rotate
        disable-zoom
        disable-pan
        disable-tap
        camera-target="0m 1.0m 0m"
        field-of-view="30deg"
        style="width: 100%; height: 100%;">
      </model-viewer>
    `;

    // Prikaz okroglega (glava + ramena) z model-viewer
    document.getElementById("roundAvatar").innerHTML = `
      <model-viewer
        src="${url}"
        camera-controls
        auto-rotate
        disable-zoom
        disable-pan
        disable-tap
        min-camera-orbit="0deg 90deg 1.0m"
        max-camera-orbit="360deg 90deg 1.0m"
        camera-target="0m 1.63m 0m"
        field-of-view="20deg"
        style="width: 100%; height: 100%; border-radius: 50%;">
      </model-viewer>
    `;

    // Prikaz slike celotnega telesa preko render URL (transparent background)
    const renderedImgUrl = `https://render.readyplayer.me/render?url=${encodeURIComponent(url)}&scene=full-body-portrait-v1-transparent`;
    document.getElementById("fullBodyImage").innerHTML = `
      <img src="${renderedImgUrl}" alt="Avatar slika" class="avatar-img" />
    `;
  }

  // Gumb za shranjevanje ročno vnešenega URL-ja
  document.getElementById("saveAvatarURLBtn").addEventListener("click", async () => {
    const url = document.getElementById("avatarURLInput").value.trim();
    if (!url) {
      alert("Prosim, vnesi veljaven URL.");
      return;
    }

    const user = firebase.auth().currentUser;
    if (!user) {
      alert("Uporabnik ni prijavljen.");
      return;
    }

    const userId = user.uid;
    await firebase.database().ref("users/" + userId).update({
      avatarURL2: url
    });
    alert("URL uspešno shranjen!");
    loadAvatarURL2();
  });
</script>

<!-- Model Viewer CDN -->
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer.min.js"></script>

</body>
</html>
