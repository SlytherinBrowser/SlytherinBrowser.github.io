<!DOCTYPE html>
<html>
<head>
  <title>Ustvari Avatar</title>
  <style>
    iframe {
      width: 100%;
      height: 600px;
      border: none;
    }
    #avatarDisplay {
      margin-top: 20px;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .rect, .round {
      width: 300px;
      height: 400px;
      overflow: hidden;
    }
    .round {
      border-radius: 50%;
      aspect-ratio: 1/1;
    }
    model-viewer {
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>

<h2>Ustvari svoj avatar</h2>
<iframe id="rpm-frame" src="https://readyplayer.me/avatar?sk_live_339mFDSGcXj7CTL3xozk6ywjjERKN06cogHu" allow="camera *; microphone *;"></iframe>

<div id="avatarDisplay"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
    authDomain: "chater-cf682.firebaseapp.com",
    databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
    projectId: "chater-cf682",
    storageBucket: "chater-cf682.appspot.com",
    messagingSenderId: "233632075480",
    appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
  };

  firebase.initializeApp(firebaseConfig);

  // Prijava anonimno
  firebase.auth().signInAnonymously().then(async () => {
    const user = firebase.auth().currentUser;
    const userId = user.uid;

    // 🔍 Preveri, če ima že shranjen avatar
    const snapshot = await firebase.database().ref("users/" + userId).get();
    if (snapshot.exists() && snapshot.val().avatar) {
      const avatarUrl = snapshot.val().avatar;
      displayAvatars(avatarUrl);
    }
  });

  const frame = document.getElementById("rpm-frame");

  frame.addEventListener("load", () => {
    frame.contentWindow.postMessage(
      JSON.stringify({
        target: "readyplayerme",
        type: "subscribe",
        eventName: "v1.avatar.exported"
      }),
      "*"
    );
  });

  window.addEventListener("message", async (event) => {
    const json = JSON.parse(event.data);
    if (json.source !== "readyplayerme") return;

    if (json.eventName === "v1.avatar.exported") {
      const avatarUrl = json.data.url;
      const user = firebase.auth().currentUser;

      if (user) {
        const userId = user.uid;
        await firebase.database().ref("users/" + userId).update({ avatar: avatarUrl });
        displayAvatars(avatarUrl);
      }
    }
  });

  function displayAvatars(url) {
    const avatarDisplay = document.getElementById("avatarDisplay");
    avatarDisplay.innerHTML = `
      <div class="rect">
        <model-viewer
          src="${url}"
          camera-controls
          auto-rotate
          disable-zoom
          disable-pan
          disable-tap
          camera-target="0m 1m 0m"
          field-of-view="25deg">
        </model-viewer>
      </div>

      <div class="round">
        <model-viewer
          src="${url}"
          camera-controls
          auto-rotate
          disable-zoom
          disable-pan
          disable-tap
          min-camera-orbit="0deg 90deg 1.0m"
          max-camera-orbit="360deg 90deg 0.65m"
          camera-target="0m 1.63m 0m"
          field-of-view="20deg">
        </model-viewer>
      </div>
    `;
  }
</script>

</body>
</html>
