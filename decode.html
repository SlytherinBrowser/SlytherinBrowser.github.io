<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slytherin encoder/decoder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to right, #2b5876, #4e4376);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      margin: 20px 0;
      font-size: 2.5rem;
      color: #ffcc00;
    }

    textarea {
      width: 90%;
      height: 120px;
      margin: 10px 0;
      padding: 15px;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      background: #333;
      color: white;
      resize: none;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    .button-row {
      display: flex;
      gap: 10px;
      margin: 10px 0;
    }

    button {
      padding: 12px 20px;
      background: #ffcc00;
      color: #333;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    button:hover {
      background: #ffd633;
      transform: translateY(-2px);
    }

    .dock {
      position: fixed;
      bottom: 20px;
      background: #222;
      padding: 15px 20px;
      border-radius: 30px;
      display: flex;
      gap: 10px;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .dock input[type="text"] {
      width: 200px;
      padding: 10px;
      border: none;
      border-radius: 20px;
      background: #444;
      color: white;
    }

    label {
      font-size: 1rem;
      color: white;
    }
  </style>
</head>
<body>

<h1>Slytherin encoder/decoder</h1>

<textarea id="input1" placeholder="Vnesi besedilo..."></textarea>
<div class="button-row">
  <button onclick="copyToClipboard('input1')">Kopiraj zgornje besedilo</button>
</div>

<textarea id="input2" placeholder="Prevedeno besedilo..."></textarea>
<div class="button-row">
  <button onclick="copyToClipboard('input2')">Kopiraj spodnje besedilo</button>
</div>

<div class="dock">
  <label for="key">Ključ:</label>
  <input type="text" id="key" placeholder="Vnesi ključ...">
</div>

<script>
  document.getElementById("input1").addEventListener("input", () => {
    const text = document.getElementById("input1").value;
    document.getElementById("input2").value = encryptAll(text);
  });

  document.getElementById("input2").addEventListener("input", () => {
    const text = document.getElementById("input2").value;
    document.getElementById("input1").value = decryptAll(text);
  });

  function vigenereEncrypt(text, key) {
    if (!key) return text; 
    const keyLength = key.length;
    let encrypted = "";
    for (let i = 0; i < text.length; i++) {
      const charCode = text.charCodeAt(i);
      const keyChar = key[i % keyLength].toLowerCase().charCodeAt(0) - 97;
      if (charCode >= 65 && charCode <= 90) {
        encrypted += String.fromCharCode(((charCode - 65 + keyChar) % 26) + 65);
      } else if (charCode >= 97 && charCode <= 122) {
        encrypted += String.fromCharCode(((charCode - 97 + keyChar) % 26) + 97);
      } else {
        encrypted += text[i];
      }
    }
    return encrypted;
  }

  function vigenereDecrypt(text, key) {
    if (!key) return text;
    const keyLength = key.length;
    let decrypted = "";
    for (let i = 0; i < text.length; i++) {
      const charCode = text.charCodeAt(i);
      const keyChar = key[i % keyLength].toLowerCase().charCodeAt(0) - 97;
      if (charCode >= 65 && charCode <= 90) {
        decrypted += String.fromCharCode(((charCode - 65 - keyChar + 26) % 26) + 65);
      } else if (charCode >= 97 && charCode <= 122) {
        decrypted += String.fromCharCode(((charCode - 97 - keyChar + 26) % 26) + 97);
      } else {
        decrypted += text[i];
      }
    }
    return decrypted;
  }

  function rot13(text) {
    return text.replace(/[A-Za-z]/g, function (c) {
      return String.fromCharCode(
        c.charCodeAt(0) + (c.toLowerCase() < 'n' ? 13 : -13)
      );
    });
  }

  function textToNumbers(text) {
    return text.split("").map(char => char.charCodeAt(0)).join(" ");
  }

  function numbersToText(numbers) {
    return numbers.split(" ").map(num => String.fromCharCode(num)).join("");
  }

  function encryptAll(text) {
    const key = document.getElementById("key").value;
    const vigenereResult = vigenereEncrypt(text, key);
    const rot13Result = rot13(vigenereResult);
    return textToNumbers(rot13Result);
  }

  function decryptAll(text) {
    const key = document.getElementById("key").value;
    const numberResult = numbersToText(text);
    const rot13Result = rot13(numberResult);
    return vigenereDecrypt(rot13Result, key);
  }

  function copyToClipboard(elementId) {
    const text = document.getElementById(elementId).value;
    navigator.clipboard.writeText(text).then(() => {
      alert("Besedilo kopirano!");
    });
  }
</script>

</body>
</html>
