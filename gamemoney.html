<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piramidna Igra</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>
    <script type="module">
        // Import Firebase funkcije
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
        import { getDatabase, ref, set, update, get, child, push, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        // Firebase nastavitve
        const firebaseConfig = {
            apiKey: "AIzaSyA_JUf26P7PoKmaZSs9Q0n6wDM4aYe2xQo",
            authDomain: "money-dbb15.firebaseapp.com",
            projectId: "money-dbb15",
            storageBucket: "money-dbb15.firebasestorage.app",
            messagingSenderId: "92296430851",
            appId: "1:92296430851:web:24ed23b75abd81453a1536",
            measurementId: "G-LNEVCP2VLB"
        };

        // Inicializacija Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        // Prijava uporabnika z Google
        function googleSignIn() {
            const provider = new GoogleAuthProvider();
            signInWithPopup(auth, provider)
                .then(result => {
                    const user = result.user;
                    document.getElementById('user-email').textContent = user.email;
                    document.getElementById('user-info').style.display = 'block';

                    // Shranjevanje uporabniških podatkov v Firebase
                    const userRef = ref(database, 'users/' + user.uid);
                    get(userRef).then(snapshot => {
                        if (!snapshot.exists()) {
                            set(userRef, {
                                email: user.email,
                                points: 10,  // Začetne točke
                                invitedBy: null,  // Noben uporabnik ga ni povabil
                                invitations: [],
                                status: 'active'
                            });
                        }
                        document.getElementById('user-points').textContent = snapshot.val().points;
                    });
                })
                .catch(error => {
                    console.error("Napaka pri prijavi: ", error.message);
                });
        }

        // Funkcija za pošiljanje povabila
        function sendInvitation() {
            const user = auth.currentUser;
            const inviteEmail = document.getElementById('invite-email').value;
            const userRef = ref(database, 'users/' + user.uid);

            // Shranjevanje povabljenega uporabnika
            push(ref(database, 'users/' + user.uid + '/invitations'), inviteEmail);

            // Poslano povabilo
            const inviteStatus = document.getElementById('invitation-status');
            inviteStatus.textContent = `Povabilo poslano na ${inviteEmail}. Čakaj na potrditev.`;

            // Posodobi podatke (odštejemo 10 točk za vstopnino)
            update(userRef, {
                points: (user.points - 10)
            });

            // Dodaj povabilo za prijatelja (pošiljanje povabila prijatelju)
            sendInviteEmail(inviteEmail, user.email);
        }

        // Funkcija za pošiljanje povabila prijatelju
        function sendInviteEmail(inviteEmail, inviterEmail) {
            const usersRef = ref(database, 'users');
            get(query(usersRef, orderByChild('email'), equalTo(inviteEmail)))
                .then(snapshot => {
                    if (snapshot.exists()) {
                        const inviteUserID = Object.keys(snapshot.val())[0];
                        const inviteUserRef = ref(database, 'users/' + inviteUserID);

                        // Posodobi podatke povabljenega uporabnika
                        get(inviteUserRef).then(userSnapshot => {
                            if (userSnapshot.exists()) {
                                // Za povabljenega uporabnika odštejemo 10 točk kot vstopnino
                                const newPoints = userSnapshot.val().points - 10;
                                update(inviteUserRef, { points: newPoints });

                                // Za povabitelja dodamo 10 točk
                                const inviterRef = ref(database, 'users/' + inviterEmail);
                                update(inviterRef, { points: inviterRef.val().points + 10 });

                                // 10% bonus za začetnika (tisti, ki je povabil)
                                const inviterUserRef = ref(database, 'users/' + inviterEmail);
                                get(inviterUserRef).then(snapshot => {
                                    const inviterBonus = snapshot.val().points + 1; // 10% od 10 točk = 1 točka
                                    update(inviterUserRef, { points: inviterBonus });
                                });
                            }
                        });
                    }
                });
        }

        // Sledenje prijavi uporabnika in podatkom
        onAuthStateChanged(auth, user => {
            if (user) {
                const userRef = ref(database, 'users/' + user.uid);
                get(userRef).then(snapshot => {
                    document.getElementById('user-points').textContent = snapshot.val().points;
                });
            }
        });
    </script>
</head>
<body>
    <h1>Piramidna Igra</h1>
    <button onclick="googleSignIn()">Prijavi se z Google računom</button>
    <div id="user-info" style="display:none;">
        <h2>Dobrodošel, <span id="user-email"></span></h2>
        <p>Točke: <span id="user-points"></span></p>
        <input type="email" id="invite-email" placeholder="Vnesite e-poštni naslov prijatelja">
        <button onclick="sendInvitation()">Povabi prijatelja</button>
        <p id="invitation-status"></p>
    </div>
</body>
</html>
