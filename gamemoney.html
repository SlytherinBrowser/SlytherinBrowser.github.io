<!doctype html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <title>Firebase Igra</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
      border-radius: 8px;
    }
    h1, h2 {
      text-align: center;
    }
    .user-info {
      text-align: center;
      margin-bottom: 20px;
    }
    .coin-display {
      font-size: 1.5em;
      font-weight: bold;
      text-align: center;
      margin: 10px 0;
      color: #006600;
    }
    form {
      margin: 20px 0;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"],
    input[type="number"],
    input[type="email"] {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #007bff;
      color: #fff;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      padding: 5px 0;
      border-bottom: 1px solid #eee;
    }
  </style>
  <script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.5.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.5.0/firebase-analytics.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
  const firebaseConfig = {
    apiKey: "AIzaSyA_JUf26P7PoKmaZSs9Q0n6wDM4aYe2xQo",
    authDomain: "money-dbb15.firebaseapp.com",
    projectId: "money-dbb15",
    storageBucket: "money-dbb15.firebasestorage.app",
    messagingSenderId: "92296430851",
    appId: "1:92296430851:web:24ed23b75abd81453a1536",
    measurementId: "G-LNEVCP2VLB"
  };

  const analytics = getAnalytics(app)
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // DOM elementi
    const signInBtn = document.getElementById("signInBtn");
    const userInfo = document.getElementById("userInfo");
    const coinDisplay = document.getElementById("coinDisplay");
    const sendCoinForm = document.getElementById("sendCoinForm");
    const generatorBtn = document.getElementById("generatorBtn");
    const upgradeBtn = document.getElementById("upgradeBtn");
    const leaderboardList = document.getElementById("leaderboardList");

    let currentUser = null;
    let generatorInterval = null;

    // Prijava z Google računom
    signInBtn.addEventListener("click", async () => {
      try {
        const result = await signInWithPopup(auth, provider);
        currentUser = result.user;
        userInfo.innerText = `Prijavljeni kot: ${currentUser.displayName}`;
        const userRef = doc(db, "users", currentUser.uid);
        const userSnap = await getDoc(userRef);
        if (!userSnap.exists()) {
          await setDoc(userRef, {
            coins: 1000,
            generatorBought: false,
            generatorSpeed: 1,
            upgradeCost: 500,
            displayName: currentUser.displayName
          });
        }
        listenUserCoins();
        listenLeaderboard();
        startGenerator();
      } catch (error) {
        console.error("Napaka pri prijavi:", error);
      }
    });

    // Poslušanje sprememb kovancev
    async function listenUserCoins() {
      const userRef = doc(db, "users", currentUser.uid);
      onSnapshot(userRef, (docSnap) => {
        if (docSnap.exists()) {
          coinDisplay.innerText = `Imaš ${docSnap.data().coins} kovancev`;
        }
      });
    }

    // Prenos kovancev med igralci
    sendCoinForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const recipientId = document.getElementById("recipientId").value;
      const amount = parseInt(document.getElementById("amount").value);
      if (isNaN(amount) || amount <= 0) {
        alert("Vnesi veljaven znesek.");
        return;
      }
      try {
        await runTransaction(db, async (transaction) => {
          const senderRef = doc(db, "users", currentUser.uid);
          const recipientRef = doc(db, "users", recipientId);
          const senderDoc = await transaction.get(senderRef);
          const recipientDoc = await transaction.get(recipientRef);
          if (!recipientDoc.exists()) {
            throw "Prejemnik ne obstaja.";
          }
          const senderCoins = senderDoc.data().coins;
          if (senderCoins < amount) {
            throw "Premalo kovancev.";
          }
          transaction.update(senderRef, { coins: senderCoins - amount });
          const recipientCoins = recipientDoc.data().coins;
          transaction.update(recipientRef, { coins: recipientCoins + amount });
        });
        alert("Prenos uspešen!");
      } catch (error) {
        alert("Napaka pri prenosu: " + error);
      }
    });

    // Nakup generatorja
    generatorBtn.addEventListener("click", async () => {
      const userRef = doc(db, "users", currentUser.uid);
      try {
        await runTransaction(db, async (transaction) => {
          const userDoc = await transaction.get(userRef);
          const data = userDoc.data();
          if (data.generatorBought) {
            throw "Generator je že kupljen.";
          }
          if (data.coins < 700) {
            throw "Premalo kovancev za nakup generatorja.";
          }
          transaction.update(userRef, {
            coins: data.coins - 700,
            generatorBought: true
          });
        });
        alert("Generator kupljen!");
        startGenerator();
      } catch (error) {
        alert("Napaka: " + error);
      }
    });

    // Nadgradnja generatorja – cena se povečuje za 500 po vsaki nadgradnji
    upgradeBtn.addEventListener("click", async () => {
      const userRef = doc(db, "users", currentUser.uid);
      try {
        await runTransaction(db, async (transaction) => {
          const userDoc = await transaction.get(userRef);
          const data = userDoc.data();
          if (!data.generatorBought) {
            throw "Najprej moraš kupiti generator.";
          }
          if (data.coins < data.upgradeCost) {
            throw `Za nadgradnjo potrebuješ ${data.upgradeCost} kovancev.`;
          }
          transaction.update(userRef, {
            coins: data.coins - data.upgradeCost,
            generatorSpeed: data.generatorSpeed + 1,
            upgradeCost: data.upgradeCost + 500
          });
        });
        alert("Nadgradnja uspešna!");
        startGenerator();
      } catch (error) {
        alert("Napaka pri nadgradnji: " + error);
      }
    });

    // Generator kovancev – periodično doda kovance glede na hitrost generatorja
    function startGenerator() {
      if (generatorInterval) clearInterval(generatorInterval);
      const userRef = doc(db, "users", currentUser.uid);
      generatorInterval = setInterval(async () => {
        const userSnap = await getDoc(userRef);
        const data = userSnap.data();
        if (data.generatorBought) {
          const addAmount = 10 * data.generatorSpeed;
          await updateDoc(userRef, { coins: data.coins + addAmount });
        }
      }, 5000);
    }

    // Leaderboard – prikaz igralcev urejenih po številu kovancev
    function listenLeaderboard() {
      const q = query(collection(db, "users"), orderBy("coins", "desc"));
      onSnapshot(q, (snapshot) => {
        leaderboardList.innerHTML = "";
        snapshot.forEach((doc) => {
          const data = doc.data();
          const li = document.createElement("li");
          li.innerText = `${data.displayName || "Anonymous"} - ${data.coins} kovancev`;
          leaderboardList.appendChild(li);
        });
      });
    }
  </script>
</head>
<body>
  <div class="container">
    <h1>Firebase Igra</h1>
    <div class="user-info">
      <button id="signInBtn">Prijavi se z Google računom</button>
      <p id="userInfo"></p>
      <p id="coinDisplay" class="coin-display"></p>
    </div>

    <h2>Pošlji kovance</h2>
    <form id="sendCoinForm">
      <label for="recipientId">ID prejemnika:</label>
      <input type="text" id="recipientId" required>
      <label for="amount">Znesek:</label>
      <input type="number" id="amount" required>
      <button type="submit">Pošlji</button>
    </form>

    <h2>Generator</h2>
    <button id="generatorBtn">Kupi generator (700 kovancev)</button>
    <button id="upgradeBtn">Nadgradi generator</button>
    <p>Trenutna cena nadgradnje bo prikazana ob kliku na gumb.</p>

    <h2>Leaderboard</h2>
    <ul id="leaderboardList"></ul>
  </div>

</body></html>
