<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koda Chat</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f1f1;
    }
    .centered {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    input, button {
      padding: 10px;
      margin: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      width: 250px;
    }
    #chatContainer {
      display: none;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .message {
      max-width: 60%;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 15px;
      word-wrap: break-word;
    }
    .me {
      align-self: flex-end;
      background-color: #d1e7dd;
    }
    .partner {
      align-self: flex-start;
      background-color: #f8d7da;
    }
    #messageInput {
      padding: 15px;
      border: none;
      width: 100%;
      font-size: 16px;
      border-top: 1px solid #ccc;
    }
  </style>
</head>
<body>

<div class="centered" id="authSection">
  <h2>Registracija / Prijava</h2>
  <input type="text" id="name" placeholder="Ime" />
  <input type="email" id="email" placeholder="Email" />
  <input type="password" id="password" placeholder="Geslo" />
  <button onclick="register()">Registracija</button>
  <button onclick="login()">Prijava</button>
</div>

<div class="centered" id="codeSection" style="display:none">
  <h2>Tvoja koda:</h2>
  <div id="yourCode" style="font-size: 24px; font-weight: bold;"></div>
  <input type="text" id="partnerCode" placeholder="Vnesi kodo partnerja" />
  <button onclick="requestPartner()">Poveži</button>
</div>

<div class="centered" id="confirmRequestSection" style="display:none">
  <p>Uporabnik s kodo <span id="incomingCode"></span> te želi povezati. Sprejmeš?</p>
  <button onclick="acceptPartner()">Sprejmi</button>
</div>

<div id="chatContainer">
  <div id="messages"></div>
  <input type="text" id="messageInput" placeholder="Napiši sporočilo..." onkeydown="handleKey(event)" />
</div>

<script>
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCaKT0CCg1xNJanG4-6Pox2UaH_1rSL3M0",
  authDomain: "chater2-fc480.firebaseapp.com",
  projectId: "chater2-fc480",
  storageBucket: "chater2-fc480.firebasestorage.app",
  messagingSenderId: "623092508370",
  appId: "1:623092508370:web:08cf5d58c6edcfac096f0b",
  measurementId: "G-5W40WP5YEG"
};
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  let currentUser = {};
  let partnerCode = null;

  function generateCode() {
    return Math.floor(10000000 + Math.random() * 90000000).toString();
  }

  function register() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const name = document.getElementById('name').value;
    auth.createUserWithEmailAndPassword(email, password)
      .then(res => {
        const code = generateCode();
        currentUser = { uid: res.user.uid, name, code };
        db.ref('users/' + currentUser.uid).set({ name, code });
        showCodeSection(code);
      })
      .catch(alert);
  }

  function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    auth.signInWithEmailAndPassword(email, password)
      .then(res => {
        currentUser.uid = res.user.uid;
        db.ref('users/' + currentUser.uid).once('value', snap => {
          currentUser.name = snap.val().name;
          currentUser.code = snap.val().code;
          showCodeSection(currentUser.code);
        });
      })
      .catch(alert);
  }

  function showCodeSection(code) {
    document.getElementById('authSection').style.display = 'none';
    document.getElementById('codeSection').style.display = 'flex';
    document.getElementById('yourCode').textContent = code;

    // Listen for requests
    db.ref('requests/' + currentUser.code).on('value', snap => {
      if (snap.exists()) {
        document.getElementById('codeSection').style.display = 'none';
        document.getElementById('confirmRequestSection').style.display = 'flex';
        document.getElementById('incomingCode').textContent = snap.val();
      }
    });
  }

  function requestPartner() {
    const code = document.getElementById('partnerCode').value;
    if (!code) return;
    db.ref('requests/' + code).set(currentUser.code);
  }

  function acceptPartner() {
    partnerCode = document.getElementById('incomingCode').textContent;
    db.ref('requests/' + currentUser.code).remove();
    document.getElementById('confirmRequestSection').style.display = 'none';
    document.getElementById('chatContainer').style.display = 'flex';

    // Listen for messages
    db.ref('chats/' + chatId()).on('child_added', snap => {
      const msg = snap.val();
      appendMessage(msg);
    });
  }

  function handleKey(e) {
    if (e.key === 'Enter') sendMessage();
  }

  function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text) return;
    const msg = { from: currentUser.code, text, timestamp: Date.now() };
    db.ref('chats/' + chatId()).push(msg);
    input.value = '';
  }

  function appendMessage(msg) {
    const box = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'message ' + (msg.from === currentUser.code ? 'me' : 'partner');
    div.textContent = msg.text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function chatId() {
    return [currentUser.code, partnerCode].sort().join('_');
  }
</script>

</body>
</html>
