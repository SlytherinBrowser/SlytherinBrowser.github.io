<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Chat</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f0f0f0; }
    #login, #codeArea, #chatArea { display: none; max-width: 600px; margin: 40px auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    #chatBox { height: 400px; overflow-y: auto; border: 1px solid #ccc; margin-top: 10px; padding: 10px; background: #fafafa; border-radius: 5px; }
    .message { margin: 10px 0; padding: 10px; border-radius: 10px; max-width: 70%; }
    .me { background-color: #d1e7dd; align-self: flex-end; text-align: right; margin-left: auto; }
    .partner { background-color: #f8d7da; align-self: flex-start; text-align: left; margin-right: auto; }
    #chatMessages { display: flex; flex-direction: column; }
    input[type=email], input[type=password], input[type=text] { width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; }
    button { padding: 10px 20px; margin-top: 10px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
  </style>
</head>
<body>

<div id="login">
  <h2>Registracija / Prijava</h2>
  <input type="email" id="email" placeholder="Email" />
  <input type="password" id="password" placeholder="Geslo" />
  <input type="text" id="username" placeholder="Ime" />
  <button onclick="register()">Registracija</button>
  <button onclick="login()">Prijava</button>
</div>

<div id="codeArea">
  <h2>Tvoja koda: <span id="myCode"></span></h2>
  <input type="text" id="partnerCode" placeholder="Vpiši kodo partnerja" />
  <button onclick="sendRequest()">Poveži se</button>
</div>

<div id="chatArea">
  <h2>Klepet</h2>
  <div id="chatBox">
    <div id="chatMessages"></div>
  </div>
  <input type="text" id="chatInput" placeholder="Vnesi sporočilo in pritisni Enter" onkeydown="handleKey(event)" />
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
<script>
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCaKT0CCg1xNJanG4-6Pox2UaH_1rSL3M0",
  authDomain: "chater2-fc480.firebaseapp.com",
  projectId: "chater2-fc480",
  storageBucket: "chater2-fc480.firebasestorage.app",
  messagingSenderId: "623092508370",
  appId: "1:623092508370:web:08cf5d58c6edcfac096f0b",
  measurementId: "G-5W40WP5YEG"
};
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  let myUid, myCode, partnerCode = null;

  function generateCode() {
    return Math.floor(10000000 + Math.random() * 90000000).toString();
  }

  function register() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const username = document.getElementById("username").value;

    auth.createUserWithEmailAndPassword(email, password).then(cred => {
      myUid = cred.user.uid;
      myCode = generateCode();
      db.ref("users/" + myUid).set({ code: myCode, username });
      showCode();
    });
  }

  function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    auth.signInWithEmailAndPassword(email, password).then(cred => {
      myUid = cred.user.uid;
      db.ref("users/" + myUid).once("value", snap => {
        myCode = snap.val().code;
        showCode();
      });
    });
  }

  function showCode() {
    document.getElementById("login").style.display = "none";
    document.getElementById("codeArea").style.display = "block";
    document.getElementById("myCode").textContent = myCode;

    // Spremljaj prošnje
    db.ref("requests/" + myCode).on("value", snap => {
      const request = snap.val();
      if (request && confirm("Uporabnik s kodo " + request + " želi klepetati. Sprejmeš?")) {
        startChat(request);
        db.ref("requests/" + myCode).remove();
      }
    });
  }

  function sendRequest() {
    const code = document.getElementById("partnerCode").value;
    db.ref("requests/" + code).set(myCode);
  }

  function startChat(code) {
    partnerCode = code;
    document.getElementById("chatArea").style.display = "block";
    document.getElementById("codeArea").style.display = "none";

    const chatId = myCode < partnerCode ? myCode + "_" + partnerCode : partnerCode + "_" + myCode;

    db.ref("chats/" + chatId).on("child_added", snap => {
      const msg = snap.val();
      const div = document.createElement("div");
      div.className = "message " + (msg.sender === myCode ? "me" : "partner");
      div.textContent = msg.text;
      document.getElementById("chatMessages").appendChild(div);
      document.getElementById("chatBox").scrollTop = document.getElementById("chatBox").scrollHeight;
    });
  }

  function handleKey(e) {
    if (e.key === "Enter") {
      const text = document.getElementById("chatInput").value;
      if (!text.trim()) return;

      const chatId = myCode < partnerCode ? myCode + "_" + partnerCode : partnerCode + "_" + myCode;
      db.ref("chats/" + chatId).push({ text, sender: myCode });
      document.getElementById("chatInput").value = "";
    }
  }

  auth.onAuthStateChanged(user => {
    if (user) {
      myUid = user.uid;
      db.ref("users/" + myUid).once("value", snap => {
        myCode = snap.val().code;
        showCode();
      });
    } else {
      document.getElementById("login").style.display = "block";
    }
  });
</script>

</body>
</html>
