<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat za Pare</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }
    body {
      background: #fefefe;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
    }
    #register-section, #connect-section {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    input, button {
      padding: 10px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    #code-display {
      font-size: 1.5rem;
      font-weight: bold;
      margin-top: 20px;
    }
    #chat {
      flex: 1;
      width: 100%;
      max-width: 500px;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 70%;
      padding: 10px;
      border-radius: 12px;
    }
    .me {
      background: #d1e7dd;
      align-self: flex-end;
    }
    .partner {
      background: #f8d7da;
      align-self: flex-start;
    }
    #message-input {
      display: flex;
      width: 100%;
      max-width: 500px;
      padding: 10px;
    }
    #message-input input {
      flex: 1;
      margin-right: 10px;
    }
    #navbar {
      display: none;
      width: 100%;
      max-width: 500px;
      position: fixed;
      bottom: 0;
      background: #fff;
      border-top: 1px solid #ccc;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }
    #navbar button {
      background: none;
      border: none;
      font-size: 1.2rem;
    }
    #status-level {
      padding: 20px;
      font-size: 1.2rem;
      text-align: center;
    }
    #plant {
      width: 60px;
      height: 60px;
      transition: transform 0.3s;
    }
    #plant.watering {
      transform: scale(1.2);
    }
  </style>
</head>
<body>
  <div id="register-section">
    <button onclick="register()">Registriraj se</button>
    <div id="code-display"></div>
  </div>

  <div id="connect-section" style="display: none;">
    <input type="number" id="partner-code" placeholder="Vnesi partnerjevo kodo" />
    <button onclick="connect()">Poveži se</button>
  </div>

  <div id="chat-section" style="display: none; flex-direction: column; align-items: center; width: 100%;">
    <div id="chat"></div>
    <div id="message-input">
      <input type="text" id="msg" placeholder="Napiši sporočilo..." />
      <button onclick="sendMessage()">Pošlji</button>
    </div>
  </div>

  <div id="status-level" style="display: none;">🌱 Nivo zveze: <span id="level">1</span></div>

  <div id="navbar">
    <button onclick="showChat()">💬</button>
    <button onclick="waterPlant()">🌿</button>
    <button onclick="showLevel()">❤️</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let myCode = null;
    let chatId = null;
    let myId = Math.floor(Math.random() * 1000000);

    function register() {
      myCode = Math.floor(100000 + Math.random() * 900000).toString();
      set(ref(db, 'codes/' + myCode), myId);
      document.getElementById("code-display").innerText = "Tvoja koda: " + myCode;
      document.getElementById("connect-section").style.display = 'flex';
    }

    function connect() {
      const partnerCode = document.getElementById("partner-code").value;
      const combined = [myCode, partnerCode].sort().join('-');
      chatId = combined;
      startChat();
    }

    function startChat() {
      document.getElementById("register-section").style.display = 'none';
      document.getElementById("connect-section").style.display = 'none';
      document.getElementById("chat-section").style.display = 'flex';
      document.getElementById("status-level").style.display = 'block';
      document.getElementById("navbar").style.display = 'flex';

      const chatRef = ref(db, 'chats/' + chatId);
      onChildAdded(chatRef, (snapshot) => {
        const msg = snapshot.val();
        const div = document.createElement("div");
        div.className = 'message ' + (msg.sender === myId ? 'me' : 'partner');
        div.innerText = msg.text;
        document.getElementById("chat").appendChild(div);
        updateLevel();
      });
    }

    function sendMessage() {
      const text = document.getElementById("msg").value;
      if (!text) return;
      const chatRef = ref(db, 'chats/' + chatId);
      push(chatRef, { sender: myId, text });
      document.getElementById("msg").value = '';
    }

    let actionCount = 0;

    function updateLevel() {
      actionCount++;
      const level = Math.floor(actionCount / 5) + 1;
      document.getElementById("level").innerText = level;
    }

    function waterPlant() {
      const plant = document.createElement("div");
      plant.id = 'plant';
      plant.innerHTML = '🌿';
      plant.classList.add('watering');
      document.getElementById("chat").appendChild(plant);
      setTimeout(() => plant.classList.remove('watering'), 300);
      updateLevel();
    }

    function showChat() {
      document.getElementById("chat-section").scrollIntoView({ behavior: 'smooth' });
    }

    function showLevel() {
      alert("Trenutni nivo vajine zveze: " + document.getElementById("level").innerText);
    }
  </script>
</body>
</html>
