<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ljubimčki Chat</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #fff0f5;
    }
    #connect-section, #chat-section, #plant-section, #status-section {
      display: none;
      padding: 20px;
    }
    #navbar {
      display: none;
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #ffb6c1;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }
    #navbar button {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }
    #messages {
      max-height: 300px;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    .msg {
      padding: 8px 12px;
      margin: 6px;
      border-radius: 12px;
      max-width: 70%;
    }
    .me {
      background: #add8e6;
      align-self: flex-end;
      text-align: right;
    }
    .partner {
      background: #90ee90;
      align-self: flex-start;
      text-align: left;
    }
    #plant-svg {
      width: 100px;
    }
  </style>
</head>
<body>
  <div id="connect-section">
    <h2>Poveži se s partnerjem</h2>
    <p>Tvoja koda: <span id="my-code"></span></p>
    <input type="number" id="partner-code" placeholder="Partnerjeva koda">
    <button onclick="connectToPartner()">Poveži</button>
  </div>

  <div id="chat-section">
    <div id="messages"></div>
    <input type="text" id="message-input" placeholder="Napiši sporočilo">
    <button onclick="sendMessage()">Pošlji</button>
  </div>

  <div id="plant-section">
    <h3>Najina rastlina</h3>
    <svg id="plant-svg" viewBox="0 0 100 100">
      <circle cx="50" cy="80" r="20" fill="green"/>
      <rect x="45" y="80" width="10" height="20" fill="brown"/>
    </svg>
    <button onclick="waterPlant()">Zalij</button>
  </div>

  <div id="status-section">
    <h3>Status zveze</h3>
    <p>Level: <span id="love-level">1</span></p>
    <p>Sporočila danes: <span id="message-count">0</span></p>
  </div>

  <div id="navbar">
    <button onclick="showSection('chat')">💬</button>
    <button onclick="showSection('plant')">🌱</button>
    <button onclick="showSection('status')">💖</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, push } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCaKT0CCg1xNJanG4-6Pox2UaH_1rSL3M0",
  authDomain: "chater2-fc480.firebaseapp.com",
  projectId: "chater2-fc480",
  storageBucket: "chater2-fc480.firebasestorage.app",
  messagingSenderId: "623092508370",
  appId: "1:623092508370:web:08cf5d58c6edcfac096f0b",
  measurementId: "G-5W40WP5YEG"
};

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const myId = Math.floor(100000 + Math.random() * 900000).toString();
    let partnerId = null;
    let messageCountToday = 0;

    document.getElementById('my-code').textContent = myId;
    document.getElementById('connect-section').style.display = 'block';

    function connectToPartner() {
      partnerId = document.getElementById('partner-code').value;
      if (!partnerId) return alert('Vnesi partnerjevo kodo.');

      document.getElementById('connect-section').style.display = 'none';
      document.getElementById('chat-section').style.display = 'block';
      document.getElementById('navbar').style.display = 'flex';

      listenForMessages();
    }

    function sendMessage() {
      const text = document.getElementById('message-input').value;
      if (!text || !partnerId) return;

      const chatRef = ref(db, `pairs/${myId}_${partnerId}`);
      push(chatRef, {
        sender: myId,
        text,
        timestamp: Date.now()
      });
      document.getElementById('message-input').value = '';
      messageCountToday++;
      document.getElementById('message-count').textContent = messageCountToday;
      updateLoveLevel();
    }

    function listenForMessages() {
      const chatRef = ref(db, `pairs/${partnerId}_${myId}`);
      onValue(chatRef, snapshot => {
        const msgs = snapshot.val();
        const box = document.getElementById('messages');
        box.innerHTML = '';
        for (let id in msgs) {
          const msg = msgs[id];
          const div = document.createElement('div');
          div.className = 'msg ' + (msg.sender === myId ? 'me' : 'partner');
          div.textContent = msg.text;
          box.appendChild(div);
        }
      });
    }

    function updateLoveLevel() {
      let level = 1;
      if (messageCountToday > 10) level = 2;
      if (messageCountToday > 25) level = 3;
      if (messageCountToday > 50) level = 4;
      document.getElementById('love-level').textContent = level;
    }

    function waterPlant() {
      alert('Rastlina je srečna! 🌱');
    }

    window.connectToPartner = connectToPartner;
    window.sendMessage = sendMessage;
    window.waterPlant = waterPlant;
    window.showSection = function(name) {
      document.getElementById('chat-section').style.display = 'none';
      document.getElementById('plant-section').style.display = 'none';
      document.getElementById('status-section').style.display = 'none';
      document.getElementById(name + '-section').style.display = 'block';
    }
  </script>
</body>
</html>
