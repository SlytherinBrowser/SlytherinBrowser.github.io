<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beležke in opravila</title>
    <style>
       @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

body {
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    color: #e0f7fa;
    font-family: 'Orbitron', monospace, monospace;
    padding: 40px 30px;
    margin: 0;
    overflow-x: hidden;
}

.container {
    max-width: 650px;
    margin: 0 auto;
    background: rgba(14, 27, 44, 0.85);
    padding: 30px 40px;
    border-radius: 15px;
    box-shadow:
        0 0 10px #00fff7,
        0 0 20px #00fff7,
        0 0 30px #00b8f4,
        0 0 40px #0096c7;
    border: 2px solid #00fff7;
}

h1, h2 {
    text-align: center;
    font-weight: 900;
    letter-spacing: 3px;
    color: #00fff7;
    text-shadow:
        0 0 5px #00fff7,
        0 0 10px #00b8f4,
        0 0 20px #0077b6;
    margin-bottom: 25px;
}

textarea, input[type="text"] {
    width: 100%;
    padding: 15px 20px;
    margin-bottom: 20px;
    background: rgba(0, 255, 247, 0.1);
    color: #00fff7;
    border: 2px solid #00fff7;
    border-radius: 12px;
    font-size: 18px;
    box-sizing: border-box;
    font-family: 'Orbitron', monospace;
    transition: border-color 0.4s ease, box-shadow 0.4s ease;
}

textarea:focus, input[type="text"]:focus {
    outline: none;
    border-color: #00b8f4;
    box-shadow: 0 0 15px #00b8f4;
    background: rgba(0, 255, 247, 0.2);
}

button {
    display: block;
    width: 100%;
    padding: 18px 0;
    background: linear-gradient(90deg, #00fff7 0%, #0077b6 100%);
    color: #021124;
    font-weight: 900;
    font-size: 20px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    letter-spacing: 2px;
    box-shadow:
        0 0 8px #00fff7,
        0 0 15px #0077b6;
    transition: background 0.3s ease;
}

button:hover {
    background: linear-gradient(90deg, #0077b6 0%, #00fff7 100%);
    color: #e0f7fa;
    box-shadow:
        0 0 12px #00fff7,
        0 0 25px #00b8f4;
}

ul {
    list-style-type: none;
    padding: 0;
    margin-top: 20px;
}

li {
    margin-bottom: 18px;
    padding: 16px 20px;
    background: rgba(0, 255, 247, 0.05);
    border-left: 5px solid #00fff7;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 18px;
    color: #b2fefa;
    text-shadow: 0 0 2px #00b8f4;
}

li input[type="checkbox"] {
    margin-right: 15px;
    transform: scale(1.4);
    cursor: pointer;
    accent-color: #00fff7;
}

.delete-btn {
    background: #ff1744;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
    font-size: 14px;
    box-shadow: 0 0 6px #ff1744;
    transition: background 0.3s ease;
}

.delete-btn:hover {
    background: #b2102f;
    box-shadow: 0 0 12px #ff1744;
}

    </style>
</head>
<body>
    <div class="container">
        <h1>Beležke in opravila</h1>

        <div id="notes">
            <h2>Beležke</h2>
            <textarea id="noteInput" cols="30" rows="5" placeholder="Vnesite beležko..."></textarea>
            <button onclick="addNote()">Dodaj beležko</button>
            <ul id="noteList">
                <!-- Tukaj bodo prikazane beležke -->
            </ul>
        </div>

        <div id="tasks">
            <h2>Opravila</h2>
            <input id="taskInput" type="text" placeholder="Dodaj novo opravilo">
            <button onclick="addTask()">Dodaj opravilo</button>
            <ul id="taskList">
                <!-- Tukaj bodo prikazana opravila -->
            </ul>
        </div>
    </div>

    <script>
        function addNote() {
            const noteInput = document.getElementById('noteInput');
            const noteText = noteInput.value.trim();

            if (noteText !== '') {
                const noteList = document.getElementById('noteList');
                const noteItem = createItemWithDeleteButton(noteText, 'notes');
                noteList.appendChild(noteItem);

                saveToLocalStorage('notes', noteList);

                noteInput.value = '';
            }
        }

        function addTask() {
            const taskInput = document.getElementById('taskInput');
            const taskText = taskInput.value.trim();

            if (taskText !== '') {
                const taskList = document.getElementById('taskList');
                const taskItem = createItemWithCheckboxAndDeleteButton(taskText, 'tasks');
                taskList.appendChild(taskItem);

                saveToLocalStorage('tasks', taskList);

                taskInput.value = '';
            }
        }

        function createItemWithDeleteButton(textContent, key) {
            const listItem = document.createElement('li');
            listItem.textContent = textContent;

            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'Del';
            deleteBtn.className = 'delete-btn';
            deleteBtn.onclick = function() {
                listItem.remove();
                removeFromLocalStorage(key, textContent);
            };

            listItem.appendChild(deleteBtn);
            return listItem;
        }

        function createItemWithCheckboxAndDeleteButton(taskText, key) {
            const listItem = document.createElement('li');

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.addEventListener('change', () => {
                if (checkbox.checked) {
                    listItem.style.textDecoration = 'line-through';
                } else {
                    listItem.style.textDecoration = 'none';
                }
                updateLocalStorage();
            });

            const taskLabel = document.createElement('label');
            taskLabel.textContent = taskText;

            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'Del';
            deleteBtn.className = 'delete-btn';
            deleteBtn.onclick = function() {
                listItem.remove();
                removeFromLocalStorage(key, taskText);
            };

            listItem.appendChild(checkbox);
            listItem.appendChild(taskLabel);
            listItem.appendChild(deleteBtn);

            return listItem;
        }

        function saveToLocalStorage(key, list) {
            const items = [];
            list.childNodes.forEach(item => {
                if (item.nodeName === 'LI') {
                    const textContent = item.textContent.replace('Del', '').trim();
                    items.push(textContent);
                }
            });
            localStorage.setItem(key, JSON.stringify(items));
        }

        function removeFromLocalStorage(key, value) {
            const items = JSON.parse(localStorage.getItem(key)) || [];
            const index = items.indexOf(value);
            if (index !== -1) {
                items.splice(index, 1);
                localStorage.setItem(key, JSON.stringify(items));
            }
        }

        window.onload = function() {
            loadFromLocalStorage('notes', 'noteList', createItemWithDeleteButton);
            loadFromLocalStorage('tasks', 'taskList', createItemWithCheckboxAndDeleteButton);
        };

        function loadFromLocalStorage(key, listId, createItemFunc) {
            const items = JSON.parse(localStorage.getItem(key)) || [];
            const itemList = document.getElementById(listId);

            items.forEach(item => {
                const listItem = createItemFunc(item, key);
                itemList.appendChild(listItem);
            });
        }

        function updateLocalStorage() {
            const taskList = document.getElementById('taskList');
            saveToLocalStorage('tasks', taskList);
        }
    </script>
</body>
</html>
