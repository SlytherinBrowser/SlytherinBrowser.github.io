<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test osebnosti in ljubezni</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            transition: background 0.5s ease-in-out;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: bold;
            animation: fadeIn 1s ease-in-out;
        }

        button {
            background: #ffffff;
            color: #6e8efb;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
            transform: scale(1);
            margin: 10px;
        }

        button:hover {
            background: #dfe9fd;
            transform: scale(1.1);
        }

        button:active {
            transform: scale(0.95);
        }

        #test-selection {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #question-container {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.3);
            width: 80%;
            max-width: 400px;
            display: none;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s forwards;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 20px;
            animation: fadeIn 0.8s ease-in-out;
        }

        .option {
            display: block;
            background: rgba(255, 255, 255, 0.85);
            color: #333;
            padding: 15px;
            margin: 10px auto;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 80%;
            max-width: 300px;
            transition: all 0.3s ease-in-out;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
            transform: scale(1);
        }

        .option:hover {
            background: #ffffff;
            transform: scale(1.05);
        }

        .option:active {
            transform: scale(0.95);
        }

        #result {
            display: none;
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.9);
            color: #444;
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease-in-out;
        }

        #home-button {
            display: none;
            margin-top: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <h1>Izberi test</h1>
    <div id="test-selection">
        <button onclick="startTest('personality')">Test osebnosti</button>
        <button onclick="startTest('love')">Ljubezenski test</button>
    </div>

    <div id="question-container">
        <h2 id="question"></h2>
        <div class="option" onclick="selectOption(0)" id="option1"></div>
        <div class="option" onclick="selectOption(1)" id="option2"></div>
    </div>

    <div id="result"></div>
    <button id="home-button" onclick="goHome()">Pojdi na začetno stran</button>

    <script>
        const personalityQuestions = [
            ["Morje", "Gore"], ["Dan", "Noč"], ["Kava", "Čaj"], ["Mesto", "Vas"],
            ["Mačka", "Pes"], ["Zima", "Poletje"], ["Knjiga", "Film"], ["Sončno", "Deževno"],
            ["Sladko", "Slano"], ["Aktivnost", "Počitek"], ["Glasba", "Tišina"], ["Sanje", "Resničnost"],
            ["Sončni vzhod", "Sončni zahod"], ["Avto", "Kolo"], ["Sam", "Družba"], ["Vino", "Pivo"],
            ["Pustolovščina", "Rutina"], ["Sneg", "Dež"], ["Rdeča", "Modra"], ["Šport", "Umetnost"],
            ["Letalo", "Vlak"], ["Delo", "Zabava"], ["Pisanje", "Govorjenje"], ["Zaupanje", "Skrivnostnost"],
            ["Zvezde", "Luna"], ["Narava", "Tehnologija"]
        ];

        const loveQuestions = [
            ["Romantičen večer doma", "Pustolovščina v dvoje"], ["Nežni poljub", "Strasten poljub"],
            ["Skrivni opisi", "Jasna čustva"], ["Pogovor o prihodnosti", "Uživanje v trenutkih"],
            ["Sprejemanje napak", "Iskanje popolnosti"], ["Izražanje ljubezni", "Tihi dotiki"],
            ["Skupni hobiji", "Različni interesi"], ["Skrbnost", "Pustite, da partner izbira"],
            ["Skrivnosti", "Transparentnost"], ["Skrb za detajle", "Nekaj spontanosti"], 
            ["Preteklost", "Prihodnost"], ["Pogovarjanje o čustvih", "Zabava brez obveznosti"],
            ["Komunikacija", "Tišina"], ["Podpora v težkih trenutkih", "Skrb za partnerja"],
            ["Sprejemanje osebnih prostorov", "Deljenje vsega"], ["Iskanje popolne skladnosti", "Spoštovanje razlik"],
            ["Pustolovščina v ljubezni", "Mirni trenutki doma"], ["Čustvena povezanost", "Fizična privlačnost"]
        ];

        const personalityMappings = [
            ["Avanturist", "Analitik"], ["Družaben", "Analitik"], ["Avanturist", "Udobje"], ["Družaben", "Udobje"],
            ["Analitik", "Družaben"], ["Analitik", "Avanturist"], ["Analitik", "Družaben"], ["Avanturist", "Analitik"],
            ["Družaben", "Udobje"], ["Avanturist", "Udobje"], ["Družaben", "Analitik"], ["Avanturist", "Udobje"],
            ["Avanturist", "Družaben"], ["Avanturist", "Analitik"], ["Analitik", "Družaben"], ["Družaben", "Udobje"],
            ["Avanturist", "Udobje"], ["Analitik", "Udobje"], ["Avanturist", "Analitik"], ["Družaben", "Analitik"],
            ["Avanturist", "Analitik"], ["Analitik", "Udobje"], ["Analitik", "Družaben"], ["Družaben", "Udobje"],
            ["Avanturist", "Analitik"], ["Družaben", "Udobje"]
        ];

        let currentQuestion = 0;
        let selectedTest = '';

        const personalityTypes = {
            "Avanturist": 0, "Analitik": 0, "Družaben": 0, "Udobje": 0
        };

        const loveTypes = {
            "Romantični": 0, "Strastni": 0, "Racionalni": 0, "Neodvisni": 0, "Pustolovski": 0, "Čustveni": 0
        };

        function startTest(testType) {
            selectedTest = testType;
            document.getElementById("test-selection").style.display = "none";
            document.getElementById("question-container").style.display = "block";
            nextQuestion();
        }

        function nextQuestion() {
            if (selectedTest === 'personality') {
                if (currentQuestion < personalityQuestions.length) {
                    document.getElementById("question").textContent = `Izberi eno:`;
                    document.getElementById("option1").textContent = personalityQuestions[currentQuestion][0];
                    document.getElementById("option2").textContent = personalityQuestions[currentQuestion][1];
                } else {
                    showResult();
                }
        } else if (selectedTest === 'love') {
                if (currentQuestion < loveQuestions.length) {
                    document.getElementById("question").textContent = `Izberi eno:`;
                    document.getElementById("option1").textContent = loveQuestions[currentQuestion][0];
                    document.getElementById("option2").textContent = loveQuestions[currentQuestion][1];
                } else {
                    showResult();
                }
            }
        }

        function selectOption(selected) {
            if (selectedTest === 'personality') {
                if (selected === 0) {
                    personalityTypes["Avanturist"]++;
                } else {
                    personalityTypes["Analitik"]++;
                }
            } else if (selectedTest === 'love') {
                if (selected === 0) {
                    loveTypes["Romantični"]++;
                } else {
                    loveTypes["Strastni"]++;
                }
            }
            currentQuestion++;
            nextQuestion();
        }

        function showResult() {
            document.getElementById("question-container").style.display = "none";
            document.getElementById("home-button").style.display = "block";

            let resultText = '';
            if (selectedTest === 'personality') {
                const highestScore = Math.max(...Object.values(personalityTypes));
                const personalityResult = Object.keys(personalityTypes).find(key => personalityTypes[key] === highestScore);
                resultText = `Vaša osebnostna vrsta je: ${personalityResult}`;
            } else if (selectedTest === 'love') {
                const highestScore = Math.max(...Object.values(loveTypes));
                const loveResult = Object.keys(loveTypes).find(key => loveTypes[key] === highestScore);
                resultText = `Vaša ljubezenska usmeritev je: ${loveResult}`;
            }

            document.getElementById("result").textContent = resultText;
            document.getElementById("result").style.display = "block";
        }

        function goHome() {
            window.location.reload();
        }
    </script>
</body>
</html>
