<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gameportal</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(to bottom, #68e5d8, #b1c6f5);
            color: #333;
        }

        #searchForm {
            width: 50%;
            background: radial-gradient(circle, #3fa9ff, #2473b2);
            border: 2px solid #fff;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
            transition: transform 0.5s ease-in-out, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #searchForm.shrunk {
            display: none;
        }

        #searchForm:hover {
            box-shadow: 0 6px 40px rgba(0, 0, 0, 0.6);
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 16px;
            color: #fff;
        }

        #search {
            background: linear-gradient(to right, #3fa9ff, #2473b2);
            border: 2px solid #fff;
            padding: 20px;
            font-size: 18px;
            width: 90%;
            height: 74px;
            border-radius: 10px;
            color: #fff;
            outline: none;
            transition: background 0.3s, transform 0.3s ease-in-out, border-color 0.3s, box-shadow 0.3s;
        }

        #search:focus {
            border-color: #007bff;
            background: linear-gradient(to right, #e74c3c, #2473b2);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
        }

        iframe {
            width: 100%;
            height: 400px;
            border: none;
            margin-top: 20px;
            display: block;
            border-radius: 10px;
            opacity: 1;
            transform: translateY(0);
            transition: height 0.5s ease-in-out, opacity 0.5s ease-in-out;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }

        iframe.active {
            height: 800px;
            opacity: 1;
        }

        #popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            width: 80%;
            max-width: 400px;
            animation: fadeIn 0.3s ease-in-out;
        }

        #popup ul {
            list-style-type: none;
            padding: 0;
        }

        #popup li {
            margin: 10px 0;
            font-size: 18px;
            color: #333;
        }

        #popupButton, #toggleButton {
            background-color: #3fa9ff;
            color: #fff;
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s ease-in-out;
            margin-top: 10px;
        }

        #popupButton:hover, #toggleButton:hover {
            background-color: #2473b2;
            transform: scale(1.05);
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translate(-50%, -60%);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }
    </style>
</head>
<body>
    <form id="searchForm">
        <label for="search">Vnesi igro:</label>
        <input type="text" id="search" placeholder="Napiši ključne besede...">
    </form>
    <iframe id="resultFrame" style="display:none;"></iframe>
    <div class="button-container">
        <button id="popupButton">Pokaži seznam iger</button>
        <button id="toggleButton" disabled>Povečaj / Pomanjšaj</button>
    </div>
    <div id="popup">
        <h3>Seznam iger:</h3>
        <ul>
            <li>among</li>
            <li>archer hero</li>
            <li>warstrike</li>
            <li>drift</li>
            <li>bob</li>
            <li>diep</li>
            <li>wormate</li>
            <li>littlebigsnake</li>
            <li>wormszoneio</li>
            <li>slithercraft</li>
            <li>moomoo</li>
            <li>zombsroyale</li>
            <li>krunker</li>
            <li>lordz.io</li>
            <li>flyordie</li>
            <li>typeracer</li>
        </ul>
        <button onclick="closePopup()">Zapri</button>
    </div>

    <script>
        const searchInput = document.getElementById('search');
        const searchForm = document.getElementById('searchForm');
        const resultFrame = document.getElementById('resultFrame');
        const popupButton = document.getElementById('popupButton');
        const popup = document.getElementById('popup');
        const toggleButton = document.getElementById('toggleButton');

        const links = {
            "among": "https://www.onlinegames.io/games/2023/construct/234/among-impostor/index.html",
            "archer hero": "https://www.onlinegames.io/games/2023/unity/archer-hero/index.html",
            "warstrike": "https://cloud.onlinegames.io/games/2024/unity3/warstrike/index-og.html",
            "drift": "https://www.onlinegames.io/games/2024/unity/drift-king/index.html",
            "bob": "https://html5.gamedistribution.com/18d28481ea514f3c838f9a5a355fb0f7/?gd_sdk_referrer_url=https://gamedistribution.com/games/bob-the-robber/",
            "diep": "https://diep.io",
            "wormate": "https://wormate.io",
            "littlebigsnake": "https://littlebigsnake.com",
            "wormszoneio": "https://wormszone.io",
            "slithercraft": "https://slithercraft.io",
            "moomoo": "https://moomoo.io",
            "zombsroyale": "https://zombsroyale.io",
            "krunker": "https://krunker.io",
            "lordz.io": "https://lordz.io",
            "flyordie": "https://flyordie.io",
            "typeracer": "https://play.typeracer.com"
        };

        searchInput.addEventListener('input', () => {
            const value = searchInput.value.toLowerCase();
            if (links[value]) {
                searchForm.classList.add('active');
                resultFrame.src = links[value];
                resultFrame.style.display = 'block'; // Show iframe when there is a match
                resultFrame.classList.add('active');
                toggleButton.disabled = false; // Enable the toggle button once iframe is active
            } else {
                searchForm.classList.remove('active');
                resultFrame.src = '';
                resultFrame.style.display = 'none'; // Hide iframe when no match
                resultFrame.classList.remove('active');
                toggleButton.disabled = true; // Disable the toggle button if iframe is not active
            }
        });

        popupButton.addEventListener('click', () => {
            popup.style.display = 'block';
        });

        function closePopup() {
            popup.style.display = 'none';
        }

        toggleButton.addEventListener('click', () => {
            const isActive = resultFrame.classList.contains('active');
            if (isActive) {
                resultFrame.classList.remove('active');
                searchForm.classList.remove('shrunk'); // Show search bar when iframe is minimized
            } else {
                resultFrame.classList.add('active');
                searchForm.classList.add('shrunk'); // Hide search bar when iframe is maximized
            }
        });
         function getTimePlayedToday() {
            const today = new Date().toISOString().split('T')[0];
            const data = JSON.parse(localStorage.getItem('playTime')) || {};
            return data[today] || 0;
        }

        function updateTimePlayed(duration) {
            const today = new Date().toISOString().split('T')[0];
            const data = JSON.parse(localStorage.getItem('playTime')) || {};
            data[today] = (data[today] || 0) + duration;
            localStorage.setItem('playTime', JSON.stringify(data));
        }

        function getTotalTimePlayed() {
            const data = JSON.parse(localStorage.getItem('playTime')) || {};
            return Object.values(data).reduce((total, time) => total + time, 0);
        }

        function enforceChildMode() {
            if (getTimePlayedToday() >= 3 * 60 * 60 * 1000) {
                alert('Dosežen je dnevni časovni limit igranja (3 ure).');
                resultFrame.classList.add('hidden');
            }
        }

        searchInput.addEventListener('input', () => {
            const value = searchInput.value.toLowerCase();
            if (links[value]) {
                resultFrame.src = links[value];
                resultFrame.classList.remove('hidden');
                toggleButton.disabled = false;
                startTime = Date.now();
            } else {
                resultFrame.classList.add('hidden');
                toggleButton.disabled = true;
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                const command = searchInput.value.toLowerCase();
                if (command === 'todaytime') {
                    alert(`Danes si igral ${Math.floor(getTimePlayedToday() / 60000)} minut.`);
                } else if (command === 'time') {
                    alert(`Skupno si igral ${Math.floor(getTotalTimePlayed() / 60000)} minut.`);
                } else if (command === 'child') {
                    isChildMode = true;
                    enforceChildMode();
                } else if (command === '18') {
                    isChildMode = false;
                    alert('Preklopljeno na način brez omejitev.');
                }
            }
        });

        setInterval(() => {
            if (startTime) {
                const now = Date.now();
                const elapsed = now - startTime;
                updateTimePlayed(elapsed);
                startTime = now;
                if (isChildMode) enforceChildMode();
            }
        }, 1000);
    </script>
</body>
</html>
