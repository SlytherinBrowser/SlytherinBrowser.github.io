<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gameportal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(to bottom, #74ebd5, #acb6e5);
        }

        #searchForm {
            width: 50%;
            background: radial-gradient(circle, #3498db, #2980b9);
            border: 2px solid #fff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.5s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #fff;
        }

        #search {
            background: linear-gradient(to right, #3498db, #2980b9);
            border: 2px solid #fff;
            padding: 20px;
            font-size: 18px;
            width: 90%;
            height: 74px;
            border-radius: 10px;
            color: #fff;
            outline: none;
            transition: background 0.3s, transform 0.3s ease-in-out, border-color 0.3s;
        }

        #search:focus {
            border-color: #007bff;
            background: linear-gradient(to right, #e74c3c, #2980b9);
        }

        iframe {
            width: 100%;
            height: 90%;
            border: none;
            margin-top: 20px;
            display: none;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        #searchForm.active {
            transform: translateY(-50px);
        }

        iframe.active {
            display: block;
        }

        #popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            width: 80%;
            max-width: 400px;
        }

        #popup ul {
            list-style-type: none;
            padding: 0;
        }

        #popup li {
            margin: 10px 0;
            font-size: 18px;
        }

        #popupButton {
            width: 50%;
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #popupButton:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <form id="searchForm">
        <label for="search">Vnesi igro:</label>
        <input type="text" id="search" placeholder="Napiši ključne besede...">
    </form>
    <iframe id="resultFrame"></iframe>
    <button id="popupButton">Pokaži seznam iger</button>
    <div id="popup">
        <h3>Seznam iger:</h3>
        <ul>
            <li>among</li>
            <li>archer hero</li>
            <li>warstrike</li>
            <li>drift</li>
            <li>bob</li>
            <li>diep</li>
            <li>wormate</li>
            <li>littlebigsnake</li>
            <li>wormszoneio</li>
            <li>slithercraft</li>
            <li>moomoo</li>
            <li>zombsroyale</li>
            <li>krunker</li>
            <li>lordz.io</li>
            <li>flyordie</li>
            <li>typeracer</li>
        </ul>
        <button onclick="closePopup()">Zapri</button>
    </div>

    <script>
        const searchInput = document.getElementById('search');
        const searchForm = document.getElementById('searchForm');
        const resultFrame = document.getElementById('resultFrame');
        const popupButton = document.getElementById('popupButton');
        const popup = document.getElementById('popup');

        const links = {
            "among": "https://www.onlinegames.io/games/2023/construct/234/among-impostor/index.html",
            "archer hero": "https://www.onlinegames.io/games/2023/unity/archer-hero/index.html",
            "warstrike": "https://cloud.onlinegames.io/games/2024/unity3/warstrike/index-og.html",
            "drift": "https://www.onlinegames.io/games/2024/unity/drift-king/index.html",
            "bob": "https://html5.gamedistribution.com/18d28481ea514f3c838f9a5a355fb0f7/?gd_sdk_referrer_url=https://gamedistribution.com/games/bob-the-robber/",
            "diep": "https://diep.io",
            "wormate": "https://wormate.io",
            "littlebigsnake": "https://littlebigsnake.com",
            "wormszoneio": "https://wormszone.io",
            "slithercraft": "https://slithercraft.io",
            "moomoo": "https://moomoo.io",
            "zombsroyale": "https://zombsroyale.io",
            "krunker": "https://krunker.io",
            "lordz.io": "https://lordz.io",
            "flyordie": "https://flyordie.io",
            "typeracer": "https://play.typeracer.com"
        };

        searchInput.addEventListener('input', () => {
            const value = searchInput.value.toLowerCase();
            if (links[value]) {
                searchForm.classList.add('active');
                resultFrame.src = links[value];
                resultFrame.classList.add('active');
            } else {
                searchForm.classList.remove('active');
                resultFrame.src = '';
                resultFrame.classList.remove('active');
            }
        });

        popupButton.addEventListener('click', () => {
            popup.style.display = 'block';
        });

        function closePopup() {
            popup.style.display = 'none';
        }
    </script>
</body>
</html>
