<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>Avatar animacija z gumbom (5 sekund) - test model</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    canvas { display: block; }
    #btnAnimate {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #008CBA;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      user-select: none;
      z-index: 10;
    }
    #btnAnimate:active {
      background-color: #005f73;
    }
  </style>
</head>
<body>

<button id="btnAnimate">Zaženi animacijo (5s)</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.153.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.153.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
  let scene, camera, renderer, avatar, mixer, clock;
  let currentAction;
  let actions = {};

  init();
  animate();

  function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xaaaaaa);

    camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.5, 3);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(1, 2, 3);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    clock = new THREE.Clock();

    const loader = new THREE.GLTFLoader();

    // Tu je testni model z animacijami
    loader.load('https://threejs.org/examples/models/gltf/Soldier.glb', function(gltf) {
      avatar = gltf.scene;
      avatar.scale.set(1,1,1);
      scene.add(avatar);

      mixer = new THREE.AnimationMixer(avatar);

      gltf.animations.forEach(clip => {
        actions[clip.name.toLowerCase()] = mixer.clipAction(clip);
        console.log(`Animacija na voljo: ${clip.name}`);
      });

      if(actions['idle']) {
        currentAction = actions['idle'];
      } else {
        currentAction = Object.values(actions)[0];
      }
      currentAction.play();
    }, undefined, function(error) {
      console.error('Napaka pri nalaganju modela:', error);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    document.getElementById('btnAnimate').addEventListener('click', () => {
      // Preizkusimo animacijo "run" ali "walk"
      if (actions['run']) {
        switchAnimationForDuration('run', 5000);
      } else if (actions['walk']) {
        switchAnimationForDuration('walk', 5000);
      } else {
        alert('Animacije "run" ali "walk" ni na voljo pri tem modelu.');
      }
    });
  }

  function switchAnimationForDuration(name, duration) {
    name = name.toLowerCase();
    if(!actions[name]) {
      console.warn(`Animacija "${name}" ni najdena.`);
      return;
    }
    if(currentAction === actions[name]) return;

    currentAction.fadeOut(0.3);
    currentAction = actions[name];
    currentAction.reset().fadeIn(0.3).play();

    setTimeout(() => {
      if(actions['idle']) {
        currentAction.fadeOut(0.3);
        currentAction = actions['idle'];
        currentAction.reset().fadeIn(0.3).play();
      }
    }, duration);
  }

  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    if(mixer) mixer.update(delta);
    renderer.render(scene, camera);
  }
</script>

</body>
</html>
