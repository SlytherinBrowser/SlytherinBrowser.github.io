     .eye {

}

.pupil {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background-color: black;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.2s ease-in-out;
    box-shadow: 0 0 5px rgba(0, 0, 0, 0.5); /* Dodana senca zenici */
}

.eye:hover .pupil {
    transform: translate(-50%, -50%) scale(1.2); /* Dinamična velikost zenice */
}
</style>

<script>
    function checkTime() {
        let now = new Date();
        let hour = now.getHours();
        let nightMode = (hour >= 19 || hour < 6); // Noč od 19:00 do 06:00

        // Prejšnje stanje v localStorage
        let previousState = localStorage.getItem("nightMode");

        if (nightMode && previousState !== "true") {
            // Prehod v noč -> Shrani stanje in preusmeri
            localStorage.setItem("nightMode", "true");
            window.location.href = "newbrowser.html";
        } 
        else if (!nightMode && previousState !== "false") {
            // Prehod v dan -> Shrani stanje in preusmeri
            localStorage.setItem("nightMode", "false");
            window.location.href = "index.html";
        }
    }

    // Preveri ob nalaganju strani
    checkTime();

    // Preverja vsako minuto, če je treba osvežiti/preusmeriti
    setInterval(checkTime, 60000);




</script>
              <script>
const setLinkButton = document.querySelector('.set-link');
const popup = document.querySelector('.popup');
const linkInput = document.getElementById('linkInput');
const saveLinkButton = document.getElementById('saveLink');
const closePopupButton = document.getElementById('closePopup');

// Naloži povezavo iz lokalnega shranjevanja
const loadLink = () => {
    const savedLink = localStorage.getItem('savedLink');
    return savedLink || '';
};

let currentLink = loadLink();

// Prikaži pop-up ali odpri povezavo
setLinkButton.addEventListener('click', () => {
    if (!currentLink) {
        // Če povezava ni shranjena, pokaži pop-up
        popup.style.display = 'block';
    } else {
        // Če povezava obstaja, jo odpri
        window.open(currentLink, '_blank');
    }
});

// Shrani povezavo in zapri pop-up
saveLinkButton.addEventListener('click', () => {
    const url = linkInput.value.trim();
    if (url) {
        currentLink = url;
        localStorage.setItem('savedLink', currentLink);
        popup.style.display = 'none';
        linkInput.value = '';
    } else {
        alert('Prosim, vnesite veljaven URL.');
    }
});

// Zapri pop-up ob kliku na gumb "Zapri"
closePopupButton.addEventListener('click', () => {
    popup.style.display = 'none';
});









 const pupils = document.querySelectorAll('.pupil');
    let isBlinking = false;
    let lastPositions = [{x: 0, y: 0}, {x: 0, y: 0}];

    function moveEyes(event) {
        if (isBlinking) return; // Če oči mežikajo, ne premikaj pupil

        const mouseX = event.clientX || event.touches[0].clientX;
        const mouseY = event.clientY || event.touches[0].clientY;

        const eyes = document.querySelectorAll('.eye');
        eyes.forEach((eye, index) => {
            const eyeRect = eye.getBoundingClientRect();
            const eyeCenterX = eyeRect.left + eyeRect.width / 2;
            const eyeCenterY = eyeRect.top + eyeRect.height / 2;

            const angle = Math.atan2(mouseY - eyeCenterY, mouseX - eyeCenterX);
            const distance = Math.min(eyeRect.width / 4, eyeRect.height / 4);

            const pupil = pupils[index];
            const newX = Math.cos(angle) * distance;
            const newY = Math.sin(angle) * distance;

            pupil.style.transform = `translate(-50%, -50%) translate(${newX}px, ${newY}px)`;

            lastPositions[index] = {x: newX, y: newY};
        });
    }

    function blink() {
        if (isBlinking) return;

        isBlinking = true;
        pupils.forEach(pupil => {
            pupil.style.transform = 'translate(-50%, -50%) scale(0)';
        });

        setTimeout(() => {
            pupils.forEach((pupil, index) => {
                pupil.style.transform = `translate(-50%, -50%) translate(${lastPositions[index].x}px, ${lastPositions[index].y}px) scale(1)`;
            });
            isBlinking = false;
        }, 200);
    }

    // Zavijanje z očmi vsakih 5 sekund
    setInterval(() => {
        blink();
    }, 5000);

    // Dogodki za premikanje miške ali dotik
    document.addEventListener('mousemove', moveEyes);
    document.addEventListener('touchmove', (event) => {
        event.preventDefault();
        moveEyes(event);
    });

    // Dodajanje dogodkov za klik na oči
document.querySelector('.eye-left').addEventListener('click', () => {
    window.open('pogodba.html', '_blank'); // Stran za levo oko
});

document.querySelector('.eye-right').addEventListener('click', () => {
    window.open('m.html', '_blank'); // Stran za desno oko
});

    </script>
