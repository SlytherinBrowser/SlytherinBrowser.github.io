    <style>
    .eye-container {
        position: fixed;
        top: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .eye {
            width: 100px;
            height: 100px;
            background-color: white;
            border-radius: 50%;
            position: relative;
            margin: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .pupil {
            width: 40px;
            height: 40px;
            background-color: black;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease;
        }
.popupBackup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 25px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            width: 300px;
            text-align: center;
            font-family: Arial, sans-serif;
            animation: fadeIn 0.3s ease-in-out;
        }
     @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -55%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        
        .popupBackup button {
            margin-top: 10px;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        .popupBackup button:first-of-type {
            background: #4CAF50;
            color: white;
        }
        .popupBackup button:first-of-type:hover {
            background: #45a049;
        }
        
        .popupBackup button:last-of-type {
            background: #f44336;
            color: white;
        }
        .popupBackup button:last-of-type:hover {
            background: #d32f2f;
        }
        
        #fileInput {
            margin-top: 10px;
        }
    </style>
</head>

<script>












    function checkTime() {
        let now = new Date();
        let hour = now.getHours();
        let nightMode = (hour >= 19 || hour < 6); // Noč od 19:00 do 06:00

        // Prejšnje stanje v localStorage
        let previousState = localStorage.getItem("nightMode");

        if (nightMode && previousState !== "true") {
            // Prehod v noč -> Shrani stanje in preusmeri
            localStorage.setItem("nightMode", "true");
            window.location.href = "newbrowser.html";
        } 
        else if (!nightMode && previousState !== "false") {
            // Prehod v dan -> Shrani stanje in preusmeri
            localStorage.setItem("nightMode", "false");
            window.location.href = "index.html";
        }
    }

    // Preveri ob nalaganju strani
    checkTime();

    // Preverja vsako minuto, če je treba osvežiti/preusmeriti
    setInterval(checkTime, 60000);




</script>
              <script>
const setLinkButton = document.querySelector('.set-link');
const popup = document.querySelector('.popup');
const linkInput = document.getElementById('linkInput');
const saveLinkButton = document.getElementById('saveLink');
const closePopupButton = document.getElementById('closePopup');

// Naloži povezavo iz lokalnega shranjevanja
const loadLink = () => {
    const savedLink = localStorage.getItem('savedLink');
    return savedLink || '';
};

let currentLink = loadLink();

// Prikaži pop-up ali odpri povezavo
setLinkButton.addEventListener('click', () => {
    if (!currentLink) {
        // Če povezava ni shranjena, pokaži pop-up
        popup.style.display = 'block';
    } else {
        // Če povezava obstaja, jo odpri
        window.open(currentLink, '_blank');
    }
});

// Shrani povezavo in zapri pop-up
saveLinkButton.addEventListener('click', () => {
    const url = linkInput.value.trim();
    if (url) {
        currentLink = url;
        localStorage.setItem('savedLink', currentLink);
        popup.style.display = 'none';
        linkInput.value = '';
    } else {
        alert('Prosim, vnesite veljaven URL.');
    }
});

// Zapri pop-up ob kliku na gumb "Zapri"
closePopupButton.addEventListener('click', () => {
    popup.style.display = 'none';
});








    </script>

<script>
        const eyes = document.querySelectorAll('.eye');
        const pupils = document.querySelectorAll('.pupil');

        document.addEventListener('mousemove', (e) => {
            const mouseX = e.clientX;
            const mouseY = e.clientY;

            eyes.forEach((eye, index) => {
                const rect = eye.getBoundingClientRect();
                const eyeX = rect.left + rect.width / 2;
                const eyeY = rect.top + rect.height / 2;

                const angle = Math.atan2(mouseY - eyeY, mouseX - eyeX);
                const distance = Math.min(eye.offsetWidth / 4, eye.offsetHeight / 4);

                const pupil = pupils[index];
                pupil.style.transform = `translate(-50%, -50%) translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px)`;
            });
        });
    </script>
   <script>
        // Funkcija za prikaz backup popup okna
function showBackupPopup() {
    const popupBackup = document.createElement("div");
    popupBackup.classList.add("popupBackup");
    popupBackup.innerHTML = `
        <h2>LocalStorage Backup & Restore</h2>
        <button onclick="exportLocalStorage()">Izvozi LocalStorage</button>
        <input type="file" id="fileInput" onchange="importLocalStorage(event)">
        <button onclick="this.parentElement.remove()">Zapri</button>
    `;
    document.body.appendChild(popupBackup);
    popupBackup.style.display = "block";
}

// Povezava dogodka s funkcijo
document.getElementById("backupButton").addEventListener("click", showBackupPopup);

        function exportLocalStorage() {
            const data = JSON.stringify(localStorage);
            const blob = new Blob([data], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "localStorageBackup.json";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
        
        function importLocalStorage(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    for (const key in data) {
                        localStorage.setItem(key, data[key]);
                    }
                    alert("LocalStorage uspešno obnovljen!");
                } catch (error) {
                    alert("Napaka pri uvozu datoteke.");
                }
            };
            reader.readAsText(file);
        }
    </script>

       <script>
const container = document.getElementById("container");
const addIconForm = document.getElementById("addIconForm");
const addIconBtn = document.getElementById("addIconBtn");
const iconNameInput = document.getElementById("iconName");
const iconLinkInput = document.getElementById("iconLink");
const categorySelect = document.getElementById("categorySelect");

const categories = [
    {
        name: "Domov",
        icons: [
            { name: "📂", link: "chosemenu.html" },
            { name: "🌙", link: "newbrowser.html" },
            { name: "🔄", link: "javascript:void(0)", action: "handleButtonClick" },
            { name: "💾", link: "javascript:void(0)", action: "showBackupPopup" },
            { name: "⚙️", link: "javascript:void(0)", action: "toggleElement" }
        ],
        color: "#9b59b6"
    },
    {
        name: "Osnovno",
        icons: [
            { name: "📫", link: "https://mail.google.com" },
            { name: "🗂", link: "https://drive.google.com" },
            { name: "🔗", link: "https://drive.google.com/file/d/1O7jFqO1donJeaD8cxgXaBEkVDmuSmMAm/view?usp=sharing" },
            { name: "📅", link: "https://calendar.google.com" }
        ],
        color: "#e67e22"
    },
    {
        name: "Zabava",
        icons: [
            { name: "▶", link: "https://www.youtube.com" },
            { name: "N", link: "https://www.netflix.com" },
            { name: "V", link: "https://www.voyo.si" }
        ],
        color: "#e74c3c"
    },
    {
        name: "Chatbot",
        icons: [
            { name: "💬", link: "https://chat.openai.com" },
            { name: "🐍", link: "auth.html" },
            { name: "👾", link: "https://slytherin.ai" }
        ],
        color: "#2ecc71"
    },
    {
        name: "Moje Ikone",
        icons: [
            { name: "🤖", link: "javascript:void(0)", action: "toggleChatPopup" },
            { name: "🗓️", link: "javascript:void(0)", action: "toggleCalendar" },
            { name: "🧮", link: "javascript:void(0)", action: "toggleCalculator" }
        ],
        color: "#3498db"
    }
];

let currentCategory = 0;
let isDock = false;

function showDockIcons() {
    container.innerHTML = "";
    categories[currentCategory].icons.forEach(icon => {
        const el = document.createElement("div");
        el.className = "icon";
        el.textContent = icon.name;
        el.onclick = (e) => {
            e.stopPropagation();
            if (icon.action) {
                window[icon.action]?.();
            } else {
                window.open(icon.link, "_blank");
            }
        };
        container.appendChild(el);
    });

    // Dodaj gumb za zapiranje
    const closeIcon = document.createElement("div");
    closeIcon.className = "icon";
    closeIcon.textContent = "❌";
    closeIcon.onclick = (e) => {
        e.stopPropagation();
        isDock = false;
        container.classList.remove("dock");
        showCategoryText();
    };
    container.appendChild(closeIcon);
}

function showCategoryText() {
    container.innerHTML = categories[currentCategory].name;
    container.style.background = categories[currentCategory].color;
}

function changeCategory(direction) {
    if (direction === "up") {
        currentCategory = (currentCategory - 1 + categories.length) % categories.length;
    } else {
        currentCategory = (currentCategory + 1) % categories.length;
    }
    if (isDock) {
        showDockIcons();
    } else {
        showCategoryText();
    }
}

function addCustomIcon(name, link, categoryIndex) {
    categories[categoryIndex].icons.push({ name, link });
}

function addIcon() {
    const name = iconNameInput.value;
    const link = iconLinkInput.value;
    const categoryIndex = categorySelect.value;

    if (name && link) {
        addCustomIcon(name, link, categoryIndex);
        iconNameInput.value = '';
        iconLinkInput.value = '';
        addIconForm.style.display = 'none';
        showDockIcons();
    } else {
        alert("Prosim, vnesite ime in URL ikone!");
    }
}

addIconBtn.addEventListener("click", addIcon);

// TAP za odprtje docka
container.addEventListener("click", (e) => {
    if (!isDock && !e.target.classList.contains("icon")) {
        isDock = true;
        container.classList.add("dock");
        showDockIcons();
    }
});

// SWIPE podpora
let startY = 0;
container.addEventListener("touchstart", e => {
    startY = e.touches[0].clientY;
});
container.addEventListener("touchend", e => {
    const endY = e.changedTouches[0].clientY;
    const dy = endY - startY;
    if (Math.abs(dy) > 30) {
        changeCategory(dy < 0 ? "up" : "down");
    }
});

// KOLESČEK za vse naprave
container.addEventListener("wheel", (e) => {
    e.preventDefault();
    changeCategory(e.deltaY < 0 ? "up" : "down");
}, { passive: false });

// Začetni prikaz
showCategoryText();

// Dummy funkcije za akcije
function toggleChatPopup() { alert("Chat popup!"); }
function toggleCalendar() { alert("Calendar opened!"); }
function toggleCalculator() { alert("Calculator opened!"); }
function toggleElement() { alert("Element toggled!"); }
function showBackupPopup() { alert("Backup popup!"); }
function handleButtonClick() { location.reload(); }
</script>
