<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Chat (MiniMaxAI)</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }
    .chat-box {
      border: 1px solid #ccc;
      height: 400px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
      background: #f9f9f9;
    }
    .message {
      margin: 10px 0;
    }
    .user {
      color: blue;
    }
    .assistant {
      color: green;
    }
  </style>
</head>
<body>
  <h2>MiniMaxAI Chat</h2>
  <div class="chat-box" id="chatBox"></div>
  <input type="text" id="userInput" placeholder="Vnesi sporočilo..." style="width: 80%;">
  <button onclick="sendMessage()">Pošlji</button>

  <script type="module">
    import { InferenceClient } from "https://cdn.skypack.dev/@huggingface/inference";

    const HF_TOKEN = "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"; // 🔒 TUKAJ VSTAVI SVOJ TOKEN
    const client = new InferenceClient(HF_TOKEN);

    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");

    const messages = [];

    async function sendMessage() {
      const userMessage = userInput.value.trim();
      if (!userMessage) return;

      // Dodaj sporočilo uporabnika
      messages.push({ role: "user", content: userMessage });
      appendMessage("user", userMessage);
      userInput.value = "";
      userInput.disabled = true;

      try {
        const result = await client.chatCompletion({
          provider: "novita",
          model: "MiniMaxAI/MiniMax-M1-80k",
          messages: messages,
        });

        const aiReply = result.choices[0].message.content;
        messages.push({ role: "assistant", content: aiReply });
        appendMessage("assistant", aiReply);
      } catch (error) {
        appendMessage("assistant", "Napaka pri odgovoru AI: " + error.message);
      }

      userInput.disabled = false;
      userInput.focus();
    }

    function appendMessage(role, text) {
      const msg = document.createElement("div");
      msg.className = "message " + role;
      msg.textContent = (role === "user" ? "Ti: " : "AI: ") + text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Pošlji s tipko Enter
    userInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
