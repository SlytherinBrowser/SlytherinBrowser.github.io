<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hogwartsbrowser</title>
     <link id="favicon" rel="icon" href="Slytherin.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .search-bar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            padding: 12px;
            border-radius: 40px;
            border: none;
            background-color: black;
            color: white;
            text-align: center;
        }
        .container {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: calc(97vh - 120px);
            background: white;
            border-radius: 40px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: black;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
        }

        .nav-item {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            text-decoration: none;
            padding: 5px 15px;
            transition: color 0.3s, text-shadow 0.3s;
            cursor: pointer;
        }

        .nav-item:hover {
            color: white;
            text-shadow: 0 0 10px white;
        }

        .nav-item.active {
            color: white;
            text-shadow: 0 0 10px white;
        }
        #logo {
            width: 70px;
            height: 70px;
        }
        .quick-links {
            position: absolute;
            top: 15px;
            display: flex;
            gap: 15px;
        }
        .quick-links.left {
            left: 90px;
        }
        .quick-links.right {
            right: 10px;
        }
        .quick-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        .quick-links a:hover {
            color: lightgray;
        }
    </style>
</head>
<body>
    <div class="container-wrapper">
        <img id="logo" src="Slytherin.png"></img>
        <div class="quick-links left">
            <a href="https://mail.google.com" target="_blank">Gmail</a>
            <a href="https://drive.google.com" target="_blank">Google Drive</a>
        </div>
        <input type="text" class="search-bar" id="search" placeholder="Išči...">
        <div class="quick-links right">
            <a href="https://www.youtube.com" target="_blank">YouTube</a>
            <a href="https://chat.openai.com" target="_blank">ChatGPT</a>
        </div>
        <div class="container">
            <iframe id="browser-frame" src="comand.html"></iframe>
        </div>
        <div class="nav-bar">
            <a href="chosemenu.html" class="nav-item">Meni</a>
             <a class="nav-item" onclick="resetFrame()">Domov</a>
            <a onclick="goHome()"class="nav-item">Clasic</a>
        </div>
    </div>

    <script>
document.getElementById('search').addEventListener('keypress', function(event) {
    if (event.key === 'Enter') {
        let query = this.value.trim();
        if (query) {
            try {
                let url = new URL(query.includes('://') ? query : 'http://' + query);
                if (url.hostname.includes('.')) {
                    localStorage.setItem("lastSearch", url.href); // Shrani zadnji obiskani URL
                    window.open(url.href, '_blank');
                    return;
                }
            } catch (e) {}

            let searchUrl = 'https://www.google.com/search?q=' + encodeURIComponent(query);
            localStorage.setItem("lastSearch", searchUrl); // Shrani zadnje iskanje
            window.open(searchUrl, '_blank');
        }
    }
});

// Klik na sliko odpre zadnje iskanje
document.getElementById('logo').addEventListener('click', function() {
    let lastSearch = localStorage.getItem("lastSearch");
    if (lastSearch) {
        window.open(lastSearch, '_blank');
    }
});

function goHome() {
    window.location.href = "index.html"; // Preprosto odpre index.html
}

function checkTime() {
    let now = new Date();
    let hour = now.getHours();
    let nightMode = (hour >= 19 || hour < 6); // Noč od 19:00 do 06:00

    let previousState = localStorage.getItem("nightMode");

    if (nightMode && previousState !== "true") {
        localStorage.setItem("nightMode", "true");
        window.location.href = "newbrowser.html";
    } 
    else if (!nightMode && previousState !== "false") {
        localStorage.setItem("nightMode", "false");
        window.location.href = "index.html";
    }
}

checkTime();
setInterval(checkTime, 60000);
    </script>
</body>
</html>
