<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>Slychat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: url('slika.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      width: 90%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    h2 {
      text-align: center;
      font-weight: 500;
    }

    #chatBox {
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #chatBox div {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      padding: 10px 15px;
      color: #fff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
      word-wrap: break-word;
      font-size: 0.95em;
    }

    #chatBox .sender {
      font-weight: 600;
      color: #ffd700;
      margin-right: 6px;
    }

    input[type='text'] {
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      color: white;
      outline: none;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .btn {
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover {
      background-color: rgba(255, 255, 255, 0.25);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    #userSearch {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    #chatOptions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    #friendList {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    @media (max-width: 480px) {
      .actions {
        flex-direction: column;
      }

      #chatOptions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Slychat</h2>
    <div id="chatBox"></div>
    <input type="text" id="messageInput" placeholder="Vpiši sporočilo..." />
    <div class="actions">
      <button class="btn" onclick="sendMessage()">Pošlji</button>
      <button class="btn" onclick="logout()">Odjava</button>
      <button class="btn" onclick="toggleSearch()">Iskanje uporabnikov</button>
    </div>

    <div id="userSearch">
      <input type="text" id="searchInput" placeholder="Vnesi email uporabnika..." />
      <button class="btn" onclick="sendFriendRequest()">Dodaj prijatelja</button>
    </div>

    <div id="chatOptions">
      <button class="btn" onclick="setChatMode('public')">Public chat</button>
      <button class="btn" onclick="showChatList()">Seznam pogovorov</button>
    </div>

    <div id="friendList"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad",
      measurementId: "G-32E3BYYLKS",
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const chatBox = document.getElementById("chatBox");
    const messageInput = document.getElementById("messageInput");
    const friendListDiv = document.getElementById("friendList");

    let currentChatUser = null;
    let chatMode = "public";

    auth.onAuthStateChanged((user) => {
      if (!user) {
        window.location.href = "auth.html";
      } else {
        setChatMode("public");

        const userKey = user.email.replace(/\./g, "_");
        db.ref(`friendRequests/${userKey}`).on("child_added", (snapshot) => {
          const requesterKey = snapshot.key;
          const requesterEmail = requesterKey.replace(/_/g, ".");
          const confirm = window.confirm(`${requesterEmail} te želi dodati. Potrdi?`);

          if (confirm) {
            db.ref(`friends/${userKey}/${requesterKey}`).set(true);
            db.ref(`friends/${requesterKey}/${userKey}`).set(true);
          }
          snapshot.ref.remove();
        });
      }
    });

    function setChatMode(mode) {
      chatMode = mode;
      currentChatUser = null;
      chatBox.innerHTML = "";
      friendListDiv.style.display = "none";

      if (mode === "public") {
        db.ref("messages").off();
        db.ref("messages").on("child_added", (snapshot) => {
          const msg = snapshot.val();
          addMessageToChat(msg.email, msg.text);
        });
      }
    }

    function loadPrivateChat() {
      chatBox.innerHTML = "";
      const user = auth.currentUser;
      if (!currentChatUser) return;

      const chatId = [user.email, currentChatUser].sort().join("_").replace(/\./g, "_");

      db.ref(`privateMessages/${chatId}`).off();
      db.ref(`privateMessages/${chatId}`).on("child_added", (snapshot) => {
        const msg = snapshot.val();
        addMessageToChat(msg.email, msg.text);
      });
    }

    function sendMessage() {
      const user = auth.currentUser;
      const text = messageInput.value.trim();
      if (!text) return;

      if (text === "/clearchat") {
        if (chatMode === "public") {
          db.ref("messages").remove().then(() => (chatBox.innerHTML = ""));
        } else {
          const chatId = [user.email, currentChatUser].sort().join("_").replace(/\./g, "_");
          db.ref(`privateMessages/${chatId}`).remove().then(() => (chatBox.innerHTML = ""));
        }
      } else {
        if (chatMode === "public") {
          db.ref("messages").push({ email: user.email, text });
        } else {
          const chatId = [user.email, currentChatUser].sort().join("_").replace(/\./g, "_");
          db.ref(`privateMessages/${chatId}`).push({ email: user.email, text });
        }
      }

      messageInput.value = "";
    }

    function logout() {
      auth.signOut().then(() => (window.location.href = "auth.html"));
    }

    function toggleSearch() {
      const box = document.getElementById("userSearch");
      box.style.display = box.style.display === "none" ? "flex" : "none";
    }

    function sendFriendRequest() {
      const user = auth.currentUser;
      const targetEmail = document.getElementById("searchInput").value.trim();

      if (!targetEmail || targetEmail === user.email) {
        alert("Vnesi veljaven email drugega uporabnika.");
        return;
      }

      const targetKey = targetEmail.replace(/\./g, "_");
      const userKey = user.email.replace(/\./g, "_");

      // Preveri, če uporabnik obstaja
      db.ref(`users/${targetKey}`).once("value").then((snapshot) => {
        if (snapshot.exists()) {
          db.ref(`friendRequests/${targetKey}/${userKey}`).set(true);
          alert("Zahteva poslana.");
        } else {
          alert("Uporabnik ne obstaja.");
        }
      });
    }

    function addMessageToChat(email, text) {
      const msgDiv = document.createElement("div");
      const senderSpan = document.createElement("span");
      senderSpan.classList.add("sender");
      senderSpan.textContent = email + ": ";
      msgDiv.appendChild(senderSpan);
      msgDiv.appendChild(document.createTextNode(text));
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showChatList() {
      const user = auth.currentUser;
      const userKey = user.email.replace(/\./g, "_");

      friendListDiv.innerHTML = "";
      friendListDiv.style.display = "flex";

      db.ref(`friends/${userKey}`).once("value", (snapshot) => {
        const list = snapshot.val();
        if (!list) {
          friendListDiv.innerHTML = "<div>Ni prijateljev.</div>";
          return;
        }

        Object.keys(list).forEach((key) => {
          const friendEmail = key.replace(/_/g, ".");
          const btn = document.createElement("button");
          btn.textContent = friendEmail;
          btn.className = "btn";
          btn.onclick = () => {
            currentChatUser = friendEmail;
            chatMode = "private";
            friendListDiv.style.display = "none";
            loadPrivateChat();
          };
          friendListDiv.appendChild(btn);
        });
      });
    }
  </script>
</body>
</html>
