<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Chat</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f1f1f1;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .auth-container, .chat-container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 400px;
            max-width: 100%;
        }
        h2 {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }
        .auth-container input, .input-container input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #f9f9f9;
            transition: border-color 0.3s ease;
        }
        .auth-container input:focus, .input-container input:focus {
            border-color: #4CAF50;
        }
        .auth-container button, .input-container button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .auth-container button:hover, .input-container button:hover {
            background-color: #45a049;
        }
        .auth-toggle {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: #007BFF;
            cursor: pointer;
            text-decoration: underline;
        }
        .messages {
            background-color: #f9f9f9;
            padding: 20px;
            height: 300px;
            overflow-y: auto;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }
        .message {
            padding: 12px;
            margin: 10px 0;
            background-color: #e8e8e8;
            border-radius: 8px;
            font-size: 16px;
            word-wrap: break-word;
        }
        .message .sender {
            font-weight: bold;
            color: #333;
        }
        .input-container {
            display: flex;
            justify-content: space-between;
        }
        .input-container input {
            width: 80%;
            border-radius: 8px;
            font-size: 16px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            padding: 12px;
            margin-right: 10px;
        }
        .input-container button {
            width: 15%;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .input-container button:hover {
            background-color: #45a049;
        }
        .auth-container p {
            font-size: 14px;
            color: #555;
        }
        .auth-container p a {
            color: #007BFF;
            text-decoration: none;
        }
        .auth-container p a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="chat-container" class="chat-container" style="display: none;">
        <h2>Chat Room</h2>
        <div id="messages" class="messages"></div>
        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Type a message" disabled>
            <button onclick="sendMessage()" disabled>Send</button>
        </div>
        <button onclick="signOut()">Sign out</button>
    </div>

    <div id="auth-container" class="auth-container">
        <div id="register-form" style="display: none;">
            <h2>Register</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <input type="text" id="username" placeholder="Username (for registration)">
            <button onclick="register()">Register</button>
            <p id="auth-message"></p>
            <p class="auth-toggle" onclick="toggleAuthForm('login')">Already have an account? Login</p>
        </div>

        <div id="login-form">
            <h2>Login</h2>
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-password" placeholder="Password">
            <button onclick="login()">Login</button>
            <p id="login-message"></p>
            <p class="auth-toggle" onclick="toggleAuthForm('register')">Don't have an account? Register</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2l2SEcXPrLGpSOiTyyC55l35OMln1VUM",
            authDomain: "slychat-e0a59.firebaseapp.com",
            projectId: "slychat-e0a59",
            storageBucket: "slychat-e0a59.appspot.com",
            messagingSenderId: "462724887870",
            appId: "1:462724887870:web:72d25e58b20af6e2d2286f",
            measurementId: "G-52CMK3FJYW"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // Check if user is logged in on page load
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('chat-container').style.display = 'block';
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('messageInput').disabled = false;
                document.querySelector('button').disabled = false;
                listenForMessages();
            } else {
                document.getElementById('chat-container').style.display = 'none';
                document.getElementById('auth-container').style.display = 'block';
                document.getElementById('messageInput').disabled = true;
                document.querySelector('button').disabled = true;
            }
        });

        // Register user
        function register() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const username = document.getElementById('username').value;

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    userCredential.user.updateProfile({
                        displayName: username
                    });
                    document.getElementById('auth-message').innerText = "Registered successfully!";
                    toggleAuthForm('login');
                })
                .catch((error) => {
                    document.getElementById('auth-message').innerText = error.message;
                });
        }

        // Login user
        function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    document.getElementById('login-message').innerText = "Logged in successfully!";
                    document.getElementById('chat-container').style.display = 'block';
                    document.getElementById('auth-container').style.display = 'none';
                    document.getElementById('messageInput').disabled = false;
                    document.querySelector('button').disabled = false;
                    listenForMessages();
                })
                .catch((error) => {
                    document.getElementById('login-message').innerText = error.message;
                });
        }

        // Toggle between login and register form
        function toggleAuthForm(form) {
            if (form === 'register') {
                document.getElementById('register-form').style.display = "block";
                document.getElementById('login-form').style.display = "none";
            } else {
                document.getElementById('login-form').style.display = "block";
                document.getElementById('register-form').style.display = "none";
            }
        }

        // Listen for new messages
        function listenForMessages() {
            const messagesRef = database.ref('messages');
            messagesRef.on('child_added', function(snapshot) {
                const message = snapshot.val();
                displayMessage(message);
            });
        }

        // Display message
        function displayMessage(message) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');
            messageDiv.innerHTML = `<span class="sender">${message.username}:</span> ${message.text}`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Send message
        function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const messageText = messageInput.value;
            if (messageText.trim() !== '') {
                const username = auth.currentUser.displayName;
                const messageRef = database.ref('messages');
                messageRef.push({
                    username: username,
                    text: messageText
                });
                messageInput.value = '';
            }
        }

        // Sign out user
        function signOut() {
            auth.signOut().then(() => {
                document.getElementById('chat-container').style.display = 'none';
                document.getElementById('auth-container').style.display = 'block';
            });
        }
    </script>
</body>
</html>
