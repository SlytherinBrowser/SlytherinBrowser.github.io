  async function sendMessage() {  


    if (!currentUser) return;  

    const textRaw = messageInput.value.trim();  

    if (!textRaw) return;  












    // Če še nima imena - potrdi  

    if (messageInput.dataset.nameConfirm === "1") {  

      await db.ref("users/" + currentUser.uid).update({  

        displayName: textRaw

      alert("Ime potrjeno: " + textRaw);  

      messageInput.value = "";  

      return;  

    }  



    // Ukaz za spremembo imena: *name*novoime  

    if (textRaw.startsWith("*name*")) {  

      const newName = textRaw.slice(6).trim();  

      if (!newName) {  

        alert("Vpiši novo ime za spremembo.");  

        messageInput.value = "";  

        return;  

      }  

      await db.ref("users/" + currentUser.uid).update({ displayName: newName });  

      userNamesCache[currentUser.uid] = newName;  

      alert("Ime je bilo spremenjeno na: " + newName);  

      messageInput.value = "";  

      return;  

    }  



    // Ukaz za spremembo barve imena: *color*barva  

    if (textRaw.startsWith("*color*")) {

  await db.ref("users/" + currentUser.uid).update({ color: "none" });
  userColorsCache[currentUser.uid] = "none";
  alert("Ime bo zdaj nevidno.");
} else {
  const s = new Option().style;

    messageInput.value = "";
    return;

  await db.ref("users/" + currentUser.uid).update({ color: colorVal });
  userColorsCache[currentUser.uid] = colorVal;
  alert("Barva imena nastavljena na: " + colorVal);
}

      messageInput.value = "";

      return;

  // Razdelimo na posamezne uporabniške povabile (npr. "@ime1", "@ime2")

  invitedUids.forEach(uid => {

      privateUid: uid

  messageInput.value = "";

    let hidden = isHiddenMode;

// === SPLOŠNE SPREMENLJIVKE ===
let rotationDegree = 0;
const rotationStep = 12;
let moves = [];
const maxMoves = 8;

let selfDestructActive = false;
let selfDestructEndTimestamp = null;
let selfDestructUnlimited = false;
let masterControlActive = false;
let currentUserId = null;  // trenutno prijavljeni uporabnik

// === FIREBASE REALTIME REFERENCA ===
const database = firebase.database();
const selfDestructRef = database.ref('system/selfDestruct');

// === INICIALIZACIJA DOKUMENTA (ENKRATNO BERE) ===
async function initializeSelfDestructDoc() {
  const snapshot = await selfDestructRef.once('value');
  if (!snapshot.exists()) {
    await selfDestructRef.set({
      active: false,
      unlimited: false,
      endTimestamp: null
    });
    console.log("Self destruct dokument je bil ustvarjen v Realtime Database.");
  } else {
    const data = snapshot.val();
    selfDestructActive = data.active;
    selfDestructUnlimited = data.unlimited;
    selfDestructEndTimestamp = data.endTimestamp;

    if (selfDestructActive) {
      disableChat();
      if (!selfDestructUnlimited && selfDestructEndTimestamp) {
        startSelfDestructTimer();
      }
    }
    console.log("Self destruct dokument že obstaja in je stanje naloženo.");
  }
}

// --- POSLUŠANJE V REALNEM ČASU za selfDestruct ---
selfDestructRef.on('value', (snapshot) => {
  const data = snapshot.val();
  if (!data) return;

  selfDestructActive = data.active;
  selfDestructUnlimited = data.unlimited;
  selfDestructEndTimestamp = data.endTimestamp;

  if (selfDestructActive) {
    disableChat();
    if (!selfDestructUnlimited && selfDestructEndTimestamp) {
      startSelfDestructTimer();
    }
  } else {
    enableChat();
    clearInterval(window.selfDestructInterval);
  }
});

// === FUNKCIJA ZA NALAGANJE MASTER CONTROL ZA TRENUTNEGA UPORABNIKA ===
async function loadUserMasterControl() {
  if (!currentUserId) return;
  const snapshot = await database.ref(`users/${currentUserId}/masterControl`).once('value');
  masterControlActive = snapshot.val() || false;
  console.log("Master control za uporabnika:", masterControlActive);
}

// --- POSLUŠANJE SPREMEMB MASTER CONTROL ZA TRENUTNEGA UPORABNIKA ---
function listenUserMasterControl() {
  if (!currentUserId) return;
  database.ref(`users/${currentUserId}/masterControl`).on('value', (snapshot) => {
    masterControlActive = snapshot.val() || false;
    console.log("Master control posodobljen:", masterControlActive);
  });
}

// === SELF DESTRUCT FUNKCIJE ===
async function activateSelfDestruct(duration = 60 * 60 * 1000) {
  if (!masterControlActive) {
    alert("Self destruct lahko aktivira samo master control!");
    return;
  }

  if (selfDestructActive && !selfDestructUnlimited) {
    // Preklop na neomejen self destruct
    selfDestructUnlimited = true;
    selfDestructEndTimestamp = null;
    await selfDestructRef.update({
      active: true,
      unlimited: true,
      endTimestamp: null
    });

    disableChat();
    clearInterval(window.selfDestructInterval);
    alert("Self destruct nastavljen na neomejen čas!");
    return;
  }

  selfDestructActive = true;
  selfDestructUnlimited = false;
  selfDestructEndTimestamp = Date.now() + duration;

  await selfDestructRef.update({
    active: true,
    unlimited: false,
    endTimestamp: selfDestructEndTimestamp
  });

  disableChat();
  startSelfDestructTimer();
  alert("Self destruct aktiviran za 1 uro.");
}

function disableChat() {
  messageInput.disabled = true;
  chatBox.style.opacity = '0.6';
  messageInput.placeholder = "Chat je onemogočen zaradi self destruct.";
}

function enableChat() {
  messageInput.disabled = false;
  chatBox.style.opacity = '1';
  messageInput.placeholder = "Vpiši sporočilo...";
}

function startSelfDestructTimer() {
  clearInterval(window.selfDestructInterval);
  window.selfDestructInterval = setInterval(async () => {
    if (!selfDestructEndTimestamp || selfDestructUnlimited) return;
    if (Date.now() >= selfDestructEndTimestamp) {
      selfDestructActive = false;
      selfDestructEndTimestamp = null;
      selfDestructUnlimited = false;

      await selfDestructRef.update({
        active: false,
        unlimited: false,
        endTimestamp: null
      });

      enableChat();
      clearInterval(window.selfDestructInterval);
      alert("Self destruct se je iztekel. Chat je spet omogočen.");
    }
  }, 1000);
}

async function cancelSelfDestruct() {
  if (!selfDestructActive) return alert("Self destruct ni aktiven.");
  if (!masterControlActive) return alert("Preklic samo z master control!");

  selfDestructActive = false;
  selfDestructUnlimited = false;
  selfDestructEndTimestamp = null;

  await selfDestructRef.update({
    active: false,
    unlimited: false,
    endTimestamp: null
  });

  clearInterval(window.selfDestructInterval);
  enableChat();
  alert("Self destruct je bil deaktiviran.");
}



async function activateSelfDestructForUser(username) {
  try {
    const snapshot = await firebase.database().ref(`users`).orderByChild('username').equalTo(username).once('value');
    if (!snapshot.exists()) {
      alert("Uporabnik ni bil najden.");
      return;
    }

    const userId = Object.keys(snapshot.val())[0];
    await database.ref(`userSelfDestruct/${userId}`).set({
      active: true,
      timestamp: Date.now(),
      duration: 60 * 60 * 1000
    });

    alert(`Self destruct za uporabnika ${username} aktiviran za 1 uro.`);
  } catch (error) {
    console.error("Napaka pri aktivaciji self destruct za uporabnika:", error);
  }
}

async function cancelSelfDestructForUser(username) {
  try {
    const snapshot = await firebase.database().ref(`users`).orderByChild('username').equalTo(username).once('value');
    if (!snapshot.exists()) {
      alert("Uporabnik ni bil najden.");
      return;
    }

    const userId = Object.keys(snapshot.val())[0];
    await database.ref(`userSelfDestruct/${userId}`).remove();

    alert(`Self destruct za uporabnika ${username} preklican.`);
  } catch (error) {
    console.error("Napaka pri preklicu self destruct za uporabnika:", error);
  }
}

btnZ.addEventListener('wheel', function (event) {
  event.preventDefault();
  if (selfDestructActive && !masterControlActive) return;

  rotationDegree += event.deltaY < 0 ? -rotationStep : rotationStep;
  moves.push(event.deltaY < 0 ? 'L' : 'R');
  if (moves.length > maxMoves) moves.shift();
  btnZ.style.transform = `rotate(${rotationDegree}deg)`;

  interpretCode();
});

// === GESTURE ZA MOBILNI DOTIK ===
(function () {
  let isDragging = false;
  let startX = 0;
  let currentX = 0;
  let zActive = false;

  function resetPosition() {
    btnZ.style.transition = 'transform 0.3s ease';
    btnZ.style.transform = 'translateX(0px)';
    setTimeout(() => { btnZ.style.transition = ''; }, 300);
  }

  function handleSwipe() {
    const deltaX = currentX - startX;
    if (Math.abs(deltaX) > 40) {
      const move = deltaX < 0 ? 'L' : 'R';
      moves.push(move);
      if (moves.length > maxMoves) moves.shift();
      interpretCode();
    }
    resetPosition();
  }

  function addTouchEvents() {
    btnZ.addEventListener('touchstart', (e) => {
      isDragging = true;
      startX = e.touches[0].clientX;
    });

    btnZ.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      currentX = e.touches[0].clientX;
      const deltaX = currentX - startX;
      const maxX = container.offsetWidth / 2 - btnZ.offsetWidth / 2;
      btnZ.style.transform = `translateX(${Math.max(-maxX, Math.min(maxX, deltaX))}px)`;
    });

    btnZ.addEventListener('touchend', () => {
      if (!isDragging) return;
      isDragging = false;
      handleSwipe();
    });
  }

  function toggleZMobile() {
    zActive = !zActive;
    btnZ.classList.toggle('active', zActive);
    btnH.style.display = zActive ? 'none' : 'inline-block';
  }

  btnZ.addEventListener('click', toggleZMobile);

  window.addEventListener('resize', () => {
    btnH.style.display = 'inline-block';
    container.appendChild(btnZ);
  });

  window.addEventListener('load', () => {
    addTouchEvents();
  });
})();

// === DEKODIRANJE GESTURE KODE ===
function interpretCode() {
  const code = moves.join('');

  if (code === 'LRLRLRLR') {
    if (selfDestructActive && !masterControlActive) {
      alert("Ni mogoče vključiti master control med aktivnim self destruct.");
      return;
    }
    masterControlActive = !masterControlActive;

    if (currentUserId) {
      database.ref(`users/${currentUserId}/masterControl`).set(masterControlActive)
        .catch(err => console.error("Napaka pri posodobitvi masterControl:", err));
    }

    alert(masterControlActive ? "Master control VKLOPLJEN." : "Master control IZKLOPLJEN.");

  } else if (code === 'RRLLRRRL') {
    if (!masterControlActive) {
      alert("Self destruct zahteva master control.");
      return;
    }
    if (!selfDestructActive) {
      activateSelfDestruct(); // vklop za 1 uro
    } else if (!selfDestructUnlimited) {
      activateSelfDestruct(); // preklop v unlimited
    }

  } else if (code === 'LLRRLLLR') {
    if (selfDestructActive && selfDestructUnlimited) {
      activateSelfDestruct(60 * 60 * 1000);
    } else if (selfDestructActive) {
      if (!masterControlActive) {
        alert("Preklic zahteva master control.");
        return;
      }
      cancelSelfDestruct();
    }

  } else if (code === 'LLLRLLRL') {
    const targetUser = messageInput.value.trim();
    if (!targetUser) {
      alert("Vnesi ime uporabnika v vnosno polje!");
      return;
    }
    if (!masterControlActive) {
      alert("Self destruct za uporabnika zahteva master control.");
      return;
    }
    activateSelfDestructForUser(targetUser);

  } else if (code === 'RRRLRRLR') {
    const targetUser = messageInput.value.trim();
    if (!targetUser) {
      alert("Vnesi ime uporabnika za preklic self destruct!");
      return;
    }
    if (!masterControlActive) {
      alert("Preklic za uporabnika zahteva master control.");
      return;
    }
    cancelSelfDestructForUser(targetUser);
  }
}
// === CHAT FUNKCIJE ===
function displayMessage(sender, message) {
  const el = document.createElement('div');
  el.innerHTML = `<strong>${sender}:</strong> ${message}`;
  chatBox.appendChild(el);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function handleIncomingMessage(msg) {
  if (!selfDestructActive) displayMessage(msg.sender, msg.text);
}

async function onUserSendMessage(sender, message) {
  if (selfDestructActive) return;
  displayMessage(sender, message);
  try {
    await firebase.firestore().collection('messages').add({
      sender: sender,
      text: message,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (err) {
    console.error("Napaka pri shranjevanju:", err);
  }
}

// Baterija - prikaz z znaki za polnjenje in nizko baterijo
if (navigator.getBattery) {
  navigator.getBattery().then(battery => {
    function updateBattery() {
      const pct = Math.round(battery.level * 100);
      let symbol = "🔋";

      if (battery.charging) {
        symbol = "⚡️";  // polnjenje
      } else if (pct <= 20) {
        symbol = "🪫";   // prazna baterija (lahko zamenjaš emoji)
      }

      batterySpan.textContent = battery.charging ? `${symbol}${pct}%` : `${pct}%${symbol}`;
    }
    updateBattery();
    battery.addEventListener('levelchange', updateBattery);
    battery.addEventListener('chargingchange', updateBattery);
  });
} else {
  batterySpan.textContent = "Ni podpore";
}

// Funkcija za shranjevanje v localStorage
function saveReminders() {
  localStorage.setItem("reminders", JSON.stringify(reminders));
}

// Funkcija za izris opomnikov
function renderReminders() {
  reminderList.innerHTML = "";
  const now = Date.now();

  reminders.forEach((r, i) => {
    const div = document.createElement("div");
    div.style.display = "flex";
    div.style.justifyContent = "space-between";
    div.style.alignItems = "center";
    div.style.padding = "5px";
    div.style.borderRadius = "5px";
    div.style.backgroundColor = "rgba(255,255,255,0.2)";
    div.style.backdropFilter = "blur(4px)";

    // Opomnik - ime + čas
    const label = document.createElement("span");
    label.textContent = `${r.name} - ${new Date(r.time).toLocaleString()}`;
    if (r.triggered) label.style.fontWeight = "bold";

    div.appendChild(label);

    const buttonsDiv = document.createElement("div");

    // Gumb za potrditev (prikaže se samo če je sprožen opomnik)
    if (r.triggered) {
      const confirmBtn = document.createElement("button");
      confirmBtn.textContent = "✅️";
      confirmBtn.style.marginRight = "5px";
      confirmBtn.style.cursor = "pointer";
      confirmBtn.onclick = () => {
        reminders.splice(i, 1);
        saveReminders();
        renderReminders();
        checkAlerts();
      };
      buttonsDiv.appendChild(confirmBtn);
    }

    // Gumb za brisanje
    const deleteBtn = document.createElement("button");
    deleteBtn.textContent = "❌️";
    deleteBtn.style.cursor = "pointer";
    deleteBtn.onclick = () => {
      reminders.splice(i, 1);
      saveReminders();
      renderReminders();
      checkAlerts();
    };
    buttonsDiv.appendChild(deleteBtn);

    div.appendChild(buttonsDiv);
    reminderList.appendChild(div);
  });
}

// Funkcija za preverjanje ali so opomniki sproženi in prikaz znaka ‼️
function checkAlerts() {
  const now = Date.now();
  let anyTriggered = false;

  reminders.forEach(r => {
    if (!r.triggered && now >= r.time) {
      r.triggered = true;
      anyTriggered = true;
    } else if (r.triggered) {
      anyTriggered = true;
    }
  });

  saveReminders();
  renderReminders();

  alertIcon.style.display = anyTriggered ? "block" : "none";
}
