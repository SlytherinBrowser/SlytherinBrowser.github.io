<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>Slychat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
    }
    .container {
      max-width: 600px;
      margin: 20px auto;
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    #chatTitle {
      text-align: center;
      margin-bottom: 10px;
    }
    #chatBox {
      border: 1px solid #ddd;
      height: 400px;
      overflow-y: scroll;
      padding: 10px;
      margin-bottom: 10px;
      background: #fff;
    }
    .sender {
      font-weight: bold;
      color: #333;
    }
    .realText {
      margin-left: 5px;
      color: #222;
    }
    .hiddenMessage .realText {
      display: none;
    }
    .hiddenMessage .hiddenText {
      cursor: pointer;
      color: #888;
      font-style: italic;
    }
    .private-invite {
      color: blue;
      cursor: pointer;
      text-decoration: underline;
    }
    #messageInput {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      font-size: 16px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .actions {
      text-align: center;
    }
    .btn {
      background: #007bff;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 4px;
      margin: 0 5px;
      cursor: pointer;
      font-size: 16px;
    }
    .btn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="chatTitle">Slychat</h2>
    <div id="chatBox"></div>
    <input type="text" id="messageInput" placeholder="Vpiši sporočilo..." autocomplete="off" />
    <div class="actions">
      <button class="btn" onclick="sendMessage()">Pošlji</button>
      <button class="btn" onclick="logout()">Odjava</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
    };
    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.database();

    const chatBox = document.getElementById("chatBox");
    const messageInput = document.getElementById("messageInput");
    const chatTitle = document.getElementById("chatTitle");

    let privateChatWith = null; // UID sogovornika v zasebnem klepetu
    const userNamesCache = {};

    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location.href = "auth.html";
      } else {
        loadMessages();
      }
    });

    function loadMessages() {
      db.ref("messages").off();
      const currentUser = auth.currentUser;
      chatBox.innerHTML = "";

      db.ref("messages").on("child_added", async snapshot => {
        const msg = snapshot.val();
        const senderUid = msg.uid;

        let displayName = userNamesCache[senderUid];
        if (!displayName) {
          try {
            const userSnap = await db.ref('users/' + senderUid).once('value');
            displayName = userSnap.val()?.displayName || "Anonimen";
            userNamesCache[senderUid] = displayName;
          } catch {
            displayName = "Anonimen";
          }
        }

        // Če je povabilo za zasebni klepet in je naslovnik trenutni uporabnik
        if (msg.type === "invite" && msg.to === currentUser.uid) {
          const div = document.createElement("div");
          div.innerHTML = `<span class='private-invite'>[Vabilo za zasebni klepet od ${displayName} - klikni za odprtje]</span>`;
          div.querySelector(".private-invite").addEventListener("click", () => {
            privateChatWith = senderUid;
            chatTitle.textContent = "Zasebno s: " + displayName;
            chatBox.innerHTML = "";
            loadMessages();
          });
          chatBox.appendChild(div);
          chatBox.scrollTop = chatBox.scrollHeight;
          return;
        }

        // Filtriranje sporočil glede na izbrani klepet
        if (privateChatWith) {
          const isBetween = (msg.uid === currentUser.uid && msg.to === privateChatWith)
            || (msg.uid === privateChatWith && msg.to === currentUser.uid);
          if (!isBetween) return;
          if (msg.type !== "private") return;
        } else {
          // Javne omembe in javni klepet
          if (msg.to) {
            if (msg.type === "mention") {
              // Pokaži samo omembe, kjer je naslovnik currentUser ali pošiljatelj
              if (msg.uid !== currentUser.uid && msg.to !== currentUser.uid) return;
            } else {
              // ostala sporočila z "to" ignoriraj v javnem klepetu
              return;
            }
          }
        }

        const div = document.createElement("div");
        const senderSpan = document.createElement("span");
        senderSpan.classList.add("sender");
        senderSpan.textContent = displayName + ": ";

        const realText = document.createElement("span");
        realText.classList.add("realText");
        realText.textContent = msg.text;

        if (msg.hidden) {
          const hiddenText = document.createElement("span");
          hiddenText.classList.add("hiddenText");
          hiddenText.textContent = "Skrito sporočilo (klikni za prikaz)";
          hiddenText.style.marginLeft = "5px";

          div.classList.add("hiddenMessage");
          div.appendChild(senderSpan);
          div.appendChild(hiddenText);
          div.appendChild(realText);

          hiddenText.addEventListener("click", () => {
            realText.style.display = realText.style.display === "inline" ? "none" : "inline";
          });
        } else {
          div.appendChild(senderSpan);
          div.appendChild(realText);
        }

        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
      });
    }

    function sendMessage() {
      const user = auth.currentUser;
      let text = messageInput.value.trim();
      if (!text) return;

      // Povabilo v zasebni klepet: /@ime
      if (text.startsWith("/@")) {
        const name = text.slice(2).toLowerCase().trim();
        db.ref("users").once("value").then(snapshot => {
          const users = snapshot.val();
          let found = false;
          for (const uid in users) {
            if (users[uid].displayName.toLowerCase().trim() === name) {
              found = true;
              db.ref("messages").push({
                uid: user.uid,
                to: uid,
                type: "invite",
                text: "Vabilo v zasebni klepet"
              }).then(() => {
                privateChatWith = uid;
                chatTitle.textContent = "Zasebno s: " + users[uid].displayName;
                chatBox.innerHTML = "";
                loadMessages();
              });
              break;
            }
          }
          if (!found) {
            alert("Uporabnik s tem imenom ne obstaja.");
          }
        });
        messageInput.value = "";
        return;
      }

      // Omemba: @ime sporočilo
      if (text.startsWith("@") && text.indexOf(" ") > 1) {
        const spaceIndex = text.indexOf(" ");
        const name = text.slice(1, spaceIndex).toLowerCase().trim();
        const content = text.slice(spaceIndex + 1);
        db.ref("users").once("value").then(snapshot => {
          const users = snapshot.val();
          let found = false;
          for (const uid in users) {
            if (users[uid].displayName.toLowerCase().trim() === name) {
              found = true;
              db.ref("messages").push({
                uid: user.uid,
                text: content,
                to: uid,
                type: "mention"
              });
              break;
            }
          }
          if (!found) {
            alert("Uporabnik s tem imenom ne obstaja.");
          }
        });
        messageInput.value = "";
        return;
      }

      // Preklop na javni klepet
      if (text === "/public") {
        privateChatWith = null;
        chatTitle.textContent = "Slychat";
        chatBox.innerHTML = "";
        loadMessages();
        messageInput.value = "";
        return;
      }

      // Brisanje javnega klepeta
      if (text === "/clearchat") {
        if (privateChatWith) {
          alert("Brisanje klepeta je dovoljeno samo v javnem klepetu.");
          return;
        }
        db.ref("messages").remove().then(() => {
          chatBox.innerHTML = "";
          alert("Klepet je bil pobrisan.");
        }).catch(error => alert("Napaka pri brisanju: " + error.message));
        messageInput.value = "";
        return;
      }

      // Skrito sporočilo (začne se z *)
      let isHidden = false;
      if (text.startsWith("*")) {
        text = text.slice(1);
        isHidden = true;
      }

      const messageData = {
        uid: user.uid,
        text,
        hidden: isHidden,
        to: privateChatWith || null,
        type: privateChatWith ? "private" : null
      };

      db.ref("messages").push(messageData)
        .then(() => {
          messageInput.value = "";
        })
        .catch(err => alert("Napaka pri pošiljanju: " + err.message));
    }

    function logout() {
      auth.signOut().then(() => {
        window.location.href = "auth.html";
      });
    }

    messageInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
