<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>Slychat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: url('slika.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      width: 90%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    h2 {
      text-align: center;
      font-weight: 500;
    }

    #chatBox {
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #chatBox div {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      padding: 10px 15px;
      color: #fff;
      word-wrap: break-word;
      font-size: 0.95em;
      position: relative;
    }

    .sender {
      font-weight: 600;
      color: #ffd700;
      margin-right: 6px;
    }

    .hiddenMessage .realText {
      display: none;
    }

    .hiddenMessage:hover .realText {
      display: inline;
    }

    .hiddenMessage:hover .hiddenText {
      display: none;
    }

    .hiddenText {
      font-style: italic;
      color: #ccc;
    }

    .message-input-container {
      position: relative;
    }

    #messageInput {
      padding: 10px;
      padding-right: 40px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      color: white;
      outline: none;
      width: 100%;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }
#hiddenToggleBtn.active {
  background-color: rgba(255, 255, 255, 0.6);
  color: black;
}
    #hiddenToggleBtn {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      width: 25px;
      height: 25px;
      border-radius: 50%;
      border: none;
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .btn {
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover {
      background-color: rgba(255, 255, 255, 0.25);
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    @media (max-width: 480px) {
      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Slychat</h2>
    <div id="chatBox"></div>

    <div class="message-input-container">
      <input type="text" id="messageInput" placeholder="Vpiši sporočilo..." />
      <button id="hiddenToggleBtn" title="Skrito sporočilo" onclick="toggleHidden()">H</button>
    </div>

    <div class="actions">
      <button class="btn" onclick="sendMessage()">Pošlji</button>
      <button class="btn" onclick="toggleActiveUsers()">Aktivni uporabniki</button>
      <button class="btn" onclick="logout()">Odjava</button>
    </div>
  </div>



<div id="callOverlay" style="display:none; padding: 20px;">
  <div id="callStatus" style="font-weight: bold; margin-bottom: 10px;"></div>
  <div id="callControls"></div>
</div>





  <script>

  // Firebase config in inicializacija
  const firebaseConfig = {
    apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
    authDomain: "chater-cf682.firebaseapp.com",
    databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
    projectId: "chater-cf682",
    storageBucket: "chater-cf682.appspot.com",
    messagingSenderId: "233632075480",
    appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  // HTML elementi
  const chatBox = document.getElementById("chatBox");
  const messageInput = document.getElementById("messageInput");
  const hiddenToggleBtn = document.getElementById("hiddenToggleBtn");

  let currentChatPartner = null;
  let currentUser = null;
  let userNamesCache = {};
  let userStatusCache = {};
  let isHiddenMode = false;

  // WebRTC in signaling spremenljivke
  let localStream = null;
  let peerConnection = null;
  let callId = null;
  const servers = {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" }
    ]
  };

  // Funkcija za toggle hidden mode
  function toggleHidden() {
    isHiddenMode = !isHiddenMode;
    if (isHiddenMode) {
      hiddenToggleBtn.classList.add("active");
      hiddenToggleBtn.title = "Skrito vklopljeno";
    } else {
      hiddenToggleBtn.classList.remove("active");
      hiddenToggleBtn.title = "Skrito izklopljeno";
    }
  }

  // Pridobi lokalni audio stream
  async function getLocalStream() {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      alert("Napaka pri dostopu do mikrofona: " + e.message);
    }
  }

  // Ustvari PeerConnection in nastavi evente
  function createPeerConnection(partnerUid) {
    peerConnection = new RTCPeerConnection(servers);

    // Dodaj lokalne sledi
    localStream.getTracks().forEach(track => {
      peerConnection.addTrack(track, localStream);
    });

    // Ko prejmemo nov ICE kandidat, ga pošljemo partnerju
    peerConnection.onicecandidate = event => {
      if (event.candidate) {
        db.ref(`calls/${callId}/iceCandidates/${currentUser.uid}`).push(event.candidate.toJSON());
      }
    };

    // Ko prejmemo oddaljene medijske sledi, jih predvajamo
    peerConnection.ontrack = event => {
      const remoteAudio = document.getElementById("remoteAudio");
      if (!remoteAudio) {
        const audio = document.createElement("audio");
        audio.id = "remoteAudio";
        audio.autoplay = true;
        audio.srcObject = event.streams[0];
        document.body.appendChild(audio);
      } else {
        remoteAudio.srcObject = event.streams[0];
      }
    };
  }

  // Pošlji povabilo za klic
  async function callUser(partnerUid) {
    if (!localStream) await getLocalStream();

    currentChatPartner = partnerUid;
    callId = [currentUser.uid, partnerUid].sort().join("_call_");

    createPeerConnection(partnerUid);

    // Nastavi signaling v Firebase
    const callRef = db.ref(`calls/${callId}`);
    await callRef.set({
      offer: null,
      answer: null,
      caller: currentUser.uid,
      callee: partnerUid,
      status: "calling"
    });

    // Ustvari ponudbo (offer)
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);

    await callRef.child("offer").set(offer.toJSON());

    // Poslušaj odgovor
    callRef.child("answer").on("value", async snapshot => {
      const answer = snapshot.val();
      if (answer && peerConnection.signalingState !== "stable") {
        const rtcAnswer = new RTCSessionDescription(answer);
        await peerConnection.setRemoteDescription(rtcAnswer);
        showCallUI(true);
      }
    });

    // Poslušaj ICE kandidate partnerja
    callRef.child(`iceCandidates/${partnerUid}`).on("child_added", async snap => {
      const candidate = snap.val();
      if (candidate) {
        try {
          await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
        } catch (e) {
          console.error("Napaka pri dodajanju ICE kandidata:", e);
        }
      }
    });

    // Prikaži klicno UI za kličočega
    showCallingUI();
  }

  // Sprejmi klic
  async function answerCall(callData, partnerUid) {
    if (!localStream) await getLocalStream();

    currentChatPartner = partnerUid;
    callId = [currentUser.uid, partnerUid].sort().join("_call_");

    createPeerConnection(partnerUid);

    const callRef = db.ref(`calls/${callId}`);

    // Nastavi oddaljeno ponudbo (offer)
    await peerConnection.setRemoteDescription(new RTCSessionDescription(callData.offer));

    // Ustvari odgovor (answer)
    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);

    await callRef.child("answer").set(answer.toJSON());
    await callRef.child("status").set("in_call");

    // Poslušaj ICE kandidate kličočega
    callRef.child(`iceCandidates/${callData.caller}`).on("child_added", async snap => {
      const candidate = snap.val();
      if (candidate) {
        try {
          await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
        } catch (e) {
          console.error("Napaka pri dodajanju ICE kandidata:", e);
        }
      }
    });

    // Poslušaj ICE kandidate partnerja
    callRef.child(`iceCandidates/${currentUser.uid}`).on("child_added", async snap => {
      const candidate = snap.val();
      if (candidate) {
        try {
          await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
        } catch (e) {
          console.error("Napaka pri dodajanju ICE kandidata:", e);
        }
      }
    });

    showCallUI(true);
  }

  // Končaj klic (obema)
  async function endCall() {
    if (peerConnection) {
      peerConnection.close();
      peerConnection = null;
    }

    if (localStream) {
      localStream.getTracks().forEach(track => track.stop());
      localStream = null;
    }

    // Počisti UI in podatke o klicu
    currentChatPartner = null;

    if (callId) {
      await db.ref(`calls/${callId}`).remove();
      callId = null;
    }

    document.getElementById("callControls").remove();
    chatBox.innerHTML = "";
  }

  // Prikaži UI za klicanje (kličočemu)
  function showCallingUI() {
    chatBox.innerHTML = "";
    const div = document.createElement("div");
    div.id = "callControls";
    div.innerHTML = `
      <p>Kličem uporabnika <strong>${userNamesCache[currentChatPartner] || "Anonimen"}</strong>...</p>
      <button onclick="endCall()">Prekliči klic</button>
    `;
    chatBox.appendChild(div);
  }

  // Prikaži UI za aktivni klic (obe strani)
  function showCallUI(isInCall) {
    chatBox.innerHTML = "";
    const div = document.createElement("div");
    div.id = "callControls";
    div.innerHTML = `
      <p>Klic z <strong>${userNamesCache[currentChatPartner] || "Anonimen"}</strong> je aktiven.</p>
      <button onclick="endCall()">Končaj klic</button>
    `;
    chatBox.appendChild(div);
  }

  // Poslušaj Firebase za vhodne klice
  function listenForIncomingCalls() {
    const userCallsRef = db.ref("calls");
    userCallsRef.on("value", snapshot => {
      const calls = snapshot.val() || {};

      for (const id in calls) {
        const call = calls[id];

        if (
          call.callee === currentUser.uid &&
          call.status === "calling" &&
          id === [currentUser.uid, call.caller].sort().join("_call_")
        ) {
          // Prikaži UI za sprejem klica
          if (!document.getElementById("incomingCallControls")) {
            chatBox.innerHTML = "";
            const div = document.createElement("div");
            div.id = "incomingCallControls";
            div.innerHTML = `
              <p>Uporabnik <strong>${userNamesCache[call.caller] || "Anonimen"}</strong> te kliče.</p>
              <button id="acceptCallBtn">Sprejmi</button>
              <button id="rejectCallBtn">Zavrni</button>
            `;
            chatBox.appendChild(div);

            document.getElementById("acceptCallBtn").onclick = () => {
              answerCall(call, call.caller);
              db.ref(`calls/${id}/status`).set("in_call");
              div.remove();
            };
            document.getElementById("rejectCallBtn").onclick = () => {
              db.ref(`calls/${id}`).remove();
              div.remove();
            };
          }
        }
      }
    });
  }

  // Pošiljanje sporočil, obravnava ukazov in klicev
  function sendMessage() {
    if (!currentUser) return;
    const textRaw = messageInput.value.trim();
    if (!textRaw) return;

    // Ukaz za javni klepet
    if (textRaw === "/public") {
      currentChatPartner = null;
      chatBox.innerHTML = "";
      messageInput.value = "";
      alert("Zdaj si v javnem klepetu.");
      setTimeout(() => location.reload(), 10);
      return;
    }

    // Ukaz za brisanje klepeta
    if (textRaw === "/clearchat") {
      db.ref("messages").remove().then(() => {
        alert("Klepetalnica je bila pobrisana.");
        location.reload();
      }).catch(error => alert("Napaka pri brisanju: " + error.message));
      messageInput.value = "";
      return;
    }

    // Ukaz za povabilo v zasebni klepet /@ime
    if (textRaw.startsWith("/@")) {
      const invitedName = textRaw.slice(2).toLowerCase();
      let foundUid = null;
      for (const uid in userNamesCache) {
        if (userNamesCache[uid].toLowerCase() === invitedName) {
          foundUid = uid;
          break;
        }
      }
      if (!foundUid) {
        alert("Uporabnik '" + invitedName + "' ni najden.");
        messageInput.value = "";
        return;
      }

      db.ref("messages").push({
        uid: currentUser.uid,
text: `/@${userNamesCache[foundUid]} te vabi v zasebni klepet.`,
        timestamp: Date.now(),
        private: true,
        to: foundUid
      });
      messageInput.value = "";
      alert(`Povabilo poslano uporabniku ${userNamesCache[foundUid]}.`);
      return;
    }

    // Ukaz za začetek zvočnega klica /*imeuporabnika
    if (textRaw.startsWith("/*")) {
      const calleeName = textRaw.slice(2).trim().toLowerCase();
      let calleeUid = null;
      for (const uid in userNamesCache) {
        if (userNamesCache[uid].toLowerCase() === calleeName) {
          calleeUid = uid;
          break;
        }
      }
      if (!calleeUid) {
        alert("Uporabnik '" + calleeName + "' ni najden.");
        messageInput.value = "";
        return;
      }
      if (calleeUid === currentUser.uid) {
        alert("Ne moreš poklicati samega sebe.");
        messageInput.value = "";
        return;
      }

      // Zaženi klic
      callUser(calleeUid);
      messageInput.value = "";
      return;
    }

    // Pošiljanje običajnih sporočil (javni ali zasebni)
    const msgData = {
      uid: currentUser.uid,
      text: textRaw,
      timestamp: Date.now()
    };
    if (currentChatPartner) {
      msgData.private = true;
      msgData.to = currentChatPartner;
    }

    db.ref("messages").push(msgData);
    messageInput.value = "";
  }

  // Pridobi imena uporabnikov in shrani v cache
  function loadUserNames() {
    return db.ref("users").once("value").then(snapshot => {
      const users = snapshot.val() || {};
      for (const uid in users) {
        userNamesCache[uid] = users[uid].name || "Anonimen";
      }
    });
  }

  // Pridobi trenutnega uporabnika (prijavo)
  auth.onAuthStateChanged(user => {
    if (user) {
      currentUser = user;
      loadUserNames().then(() => {
        listenForIncomingCalls();
      });
    } else {
      // Če ni prijave, zahtevaj prijavo (ali anonimno)
      auth.signInAnonymously().catch(console.error);
    }
  });

  // Dogodek za pošiljanje sporočila ob pritisku tipke Enter
  messageInput.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      sendMessage();
    }
  });

  // Funkcija za končanje klica mora biti globalna (ker jo klicajo gumbi)
  window.endCall = endCall;
  window.callUser = callUser;
  window.answerCall = answerCall;

</script>
</body>
</html>
