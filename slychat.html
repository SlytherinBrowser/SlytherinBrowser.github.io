<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>Slychat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }
    body {
      background: url('slika.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }
    .container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      width: 90%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    h2 {
      text-align: center;
      font-weight: 500;
    }
    #chatBox {
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #chatBox div {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      padding: 10px 15px;
      color: #fff;
      word-wrap: break-word;
      font-size: 0.95em;
      position: relative;
    }
    .sender {
      font-weight: 600;
      color: #ffd700;
      margin-right: 6px;
    }
    .hiddenMessage .realText {
      display: none;
    }
    .hiddenMessage:hover .realText {
      display: inline;
    }
    .hiddenMessage:hover .hiddenText {
      display: none;
    }
    .hiddenText {
      font-style: italic;
      color: #ccc;
    }
    .privateInvite {
      background: rgba(0, 128, 255, 0.3);
      cursor: pointer;
      border: 1px solid #0080ff;
      padding: 5px 10px;
      border-radius: 8px;
      margin-bottom: 5px;
      user-select: none;
      transition: background 0.3s;
    }
    .privateInvite:hover {
      background: rgba(0, 128, 255, 0.6);
    }
    input[type='text'] {
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      color: white;
      outline: none;
    }
    input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }
    .btn {
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn:hover {
      background-color: rgba(255, 255, 255, 0.25);
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    @media (max-width: 480px) {
      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="chatTitle">Slychat</h2>
    <div id="chatBox"></div>
    <input type="text" id="messageInput" placeholder="Vpiši sporočilo..." autocomplete="off" />
    <div class="actions">
      <button class="btn" onclick="sendMessage()">Pošlji</button>
      <button class="btn" onclick="logout()">Odjava</button>
    </div>
  </div>

  <script>
    // Firebase config - spremeni po potrebi
    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const chatBox = document.getElementById("chatBox");
    const messageInput = document.getElementById("messageInput");
    const chatTitle = document.getElementById("chatTitle");

    let privateChatWith = null;  // uid osebe s katero si v zasebnem klepetu
    const userNamesCache = {};   // cache za hitrejši prikaz imen

    // Ob prijavi naloži sporočila
    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location.href = "auth.html";
      } else {
        loadMessages();
      }
    });

    // Naloži uporabniško ime iz baze (s cache)
    async function getDisplayName(uid) {
      if (userNamesCache[uid]) return userNamesCache[uid];
      try {
        const userSnap = await db.ref('users/' + uid).once('value');
        const name = userSnap.val()?.displayName || "Anonimen";
        userNamesCache[uid] = name;
        return name;
      } catch {
        return "Anonimen";
      }
    }

    // Prikaži sporočila glede na stanje (javni ali zasebni klepet)
    function loadMessages() {
      chatBox.innerHTML = "";
      db.ref("messages").off();

      db.ref("messages").on("child_added", async snapshot => {
        const msg = snapshot.val();
        const msgKey = snapshot.key;
        const senderUid = msg.uid;
        const currentUser = auth.currentUser;

        // Filtriraj glede na tip klepeta
        if (privateChatWith) {
          // Zasebni klepet: pokaži samo sporočila med nama
          // Pokaži sporočila, kjer: 
          // - posiljatelj je jaz in prejemnik je privateChatWith
          // - ali posiljatelj je privateChatWith in prejemnik jaz
          if (!(
            (senderUid === currentUser.uid && msg.mention === privateChatWith) ||
            (senderUid === privateChatWith && msg.mention === currentUser.uid)
          )) return;
        } else {
          // Javni klepet: pokaži samo sporočila brez mentiona (brez zasebnih)
          if (msg.mention) return;
        }

        // Dobimo ime pošiljatelja
        const displayName = await getDisplayName(senderUid);

        // Če je zasebno sporočilo, ki je poslano posamezniku, ampak nisi v zasebnem klepetu z njim:
        if (!privateChatWith && msg.mention === currentUser.uid) {
          // Prikaži povabilo v zasebni klepet
          const invite = document.createElement("div");
          invite.classList.add("privateInvite");
          invite.textContent = `Zasebno sporočilo od ${displayName} — klikni za klepet`;
          invite.onclick = () => {
            privateChatWith = senderUid;
            chatTitle.textContent = `Zasebno s: ${displayName}`;
            chatBox.innerHTML = "";
            loadMessages();
          };
          chatBox.appendChild(invite);
        }

        // Pripravi div za sporočilo
        const div = document.createElement("div");
        const senderSpan = document.createElement("span");
        senderSpan.classList.add("sender");
        senderSpan.textContent = displayName + ": ";

        const realText = document.createElement("span");
        realText.classList.add("realText");
        realText.textContent = msg.text;

        if (msg.hidden) {
          const hiddenText = document.createElement("span");
          hiddenText.classList.add("hiddenText");
          hiddenText.textContent = "Zasebno sporočilo";
          div.classList.add("hiddenMessage");
          div.appendChild(senderSpan);
          div.appendChild(hiddenText);
          div.appendChild(realText);
        } else {
          div.appendChild(senderSpan);
          div.appendChild(realText);
        }

        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
      });
    }

    // Pošlji sporočilo
    function sendMessage(isHidden = false) {
      const user = auth.currentUser;
      let text = messageInput.value.trim();
      if (!text) return;

      // Ukazi za preklop zasebnega klepeta
      if (text.startsWith("/@")) {
        const name = text.slice(2).toLowerCase();
        db.ref("users").once("value").then(snapshot => {
          const users = snapshot.val();
          for (const uid in users) {
            if (users[uid].displayName.toLowerCase() === name) {
              privateChatWith = uid;
              chatTitle.textContent = "Zasebno s: " + users[uid].displayName;
              chatBox.innerHTML = "";
              loadMessages();
              return;
            }
          }
          alert("Uporabnik ni najden.");
        });
        messageInput.value = "";
        return;
      }

      // Ukaz za vrnitev v javni klepet
      if (text === "/public") {
        privateChatWith = null;
        chatTitle.textContent = "Slychat";
        chatBox.innerHTML = "";
        loadMessages();
        messageInput.value = "";
        return;
      }

      // Ukaz za brisanje javnega klepeta (v zasebnem ni dovoljeno)
      if (text === "/clearchat") {
        if (privateChatWith) {
          alert("Brisanje klepeta je dovoljeno samo v javnem klepetu.");
          return;
        }
        db.ref("messages").remove().then(() => {
          chatBox.innerHTML = "";
          alert("Klepetalnica je bila pobrisana.");
        }).catch(error => alert("Napaka pri brisanju: " + error.message));
        messageInput.value = "";
        return;
      }

      // Če sporočilo vsebuje zasebno sporočilo @imeuporabnika, ga pošlji kot zasebno (prejme samo ta oseba)
      // To pomeni, da v besedilu poiščemo pattern @imeuporabnika in to osebo določimo kot mention.
      // Če je več takih omemb, vzamemo prvo.
      let mentionUid = null;
      if (text.startsWith("@")) {
        const parts = text.split(" ");
        const mentionName = parts[0].slice(1).toLowerCase();
        db.ref("users").once("value").then(snapshot => {
          const users = snapshot.val();
          for (const uid in users) {
            if (users[uid].displayName.toLowerCase() === mentionName) {
              mentionUid = uid;
              // Pošljemo sporočilo s to omembo
              pushMessage(user.uid, text, isHidden, mentionUid);
              messageInput.value = "";
              return;
            }
          }
          alert("Uporabnik za zasebno sporočilo ni najden.");
          messageInput.value = "";
        });
        return; // Čakamo na async pošiljanje v callbacku zgoraj
      }

      // Če ni zasebnega sporočila, pošlji normalno (javno ali zasebno če smo v zasebnem klepetu)
      pushMessage(user.uid, text, isHidden, privateChatWith);

      messageInput.value = "";
    }

    // Funkcija za pošiljanje sporočila v DB
    function pushMessage(uid, text, hidden, mention) {
      db.ref("messages").push({
        uid,
        text,
        hidden: !!hidden,
        mention: mention || null
      });
    }

    // Odjava
    function logout() {
      auth.signOut().then(() => (window.location.href = "auth.html"));
    }

    // Enter za pošiljanje, Ctrl+Enter za skrito sporočilo
    messageInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        if (e.ctrlKey) {
          sendMessage(true);
        } else {
          sendMessage();
        }
      }
    });
  </script>
</body>
</html>
