<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>Slychat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: url('slika.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      width: 90%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    h2 {
      text-align: center;
      font-weight: 500;
    }

    #chatBox {
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #chatBox div {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      padding: 10px 15px;
      color: #fff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
      word-wrap: break-word;
      font-size: 0.95em;
      position: relative;
    }

    #chatBox .sender {
      font-weight: 600;
      color: #ffd700;
      margin-right: 6px;
    }

    input[type='text'] {
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      color: white;
      outline: none;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .btn {
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover {
      background-color: rgba(255, 255, 255, 0.25);
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .delete-btn {
      position: absolute;
      top: 4px;
      right: 8px;
      background: transparent;
      border: none;
      color: red;
      cursor: pointer;
      font-size: 1em;
    }

    @media (max-width: 480px) {
      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Slychat</h2>
    <div id="chatBox"></div>
    <input type="text" id="messageInput" placeholder="Vpiši sporočilo..." onkeydown="handleKeyDown(event)" />
    <div class="actions">
      <button class="btn" onclick="sendMessage()">Pošlji</button>
      <button class="btn" onclick="logout()">Odjava</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad",
      measurementId: "G-32E3BYYLKS"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const chatBox = document.getElementById("chatBox");
    const messageInput = document.getElementById("messageInput");
    const userNamesCache = {};

    function handleKeyDown(event) {
      if (event.key === "Enter") {
        if (event.ctrlKey) sendMessage(true);
        else sendMessage();
      }
    }

    function sendMessage(forceHidden = false) {
      const user = auth.currentUser;
      if (!user) return;
      const raw = messageInput.value.trim();
      if (!raw) return;

      if (raw === "/clearchat") {
        db.ref("messages").remove().then(() => {
          chatBox.innerHTML = "";
          alert("Klepetalnica je bila pobrisana.");
        });
        messageInput.value = "";
        return;
      }

      const hidden = forceHidden || raw.startsWith("*");
      const cleanedText = raw.replace(/^\*/, "").trim();

      const mentionMatch = cleanedText.match(/^@(\w+)\s+/);
      if (mentionMatch) {
        const mentionedName = mentionMatch[1];
        const messageBody = cleanedText.replace(/^@\w+\s+/, "");

        db.ref("users").once("value", snap => {
          const users = snap.val();
          let foundUid = null;
          for (const uid in users) {
            if (users[uid].displayName === mentionedName) {
              foundUid = uid;
              break;
            }
          }
          db.ref("messages").push({
            uid: user.uid,
            text: messageBody,
            hidden: false,
            mentionUid: foundUid || null
          });
        });

      } else {
        db.ref("messages").push({
          uid: user.uid,
          text: cleanedText,
          hidden: hidden,
          mentionUid: null
        });
      }

      messageInput.value = "";
    }

    auth.onAuthStateChanged(user => {
      if (!user) return window.location.href = "auth.html";

      db.ref("messages").on("child_added", async snapshot => {
        const msg = snapshot.val();
        const key = snapshot.key;

        const isMentioned = msg.mentionUid === user.uid;
        const isSender = msg.uid === user.uid;
        const isVisible = !msg.hidden || isSender || isMentioned;

        if (!isVisible) return;

        let name = userNamesCache[msg.uid];
        if (!name) {
          const uSnap = await db.ref("users/" + msg.uid).once("value");
          name = uSnap.val()?.displayName || "Anonimen";
          userNamesCache[msg.uid] = name;
        }

        const div = document.createElement("div");
        if (msg.hidden && !isSender) {
          div.style.opacity = "0.2";
          div.onmouseover = () => div.style.opacity = "1";
          div.onmouseout = () => div.style.opacity = "0.2";
        }

        const sender = document.createElement("span");
        sender.className = "sender";
        sender.textContent = name + ": ";

        const msgText = document.createElement("span");
        msgText.textContent = msg.text;

        div.appendChild(sender);
        div.appendChild(msgText);

        if (isSender) {
          const delBtn = document.createElement("button");
          delBtn.className = "delete-btn";
          delBtn.textContent = "🗑️";
          delBtn.onclick = () => db.ref("messages/" + key).remove().then(() => div.remove());
          div.appendChild(delBtn);
        }

        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
      });
    });

    function logout() {
      auth.signOut().then(() => (window.location.href = "auth.html"));
    }
  </script>
</body>
</html>
