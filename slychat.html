<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SlyChat</title>
  <link rel="stylesheet" href="slychat.css">
</head>
<body class="light-mode">
  <style>
    /* Splošni stil za obrazce */
    input {
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      width: 250px;
    }

    button {
      padding: 10px 20px;
      background-color: #5a2d5a;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      width: 270px;
    }

    button:hover {
      background-color: #7b4a7b;
    }

    /* Oblikovanje napak */
    p {
      color: #f44336;
    }

    #login-form, #register-form {
      background-color: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 300px;
      margin: 20px;
      text-align: center;
    }

    #login-form {
      display: block;
    }

    #register-form {
      display: none;
    }

    /* Naslov za prijavo in registracijo */
    #login-form h2, #register-form h2 {
      font-size: 1.5em;
      color: #5a2d5a;
      margin-bottom: 15px;
    }

    /* Preklop med prijavo in registracijo */
    span {
      color: #5a2d5a;
      cursor: pointer;
    }

    span:hover {
      color: #7b4a7b;
    }

    /* Oblikovanje povezav (preklopi) */
    p {
      font-size: 0.9em;
      color: #777;
    }

    /* Oblikovanje napak */
    #login-error, #register-error {
      color: #f44336;
      font-size: 0.9em;
      display: none;
      margin-top: 10px;
    }
  </style>

  <h1>SlyChat</h1>

  <!-- Obrazec za prijavo -->
  <div id="login-form">
    <h2>Log In</h2>
    <input type="email" id="login-email" placeholder="Email" required>
    <input type="password" id="login-password" placeholder="Password" required>
    <button type="button" id="login-button">Log In</button>
    <p id="login-error" style="color:red; display:none;">Invalid email or password</p>
    <p>Don't have an account? <span id="show-register-form">Sign Up</span></p>
  </div>

  <!-- Obrazec za registracijo -->
  <div id="register-form" style="display:none;">
    <h2>Sign Up</h2>
    <input type="email" id="register-email" placeholder="Email" required>
    <input type="password" id="register-password" placeholder="Password" required>
    <button type="button" id="register-button">Sign Up</button>
    <p id="register-error" style="color:red; display:none;">Registration failed</p>
    <p>Already have an account? <span id="show-login-form">Log In</span></p>
  </div>

  <!-- Chat okno -->
  <div id="chat-window" style="display:none;"></div>

  <!-- Obrazec za pošiljanje sporočil -->
  <form id="message-form" style="display:none;">
    <input type="text" id="message" placeholder="Type a message" required>
    <button type="button" id="send-button">Send</button>
  </form>

 <script type="module" src="chat.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, inMemoryPersistence } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

   // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAWX0bC74nQM4K5zkgnN1u9mfZtt62UAMg",
  authDomain: "slychat-d75a2.firebaseapp.com",
  databaseURL: "https://slychat-d75a2-default-rtdb.firebaseio.com",
  projectId: "slychat-d75a2",
  storageBucket: "slychat-d75a2.firebasestorage.app",
  messagingSenderId: "134982403709",
  appId: "1:134982403709:web:aea347d62b313668e79314",
  measurementId: "G-1C0H5L72J1"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    setPersistence(auth, inMemoryPersistence).catch((error) => console.error("Error setting persistence:", error.message));

    document.getElementById("login-button").addEventListener("click", () => {
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;

      signInWithEmailAndPassword(auth, email, password)
        .then(() => {
          document.getElementById("login-form").style.display = "none";
          document.getElementById("register-form").style.display = "none";
          document.getElementById("chat-window").style.display = "block";
          document.getElementById("message-form").style.display = "block";
        })
        .catch(() => document.getElementById("login-error").style.display = "block");
    });

    document.getElementById("register-button").addEventListener("click", () => {
      const email = document.getElementById("register-email").value;
      const password = document.getElementById("register-password").value;

      createUserWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          // Store the user in the database with role 'user'
          const userRef = ref(db, 'users/' + user.uid);
          set(userRef, {
            username: user.displayName || email,  // Use displayName or email as fallback
            email: email,
            role: 'user'  // Default role
          }).then(() => {
            document.getElementById("register-form").style.display = "none";
            document.getElementById("login-form").style.display = "block";
            document.getElementById("register-error").style.display = "none";
          });
        })
        .catch((error) => {
          document.getElementById("register-error").textContent = error.message;
          document.getElementById("register-error").style.display = "block";
        });
    });

    document.getElementById("show-register-form").addEventListener("click", () => {
      document.getElementById("login-form").style.display = "none";
      document.getElementById("register-form").style.display = "block";
    });

    document.getElementById("show-login-form").addEventListener("click", () => {
      document.getElementById("register-form").style.display = "none";
      document.getElementById("login-form").style.display = "block";
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        // Set the username to user's displayName or fallback to email
        const username = user.displayName || user.email;  // Fiksno ime uporabnika

        document.getElementById("login-form").style.display = "none";
        document.getElementById("register-form").style.display = "none";
        document.getElementById("chat-window").style.display = "block";
        document.getElementById("message-form").style.display = "block";

        // When the user is logged in, you can use their displayName in the chat
        document.getElementById("send-button").addEventListener("click", () => {
          const message = document.getElementById("message").value;
          if (message) {
            const messageRef = ref(db, "messages/" + Date.now());
            set(messageRef, { username, message, timestamp: Date.now() });
            document.getElementById("message").value = "";
          }
        });
      }
    });

    const messagesRef = ref(db, "messages");
    onValue(messagesRef, (snapshot) => {
      const messages = snapshot.val();
      const chatWindow = document.getElementById("chat-window");
      chatWindow.innerHTML = "";
      for (const key in messages) {
        const msg = messages[key];
        const messageElement = document.createElement("div");
        messageElement.textContent = `${msg.username}: ${msg.message}`;
        chatWindow.appendChild(messageElement);
      }
    });
  </script>
</body>
</html>
