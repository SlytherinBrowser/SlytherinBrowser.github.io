<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>Slychat</title>
  <link id="favicon" rel="icon" href="Slytherin.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: url('slika.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      width: 90%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    h2 {
      text-align: center;
      font-weight: 500;
    }

    #chatBox {
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #chatBox div {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      padding: 10px 15px;
      color: #fff;
      word-wrap: break-word;
      font-size: 0.95em;
      position: relative;
    }

    .sender {
      font-weight: 600;
      color: #ffd700;
      margin-right: 6px;
    }

    .hiddenMessage .realText {
      display: none;
    }

    .hiddenMessage:hover .realText {
      display: inline;
    }

    .hiddenMessage:hover .hiddenText {
      display: none;
    }

    .hiddenText {
      font-style: italic;
      color: #ccc;
    }

    .message-input-container {
      position: relative;
    }

    #messageInput {
      padding: 10px;
      padding-right: 40px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      color: white;
      outline: none;
      width: 100%;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }
#hiddenToggleBtn.active {
  background-color: rgba(255, 255, 255, 0.6);
  color: black;
}
    #hiddenToggleBtn {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      width: 25px;
      height: 25px;
      border-radius: 50%;
      border: none;
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .btn {
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover {
      background-color: rgba(255, 255, 255, 0.25);
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    @media (max-width: 480px) {
      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Slychat</h2>
    <div id="chatBox"></div>

    <div class="message-input-container">
      <input type="text" id="messageInput" placeholder="Vpiši sporočilo..." />
      <button id="hiddenToggleBtn" title="Skrito sporočilo" onclick="toggleHidden()">H</button>
    </div>

    <div class="actions">
      <button class="btn" onclick="sendMessage()">Pošlji</button>
      <button class="btn" onclick="toggleActiveUsers()">Aktivni uporabniki</button>
      <button class="btn" onclick="logout()">Odjava</button>
    </div>
  </div>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>  
  
  const firebaseConfig = {  
  
    apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",  
  
    authDomain: "chater-cf682.firebaseapp.com",  
  
    databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",  
  
    projectId: "chater-cf682",  
  
    storageBucket: "chater-cf682.appspot.com",  
  
    messagingSenderId: "233632075480",  
  
    appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"  
  
  };  
  
  
  
  firebase.initializeApp(firebaseConfig);  
  
  const auth = firebase.auth();  
  
  const db = firebase.database();  
  
  
  
  const chatBox = document.getElementById("chatBox");  
  
  const messageInput = document.getElementById("messageInput");  
  
  
  
  let currentChatPartner = null;  
  
  let currentUser = null;  
  
  const userNamesCache = {};  
  
  let userStatusCache = {};  
  
  let isHiddenMode = false;  
  
  let userColorsCache = {}; // Za shranjevanje barv uporabnikov  
  
  
  
  // DODANO: animacija mavrične barve (rainbow)  
  
  const style = document.createElement('style');  
  
  style.textContent = `  
  
    @keyframes rainbow {  
  
      0%, 100% { color: red; }  
  
      15% { color: orange; }  
  
      30% { color: yellow; }  
  
      45% { color: green; }  
  
      60% { color: blue; }  
  
      75% { color: indigo; }  
  
      90% { color: violet; }  
  
    }  
  
    .rainbow {  
  
      animation: rainbow 3s linear infinite;  
  
      font-weight: bold;  
  
    }  
  
  `;  
  
  document.head.appendChild(style);  
  
  
  
  function toggleHidden() {  
  
    isHiddenMode = !isHiddenMode;  
  
    const btn = document.getElementById("hiddenToggleBtn");  
  
    if (isHiddenMode) {  
  
      btn.classList.add("active");  
  
      btn.title = "Skrito vklopljeno";  
  
    } else {  
  
      btn.classList.remove("active");  
  
      btn.title = "Skrito izklopljeno";  
  
    }  
  
  }  
  
  
  
  auth.onAuthStateChanged(async user => {  
  
    if (!user) {  
  
      window.location.href = "auth.html";  
  
      return;  
  
    }  
  
  
  
    currentUser = user;  
  
  
  
    const userStatusRef = db.ref("status/" + user.uid);  
  
    userStatusRef.set({ online: true });  
  
    userStatusRef.onDisconnect().set({ online: false });  
  
  
  
    const usersSnapshot = await db.ref('users').once('value');  
  
    const users = usersSnapshot.val() || {};  
  
    for (const uid in users) {  
  
      userNamesCache[uid] = users[uid].displayName || "Anonimen";  
  
      userColorsCache[uid] = users[uid].color || null;  
  
    }  
  
  
  
    db.ref("status").on("value", snapshot => {  
  
      userStatusCache = snapshot.val() || {};  
  
    });  
  
  
  
    // Potrditev imena  
  
    const userData = users[currentUser.uid];  
  
    if (!userData || !userData.displayName) {  
  
      messageInput.placeholder = "Potrdi ime";  
  
      messageInput.dataset.nameConfirm = "1";  
  
      return;  
  
    } else {  
  
      messageInput.placeholder = "Vnesi sporočilo...";  
  
    }  
  
  
  
    db.ref("messages").on("child_added", snapshot => {  
  
      const msg = snapshot.val();  
  
  
  
      if (msg.system && msg.privateUid === currentUser.uid) {  
  
        const systemDiv = document.createElement("div");  
  
        systemDiv.style.fontStyle = "italic";  
  
        systemDiv.style.color = "#90ee90";  
  
        const senderName = userNamesCache[msg.uid] || "Uporabnik";  
  
        systemDiv.textContent = `${senderName} ${msg.text}`;  
  
        chatBox.appendChild(systemDiv);  
  
        chatBox.scrollTop = chatBox.scrollHeight;  
  
        return;  
  
      }  
  
  
  
      if (msg.invite && msg.privateUid === currentUser.uid) {  
  
        const inviterName = userNamesCache[msg.uid] || "Anonimen";  
  
        const inviteDiv = document.createElement("div");  
  
        inviteDiv.innerHTML = `<strong>${inviterName}</strong> te vabi v zasebni klepet.   
  
          <button onclick="acceptInvite('${msg.uid}')">Sprejmi</button>`;  
  
        chatBox.appendChild(inviteDiv);  
  
        chatBox.scrollTop = chatBox.scrollHeight;  
  
        return;  
  
      }  
  
  
  
      if (currentChatPartner) {  
  
        const isPrivateMatch =  
  
          (msg.uid === currentUser.uid && msg.privateUid === currentChatPartner) ||  
  
          (msg.uid === currentChatPartner && msg.privateUid === currentUser.uid);  
  
        if (!isPrivateMatch) return;  
  
      } else {  
  
        if (msg.privateUid) return;  
  
      }  
  
  
  
      const displayName = userNamesCache[msg.uid] || "Anonimen";  
  
      const isOnline = userStatusCache[msg.uid]?.online;  
  
      const color = userColorsCache[msg.uid] || null;  
  
  
  
      const div = document.createElement("div");  
  
      const senderSpan = document.createElement("span");  
  
      senderSpan.classList.add("sender");  
  
  
  
      // Nastavi barvo in mavrično animacijo  
  
      if (color === "rainbow") {  
  
        senderSpan.classList.add("rainbow");  
  
      } else if (color) {  
  
        senderSpan.style.color = color;  
  
      }  
  
  
  
      if (isOnline) {  
  
        senderSpan.innerHTML = `<span style="color: green; font-size: 1.2em;">●</span> ${displayName}: `;  
  
      } else {  
  
        senderSpan.textContent = displayName + ": ";  
  
      }  
  
  
  
      const realText = document.createElement("span");  
  
      realText.classList.add("realText");  
  
      realText.textContent = msg.text;  
  
  
  
      if (msg.hidden) {  
  
        const hiddenText = document.createElement("span");  
  
        hiddenText.classList.add("hiddenText");  
  
        hiddenText.textContent = "Zasebno sporočilo";  
  
        div.classList.add("hiddenMessage");  
  
        div.appendChild(senderSpan);  
  
        div.appendChild(hiddenText);  
  
        div.appendChild(realText);  
  
      } else {  
  
        div.appendChild(senderSpan);  
  
        div.appendChild(realText);  
  
      }  
  
  
  
      chatBox.appendChild(div);  
  
      chatBox.scrollTop = chatBox.scrollHeight;  
  
    });  
  
  });  
  
  
  
  function acceptInvite(inviterUid) {  
  
    currentChatPartner = inviterUid;  
  
    chatBox.innerHTML = "";  
  
    alert("Sprejel si povabilo. Zdaj si v zasebnem klepetu.");  
  
  
  
    db.ref("messages").push({  
  
      uid: currentUser.uid,  
  
      text: "sprejel je tvoje povabilo v zasebni klepet.",  
  
      system: true,  
  
      privateUid: inviterUid  
  
    });  
  
  }  
  
  
  
  async function sendMessage() {  
  
    if (!currentUser) return;  
  
    const textRaw = messageInput.value.trim();  
  
    if (!textRaw) return;  
 

 
  // Uporabi to v tvoji funkciji za pošiljanje sporočil
if (textRaw === "/map") {
  if (currentChatPartner) {
    alert("Zemljevid deluje samo v javnem klepetu.");
    messageInput.value = "";
    return;
  }

  showLeafletUserMap();
  messageInput.value = "";
  return;
}



  
    // Če še nima imena - potrdi  
  
    if (messageInput.dataset.nameConfirm === "1") {  
  
      await db.ref("users/" + currentUser.uid).update({  
  
        displayName: textRaw  
  
      });  
  
      userNamesCache[currentUser.uid] = textRaw;  
  
      messageInput.placeholder = "Vnesi sporočilo...";  
  
      messageInput.dataset.nameConfirm = "";  
  
      alert("Ime potrjeno: " + textRaw);  
  
      messageInput.value = "";  
  
      return;  
  
    }  
  
  
  
    // Ukaz za spremembo imena: *name*novoime  
  
    if (textRaw.startsWith("*name*")) {  
  
      const newName = textRaw.slice(6).trim();  
  
      if (!newName) {  
  
        alert("Vpiši novo ime za spremembo.");  
  
        messageInput.value = "";  
  
        return;  
  
      }  
  
      await db.ref("users/" + currentUser.uid).update({ displayName: newName });  
  
      userNamesCache[currentUser.uid] = newName;  
  
      alert("Ime je bilo spremenjeno na: " + newName);  
  
      messageInput.value = "";  
  
      return;  
  
    }  
  
  
  
    // Ukaz za spremembo barve imena: *color*barva  
  
    if (textRaw.startsWith("*color*")) {  
  
      const colorVal = textRaw.slice(7).trim().toLowerCase();  
  
      if (!colorVal) {  
  
        alert("Vpiši barvo ali 'rainbow' za mavrično animacijo.");  
  
        messageInput.value = "";  
  
        return;  
  
      }  
  
      if (colorVal === "rainbow") {  
  
        await db.ref("users/" + currentUser.uid).update({ color: "rainbow" });  
  
        userColorsCache[currentUser.uid] = "rainbow";  
  
        alert("Barva imena nastavljena na mavrično (rainbow).");  
  
      } else {  
  
        // Preverimo osnovno veljavnost barve (lahko še izboljšamo)  
  
        const s = new Option().style;  
  
        s.color = colorVal;  
  
        if (s.color === "") {  
  
          alert("Neveljavna barva.");  
  
          messageInput.value = "";  
  
          return;  
  
        }  
  
        await db.ref("users/" + currentUser.uid).update({ color: colorVal });  
  
        userColorsCache[currentUser.uid] = colorVal;  
  
        alert("Barva imena nastavljena na: " + colorVal);  
  
      }  
  
      messageInput.value = "";  
  
      return;  
  
    }  
  
  
  
    if (textRaw === "/public") {  
  
      currentChatPartner = null;  
  
      chatBox.innerHTML = "";  
  
      messageInput.value = "";  
  
      alert("Zdaj si v javnem klepetu.");  
  
      setTimeout(() => location.reload(), 10);  
  
      return;  
  
    }  
  
  
  
    if (textRaw === "/clearchat") {  
  
      db.ref("messages").remove().then(() => {  
  
        alert("Klepetalnica je bila pobrisana.");  
  
        location.reload();  
  
      }).catch(error => alert("Napaka pri brisanju: " + error.message));  
  
      messageInput.value = "";  
  
      return;  
  
    }  
  
  
  
    if (textRaw.startsWith("/@")) {
  
  // Odstranimo začetni "/"
  
  const invitesText = textRaw.slice(1).trim(); // "/@ime1 @ime2" -> "@ime1 @ime2"
  
  // Razdelimo na posamezne uporabniške povabile (npr. "@ime1", "@ime2")
  
  const inviteNames = invitesText.split(" ").filter(n => n.startsWith("@")).map(n => n.slice(1).toLowerCase());
  

  
  if (inviteNames.length === 0) {
  
    alert("Vpiši uporabniška imena za povabilo, npr. /@ime1 @ime2");
  
    messageInput.value = "";
  
    return;
  
  }
  

  
  let notFoundUsers = [];
  
  let invitedUids = [];
  

  
  // Poiščemo Uid za vsako ime
  
  inviteNames.forEach(name => {
  
    let foundUid = null;
  
    for (const uid in userNamesCache) {
  
      if (userNamesCache[uid].toLowerCase() === name) {
  
        foundUid = uid;
  
        break;
  
      }
  
    }
  
    if (foundUid) {
  
      invitedUids.push(foundUid);
  
    } else {
  
      notFoundUsers.push(name);
  
    }
  
  });
  

  
  if (notFoundUsers.length > 0) {
  
    alert("Uporabniki niso najdeni: " + notFoundUsers.join(", "));
  
  }
  

  
  // Pošljemo povabila v bazo za vse najdene uporabnike
  
  invitedUids.forEach(uid => {
  
    db.ref("messages").push({
  
      uid: currentUser.uid,
  
      text: "Povabilo v zasebni klepet",
  
      invite: true,
  
      privateUid: uid
  
    });
  
  });
  

  
  if (invitedUids.length > 0) {
  
    currentChatPartner = invitedUids[0]; // nastavimo prvega kot trenutnega partnerja
  
    chatBox.innerHTML = "";
  
    alert("Vstopil si v zasebni pogovor z: " + invitedUids.map(uid => userNamesCache[uid]).join(", "));
  
  }
  

  
  messageInput.value = "";
  
  return;
  
}
  
  
  
    let hidden = isHiddenMode;  
  
    let text = textRaw;  
  
  
  
    db.ref("messages").push({  
  
      uid: currentUser.uid,  
  
      text: text,  
  
      hidden: hidden,  
  
      privateUid: currentChatPartner  
  
    });  
  
  
  
    messageInput.value = "";  
  
  }  
  
  
  
  function logout() {  
  
    auth.signOut().then(() => {  
  
      window.location.href = "auth.html";  
  
    });  
  
  }  
  
  
  
  messageInput.addEventListener("keydown", function (e) {  
  
    if (e.key === "Enter") {  
  
      sendMessage();  
  
    }  
  
  });  
  
  
  
  let showingActiveUsers = false;  
  
  
  
  function toggleActiveUsers() {  
  
    showingActiveUsers = !showingActiveUsers;  
  
    chatBox.innerHTML = "";  
  
  
  
    if (showingActiveUsers) {  
  
      const activeUsers = Object.entries(userStatusCache)  
  
        .filter(([uid, status]) => status.online && uid !== currentUser.uid);  
  
  
  
      if (activeUsers.length === 0) {  
  
        chatBox.innerHTML = "<i>Ni drugih aktivnih uporabnikov.</i>";  
  
      } else {  
  
        activeUsers.forEach(([uid]) => {  
  
          const name = userNamesCache[uid] || "Anonimen";  
  
          const div = document.createElement("div");  
  
          div.innerHTML = `<span style="color: green; font-size: 1.2em;">●</span> ${name}`;  
  
          chatBox.appendChild(div);  
  
        });  
  
      }  
  
    } else {  
  
      location.reload();  
  
    }  
  
  }   


// PREDPOGOJ: Leaflet CSS in JS sta že vključena v HTML
// Firebase je inicializiran

let leafletMap;
let leafletMarkers = [];

const leafletMapDiv = document.createElement("div");
leafletMapDiv.id = "leafletMap";
leafletMapDiv.style.width = "100%";
leafletMapDiv.style.height = "400px";
leafletMapDiv.style.display = "none";
document.body.appendChild(leafletMapDiv);

// Funkcija za prikaz zemljevida z Leaflet
function showLeafletUserMap() {
  if (!leafletMap) {
    leafletMap = L.map('leafletMap').setView([20, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap',
      maxZoom: 18
    }).addTo(leafletMap);
  }

  leafletMarkers.forEach(m => leafletMap.removeLayer(m));
  leafletMarkers = [];

  const usersRef = firebase.database().ref("users");
  usersRef.once("value", snapshot => {
    snapshot.forEach(child => {
      const user = child.val();
      if (user.active && user.location?.lat && user.location?.lng) {
        const marker = L.marker([user.location.lat, user.location.lng])
          .addTo(leafletMap)
          .bindPopup(user.name || "Uporabnik");
        leafletMarkers.push(marker);
      }
    });
  });

  leafletMapDiv.style.display = "block";
  leafletMap.invalidateSize(); // za pravilen prikaz, če se zemljevid prvič prikaže
}
</script>
</body>
</html>
