<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>Slychat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: url('slika.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      width: 90%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    h2 {
      text-align: center;
      font-weight: 500;
    }

    #chatBox {
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #chatBox div {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      padding: 10px 15px;
      color: #fff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
      word-wrap: break-word;
      font-size: 0.95em;
    }

    #chatBox .sender {
      font-weight: 600;
      color: #ffd700;
      margin-right: 6px;
    }

    /* Skrita sporočila - prozorna, vidna ob hover */
    #chatBox div.hidden-message {
      color: transparent;
      background-color: rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: color 0.3s ease;
      user-select: none;
    }

    #chatBox div.hidden-message:hover {
      color: #fff;
      user-select: text;
    }

    /* Zasebna sporočila drugačna barva (le za primer) */
    #chatBox div.private-message {
      background-color: rgba(100, 0, 100, 0.7);
      font-style: italic;
    }

    input[type='text'] {
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      color: white;
      outline: none;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .btn {
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover {
      background-color: rgba(255, 255, 255, 0.25);
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    @media (max-width: 480px) {
      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Slychat</h2>
    <div id="chatBox"></div>
    <input type="text" id="messageInput" placeholder="Vpiši sporočilo..." autocomplete="off" />
    <div class="actions">
      <button class="btn" onclick="sendMessage()">Pošlji</button>
      <button class="btn" onclick="logout()">Odjava</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.firebasestorage.app",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad",
      measurementId: "G-32E3BYYLKS"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const chatBox = document.getElementById("chatBox");
    const messageInput = document.getElementById("messageInput");

    // Cache za uporabniška imena in UID-je
    const userNamesCache = {};
    const userIdsByName = {};

    async function refreshUsersCache() {
      try {
        const snapshot = await db.ref('users').once('value');
        const users = snapshot.val() || {};
        Object.entries(users).forEach(([uid, data]) => {
          if (data.displayName) {
            userNamesCache[uid] = data.displayName;
            userIdsByName[data.displayName.toLowerCase()] = uid;
          }
        });
      } catch {
        // ignore errors
      }
    }

    auth.onAuthStateChanged(async user => {
      if (!user) {
        window.location.href = "auth.html";
      } else {
        await refreshUsersCache();

        db.ref("messages").on("child_added", async snapshot => {
          const msg = snapshot.val();
          const senderUid = msg.uid;

          let displayName = userNamesCache[senderUid];
          if (!displayName) {
            try {
              const userSnap = await db.ref('users/' + senderUid).once('value');
              const userData = userSnap.val();
              displayName = userData && userData.displayName ? userData.displayName : "Anonimen";
              userNamesCache[senderUid] = displayName;
              userIdsByName[displayName.toLowerCase()] = senderUid;
            } catch {
              displayName = "Anonimen";
            }
          }

          // Če je sporočilo zasebno, pokaži samo pošiljatelju in prejemniku
          if (msg.privateTo) {
            const currentUser = auth.currentUser;
            if (
              currentUser.uid !== senderUid &&
              currentUser.uid !== msg.privateTo
            ) {
              return; // ne prikaži sporočila
            }
          }

          const div = document.createElement("div");

          if (msg.hidden) {
            div.classList.add("hidden-message");
          }
          if (msg.privateTo) {
            div.classList.add("private-message");
          }

          const senderSpan = document.createElement("span");
          senderSpan.classList.add("sender");
          senderSpan.textContent = displayName + ": ";

          const messageText = document.createElement("span");
          messageText.textContent = msg.text;

          div.appendChild(senderSpan);
          div.appendChild(messageText);

          chatBox.appendChild(div);
          chatBox.scrollTop = chatBox.scrollHeight;
        });
      }
    });

    messageInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        if (event.ctrlKey) {
          sendMessage(true);
        } else {
          sendMessage(false);
        }
      }
    });

    async function sendMessage(isHidden = false) {
      const user = auth.currentUser;
      let text = messageInput.value.trim();
      if (!text) return;

      if (text === "/clearchat") {
        db.ref("messages")
          .remove()
          .then(() => {
            chatBox.innerHTML = "";
            alert("Klepetalnica je bila pobrisana.");
          })
          .catch(error => alert("Napaka pri brisanju: " + error.message));
        messageInput.value = "";
        return;
      }

      // Če je sporočilo v obliki @ime nekaj, pošlji zasebno sporočilo brez @ime v prikazu
      let privateTo = null;
      if (text.startsWith("@")) {
        const spaceIndex = text.indexOf(" ");
        if (spaceIndex !== -1) {
          const mentionedName = text.slice(1, spaceIndex).toLowerCase();
          privateTo = userIdsByName[mentionedName];
          if (!privateTo) {
            alert("Uporabnik s tem imenom ne obstaja.");
            return;
          }
          text = text.slice(spaceIndex + 1).trim(); // Odstrani @ime iz prikaza sporočila
          if (!text) {
            alert("Prosim vpiši sporočilo za poslati.");
            return;
          }
        }
      }

      const messageData = {
        uid: user.uid,
        text: text,
        timestamp: Date.now(),
        hidden: isHidden,
        privateTo: privateTo,
      };

      try {
        await db.ref("messages").push(messageData);
        messageInput.value = "";
      } catch (error) {
        alert("Napaka pri pošiljanju: " + error.message);
      }
    }

    function logout() {
      auth.signOut().then(() => {
        window.location.href = "auth.html";
      });
    }
  </script>
</body>
</html>
