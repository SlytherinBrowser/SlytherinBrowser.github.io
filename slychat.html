<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlyChat</title>
    <style>
    body {
        font-family: 'Roboto', sans-serif;
        background-color: #f1f1f1;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        transition: background-color 0.3s ease-in-out;
    }
    .auth-container, .chat-container {
        background-color: white;
        border-radius: 12px;
        box-shadow: 0 4px 40px rgba(0, 0, 0, 0.1);
        padding: 40px;
        width: 400px;
        max-width: 100%;
        transform: scale(0.95);
        animation: fadeInUp 0.5s ease-out forwards;
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    h2 {
        font-size: 26px;
        color: #333;
        margin-bottom: 20px;
        text-align: center;
        letter-spacing: 1px;
        transition: color 0.3s ease-in-out;
    }

    .auth-container input, .input-container input {
        width: 100%;
        padding: 14px 18px;
        margin-bottom: 20px;
        border-radius: 8px;
        border: 1px solid #ddd;
        font-size: 16px;
        background-color: #f9f9f9;
        box-sizing: border-box;
        transition: all 0.3s ease;
    }

    .auth-container input:focus, .input-container input:focus {
        border-color: #4CAF50;
        box-shadow: 0 0 5px rgba(76, 175, 80, 0.7);
        transform: scale(1.02);
    }

    .auth-container button, .input-container button {
        width: 100%;
        padding: 14px;
        background-color: #4CAF50;
        color: white;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .auth-container button:hover, .input-container button:hover {
        background-color: #45a049;
        transform: translateY(-2px);
    }

    .auth-container button:active, .input-container button:active {
        transform: translateY(2px);
    }

    .auth-toggle {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: #007BFF;
        cursor: pointer;
        text-decoration: none;
        transition: color 0.3s ease;
    }

    .auth-toggle:hover {
        color: #0056b3;
    }

    .messages {
        background-color: #f9f9f9;
        padding: 20px;
        height: 300px;
        overflow-y: auto;
        border-radius: 12px;
        margin-bottom: 20px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
    }

    .message {
        padding: 14px;
        margin: 12px 0;
        background-color: #e8e8e8;
        border-radius: 8px;
        font-size: 16px;
        word-wrap: break-word;
        opacity: 0;
        animation: fadeInMessage 0.6s ease-out forwards;
    }

    @keyframes fadeInMessage {
        from {
            opacity: 0;
            transform: translateX(-10px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    .message .sender {
        font-weight: bold;
        color: #333;
    }

    .input-container {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
    }

    .input-container input {
        width: 80%;
        border-radius: 8px;
        font-size: 16px;
        background-color: #f9f9f9;
        border: 1px solid #ddd;
        padding: 14px;
        margin-right: 10px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .input-container input:focus {
        transform: scale(1.02);
        box-shadow: 0 0 8px rgba(76, 175, 80, 0.6);
    }

    .input-container button {
        width: 15%;
        background-color: #4CAF50;
        color: white;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .input-container button:hover {
        background-color: #45a049;
        transform: translateY(-2px);
    }

    .input-container button:active {
        transform: translateY(2px);
    }

    .auth-container p {
        font-size: 14px;
        color: #555;
        text-align: center;
        transition: color 0.3s ease;
    }

    .auth-container p a {
        color: #007BFF;
        text-decoration: none;
        transition: color 0.3s ease;
    }

    .auth-container p a:hover {
        color: #0056b3;
        text-decoration: underline;
    }
</style>

</head>
<body>
    <div id="chat-container" class="chat-container" style="display: none;">
        <h2>Chat Room</h2>
        <div id="messages" class="messages"></div>
        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Type a message" disabled>
            <button onclick="sendMessage()" disabled>Send</button>
        </div>
        <button onclick="signOut()">Sign out</button>
    </div>

    <div id="auth-container" class="auth-container">
        <div id="register-form" style="display: none;">
            <h2>Register</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <input type="text" id="username" placeholder="Username (for registration)">
            <button onclick="register()">Register</button>
            <p id="auth-message"></p>
            <p class="auth-toggle" onclick="toggleAuthForm('login')">Already have an account? Login</p>
        </div>

        <div id="login-form">
            <h2>Login</h2>
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-password" placeholder="Password">
            <button onclick="login()">Login</button>
            <p id="login-message"></p>
            <p class="auth-toggle" onclick="toggleAuthForm('register')">Don't have an account? Register</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js"></script>
    <script type="module">
       // Importiranje potrebnih modulov iz Firebase 9
import { initializeApp } from 'firebase/app';
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from 'firebase/auth';
import { getDatabase, ref, set, onValue } from 'firebase/database';

// Firebase konfiguracija
const firebaseConfig = {
    apiKey: "AIzaSyA2l2SEcXPrLGpSOiTyyC55l35OMln1VUM",
    authDomain: "slychat-e0a59.firebaseapp.com",
    projectId: "slychat-e0a59",
    storageBucket: "slychat-e0a59.appspot.com",
    messagingSenderId: "462724887870",
    appId: "1:462724887870:web:72d25e58b20af6e2d2286f",
    measurementId: "G-52CMK3FJYW"
};

// Inicializacija Firebase aplikacije
const app = initializeApp(firebaseConfig);

// Nastavite Firebase Auth in Database
const auth = getAuth(app);
const db = getDatabase(app);

        // Check if user is logged in on page load
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('chat-container').style.display = 'block';
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('messageInput').disabled = false;
                document.querySelector('button').disabled = false;
                listenForMessages();
            } else {
                document.getElementById('chat-container').style.display = 'none';
                document.getElementById('auth-container').style.display = 'block';
                document.getElementById('messageInput').disabled = true;
                document.querySelector('button').disabled = true;
            }
        });

        // Funkcija za registracijo
function register() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const username = document.getElementById('username').value;

    createUserWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
            const user = userCredential.user;
            user.updateProfile({
                displayName: username
            }).then(() => {
                document.getElementById('auth-message').innerText = "Registered successfully!";
                toggleAuthForm('login');
            }).catch((error) => {
                document.getElementById('auth-message').innerText = "Error updating profile: " + error.message;
            });
        })
        .catch((error) => {
            document.getElementById('auth-message').innerText = "Error: " + error.message;
        });
}

// Funkcija za prijavo
function login() {
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;

    signInWithEmailAndPassword(auth, email, password)
        .then(() => {
            document.getElementById('login-message').innerText = "Logged in successfully!";
            document.getElementById('chat-container').style.display = 'block';
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('messageInput').disabled = false;
            document.querySelector('button').disabled = false;
            listenForMessages();
        })
        .catch((error) => {
            document.getElementById('login-message').innerText = "Error: " + error.message;
        });
}

        // Toggle between login and register form
        function toggleAuthForm(form) {
            if (form === 'register') {
                document.getElementById('register-form').style.display = "block";
                document.getElementById('login-form').style.display = "none";
            } else {
                document.getElementById('login-form').style.display = "block";
                document.getElementById('register-form').style.display = "none";
            }
        }

        // Funkcija za pošiljanje sporočil v Firebase
function sendMessage() {
    const message = document.getElementById('messageInput').value;
    const username = auth.currentUser.displayName;
    const messageRef = ref(db, 'messages/' + Date.now());

    set(messageRef, {
        username: username,
        message: message
    });

    document.getElementById('messageInput').value = ''; // Pošljite sporočilo in počistite polje
}

        // Funkcija za izpis sporočil
function listenForMessages() {
    const messagesRef = ref(db, 'messages');
    onValue(messagesRef, (snapshot) => {
        const data = snapshot.val();
        const messagesDiv = document.getElementById('messages');
        messagesDiv.innerHTML = '';

        for (const key in data) {
            if (data.hasOwnProperty(key)) {
                const message = data[key];
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message');
                messageDiv.innerHTML = `<span class="sender">${message.username}:</span> ${message.message}`;
                messagesDiv.appendChild(messageDiv);
            }
        }
    });
}

        // Odjava uporabnika
        function signOut() {
            auth.signOut().then(() => {
                document.getElementById('chat-container').style.display = 'none';
                document.getElementById('auth-container').style.display = 'block';
            });
        }
    </script>
</body>
</html>
