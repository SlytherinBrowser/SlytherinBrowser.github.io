<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>Slychat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <style>
       * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: url('slika.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      width: 90%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    h2 {
      text-align: center;
      font-weight: 500;
    }

    #chatBox {
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #chatBox div {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      padding: 10px 15px;
      color: #fff;
      word-wrap: break-word;
      font-size: 0.95em;
      position: relative;
    }

    .sender {
      font-weight: 600;
      color: #ffd700;
      margin-right: 6px;
      cursor: pointer; /* dodano za vizualni znak */
    }

    .hiddenMessage .realText {
      display: none;
    }

    .hiddenMessage:hover .realText {
      display: inline;
    }

    .hiddenMessage:hover .hiddenText {
      display: none;
    }

    .hiddenText {
      font-style: italic;
      color: #ccc;
    }

    input[type='text'] {
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      color: white;
      outline: none;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .btn {
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover {
      background-color: rgba(255, 255, 255, 0.25);
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    @media (max-width: 480px) {
      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Slychat</h2>
    <div id="chatBox"></div>
    <input type="text" id="messageInput" placeholder="Vpiši sporočilo..." />
    <div class="actions">
      <button class="btn" onclick="sendMessage()">Pošlji</button>
      <button class="btn" onclick="logout()">Odjava</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const chatBox = document.getElementById("chatBox");
    const messageInput = document.getElementById("messageInput");

    let currentChatPartner = null; // UID uporabnika v zasebnem klepetu

    const userNamesCache = {};

    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location.href = "auth.html";
      } else {
        db.ref("messages").on("child_added", async snapshot => {
          const msg = snapshot.val();
          const senderUid = msg.uid;

          // Če smo v zasebnem klepetu, prikazuj samo ustrezna sporočila
          if (currentChatPartner) {
            if (
              !(
                (msg.uid === user.uid && msg.privateUid === currentChatPartner) ||
                (msg.uid === currentChatPartner && msg.privateUid === user.uid)
              )
            ) return;
          } else {
            if (msg.privateUid) return; // Skrivaj zasebna sporočila v javnem načinu
          }

          let displayName = userNamesCache[senderUid];
          if (!displayName) {
            try {
              const userSnap = await db.ref('users/' + senderUid).once('value');
              const userData = userSnap.val();
              displayName = userData?.displayName || "Anonimen";
              userNamesCache[senderUid] = displayName;
            } catch {
              displayName = "Anonimen";
            }
          }

          const div = document.createElement("div");

          // **SPREMEMBA: klikabilno ime za začetek zasebnega klepeta**
          const senderSpan = document.createElement("span");
          senderSpan.classList.add("sender");
          senderSpan.textContent = displayName + ": ";
          senderSpan.style.cursor = "pointer";
          senderSpan.title = "Klikni za zasebni pogovor";
          senderSpan.onclick = () => {
            if (user.uid === senderUid) return; // ne dovoli zasebnega klepeta sam s sabo
            currentChatPartner = senderUid;
            chatBox.innerHTML = "";
            alert("Vstopil si v zasebni pogovor z " + displayName);
          };

          const hiddenText = document.createElement("span");
          hiddenText.classList.add("hiddenText");
          hiddenText.textContent = "Zasebno sporočilo";

          const realText = document.createElement("span");
          realText.classList.add("realText");
          realText.textContent = msg.text;

          if (msg.hidden) {
            div.classList.add("hiddenMessage");
            div.appendChild(senderSpan);
            div.appendChild(hiddenText);
            div.appendChild(realText);
          } else {
            div.appendChild(senderSpan);
            div.appendChild(realText);
          }

          // Povabilo za zasebni pogovor
          if (msg.invite && msg.privateUid === user.uid) {
            const btn = document.createElement("button");
            btn.textContent = "Zasebni pogovor";
            btn.classList.add("btn");
            btn.onclick = () => {
              currentChatPartner = msg.uid;
              chatBox.innerHTML = "";
              alert("Vstopil si v zasebni pogovor z " + displayName);
            };
            div.appendChild(document.createElement("br"));
            div.appendChild(btn);
          }

          chatBox.appendChild(div);
          chatBox.scrollTop = chatBox.scrollHeight;
        });
      }
    });

    function sendMessage(isHidden = false) {
      const user = auth.currentUser;
      const text = messageInput.value.trim();
      if (!text) return;

      if (text === "/clearchat") {
        db.ref("messages").remove().then(() => {
          chatBox.innerHTML = "";
          alert("Klepetalnica je bila pobrisana.");
        }).catch(error => alert("Napaka pri brisanju: " + error.message));
        return;
      }

      if (text === "/public") {
        currentChatPartner = null;
        chatBox.innerHTML = "";
        return;
      }

      // Povabilo za zasebni pogovor z ukazom /@imeuporabnika
      if (text.startsWith("/@")) {
        const name = text.slice(2).toLowerCase().trim();
        db.ref("users").once("value").then(snapshot => {
          const users = snapshot.val();
          for (const uid in users) {
            if (users[uid].displayName.toLowerCase() === name) {
              db.ref("messages").push({
                uid: user.uid,
                text: "Povabilo v zasebni pogovor",
                invite: true,
                privateUid: uid
              });
              alert("Povabilo poslano.");
              return;
            }
          }
          alert("Uporabnik ni najden.");
        });
        messageInput.value = "";
        return;
      }

      let hidden = false;
      let cleanText = text;

      if (text.startsWith("*") || isHidden) {
        hidden = true;
        cleanText = text.startsWith("*") ? text.slice(1).trim() : text;
      }

      const messageData = {
        uid: user.uid,
        text: cleanText,
        hidden,
        mention: null,
        privateUid: currentChatPartner || null
      };

      db.ref("messages").push(messageData);
      messageInput.value = "";
    }

    function logout() {
      auth.signOut().then(() => (window.location.href = "auth.html"));
    }

    messageInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        if (e.ctrlKey) {
          sendMessage(true);
        } else {
          sendMessage();
        }
      }
    });
  </script>
</body>
</html>
