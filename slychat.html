<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slyChat</title>
    <link rel="stylesheet" href="slychat.css">
</head>
<body>
    <div id="chat-container">
        <div id="code-container">
            <div id="user-list">
                <h4>Logged-in Users</h4>
                <div id="user-names">
                    <!-- Tu se bodo izpisovali prijavljeni uporabniki -->
                </div>
            </div>
            <div>
                <input type="text" id="code-input" placeholder="Enter 6-digit code">
                <button id="join-button">Join Chat</button>
                <button id="reserve-button">Reserve Session</button> <!-- New button for reserving a session -->
                <button id="google-sign-in-button">Sign in with Google</button> <!-- Google Sign-In button -->
                <button id="google-sign-out-button" style="display:none;">Sign Out</button> <!-- Google Sign-Out button -->
            </div>
        </div>
        <div id="chat-window"></div>
        <input type="text" id="chat-input" placeholder="Type a message...">
        <button id="send-button">Send</button>
    </div>

    <!-- Popup Container -->
    <div id="popup-container">
        <h3>Reserve Session</h3>
        <input type="text" id="reservation-code" placeholder="Enter 6-digit code">
        <div id="email-container">
            <div class="email-input">
                <input type="email" placeholder="Enter email">
                <button id="add-email">+</button>
            </div>
        </div>
        <button id="save-button">Save</button>
        <button id="close-button">Close</button>
    </div>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

// Firebase configuration
const firebaseConfig = {
    apiKey: "AIzaSyA2l2SEcXPrLGpSOiTyyC55l35OMln1VUM",
    authDomain: "slychat-e0a59.firebaseapp.com",
    projectId: "slychat-e0a59",
    storageBucket: "slychat-e0a59.appspot.com",
    messagingSenderId: "462724887870",
    appId: "1:462724887870:web:72d25e58b20af6e2d2286f",
    measurementId: "G-52CMK3FJYW"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();
const provider = new GoogleAuthProvider();

// Elements
const chatWindow = document.getElementById('chat-window');
const chatInput = document.getElementById('chat-input');
const sendButton = document.getElementById('send-button');
const codeInput = document.getElementById('code-input');
const joinButton = document.getElementById('join-button');
const reserveButton = document.getElementById('reserve-button');
const googleSignInButton = document.getElementById('google-sign-in-button');
const googleSignOutButton = document.getElementById('google-sign-out-button');
const userNamesContainer = document.getElementById('user-names');
const popupContainer = document.getElementById('popup-container');
const addEmailButton = document.getElementById('add-email');
const emailContainer = document.getElementById('email-container');
const saveButton = document.getElementById('save-button');
const closeButton = document.getElementById('close-button');

let currentUser = null;  // Current user
let chatRoomCode = 'public'; // Default public room
const emailList = [];

function addMessageToChatWindow(message, sender, isSentByCurrentUser, status) {
    const msgElement = document.createElement('div');
    msgElement.classList.add('message-box');

    const senderNameElement = document.createElement('div');
    senderNameElement.classList.add('sender-name');
    senderNameElement.textContent = sender;

    const msgTextElement = document.createElement('div');
    msgTextElement.textContent = message.text;

    const msgStatusElement = document.createElement('div');
    msgStatusElement.classList.add('message-status');
    msgStatusElement.textContent = status;

    if (isSentByCurrentUser) {
        msgElement.classList.add('sent');
    } else {
        msgElement.classList.add('received');
    }

    msgElement.appendChild(senderNameElement);
    msgElement.appendChild(msgTextElement);
    msgElement.appendChild(msgStatusElement);

    if (chatWindow) {
        chatWindow.appendChild(msgElement);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    } else {
        console.error('Element #chat-window does not exist in the HTML.');
    }
}

// Google sign-in
googleSignInButton.onclick = () => {
    signInWithPopup(auth, provider)
        .then((result) => {
            const user = result.user;
            currentUser = user;
            updateUI(user);
        })
        .catch((error) => {
            console.error("Error during sign-in: ", error);
        });
};

// Google sign-out
googleSignOutButton.onclick = () => {
    signOut(auth)
        .then(() => {
            currentUser = null;
            updateUI(null);
        })
        .catch((error) => {
            console.error("Error during sign-out: ", error);
        });
};

// Listen for auth state changes
onAuthStateChanged(auth, (user) => {
    if (user) {
        currentUser = user;
        updateUI(user);
    } else {
        currentUser = null;
        updateUI(null);
    }
});

function updateUI(user) {
    if (user) {
        userNamesContainer.textContent = user.displayName || user.email;
        googleSignInButton.style.display = 'none';
        googleSignOutButton.style.display = 'block';
        chatInput.disabled = false;
        sendButton.disabled = false;
    } else {
        userNamesContainer.textContent = 'No user logged in';
        googleSignInButton.style.display = 'block';
        googleSignOutButton.style.display = 'none';
        chatInput.disabled = true;
        sendButton.disabled = true;
    }
}

// Send chat message
sendButton.onclick = async function () {
    const message = chatInput.value;
    if (message.trim() !== '') {
        const chatMessage = {
            text: message,
            sender: currentUser ? currentUser.displayName || currentUser.email : 'Anonymous',
            timestamp: serverTimestamp()
        };

        try {
            await addDoc(collection(db, `chats/${chatRoomCode}`), chatMessage);
            addMessageToChatWindow(chatMessage, chatMessage.sender, true, 'Sent');
            chatInput.value = '';
        } catch (error) {
            console.error('Error sending message: ', error);
        }
    }
};

// Join chat room
joinButton.onclick = function() {
    chatRoomCode = codeInput.value.trim();
    if (chatRoomCode) {
        loadMessages(chatRoomCode);
    }
};

// Load chat messages
function loadMessages(chatRoomCode) {
    const chatRef = collection(db, `chats/${chatRoomCode}`);
    onSnapshot(chatRef, (querySnapshot) => {
        chatWindow.innerHTML = '';

        const messages = [];
        querySnapshot.forEach((doc) => {
            const messageData = doc.data();
            if (messageData.timestamp && messageData.timestamp.toMillis) {
                messageData.timestamp = messageData.timestamp.toMillis();
            }
            messages.push({ id: doc.id, ...messageData });
        });

        messages.sort((a, b) => a.timestamp - b.timestamp);

        messages.forEach((message) => {
            const isSentByCurrentUser = currentUser && 
                (currentUser.displayName === message.sender || currentUser.email === message.sender);
            addMessageToChatWindow(message, message.sender, isSentByCurrentUser, 'Received');
        });
    });
}

// Load messages for the public room
if (chatRoomCode === 'public') {
    loadMessages(chatRoomCode);
}

// Show popup
reserveButton.onclick = function () {
    if (popupContainer) {
        popupContainer.style.display = 'flex';
    } else {
        console.error("Popup container element not found!");
    }
};

// Close popup
closeButton.onclick = function () {
    if (popupContainer) {
        popupContainer.style.display = 'none';
    } else {
        console.error("Popup container element not found!");
    }
};

// Add email functionality
addEmailButton.onclick = function () {
    const emailInput = emailContainer.querySelector('input[type="email"]');
    const email = emailInput.value.trim();
    if (email) {
        emailList.push(email);
        const emailDiv = document.createElement('div');
        emailDiv.textContent = email;
        emailContainer.appendChild(emailDiv);
        emailInput.value = '';
    }
};

// Save session functionality
saveButton.onclick = function () {
    const reservationCode = document.getElementById('reservation-code').value.trim();
    if (reservationCode) {
        console.log('Reservation Code:', reservationCode);
        console.log('Email List:', emailList);
        popupContainer.style.display = 'none';
    }
};
</script>

</body>
</html>
