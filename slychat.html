<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlyChat</title>
    <style>
    body {
        font-family: 'Roboto', sans-serif;
        background: linear-gradient(135deg, #1a1a1a, #333333);
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #f1f1f1;
        overflow: hidden;
        transition: background-color 0.3s ease, transform 0.5s ease-in-out;
    }

    .container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 30px;
        width: 100%;
        max-width: 500px;
        padding: 20px;
        box-sizing: border-box;
    }

    .auth-container, .chat-container {
        background: linear-gradient(45deg, #ff7e5f, #feb47b);
        border-radius: 20px;
        box-shadow: 0 15px 60px rgba(0, 0, 0, 0.2);
        padding: 40px;
        width: 100%;
        max-width: 100%;
        transform: scale(0.95);
        animation: zoomIn 0.8s ease-out forwards, pulse 2s infinite;
    }

    @keyframes zoomIn {
        from {
            opacity: 0;
            transform: scale(0.8);
        }
        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    @keyframes pulse {
        0% {
            transform: scale(1);
        }
        50% {
            transform: scale(1.05);
        }
        100% {
            transform: scale(1);
        }
    }

    h2 {
        font-size: 32px;
        color: #ffffff;
        text-align: center;
        margin-bottom: 30px;
        letter-spacing: 2px;
        font-weight: 700;
        text-transform: uppercase;
        animation: fadeIn 1.5s ease-out;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
    }

    .auth-container input, .input-container input {
        width: 100%;
        padding: 16px 18px;
        margin-bottom: 18px;
        border-radius: 12px;
        border: 2px solid #f7f7f7;
        background-color: #444444;
        color: #f1f1f1;
        font-size: 18px;
        box-sizing: border-box;
        transition: all 0.3s ease-in-out;
        animation: slideIn 0.6s ease-out forwards;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateX(-30px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    .auth-container input:focus, .input-container input:focus {
        border-color: #ff7e5f;
        box-shadow: 0 0 12px rgba(255, 126, 95, 0.7);
        transform: scale(1.05);
    }

    .auth-container button, .input-container button {
        width: 100%;
        padding: 16px;
        background-color: #ff7e5f;
        color: white;
        font-size: 18px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease-in-out;
        animation: fadeInUp 0.8s ease-out forwards;
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .auth-container button:hover, .input-container button:hover {
        background-color: #feb47b;
        transform: translateY(-4px);
        box-shadow: 0 12px 24px rgba(255, 126, 95, 0.3);
    }

    .auth-container button:active, .input-container button:active {
        transform: translateY(2px);
    }

    .messages {
        background-color: #2d2d2d;
        padding: 20px;
        height: 350px;
        overflow-y: auto;
        border-radius: 20px;
        margin-bottom: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        transition: all 0.3s ease;
        animation: fadeInUp 1s ease-out;
    }

    .message {
        padding: 14px;
        margin: 12px 0;
        background-color: #444;
        border-radius: 12px;
        font-size: 16px;
        word-wrap: break-word;
        opacity: 0;
        animation: slideInMessage 0.8s ease-out forwards;
    }

    @keyframes slideInMessage {
        from {
            opacity: 0;
            transform: translateX(-30px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    .message .sender {
        font-weight: bold;
        color: #ff7e5f;
        font-size: 18px;
    }

    .input-container {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
        animation: slideInInput 0.6s ease-out forwards;
    }

    @keyframes slideInInput {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .input-container input {
        width: 80%;
        border-radius: 12px;
        font-size: 16px;
        background-color: #333;
        border: 2px solid #444;
        padding: 14px;
        margin-right: 10px;
        transition: transform 0.2s ease, box-shadow 0.2s ease-in-out;
    }

    .input-container input:focus {
        transform: scale(1.05);
        box-shadow: 0 0 8px rgba(0, 198, 255, 0.7);
    }

    .input-container button {
        width: 15%;
        background-color: #ff7e5f;
        color: white;
        font-size: 16px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: background-color 0.3s ease-in-out, transform 0.2s ease;
    }

    .input-container button:hover {
        background-color: #feb47b;
        transform: translateY(-4px);
    }

    .input-container button:active {
        transform: translateY(2px);
    }

    .auth-container p {
        font-size: 14px;
        color: #f1f1f1;
        text-align: center;
        transition: color 0.3s ease-in-out;
        animation: fadeInText 1.5s ease-out;
    }

    @keyframes fadeInText {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
    }

    .auth-container p a {
        color: #ff7e5f;
        text-decoration: none;
        transition: color 0.3s ease-in-out;
    }

    .auth-container p a:hover {
        color: #feb47b;
        text-decoration: underline;
    }
    </style>
</head>
<body>
    <div id="chat-container" class="chat-container" style="display: none;">
        <h2>SlyChat</h2>
        <div id="messages" class="messages"></div>
        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Type a message" disabled>
            <button onclick="sendMessage()" disabled>Send</button>
        </div>
        <button onclick="signOut()">Sign out</button>
    </div>

    <div id="auth-container" class="auth-container">
        <div id="register-form" style="display: none;">
            <h2>Register</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <input type="text" id="username" placeholder="Username (for registration)">
            <button onclick="register()">Register</button>
            <p id="auth-message"></p>
            <p class="auth-toggle" onclick="toggleAuthForm('login')">Already have an account? Login</p>
        </div>

        <div id="login-form">
            <h2>Login</h2>
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-password" placeholder="Password">
            <button onclick="login()">Login</button>
            <p id="login-message"></p>
            <p class="auth-toggle" onclick="toggleAuthForm('register')">Don't have an account? Register</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js"></script>
    <script type="module">
        import { initializeApp } from 'firebase/app';
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut as firebaseSignOut } from 'firebase/auth';
        import { getDatabase, ref, set, onValue, remove } from 'firebase/database';

        const firebaseConfig = {
            apiKey: "AIzaSyA2l2SEcXPrLGpSOiTyyC55l35OMln1VUM",
            authDomain: "slychat-e0a59.firebaseapp.com",
            projectId: "slychat-e0a59",
            storageBucket: "slychat-e0a59.appspot.com",
            messagingSenderId: "462724887870",
            appId: "1:462724887870:web:72d25e58b20af6e2d2286f",
            measurementId: "G-52CMK3FJYW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        let isAdmin = false;

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('chat-container').style.display = 'block';
                document.getElementById('auth-container').style.display = 'none';
                const username = user.displayName;
                if (user.email === "denis.robinek76@gmail.com") { // Admin check
                    isAdmin = true;
                }
                document.getElementById('messageInput').disabled = false;
                document.querySelector('.input-container button').disabled = false;
                listenForMessages();
            } else {
                document.getElementById('chat-container').style.display = 'none';
                document.getElementById('auth-container').style.display = 'block';
            }
        });

        function toggleAuthForm(formType) {
            if (formType === 'register') {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('register-form').style.display = 'block';
            } else {
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('register-form').style.display = 'none';
            }
        }

        function register() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const username = document.getElementById('username').value;

            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    set(ref(db, 'users/' + user.uid), {
                        username: username,
                        email: email
                    });
                    alert("Registration successful!");
                    toggleAuthForm('login');
                })
                .catch((error) => {
                    const errorMessage = error.message;
                    document.getElementById('auth-message').textContent = errorMessage;
                });
        }

        function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    document.getElementById('login-message').textContent = "Logged in as: " + user.email;
                })
                .catch((error) => {
                    const errorMessage = error.message;
                    document.getElementById('login-message').textContent = errorMessage;
                });
        }

        function sendMessage() {
            const message = document.getElementById('messageInput').value;
            const username = auth.currentUser.displayName;
            const messageRef = ref(db, 'messages/' + Date.now());

            set(messageRef, {
                username: username,
                message: message
            });

            document.getElementById('messageInput').value = ''; 
        }

        function listenForMessages() {
            const messagesRef = ref(db, 'messages');
            onValue(messagesRef, (snapshot) => {
                const data = snapshot.val();
                const messagesDiv = document.getElementById('messages');
                messagesDiv.innerHTML = '';

                for (const key in data) {
                    if (data.hasOwnProperty(key)) {
                        const message = data[key];
                        const messageDiv = document.createElement('div');
                        messageDiv.classList.add('message');
                        messageDiv.innerHTML = `<span class="sender">${message.username}:</span> ${message.message}`;
                        messagesDiv.appendChild(messageDiv);
                        
                        // Admin view: add admin-specific message
                        if (isAdmin && message.username !== 'admin') {
                            const adminMessageDiv = document.createElement('div');
                            adminMessageDiv.classList.add('message');
                            adminMessageDiv.innerHTML = `<span class="sender">Admin:</span> Responding to message: ${message.message}`;
                            messagesDiv.appendChild(adminMessageDiv);
                        }
                    }
                }
            });
        }

        function signOut() {
            firebaseSignOut(auth).then(() => {
                document.getElementById('chat-container').style.display = 'none';
                document.getElementById('auth-container').style.display = 'block';
            });
        }

        function adminCommands(command) {
            const [cmd, ...args] = command.split('@');

            if (!isAdmin) {
                alert("Only admin can use these commands.");
                return;
            }

            if (cmd === '/slyclean') {
                const messagesRef = ref(db, 'messages');
                remove(messagesRef); // Delete all messages
            }

            if (cmd === '/slycolor' && args.length === 2) {
                const username = args[0];
                const color = args[1];
                const messagesRef = ref(db, 'messages');
                onValue(messagesRef, (snapshot) => {
                    const data = snapshot.val();
                    for (const key in data) {
                        if (data.hasOwnProperty(key)) {
                            const message = data[key];
                            if (message.username === username) {
                                const messageDiv = document.createElement('div');
                                messageDiv.classList.add('message');
                                messageDiv.innerHTML = `<span class="sender" style="color: ${color};">${message.username}:</span> ${message.message}`;
                                document.getElementById('messages').appendChild(messageDiv);
                            }
                        }
                    }
                });
            }

            if (cmd === '/slypause') {
                document.getElementById('chat-container').style.display = 'none';
                setTimeout(() => {
                    document.getElementById('chat-container').style.display = 'block';
                }, 3600000); // Chat will be unavailable for one hour
            }
        }
    </script>
</body>
</html>
