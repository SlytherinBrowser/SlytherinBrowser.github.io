<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>Slychat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }
    body {
      background: url('slika.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }
    .container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      width: 90%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    h2 {
      text-align: center;
      font-weight: 500;
    }
    #chatBox {
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #chatBox div {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      padding: 10px 15px;
      color: #fff;
      word-wrap: break-word;
      font-size: 0.95em;
      position: relative;
    }
    .sender {
      font-weight: 600;
      color: #ffd700;
      margin-right: 6px;
    }
    .hiddenMessage .realText {
      display: none;
    }
    .hiddenMessage:hover .realText {
      display: inline;
    }
    .hiddenMessage:hover .hiddenText {
      display: none;
    }
    .hiddenText {
      font-style: italic;
      color: #ccc;
    }
    input[type='text'] {
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      color: white;
      outline: none;
    }
    input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }
    .btn {
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn:hover {
      background-color: rgba(255, 255, 255, 0.25);
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    @media (max-width: 480px) {
      .actions {
        flex-direction: column;
      }
    }
    .private-invite {
      color: #90ee90;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="chatTitle">Slychat</h2>
    <div id="chatBox"></div>
    <input type="text" id="messageInput" placeholder="Vpiši sporočilo..." />
    <div class="actions">
      <button class="btn" onclick="sendMessage()">Pošlji</button>
      <button class="btn" onclick="logout()">Odjava</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const chatBox = document.getElementById("chatBox");
    const messageInput = document.getElementById("messageInput");
    const chatTitle = document.getElementById("chatTitle");

    let privateChatWith = null;
    const userNamesCache = {};

    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location.href = "auth.html";
      } else {
        loadUserNames().then(() => loadMessages());
      }
    });

    async function loadUserNames() {
      const snapshot = await db.ref('users').once('value');
      const users = snapshot.val() || {};
      for (const uid in users) {
        userNamesCache[uid] = users[uid].displayName || "Anonimen";
      }
    }

    function loadMessages() {
      chatBox.innerHTML = "";
      db.ref("messages").off();
      db.ref("messages").on("child_added", snapshot => {
        const msg = snapshot.val();
        const currentUser = auth.currentUser;

        // Filter prikaza glede na tip sporočila in klepet
        if (msg.type === "invite") {
          // Povabilo za zasebni klepet, če si ti prejemnik
          if (msg.to === currentUser.uid) {
            const div = document.createElement("div");
            div.innerHTML = `<span class='private-invite'>[Klikni za zasebni klepet s ${userNamesCache[msg.uid] || "Anonimen"}]</span>`;
            div.querySelector(".private-invite").addEventListener("click", () => {
              privateChatWith = msg.uid;
              chatTitle.textContent = "Zasebno s: " + (userNamesCache[msg.uid] || "Anonimen");
              chatBox.innerHTML = "";
              loadMessages();
            });
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return;
          } else {
            return; // Povabila ne prikazujemo ostalim
          }
        }

        // Filtriranje sporočil za zasebni klepet
        if (privateChatWith) {
          // Prikaži samo sporočila med nama dvema
          if (
            (msg.uid === currentUser.uid && msg.to === privateChatWith) ||
            (msg.uid === privateChatWith && msg.to === currentUser.uid)
          ) {
            displayMessage(msg);
          }
          // druga sporočila ne prikaži
          return;
        } else {
          // Javni klepet: prikaži samo sporočila, ki niso zasebna ali omemba
          if (msg.to) return;         // sporočila z določ. prejemnikom (zasebna) ne pokaži
          if (msg.type === "mention") return;  // omembe v javnem klepetu niso vidne
          displayMessage(msg);
        }
      });
    }

    function displayMessage(msg) {
      const div = document.createElement("div");
      const senderName = userNamesCache[msg.uid] || "Anonimen";
      const senderSpan = document.createElement("span");
      senderSpan.classList.add("sender");
      senderSpan.textContent = senderName + ": ";

      const realText = document.createElement("span");
      realText.classList.add("realText");
      realText.textContent = msg.text;

      if (msg.hidden) {
        const hiddenText = document.createElement("span");
        hiddenText.classList.add("hiddenText");
        hiddenText.textContent = "Skrito sporočilo";

        div.classList.add("hiddenMessage");
        div.appendChild(senderSpan);
        div.appendChild(hiddenText);
        div.appendChild(realText);
      } else {
        div.appendChild(senderSpan);
        div.appendChild(realText);
      }

      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendMessage() {
      const user = auth.currentUser;
      let text = messageInput.value.trim();
      if (!text) return;

      // Povabilo v zasebni klepet - ukaz: /@uporabnik
      if (text.startsWith("/@")) {
        const name = text.slice(2).toLowerCase();
        db.ref("users").once("value").then(snapshot => {
          const users = snapshot.val() || {};
          let found = false;
          for (const uid in users) {
            if (users[uid].displayName.toLowerCase() === name) {
              found = true;
              // Pošlji povabilo
              db.ref("messages").push({
                uid: user.uid,
                to: uid,
                type: "invite",
                text: `${userNamesCache[user.uid] || 'Jaz'} te vabi v zasebni klepet.`,
                timestamp: Date.now()
              });
              // Pošiljatelj samodejno odpre zasebni klepet
              privateChatWith = uid;
              chatTitle.textContent = "Zasebno s: " + users[uid].displayName;
              chatBox.innerHTML = "";
              loadMessages();
              messageInput.value = "";
              break;
            }
          }
          if (!found) alert("Uporabnik s tem imenom ne obstaja.");
        });
        return;
      }

      // Omemba @uporabnik sporočilo
      if (text.startsWith("@")) {
        const spaceIndex = text.indexOf(" ");
        if (spaceIndex === -1) {
          alert("Prosim, vpiši sporočilo za omembo.");
          return;
        }
        const name = text.slice(1, spaceIndex).toLowerCase();
        const content = text.slice(spaceIndex + 1);
        db.ref("users").once("value").then(snapshot => {
          const users = snapshot.val() || {};
          let found = false;
          for (const uid in users) {
            if (users[uid].displayName.toLowerCase() === name) {
              found = true;
              db.ref("messages").push({
                uid: user.uid,
                text: content,
                to: uid,
                type: "mention",
                timestamp: Date.now()
              });
              break;
            }
          }
          if (!found) alert("Uporabnik s tem imenom ne obstaja.");
        });
        messageInput.value = "";
        return;
      }

      // Ukaz za preklop nazaj na javni klepet
      if (text === "/public") {
        privateChatWith = null;
        chatTitle.textContent = "Slychat";
        chatBox.innerHTML = "";
        loadMessages();
        messageInput.value = "";
        return;
      }

      // Ukaz za čiščenje javnega klepeta
      if (text === "/clearchat") {
        if (privateChatWith) {
          alert("Brisanje klepeta je dovoljeno samo v javnem klepetu.");
          return;
        }
        db.ref("messages").remove()
          .then(() => {
            chatBox.innerHTML = "";
            alert("Klepet je bil pobrisan.");
          })
          .catch(error => alert("Napaka pri brisanju: " + error.message));
        messageInput.value = "";
        return;
      }

    // Skrito sporočilo - začne z *
      if (text.startsWith("*")) {
        const realText = text.slice(1).trim();
        if (!realText) {
          alert("Prosim, vpiši sporočilo za skrito sporočilo.");
          return;
        }
        db.ref("messages").push({
          uid: user.uid,
          text: realText,
          hidden: true,
          timestamp: Date.now()
        });
        messageInput.value = "";
        return;
      }

      // Navadno sporočilo - če smo v zasebnem klepetu, pošljemo s prejemnikom
      const messageData = {
        uid: user.uid,
        text: text,
        timestamp: Date.now()
      };
      if (privateChatWith) {
        messageData.to = privateChatWith;
        messageData.type = "private";
      } else {
        messageData.type = "public";
      }

      db.ref("messages").push(messageData);
      messageInput.value = "";
    }

    function logout() {
      auth.signOut();
    }
  </script>
</body>
</html>
