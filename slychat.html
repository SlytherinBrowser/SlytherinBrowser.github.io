  function toggleHidden() {  

    isHiddenMode = !isHiddenMode;  

    const btn = document.getElementById("hiddenToggleBtn");  

    if (isHiddenMode) {  

      btn.classList.add("active");  

      btn.title = "Skrito vklopljeno";  

    } else {  

      btn.classList.remove("active");  

      btn.title = "Skrito izklopljeno";  

    }  

  }  
let messagesRef = null;

function loadMessages() {
  if (messagesRef) messagesRef.off(); // Odstrani starega listenerja, če obstaja

  messagesRef = db.ref("messages");
  messagesRef.on("value", snapshot => {
    chatBox.innerHTML = ""; // počisti chat

    snapshot.forEach(child => {
      const msg = child.val();

      const isPublic = !msg.privateUid;
      const isRelevantPrivate = currentChatPartner && (
        (msg.privateUid === currentUser.uid && msg.uid === currentChatPartner) ||
        (msg.uid === currentUser.uid && msg.privateUid === currentChatPartner)
      );

      if ((!currentChatPartner && isPublic) || isRelevantPrivate) {
        const name = userNamesCache[msg.uid] || "Uporabnik";
        const div = document.createElement("div");
        div.textContent = name + ": " + msg.text + (msg.edited ? " (popravljeno)" : "");
        chatBox.appendChild(div);
      }
    });

    chatBox.scrollTop = chatBox.scrollHeight;
  });
}


auth.onAuthStateChanged(async user => {
if (!user) {
window.location.href = "auth.html";
return;
}

currentUser = user;

document.getElementById("getCoinsBtn").addEventListener("click", async () => {
const userRef = db.ref("users/" + currentUser.uid);
const snapshot = await userRef.once("value");
const userData = snapshot.val() || {};

const today = new Date().toISOString().split("T")[0];  
const lastClaim = userData.lastCoinClaim || null;  

if (lastClaim === today) {  
  alert("Danes si že dobil kovance. Poskusi znova jutri!");  
  return;  
}  

const currentCoins = userData.coins || 0;  
const newCoins = currentCoins + Math.floor(Math.random() * 10) + 1;  

await userRef.update({  
  coins: newCoins,  
  lastCoinClaim: today  
});  

alert(`Dobil si ${newCoins - currentCoins} kovancev! Skupaj: ${newCoins}`);

});

// Nastavi online status
const userStatusRef = db.ref("status/" + user.uid);
userStatusRef.set({ online: true });
userStatusRef.onDisconnect().set({ online: false });

// Naloži vse uporabnike + cache
const usersSnapshot = await db.ref('users').once('value');
const users = usersSnapshot.val() || {};

for (const uid in users) {
userNamesCache[uid] = users[uid].displayName || "Anonimen";
userColorsCache[uid] = users[uid].color || null;
userEffectsCache[uid] = users[uid].effects || null; // 🎯 Shrani učinke
}



// Posodobi online status cache
db.ref("status").on("value", snapshot => {
userStatusCache = snapshot.val() || {};
});

// Preveri potrditev imena
const userData = users?.[currentUser.uid];
if (!userData || !userData.displayName) {
messageInput.placeholder = "Potrdi ime";
messageInput.dataset.nameConfirm = "1";
return;
} else {
messageInput.placeholder = "Vnesi sporočilo...";
messageInput.dataset.nameConfirm = "0";
}

// 🎯 Poslušaj nova sporočila kronološko
db.ref("messages").orderByChild("timestamp").on("child_added", snapshot => {
  const msg = snapshot.val();


  // 🟢 Sistem: zasebno obvestilo
  if (msg.system && msg.privateUid === currentUser.uid) {
    const systemDiv = document.createElement("div");
    systemDiv.style.fontStyle = "italic";
    systemDiv.style.color = "#90ee90";
    const senderName = users[msg.uid]?.displayName || "Uporabnik";
    systemDiv.textContent = `${senderName} ${msg.text}`;
    chatBox.appendChild(systemDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
    return;
  }

  // 🟠 Povabilo v klepet
  if (msg.invite && msg.privateUid === currentUser.uid) {
    const inviterName = users[msg.uid]?.displayName || "Anonimen";
    const inviteDiv = document.createElement("div");
    inviteDiv.innerHTML = `<strong>${inviterName}</strong> te vabi v zasebni klepet.
      <button onclick="acceptInvite('${msg.uid}')">Sprejmi</button>`;
    chatBox.appendChild(inviteDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
    return;
  }

  // 🔒 Zasebna sporočila
  if (currentChatPartner) {
    const isPrivateMatch =
      (msg.uid === currentUser.uid && msg.privateUid === currentChatPartner) ||
      (msg.uid === currentChatPartner && msg.privateUid === currentUser.uid);
    if (!isPrivateMatch) return;
  } else {
    if (msg.privateUid) return;
  }

  // 🪙 Kovanci
  if (msg.uid === currentUser.uid) {
    const userCoinsRef = db.ref(`users/${currentUser.uid}/coins`);
    userCoinsRef.once('value').then(snapshot => {
      const currentCoins = snapshot.val() || 0;
      userCoinsRef.set(currentCoins + 1);
    });
  }

  // 🔧 Nastavitve uporabnika
  const displayName = userNamesCache[msg.uid] || "Anonimen";
  const isOnline = userStatusCache[msg.uid]?.online;
  const color = userColorsCache[msg.uid] || null;
  const effects = userEffectsCache[msg.uid] || null;

  const div = document.createElement("div");
div.classList.add("messageContainer");
div.dataset.key = snapshot.key;

  const defaultAvatar = "https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png";
const avatarUrl = users[msg.uid]?.avatarURL2 || defaultAvatar;

const wrapper = document.createElement("div");
wrapper.className = "avatar-wrapper";
wrapper.style.cssText = `
  width: 40px;
  height: 40px;
  overflow: hidden;
  border-radius: 50%;
  ${isOnline ? "border: 2px solid green;" : ""}
`;

wrapper.innerHTML = `
  <model-viewer
    src="${avatarUrl}"
    camera-controls
    auto-rotate
    disable-zoom
    disable-pan
    disable-tap
    camera-target="0m 1.6m 0m"
    min-camera-orbit="0deg 90deg 0.2m"
    max-camera-orbit="0deg 90deg 0.2m"
    field-of-view="8deg"
    style="width: 100%; height: 100%; object-fit: cover; background-color: transparent;">
  </model-viewer>
`;

wrapper.addEventListener("click", () => {
  prepareReply(msg, snapshot.key, div);
});

div.appendChild(wrapper);

// Ime pošiljatelja
const senderSpan = document.createElement("span");
senderSpan.classList.add("sender");

if (color === "none") {
  senderSpan.style.display = "none";
} else if (color === "rainbow") {
  senderSpan.classList.add("rainbow");
} else if (color) {
  senderSpan.style.color = color;
}

if (effects === "hacker") {
  senderSpan.classList.add("hackerEffect");
}

senderSpan.textContent = displayName + ": ";

// Dodaj v sporočilo
div.appendChild(wrapper);
div.appendChild(senderSpan);
if (msg.replyTo) {
  const replyBox = document.createElement("div");
  replyBox.classList.add("replyBox");
  replyBox.style.borderLeft = "3px solid #888";
  replyBox.style.background = "#f9f9f9";
  replyBox.style.padding = "6px 10px";
  replyBox.style.marginBottom = "6px";
  replyBox.style.fontSize = "13px";
  replyBox.style.color = "#555";
  replyBox.style.cursor = "pointer";
  replyBox.style.borderRadius = "6px";

  // Samo preview, brez imena
  replyBox.textContent = msg.replyTo.preview;

  replyBox.addEventListener("click", () => {
    const original = document.querySelector(`[data-key="${msg.replyTo.messageKey}"]`);
    if (original) {
      original.scrollIntoView({ behavior: "smooth", block: "center" });

      original.classList.add("blink");
      setTimeout(() => {
        original.classList.remove("blink");
      }, 1500);
    }
  });

  div.appendChild(replyBox);
}

  // Sporočilo
  const realText = document.createElement("span");
realText.classList.add("realText");

// Prevedi besedilo
translateText(msg.text, selectedLanguage).then(translated => {
  realText.textContent = translated;
});
  // 🛠️ Efekti na sporočilu
  if (effects === "hacker") {
    realText.classList.add("hackerEffect");
  }

  // 📝 Če je sporočilo bilo urejeno
  if (msg.edited) {
    const editedMark = document.createElement("span");
    editedMark.textContent = " (urejeno)";
    editedMark.style.fontStyle = "italic";
    editedMark.style.color = "#999";
    realText.appendChild(editedMark);
  }

  // 🕵️‍♂️ Skrito sporočilo
  if (msg.hidden) {
    const hiddenText = document.createElement("span");
    hiddenText.classList.add("hiddenText");
    hiddenText.textContent = "Zasebno sporočilo";
    div.classList.add("hiddenMessage");
    div.appendChild(hiddenText);
    div.appendChild(realText);
  } else {
    div.appendChild(realText);
  }

  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
});




// 🔁 Poslušaj spremembe sporočil (npr. popravljeno sporočilo)
db.ref("messages").on("child_changed", snapshot => {
  const updatedMsg = snapshot.val();
  const msgKey = snapshot.key;

  // Poišči in posodobi obstoječe sporočilo
  const allMessages = chatBox.querySelectorAll(".messageContainer");
  allMessages.forEach(div => {
    if (div.dataset.key === msgKey) {
      const textSpan = div.querySelector(".realText");
      if (textSpan) textSpan.textContent = updatedMsg.text;

      // Če je sporočilo zdaj skrito
      if (updatedMsg.hidden) {
        if (!div.classList.contains("hiddenMessage")) {
          const hiddenText = document.createElement("span");
          hiddenText.classList.add("hiddenText");
          hiddenText.textContent = "Zasebno sporočilo";
          div.insertBefore(hiddenText, textSpan);
          div.classList.add("hiddenMessage");
        }
      } else {
        // Odstrani skrito obnašanje če je bil odstranjen "hidden"
        const hiddenEl = div.querySelector(".hiddenText");
        if (hiddenEl) hiddenEl.remove();
        div.classList.remove("hiddenMessage");
      }
    }
  });
});
});





// Posodobi seznam aktivnih uporabnikov
function updateActiveUsersList() {
  const activeUsersDiv = document.getElementById("activeUsers");
  activeUsersDiv.innerHTML = "";

  for (const uid in userStatusCache) {
    if (userStatusCache[uid]?.online) {
      const userDiv = document.createElement("div");
      userDiv.textContent = userNamesCache[uid] || "Anonimen";
      if (userColorsCache[uid] && userColorsCache[uid] !== "none") {
        userDiv.style.color = userColorsCache[uid];
      }
      activeUsersDiv.appendChild(userDiv);
    }
  }
}







  function acceptInvite(inviterUid) {  

    currentChatPartner = inviterUid;  

    chatBox.innerHTML = "";  

    alert("Sprejel si povabilo. Zdaj si v zasebnem klepetu.");  



    db.ref("messages").push({  

      uid: currentUser.uid,  

      text: "sprejel je tvoje povabilo v zasebni klepet.",  

      system: true,  

      privateUid: inviterUid  

    });  

  }  





async function sendMessage(isReply = false) {
  if (!currentUser) return;

  // Če je reply, beremo vrednost iz reply inputa
  let textRaw;
  if (isReply) {
    const replyInput = document.getElementById("replyInput");
    if (!replyInput) return; // reply input ni prisoten
    textRaw = replyInput.value.trim();
  } else {
    textRaw = messageInput.value.trim();
  }

  if (!textRaw) return;

  // Če še nima imena - potrdi
  if (!isReply && messageInput.dataset.nameConfirm === "1") {
    await db.ref("users/" + currentUser.uid).update({
      displayName: textRaw
    });
    userNamesCache[currentUser.uid] = textRaw;
    messageInput.placeholder = "Vnesi sporočilo...";
    messageInput.dataset.nameConfirm = "";
    alert("Ime potrjeno: " + textRaw);
    messageInput.value = "";
    return;
  }

  // Ukaz za spremembo imena: *name*novoime
  if (!isReply && textRaw.startsWith("*name*")) {
    const newName = textRaw.slice(6).trim();
    if (!newName) {
      alert("Vpiši novo ime za spremembo.");
      if (!isReply) messageInput.value = "";
      return;
    }
    await db.ref("users/" + currentUser.uid).update({ displayName: newName });
    userNamesCache[currentUser.uid] = newName;
    alert("Ime je bilo spremenjeno na: " + newName);
    if (!isReply) messageInput.value = "";
    return;
  }

  // Ukaz za spremembo barve imena: *color*barva
  if (!isReply && textRaw.startsWith("*color*")) {
    const colorVal = textRaw.slice(7).trim().toLowerCase();
    if (!colorVal) {
      alert("Vpiši barvo ali 'rainbow' za mavrično animacijo.");
      if (!isReply) messageInput.value = "";
      return;
    }
    if (colorVal === "rainbow") {
      await db.ref("users/" + currentUser.uid).update({ color: "rainbow" });
      userColorsCache[currentUser.uid] = "rainbow";
      alert("Barva imena nastavljena na mavrično (rainbow).");
    } else if (colorVal === "none") {
      await db.ref("users/" + currentUser.uid).update({ color: "none" });
      userColorsCache[currentUser.uid] = "none";
      alert("Ime bo zdaj nevidno.");
    } else {
      const s = new Option().style;
      s.color = colorVal;
      if (s.color === "") {
        alert("Neveljavna barva.");
        if (!isReply) messageInput.value = "";
        return;
      }
      await db.ref("users/" + currentUser.uid).update({ color: colorVal });
      userColorsCache[currentUser.uid] = colorVal;
      alert("Barva imena nastavljena na: " + colorVal);
    }
    if (!isReply) messageInput.value = "";
    return;
  }

  if (!isReply && textRaw === "/public") {
    currentChatPartner = null;
    chatBox.innerHTML = "";
    messageInput.value = "";
    alert("Zdaj si v javnem klepetu.");
    setTimeout(() => location.reload(), 10);
    return;
  }

  if (!isReply && textRaw === "/clearchat") {
    db.ref("messages").remove().then(() => {
      alert("Klepetalnica je bila pobrisana.");
      location.reload();
    }).catch(error => alert("Napaka pri brisanju: " + error.message));
    messageInput.value = "";
    return;
  }

  if (!isReply && textRaw.startsWith("/@")) {
    const invitesText = textRaw.slice(1).trim();
    const inviteNames = invitesText.split(" ").filter(n => n.startsWith("@")).map(n => n.slice(1).toLowerCase());
    if (inviteNames.length === 0) {
      alert("Vpiši uporabniška imena za povabilo, npr. /@ime1 @ime2");
      messageInput.value = "";
      return;
    }
    let notFoundUsers = [];
    let invitedUids = [];
    inviteNames.forEach(name => {
      let foundUid = null;
      for (const uid in userNamesCache) {
        if (userNamesCache[uid].toLowerCase() === name) {
          foundUid = uid;
          break;
        }
      }
      if (foundUid) {
        invitedUids.push(foundUid);
      } else {
        notFoundUsers.push(name);
      }
    });
    if (notFoundUsers.length > 0) {
      alert("Uporabniki niso najdeni: " + notFoundUsers.join(", "));
    }
    invitedUids.forEach(uid => {
      db.ref("messages").push({
        uid: currentUser.uid,
        text: "Povabilo v zasebni klepet",
        invite: true,
        privateUid: uid
      });
    });
    if (invitedUids.length > 0) {
      currentChatPartner = invitedUids[0];
      chatBox.innerHTML = "";
      alert("Vstopil si v zasebni pogovor z: " + invitedUids.map(uid => userNamesCache[uid]).join(", "));
    }
    messageInput.value = "";
    return;
  }

  // Popravljanje zadnjega sporočila
  const isEdit = textRaw.endsWith("**");
  if (isEdit) {
    const newText = textRaw.slice(0, -2).trim();
    const lastMsgIdRef = db.ref("users/" + currentUser.uid + "/lastMessageId");
    const lastMsgIdSnap = await lastMsgIdRef.once("value");
    const lastMsgId = lastMsgIdSnap.val();

    if (!lastMsgId) {
      alert("Ni sporočila za popravek.");
      if (!isReply) messageInput.value = "";
      return;
    }

    await db.ref("messages/" + lastMsgId).update({
      text: newText,
      edited: true
    });

    if (!isReply) messageInput.value = "";
    return;
  }

  // Priprava podatkov za novo sporočilo
  const hidden = isHiddenMode;
  const text = textRaw;

  // Če je reply, dodamo reply metapodatke
  const newMessageData = {
    uid: currentUser.uid,
    text: text,
    hidden: hidden,
    privateUid: currentChatPartner || null
  };

  if (isReply && currentReply) {
    newMessageData.replyTo = {
      toUid: currentReply.toUid,
      messageKey: currentReply.messageKey,
      preview: currentReply.preview,
      name: currentReply.name
    };
  }

  const messageRef = await db.ref("messages").push(newMessageData);

  // Shrani ID zadnjega sporočila uporabnika
  await db.ref("users/" + currentUser.uid + "/lastMessageId").set(messageRef.key);

  // Po pošiljanju očistimo ustrezni input
  if (isReply) {
    const replyInput = document.getElementById("replyInput");
    if (replyInput) replyInput.value = "";
  } else {
    messageInput.value = "";
  }
}

const btnZ = document.getElementById('privateToggleBtn');
const btnH = document.getElementById('hiddenToggleBtn');

// === SPLOŠNE SPREMENLJIVKE ===
let rotationDegree = 0;
const rotationStep = 12;
let moves = [];
const maxMoves = 8;

let selfDestructActive = false;
let selfDestructEndTimestamp = null;
let selfDestructUnlimited = false;
let masterControlActive = false;
let currentUserId = null;  // trenutno prijavljeni uporabnik

// === FIREBASE REALTIME REFERENCA ===
const database = firebase.database();
const selfDestructRef = database.ref('system/selfDestruct');

// === INICIALIZACIJA DOKUMENTA (ENKRATNO BERE) ===
async function initializeSelfDestructDoc() {
  const snapshot = await selfDestructRef.once('value');
  if (!snapshot.exists()) {
    await selfDestructRef.set({
      active: false,
      unlimited: false,
      endTimestamp: null
    });
    console.log("Self destruct dokument je bil ustvarjen v Realtime Database.");
  } else {
    const data = snapshot.val();
    selfDestructActive = data.active;
    selfDestructUnlimited = data.unlimited;
    selfDestructEndTimestamp = data.endTimestamp;

    if (selfDestructActive) {
      disableChat();
      if (!selfDestructUnlimited && selfDestructEndTimestamp) {
        startSelfDestructTimer();
      }
    }
    console.log("Self destruct dokument že obstaja in je stanje naloženo.");
  }
}

// --- POSLUŠANJE V REALNEM ČASU za selfDestruct ---
selfDestructRef.on('value', (snapshot) => {
  const data = snapshot.val();
  if (!data) return;

  selfDestructActive = data.active;
  selfDestructUnlimited = data.unlimited;
  selfDestructEndTimestamp = data.endTimestamp;

  if (selfDestructActive) {
    disableChat();
    if (!selfDestructUnlimited && selfDestructEndTimestamp) {
      startSelfDestructTimer();
    }
  } else {
    enableChat();
    clearInterval(window.selfDestructInterval);
  }
});

// === FUNKCIJA ZA NALAGANJE MASTER CONTROL ZA TRENUTNEGA UPORABNIKA ===
async function loadUserMasterControl() {
  if (!currentUserId) return;
  const snapshot = await database.ref(`users/${currentUserId}/masterControl`).once('value');
  masterControlActive = snapshot.val() || false;
  console.log("Master control za uporabnika:", masterControlActive);
}

// --- POSLUŠANJE SPREMEMB MASTER CONTROL ZA TRENUTNEGA UPORABNIKA ---
function listenUserMasterControl() {
  if (!currentUserId) return;
  database.ref(`users/${currentUserId}/masterControl`).on('value', (snapshot) => {
    masterControlActive = snapshot.val() || false;
    console.log("Master control posodobljen:", masterControlActive);
  });
}

// === SELF DESTRUCT FUNKCIJE ===
async function activateSelfDestruct(duration = 60 * 60 * 1000) {
  if (!masterControlActive) {
    alert("Self destruct lahko aktivira samo master control!");
    return;
  }

  if (selfDestructActive && !selfDestructUnlimited) {
    // Preklop na neomejen self destruct
    selfDestructUnlimited = true;
    selfDestructEndTimestamp = null;
    await selfDestructRef.update({
      active: true,
      unlimited: true,
      endTimestamp: null
    });

    disableChat();
    clearInterval(window.selfDestructInterval);
    alert("Self destruct nastavljen na neomejen čas!");
    return;
  }

  selfDestructActive = true;
  selfDestructUnlimited = false;
  selfDestructEndTimestamp = Date.now() + duration;

  await selfDestructRef.update({
    active: true,
    unlimited: false,
    endTimestamp: selfDestructEndTimestamp
  });

  disableChat();
  startSelfDestructTimer();
  alert("Self destruct aktiviran za 1 uro.");
}

function disableChat() {
  messageInput.disabled = true;
  chatBox.style.opacity = '0.6';
  messageInput.placeholder = "Chat je onemogočen zaradi self destruct.";
}

function enableChat() {
  messageInput.disabled = false;
  chatBox.style.opacity = '1';
  messageInput.placeholder = "Vpiši sporočilo...";
}

function startSelfDestructTimer() {
  clearInterval(window.selfDestructInterval);
  window.selfDestructInterval = setInterval(async () => {
    if (!selfDestructEndTimestamp || selfDestructUnlimited) return;
    if (Date.now() >= selfDestructEndTimestamp) {
      selfDestructActive = false;
      selfDestructEndTimestamp = null;
      selfDestructUnlimited = false;

      await selfDestructRef.update({
        active: false,
        unlimited: false,
        endTimestamp: null
      });

      enableChat();
      clearInterval(window.selfDestructInterval);
      alert("Self destruct se je iztekel. Chat je spet omogočen.");
    }
  }, 1000);
}

async function cancelSelfDestruct() {
  if (!selfDestructActive) return alert("Self destruct ni aktiven.");
  if (!masterControlActive) return alert("Preklic samo z master control!");

  selfDestructActive = false;
  selfDestructUnlimited = false;
  selfDestructEndTimestamp = null;

  await selfDestructRef.update({
    active: false,
    unlimited: false,
    endTimestamp: null
  });

  clearInterval(window.selfDestructInterval);
  enableChat();
  alert("Self destruct je bil deaktiviran.");
}



async function activateSelfDestructForUser(username) {
  try {
    const snapshot = await firebase.database().ref(`users`).orderByChild('username').equalTo(username).once('value');
    if (!snapshot.exists()) {
      alert("Uporabnik ni bil najden.");
      return;
    }

    const userId = Object.keys(snapshot.val())[0];
    await database.ref(`userSelfDestruct/${userId}`).set({
      active: true,
      timestamp: Date.now(),
      duration: 60 * 60 * 1000
    });

    alert(`Self destruct za uporabnika ${username} aktiviran za 1 uro.`);
  } catch (error) {
    console.error("Napaka pri aktivaciji self destruct za uporabnika:", error);
  }
}

async function cancelSelfDestructForUser(username) {
  try {
    const snapshot = await firebase.database().ref(`users`).orderByChild('username').equalTo(username).once('value');
    if (!snapshot.exists()) {
      alert("Uporabnik ni bil najden.");
      return;
    }

    const userId = Object.keys(snapshot.val())[0];
    await database.ref(`userSelfDestruct/${userId}`).remove();

    alert(`Self destruct za uporabnika ${username} preklican.`);
  } catch (error) {
    console.error("Napaka pri preklicu self destruct za uporabnika:", error);
  }
}





// === ROTACIJSKI GESTURE DESKTOP ===
btnZ.addEventListener('wheel', function (event) {
  event.preventDefault();
  if (selfDestructActive && !masterControlActive) return;

  rotationDegree += event.deltaY < 0 ? -rotationStep : rotationStep;
  moves.push(event.deltaY < 0 ? 'L' : 'R');
  if (moves.length > maxMoves) moves.shift();
  btnZ.style.transform = `rotate(${rotationDegree}deg)`;

  interpretCode();
});

// === GESTURE ZA MOBILNI DOTIK ===
(function () {
  let isDragging = false;
  let startX = 0;
  let currentX = 0;
  let zActive = false;

  function resetPosition() {
    btnZ.style.transition = 'transform 0.3s ease';
    btnZ.style.transform = 'translateX(0px)';
    setTimeout(() => { btnZ.style.transition = ''; }, 300);
  }

  function handleSwipe() {
    const deltaX = currentX - startX;
    if (Math.abs(deltaX) > 40) {
      const move = deltaX < 0 ? 'L' : 'R';
      moves.push(move);
      if (moves.length > maxMoves) moves.shift();
      interpretCode();
    }
    resetPosition();
  }

  function addTouchEvents() {
    btnZ.addEventListener('touchstart', (e) => {
      isDragging = true;
      startX = e.touches[0].clientX;
    });

    btnZ.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      currentX = e.touches[0].clientX;
      const deltaX = currentX - startX;
      const maxX = container.offsetWidth / 2 - btnZ.offsetWidth / 2;
      btnZ.style.transform = `translateX(${Math.max(-maxX, Math.min(maxX, deltaX))}px)`;
    });

    btnZ.addEventListener('touchend', () => {
      if (!isDragging) return;
      isDragging = false;
      handleSwipe();
    });
  }

  function toggleZMobile() {
    zActive = !zActive;
    btnZ.classList.toggle('active', zActive);
    btnH.style.display = zActive ? 'none' : 'inline-block';
  }

  btnZ.addEventListener('click', toggleZMobile);

  window.addEventListener('resize', () => {
    btnH.style.display = 'inline-block';
    container.appendChild(btnZ);
  });

  window.addEventListener('load', () => {
    addTouchEvents();
  });
})();

// === DEKODIRANJE GESTURE KODE ===
function interpretCode() {
  const code = moves.join('');

  if (code === 'LRLRLRLR') {
    if (selfDestructActive && !masterControlActive) {
      alert("Ni mogoče vključiti master control med aktivnim self destruct.");
      return;
    }
    masterControlActive = !masterControlActive;

    if (currentUserId) {
      database.ref(`users/${currentUserId}/masterControl`).set(masterControlActive)
        .catch(err => console.error("Napaka pri posodobitvi masterControl:", err));
    }

    alert(masterControlActive ? "Master control VKLOPLJEN." : "Master control IZKLOPLJEN.");

  } else if (code === 'RRLLRRRL') {
    if (!masterControlActive) {
      alert("Self destruct zahteva master control.");
      return;
    }
    if (!selfDestructActive) {
      activateSelfDestruct(); // vklop za 1 uro
    } else if (!selfDestructUnlimited) {
      activateSelfDestruct(); // preklop v unlimited
    }

  } else if (code === 'LLRRLLLR') {
    if (selfDestructActive && selfDestructUnlimited) {
      activateSelfDestruct(60 * 60 * 1000);
    } else if (selfDestructActive) {
      if (!masterControlActive) {
        alert("Preklic zahteva master control.");
        return;
      }
      cancelSelfDestruct();
    }

  } else if (code === 'LLLRLLRL') {
    const targetUser = messageInput.value.trim();
    if (!targetUser) {
      alert("Vnesi ime uporabnika v vnosno polje!");
      return;
    }
    if (!masterControlActive) {
      alert("Self destruct za uporabnika zahteva master control.");
      return;
    }
    activateSelfDestructForUser(targetUser);

  } else if (code === 'RRRLRRLR') {
    const targetUser = messageInput.value.trim();
    if (!targetUser) {
      alert("Vnesi ime uporabnika za preklic self destruct!");
      return;
    }
    if (!masterControlActive) {
      alert("Preklic za uporabnika zahteva master control.");
      return;
    }
    cancelSelfDestructForUser(targetUser);
  }
}

  }
}

function renderReminders() {
  reminderList.innerHTML = "";
  const now = Date.now();

  reminders.forEach((r, i) => {

    div.style.display = "flex";

    if (r.triggered) label.style.fontWeight = "bold";

    div.appendChild(label);

    const buttonsDiv = document.createElement("div");

    // Gumb za potrditev (prikaže se samo če je sprožen opomnik)
    if (r.triggered) {
      const confirmBtn = document.createElement("button");
      confirmBtn.textContent = "✅️";
      confirmBtn.style.marginRight = "5px";
      confirmBtn.style.cursor = "pointer";
      confirmBtn.onclick = () => {
        reminders.splice(i, 1);
        saveReminders();
        renderReminders();
        checkAlerts();
      };
      buttonsDiv.appendChild(confirmBtn);
    }

    // Gumb za brisanje
    const deleteBtn = document.createElement("button");
    deleteBtn.textContent = "❌️";
    deleteBtn.style.cursor = "pointer";
    deleteBtn.onclick = () => {
      reminders.splice(i, 1);
      saveReminders();
      renderReminders();
      checkAlerts();
    };
    buttonsDiv.appendChild(deleteBtn);

    div.appendChild(buttonsDiv);
    reminderList.appendChild(div);
  });
}

// Funkcija za preverjanje ali so opomniki sproženi in prikaz znaka ‼️
function checkAlerts() {
  const now = Date.now();
  let anyTriggered = false;

  reminders.forEach(r => {
    if (!r.triggered && now >= r.time) {
      r.triggered = true;
      anyTriggered = true;
    } else if (r.triggered) {
      anyTriggered = true;
    }
  });

  saveReminders();
  renderReminders();

  alertIcon.style.display = anyTriggered ? "block" : "none";
}

function initUserMap(currentUserIcon) {
  const map = L.map('userMap').setView([46.05, 14.5], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
  }).addTo(map);

  // Prikaži marker za trenutnega uporabnika s svojo ikono ALI avatarjem, če obstaja
  Promise.all([
    firebase.database().ref("locations/" + currentUser.uid).once("value"),
    firebase.database().ref("users/" + currentUser.uid + "/avatarUrl").once("value")
  ]).then(([locSnap, avatarSnap]) => {
    const loc = locSnap.val();
    const avatarUrl = avatarSnap.val();
    if (loc && loc.lat && loc.lng) {
      if (avatarUrl) {
        // Uporabi sliko avatarja kot marker
        const avatarIcon = L.icon({
          iconUrl: avatarUrl,
          iconSize: [40, 40], // prilagodi velikost avatarja
          iconAnchor: [20, 40], // točka sidrišča pod sliko
          popupAnchor: [0, -40]
        });
        L.marker([loc.lat, loc.lng], { icon: avatarIcon }).addTo(map).bindPopup("<b>Tvoja lokacija (avatar)</b>");
      } else {
        // Uporabi emoji ikono, če ni avatarja
        const icon = L.divIcon({
          html: `<div style="font-size: 36px;">${currentUserIcon || '📍'}</div>`,
          className: ""
        });
        L.marker([loc.lat, loc.lng], { icon }).addTo(map).bindPopup("<b>Tvoja lokacija</b>");
      }
    }
  });

  // Prikaži markerje za ostale uporabnike z emoji ikonami (kot prej)
  const active = Object.entries(userStatusCache)
    .filter(([uid, status]) => status.online && uid !== currentUser.uid);

  active.forEach(([uid]) => {
    Promise.all([
      firebase.database().ref("locations/" + uid).once("value"),
      firebase.database().ref("userIcons/" + uid).once("value")
    ]).then(([locSnap, iconSnap]) => {
      const loc = locSnap.val();
      const iconEmoji = iconSnap.val() || '📍'; 
      if (loc && loc.lat && loc.lng) {
        const icon = L.divIcon({
          html: `<div style="font-size: 36px;">${iconEmoji}</div>`,
          className: ""
        });
        const name = userNamesCache[uid] || "Uporabnik";
        L.marker([loc.lat, loc.lng], { icon }).addTo(map).bindPopup(`<b>${name}</b>`);
      }
    });
  });
};

const chatId = "globalChat";
const userId = "user_" + Math.floor(Math.random() * 10000);

const inputField = document.getElementById('messageInput');
const defaultPlaceholder = "Vpiši sporočilo...";

let typingTimeout;

// 🔹 Dodaj CSS za utripanje roba
(function addBlinkCSS() {
  if (document.getElementById('typing-blink-style')) return;
  const style = document.createElement('style');
  style.id = 'typing-blink-style';
  style.textContent = `
    @keyframes borderBlink {
      0%, 100% { border-color: #4a90e2; }
      50% { border-color: #e91e63; }
    }
    .typing-blink {
      animation: borderBlink 1.2s infinite;
      border-width: 2px !important;
      border-style: solid !important;
      outline: none !important;
    }
  `;
  document.head.appendChild(style);
})();

// 🔹 Nastavi onDisconnect, da se status pobriše ob izgubi povezave
firebase.database().ref(`typingStatus/${chatId}/${userId}`).onDisconnect().set(false);

// 🔹 Pošlji status tipkanja ob vnosu
inputField.addEventListener('input', () => {
  firebase.database().ref(`typingStatus/${chatId}/${userId}`).set(true);

  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => {
    firebase.database().ref(`typingStatus/${chatId}/${userId}`).set(false);
  }, 2000);
});

// 🔹 Resetiraj status ob zapiranju okna
window.addEventListener('beforeunload', () => {
  firebase.database().ref(`typingStatus/${chatId}/${userId}`).set(false);
});

// 🔹 Pridobi prikazna imena uporabnikov
async function getUserNames(userIds) {
  const db = firebase.database();
  const promises = userIds.map(id =>
    db.ref(`users/${id}/displayName`).once('value').then(snap => snap.val())
  );
  return Promise.all(promises);
}

// 🔹 Spremljaj status tipkanja drugih uporabnikov
firebase.database().ref(`typingStatus/${chatId}`).on('value', async snapshot => {
  const typingUsers = snapshot.val() || {};
  delete typingUsers[userId]; // odstrani sebe iz prikaza

  const usersTyping = Object.keys(typingUsers).filter(uid => typingUsers[uid]);

  // 🔸 Prisilni reset po 10 sekundah za vsak "zataknjen" status
  Object.entries(typingUsers).forEach(([uid, isTyping]) => {
    if (isTyping) {
      setTimeout(() => {
        firebase.database().ref(`typingStatus/${chatId}/${uid}`).once('value').then(snap => {
          if (snap.val() === true) {
            firebase.database().ref(`typingStatus/${chatId}/${uid}`).set(false);
          }
        });
      }, 10000);
    }
  });

  if (usersTyping.length > 0) {
    inputField.classList.add('typing-blink');

    // Pridobi imena
    const names = await getUserNames(usersTyping);
    const cleanNames = names.filter(n => typeof n === 'string' && n.trim() !== '');

    if (cleanNames.length === 1) {
      inputField.placeholder = `${cleanNames[0]} tipka...`;
    } else if (cleanNames.length > 1) {
      inputField.placeholder = `${cleanNames.join(', ')} tipkajo...`;
    } else {
      inputField.placeholder = "Nekdo tipka...";
    }
  } else {
    inputField.classList.remove('typing-blink');
    inputField.placeholder = defaultPlaceholder;
  }
});




function prepareReply(msg, messageKey, messageDiv) {  
  if (replyPreviewDiv) {  
    replyPreviewDiv.remove();  
    replyPreviewDiv = null;  
  }  

  currentReply = {  
    toUid: msg.uid,  
    messageKey: messageKey,  
    preview: msg.text.length > 100 ? msg.text.slice(0, 100) + "..." : msg.text,  
    name: users[msg.uid]?.displayName || "Anonimen"  
  };  

  replyPreviewDiv = document.createElement("div");  
  replyPreviewDiv.classList.add("replyPreviewMessage");  
  replyPreviewDiv.style.background = "#f1f1f1";  
  replyPreviewDiv.style.border = "1px solid #ccc";  
  replyPreviewDiv.style.padding = "10px";  
  replyPreviewDiv.style.margin = "10px 0";  
  replyPreviewDiv.style.borderRadius = "10px";  
  replyPreviewDiv.style.width = "100%";  
  replyPreviewDiv.style.boxSizing = "border-box";  

  // Vsebina originalnega sporočila  
  const content = document.createElement("div");  
  content.innerHTML = `  
    <strong>Odgovarjaš:</strong> ${currentReply.name}<br>  
    <em>${currentReply.preview}</em>  
  `;  
  replyPreviewDiv.appendChild(content);  

  // Input za odgovor  
  const replyInput = document.createElement("input");  
  replyInput.type = "text";  
  replyInput.id = "replyInput";  
  replyInput.placeholder = "Napiši odgovor...";  
  replyInput.style.width = "100%";  
  replyInput.style.padding = "6px";  
  replyInput.style.margin = "10px 0 0 0";  
  replyInput.style.borderRadius = "6px";  
  replyInput.style.border = "1px solid #ccc";  
  replyPreviewDiv.appendChild(replyInput);  

  // Gumbi spodaj  
  const buttonRow = document.createElement("div");  
  buttonRow.style.marginTop = "10px";  
  buttonRow.style.display = "flex";  
  buttonRow.style.gap = "10px";  

  const cancelBtn = document.createElement("button");  
  cancelBtn.textContent = "✖ Prekliči";  
  cancelBtn.style.flex = "1";  
  cancelBtn.style.padding = "6px 12px";  
  cancelBtn.style.border = "none";  
  cancelBtn.style.borderRadius = "6px";  
  cancelBtn.style.backgroundColor = "#ccc";  
  cancelBtn.style.cursor = "pointer";  
  cancelBtn.onclick = cancelReply;  

  const confirmBtn = document.createElement("button");  
  confirmBtn.textContent = "✔ Potrdi odgovor";  
  confirmBtn.style.flex = "2";  
  confirmBtn.style.padding = "6px 12px";  
  confirmBtn.style.border = "none";  
  confirmBtn.style.borderRadius = "6px";  
  confirmBtn.style.backgroundColor = "#4CAF50";  
  confirmBtn.style.color = "white";  
  confirmBtn.style.cursor = "pointer";  
  confirmBtn.onclick = () => {  
  sendMessage(true); // pove, da gre za reply, torej se pošlje iz replyInput  
  cancelReply();     // počisti reply UI po pošiljanju  
}; 

  buttonRow.appendChild(cancelBtn);  
  buttonRow.appendChild(confirmBtn);  
  replyPreviewDiv.appendChild(buttonRow);  

  // Dodamo pod originalno sporočilo  
  messageDiv.insertAdjacentElement("afterend", replyPreviewDiv);  
  chatBox.scrollTop = chatBox.scrollHeight;  

  // Fokus na input za odgovor  
  replyInput.focus();
}

function cancelReply() {
  if (replyPreviewDiv) {
    replyPreviewDiv.remove();
    replyPreviewDiv = null;
  }
  currentReply = null;
}



const languages = [
  { code: "sl", name: "Slovenščina" },
  { code: "en", name: "English" },
  { code: "de", name: "Deutsch" },
  { code: "tr", name: "Türkçe" },
  { code: "fr", name: "Français" },
  { code: "it", name: "Italiano" },
  { code: "es", name: "Español" }
];

const slider = document.getElementById("languageSlider");
const langLabel = document.getElementById("currentLang");

let selectedLangIndex = parseInt(localStorage.getItem("sliderLangIndex")) || 0;
slider.value = selectedLangIndex;
updateLang(selectedLangIndex);

slider.addEventListener("input", (e) => {
  selectedLangIndex = parseInt(e.target.value);
  updateLang(selectedLangIndex);
  localStorage.setItem("sliderLangIndex", selectedLangIndex);
});

function updateLang(index) {
  const lang = languages[index];
  langLabel.textContent = `Jezik: ${lang.name}`;
  selectedLanguage = lang.code;
  localStorage.setItem("preferredLang", selectedLanguage);
}

async function translateText(text, targetLang) {
  const response = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=" + targetLang + "&dt=t&q=" + encodeURIComponent(text));
  const result = await response.json();
  return result[0]?.map(t => t[0]).join("") || text;
}
