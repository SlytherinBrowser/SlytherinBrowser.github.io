<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>Slychat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    /* Stilizacija, da je berljivo in lepo */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }
    body {
      background: url('slika.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }
    .container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      width: 90%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    h2 {
      text-align: center;
      font-weight: 500;
    }
    #chatBox {
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #chatBox div {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      padding: 10px 15px;
      color: #fff;
      word-wrap: break-word;
      font-size: 0.95em;
      position: relative;
    }
    .sender {
      font-weight: 600;
      color: #ffd700;
      margin-right: 6px;
    }
    .hiddenMessage .realText {
      display: none;
    }
    .hiddenMessage:hover .realText {
      display: inline;
    }
    .hiddenText {
      font-style: italic;
      color: #ccc;
    }
    input[type='text'] {
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      color: white;
      outline: none;
    }
    input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }
    .btn {
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn:hover {
      background-color: rgba(255, 255, 255, 0.25);
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    @media (max-width: 480px) {
      .actions {
        flex-direction: column;
      }
    }
    .privateInvite {
      color: #66ccff;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="chatTitle">Slychat</h2>
    <div id="chatBox"></div>
    <input type="text" id="messageInput" placeholder="Vpiši sporočilo..." />
    <div class="actions">
      <button class="btn" onclick="sendMessage()">Pošlji</button>
      <button class="btn" onclick="logout()">Odjava</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const chatBox = document.getElementById("chatBox");
    const messageInput = document.getElementById("messageInput");
    const chatTitle = document.getElementById("chatTitle");

    let privateChatWith = null; // UID za zasebni klepet (null = javni klepet)
    const userNamesCache = {};   // Cache za prikaz uporabniških imen

    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location.href = "auth.html";
      } else {
        loadMessages();
      }
    });

    // Pomaga pridobiti uporabniško ime iz UID
    async function getUserName(uid) {
      if (userNamesCache[uid]) return userNamesCache[uid];
      try {
        const snap = await db.ref('users/' + uid).once('value');
        const name = snap.val()?.displayName || "Anonimen";
        userNamesCache[uid] = name;
        return name;
      } catch {
        return "Anonimen";
      }
    }

    // Naloži in prikaže sporočila glede na javni/zasebni klepet
    function loadMessages() {
      chatBox.innerHTML = "";
      db.ref("messages").off();

      db.ref("messages").on("child_added", async snapshot => {
        const msg = snapshot.val();
        const senderUid = msg.uid;
        const currentUser = auth.currentUser;

        // Preveri tip sporočila
        const text = msg.text.trim();

        // Če smo v zasebnem klepetu - pokaži samo sporočila med nama
        if (privateChatWith) {
          // Pokaži le sporočila, ki so med trenutnim userjem in privateChatWith
          const isBetween = 
            (senderUid === currentUser.uid && msg.to === privateChatWith) || 
            (senderUid === privateChatWith && msg.to === currentUser.uid);

          if (!isBetween) return;

          const senderName = await getUserName(senderUid);

          const div = document.createElement("div");
          div.innerHTML = `<span class="sender">${senderName}: </span><span>${msg.text}</span>`;
          chatBox.appendChild(div);
          chatBox.scrollTop = chatBox.scrollHeight;
          return;
        }

        // Če smo v javnem klepetu

        // 1) Skrito sporočilo @imeuporabnika - prikaži samo prejemniku
        if (text.startsWith("@")) {
          const mentionedName = text.slice(1).split(" ")[0].toLowerCase();
          const currentUserName = (await getUserName(currentUser.uid)).toLowerCase();

          if (mentionedName === currentUserName) {
            // Prikaži samo prejemniku (to ni klikabilno)
            const senderName = await getUserName(senderUid);
            const div = document.createElement("div");
            div.classList.add("hiddenMessage");
            div.innerHTML = `<span class="sender">${senderName}: </span><span class="hiddenText">[Zasebno sporočilo]</span><span class="realText">${msg.text}</span>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
          }
          return; // Ostali ne vidijo tega sporočila
        }

        // 2) Povabilo za zasebni klepet /@imeuporabnika - klikabilno
        if (text.startsWith("/@")) {
          const mentionedName = text.slice(2).split(" ")[0].toLowerCase();
          const currentUserName = (await getUserName(currentUser.uid)).toLowerCase();

          if (mentionedName === currentUserName) {
            const senderName = await getUserName(senderUid);

            // Ustvari klikabilno sporočilo, ki preusmeri v zasebni klepet
            const div = document.createElement("div");
            div.innerHTML = `<span class="sender">${senderName}: </span>` +
              `<span class="privateInvite" title="Klikni za zasebni klepet">Povabilo za zasebni klepet</span>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;

            // Klik na povabilo odpre zasebni klepet z uporabnikom, ki je povabil
            div.querySelector(".privateInvite").addEventListener("click", async () => {
              // Poišči UID uporabnika po imenu (senderUid)
              privateChatWith = senderUid;
              chatTitle.textContent = "Zasebno s: " + senderName;
              chatBox.innerHTML = "";
              loadMessages();
            });
          }
          return; // Ostali ne vidijo tega sporočila
        }

        // 3) Navadna sporočila v javnem klepetu - prikaži vsem
        const senderName = await getUserName(senderUid);
        const div = document.createElement("div");
        div.innerHTML = `<span class="sender">${senderName}: </span><span>${msg.text}</span>`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
      });
    }

    function sendMessage() {
      const user = auth.currentUser;
      let text = messageInput.value.trim();
      if (!text) return;

      // Ukazi za preusmeritev /public in /clearchat (v javnem)
      if (text === "/public") {
        privateChatWith = null;
        chatTitle.textContent = "Slychat";
        chatBox.innerHTML = "";
        loadMessages();
        messageInput.value = "";
        return;
      }
      if (text === "/clearchat") {
        if (privateChatWith) {
          alert("Brisanje klepeta je dovoljeno samo v javnem klepetu.");
          messageInput.value = "";
          return;
        }
        db.ref("messages").remove().then(() => {
          chatBox.innerHTML = "";
          alert("Javni klepet je bil pobrisan.");
        }).catch(e => alert("Napaka pri brisanju: " + e.message));
        messageInput.value = "";
        return;
      }

      // Skrita sporočila: če sporočilo začne z *, je skrito (vidno le prejemniku)
      let hidden = false;
      if (text.startsWith("*")) {
        hidden = true;
        text = text.slice(1).trim();
      }

      // Običajno sporočilo (javna ali zasebna omemba)
      // Če je v zasebnem klepetu, dodamo "to" UID za prejemnika
      let toUid = null;
      if (privateChatWith) toUid = privateChatWith;

      // Shrani sporočilo v bazo
      db.ref("messages").push({
        uid: user.uid,
        text,
        hidden,
        to: toUid
      });

      messageInput.value = "";
    }

    function logout() {
      auth.signOut().then(() => (window.location.href = "auth.html"));
    }

    // Po pritisku enter pošlji sporočilo
    messageInput.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
