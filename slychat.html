<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>Slychat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }
    body {
      background: url('slika.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }
    .container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      width: 90%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    h2 {
      text-align: center;
      font-weight: 500;
    }
    #chatBox {
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #chatBox div {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      padding: 10px 15px;
      color: #fff;
      word-wrap: break-word;
      font-size: 0.95em;
      position: relative;
    }
    .sender {
      font-weight: 600;
      color: #ffd700;
      margin-right: 6px;
    }
    .hiddenMessage .realText {
      display: none;
    }
    .hiddenMessage:hover .realText {
      display: inline;
    }
    .hiddenMessage:hover .hiddenText {
      display: none;
    }
    .hiddenText {
      font-style: italic;
      color: #ccc;
    }
    input[type='text'] {
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      color: white;
      outline: none;
    }
    input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }
    .btn {
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn:hover {
      background-color: rgba(255, 255, 255, 0.25);
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    @media (max-width: 480px) {
      .actions {
        flex-direction: column;
      }
    }
    .private-invite {
      color: #90ee90;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="chatTitle">Slychat</h2>
    <div id="chatBox"></div>
    <input type="text" id="messageInput" placeholder="Vpiši sporočilo..." />
    <div class="actions">
      <button class="btn" onclick="sendMessage()">Pošlji</button>
      <button class="btn" onclick="logout()">Odjava</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const chatBox = document.getElementById("chatBox");
    const messageInput = document.getElementById("messageInput");
    const chatTitle = document.getElementById("chatTitle");

    let privateChatWith = null;
    const userNamesCache = {};

    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location.href = "auth.html";
      } else {
        loadMessages();
      }
    });

    function loadMessages() {
      db.ref("messages").off();
      db.ref("messages").on("child_added", async snapshot => {
        const msg = snapshot.val();
        const senderUid = msg.uid;
        const currentUser = auth.currentUser;

        // Povabila za zasebni klepet - samo prejemnik jih vidi
        if (msg.type === "invite" && msg.to === currentUser.uid) {
          const div = document.createElement("div");
          div.innerHTML = `<span class='private-invite'>[Klikni za zasebni klepet s ${userNamesCache[msg.uid] || "uporabnikom"}]</span>`;
          div.querySelector(".private-invite").addEventListener("click", () => {
            privateChatWith = msg.uid;
            chatTitle.textContent = "Zasebno s: " + (userNamesCache[msg.uid] || "Anonimen");
            chatBox.innerHTML = "";
            loadMessages();
          });
          chatBox.appendChild(div);
          chatBox.scrollTop = chatBox.scrollHeight;
          return;
        }

        // Pridobi ime pošiljatelja, če še ni v cacheu
        let displayName = userNamesCache[senderUid];
        if (!displayName) {
          try {
            const userSnap = await db.ref('users/' + senderUid).once('value');
            displayName = userSnap.val()?.displayName || "Anonimen";
            userNamesCache[senderUid] = displayName;
          } catch {
            displayName = "Anonimen";
          }
        }

        // Filtriranje sporočil glede na zasebni klepet ali javni
        if (privateChatWith) {
          // V zasebnem klepetu prikaži samo sporočila med uporabnikoma
          const isRelevant = 
            (msg.uid === currentUser.uid && msg.to === privateChatWith) ||
            (msg.uid === privateChatWith && msg.to === currentUser.uid);
          if (!isRelevant) return;
        } else {
          // V javnem klepetu ne prikaži zasebnih sporočil ali povabil
          if (msg.to && msg.type !== "mention") return;
        }

        // Priprava elementov za prikaz sporočila
        const div = document.createElement("div");
        const senderSpan = document.createElement("span");
        senderSpan.classList.add("sender");
        senderSpan.textContent = displayName + ": ";

        const realText = document.createElement("span");
        realText.classList.add("realText");
        realText.textContent = msg.text;

        // Skrito sporočilo
        if (msg.hidden) {
          const hiddenText = document.createElement("span");
          hiddenText.classList.add("hiddenText");
          hiddenText.textContent = "Skrito sporočilo";

          div.classList.add("hiddenMessage");
          div.appendChild(senderSpan);
          div.appendChild(hiddenText);
          div.appendChild(realText);
        } else {
          div.appendChild(senderSpan);
          div.appendChild(realText);
        }

        // Če je zasebno sporočilo (tip "mention" ali ima polje to), prikaži samo pošiljatelju in prejemniku v javnem klepetu
        if (!privateChatWith && msg.to) {
          if (msg.uid !== currentUser.uid && msg.to !== currentUser.uid) {
            return; // ne prikaži drugim
          }
        }

        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
      });
    }

    function sendMessage(isHidden = false) {
      const user = auth.currentUser;
      let text = messageInput.value.trim();
      if (!text) return;

      // Povabilo za zasebni klepet: /@uporabnik
      if (text.startsWith("/@")) {
        const name = text.slice(2).toLowerCase();
        db.ref("users").once("value").then(snapshot => {
          const users = snapshot.val();
          for (const uid in users) {
            if (users[uid].displayName.toLowerCase() === name) {
              // Pošlji povabilo za zasebni klepet prejemniku (uid)
              const currentUser = auth.currentUser;
              // Pošlji povabilo v bazo
              db.ref("messages").push({
                uid: currentUser.uid,
                to: uid,
                text: `${userNamesCache[currentUser.uid] || 'Jaz'} te vabi v zasebni klepet.`,
                type: "invite",
                timestamp: Date.now()
              });

              // Pošiljatelj samodejno odpre zasebni klepet
              privateChatWith = uid;
              chatTitle.textContent = "Zasebno s: " + users[uid].displayName;
              chatBox.innerHTML = "";
              loadMessages();
              messageInput.value = "";
              return;
            }
          }
          alert("Uporabnik s tem imenom ne obstaja.");
        });
        return;
      }

      // Ukazi
      if (text === "/public") {
        privateChatWith = null;
        chatTitle.textContent = "Javni klepet";
        chatBox.innerHTML = "";
        loadMessages();
        messageInput.value = "";
        return;
      }

      if (text === "/clearchat") {
        if (!privateChatWith) {
          // Brisanje javnega klepeta
          db.ref("messages").remove();
          chatBox.innerHTML = "";
          messageInput.value = "";
          return;
        } else {
          alert("Brisanje zasebnega klepeta ni podprto.");
          return;
        }
      }

      // Skrito sporočilo - začne se z zvezdico *
      if (text.startsWith("*")) {
        isHidden = true;
        text = text.slice(1).trim();
      }

      // Pripravi objekt sporočila
      const messageObj = {
        uid: auth.currentUser.uid,
        text: text,
        timestamp: Date.now(),
        hidden: isHidden
      };

      // Če je zasebni klepet, dodaj prejemnika (to)
      if (privateChatWith) {
        messageObj.to = privateChatWith;
      }

      db.ref("messages").push(messageObj);
      messageInput.value = "";
    }

    function logout() {
      auth.signOut().then(() => {
        window.location.href = "auth.html";
      });
    }

    // Ob pritisku na Enter pošlji sporočilo
    messageInput.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
