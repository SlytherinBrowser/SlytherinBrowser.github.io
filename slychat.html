<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8" />
<title>Slychat - zasebni klepet</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #222;
    color: #eee;
    margin: 0; padding: 0;
    display: flex; justify-content: center; align-items: center; height: 100vh;
  }
  .container {
    background: rgba(0,0,0,0.7);
    padding: 20px;
    border-radius: 10px;
    width: 90%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #chatBox {
    height: 300px;
    overflow-y: auto;
    background: #111;
    padding: 10px;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #chatBox div {
    padding: 6px 10px;
    background: #333;
    border-radius: 6px;
  }
  .sender {
    font-weight: bold;
    color: #FFD700;
    margin-right: 6px;
  }
  #messageInput {
    padding: 10px;
    border-radius: 6px;
    border: none;
    outline: none;
    font-size: 1em;
  }
  button {
    padding: 10px;
    border: none;
    background: #555;
    color: white;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover {
    background: #777;
  }
  .invite {
    color: #4CAF50;
    cursor: pointer;
    text-decoration: underline;
  }
  .hiddenMessage .hiddenText {
    font-style: italic;
    color: #999;
    display: inline;
  }
  .hiddenMessage .realText {
    display: none;
  }
  .hiddenMessage:hover .hiddenText {
    display: none;
  }
  .hiddenMessage:hover .realText {
    display: inline;
  }
</style>
</head>
<body>
<div class="container">
  <h2 id="chatTitle">Slychat - Javni klepet</h2>
  <div id="chatBox"></div>
  <input type="text" id="messageInput" placeholder="Vpiši sporočilo..." autocomplete="off" />
  <div style="display:flex; gap:10px;">
    <button onclick="sendMessage()">Pošlji</button>
    <button onclick="logout()">Odjava</button>
  </div>
</div>

<script>
  // Firebase nastavitve
  const firebaseConfig = {
    apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
    authDomain: "chater-cf682.firebaseapp.com",
    databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
    projectId: "chater-cf682",
    storageBucket: "chater-cf682.appspot.com",
    messagingSenderId: "233632075480",
    appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
  };
  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  const db = firebase.database();

  const chatBox = document.getElementById("chatBox");
  const messageInput = document.getElementById("messageInput");
  const chatTitle = document.getElementById("chatTitle");

  let privateChatWith = null; // če je null, javni klepet, sicer uid sogovornika
  const userNamesCache = {};

  // Prijava in nalaganje sporočil
  auth.onAuthStateChanged(user => {
    if (!user) {
      window.location.href = "auth.html";
    } else {
      loadMessages();
    }
  });

  // Pridobi uporabniško ime iz baze ali cache
  async function getDisplayName(uid) {
    if (userNamesCache[uid]) return userNamesCache[uid];
    const snap = await db.ref('users/' + uid).once('value');
    const name = snap.val()?.displayName || "Anonimen";
    userNamesCache[uid] = name;
    return name;
  }

  // Prikaz sporočil
  function loadMessages() {
    chatBox.innerHTML = "";
    db.ref("messages").off();

    db.ref("messages").on("child_added", async snapshot => {
      const msg = snapshot.val();
      const currentUser = auth.currentUser;

      // Dobimo imena
      const senderName = await getDisplayName(msg.uid);

      // Če je povabilo za zasebni klepet in naslovnik sem jaz
      if (msg.type === "invite" && msg.to === currentUser.uid) {
        const div = document.createElement("div");
        div.classList.add("invite");
        div.textContent = `Vabilo za zasebni klepet od ${senderName} - klikni za odprtje`;
        div.onclick = () => {
          privateChatWith = msg.uid;
          chatTitle.textContent = `Zasebno s: ${senderName}`;
          chatBox.innerHTML = "";
          loadMessages();
        };
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return;
      }

      // Filtriranje sporočil glede na kontekst

      if (privateChatWith) {
        // Zasebni klepet - pokaži samo sporočila med mano in sogovornikom
        const allowed = 
          (msg.uid === currentUser.uid && msg.to === privateChatWith) ||
          (msg.uid === privateChatWith && msg.to === currentUser.uid);

        if (!allowed) return; // preskoči ostala

      } else {
        // Javni klepet - pokaži samo sporočila, ki niso zasebna (msg.to == null ali undefined)
        // Ali omembe (type === "mention"), ki so namenjene meni ali jih pošljem jaz
        if (msg.to) {
          if (msg.type === "mention") {
            if (msg.uid !== currentUser.uid && msg.to !== currentUser.uid) return;
          } else {
            // ostala zasebna sporočila v javnem klepetu ne pokažemo
            return;
          }
        }
      }

      // Pripravi div sporočila
      const div = document.createElement("div");

      const senderSpan = document.createElement("span");
      senderSpan.className = "sender";
      senderSpan.textContent = senderName + ": ";

      const realText = document.createElement("span");
      realText.className = "realText";
      realText.textContent = msg.text;

      if (msg.hidden) {
        const hiddenText = document.createElement("span");
        hiddenText.className = "hiddenText";
        hiddenText.textContent = "Skrito sporočilo";

        div.classList.add("hiddenMessage");
        div.appendChild(senderSpan);
        div.appendChild(hiddenText);
        div.appendChild(realText);
      } else {
        div.appendChild(senderSpan);
        div.appendChild(realText);
      }

      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  }

  // Pošiljanje sporočila
  function sendMessage() {
    const user = auth.currentUser;
    let text = messageInput.value.trim();
    if (!text) return;

    // Ukaz za povabilo v zasebni klepet: /@ime
    if (text.startsWith("/@")) {
      const name = text.slice(2).toLowerCase();
      db.ref("users").once("value").then(snapshot => {
        const users = snapshot.val();
        for (const uid in users) {
          if (users[uid].displayName.toLowerCase() === name) {
            // Pošljemo povabilo naslovniku
            db.ref("messages").push({
              uid: user.uid,
              to: uid,
              type: "invite",
              text: "Vabilo v zasebni klepet"
            }).then(() => {
              privateChatWith = uid;
              chatTitle.textContent = "Zasebno s: " + users[uid].displayName;
              chatBox.innerHTML = "";
              loadMessages();
            });
            break;
          }
        }
      });
      messageInput.value = "";
      return;
    }

    // Omemba: @ime sporočilo (vidno samo meni in prejemniku)
    if (text.startsWith("@") && text.indexOf(" ") > 1) {
      const spaceIndex = text.indexOf(" ");
      const name = text.slice(1, spaceIndex).toLowerCase();
      const content = text.slice(spaceIndex + 1);
      db.ref("users").once("value").then(snapshot => {
        const users = snapshot.val();
        for (const uid in users) {
          if (users[uid].displayName.toLowerCase() === name) {
            db.ref("messages").push({
              uid: user.uid,
              text: content,
              to: uid,
              type: "mention"
            });
            break;
          }
        }
      });
      messageInput.value = "";
      return;
    }

    // Ukaz za javni klepet
    if (text === "/public") {
      privateChatWith = null;
      chatTitle.textContent = "Slychat - Javni klepet";
      chatBox.innerHTML = "";
      loadMessages();
      messageInput.value = "";
      return;
    }

    // Ukaz za brisanje javnega klepeta (samo v javnem klepetu)
    if (text === "/clearchat") {
      if (privateChatWith) {
        alert("Brisanje klepeta je dovoljeno samo v javnem klepetu.");
        return;
      }
      db.ref("messages").remove().then(() => {
        chatBox.innerHTML = "";
        alert("Klepet je bil pobrisan.");
      }).catch(error => alert("Napaka pri brisanju: " + error.message));
      messageInput.value = "";
      return;
    }

    // Skrito sporočilo z začetkom *
    let isHidden = false;
    if (text.startsWith("*")) {
      text = text.slice(1);
      isHidden = true;
    }

    // Pošljemo sporočilo - če smo v zasebnem klepetu, dodamo točko 'to' s sogovornikom
    const msgData = {
      uid: user.uid,
      text,
      hidden: isHidden,
      to: privateChatWith || null,
      type: privateChatWith ? "private" : null
    };

    db.ref("messages").push(msgData)
      .then(() => {
        messageInput.value = "";
      })
      .catch(e => alert("Napaka pri pošiljanju: " + e.message));
  }

  // Odjava
  function logout() {
    auth.signOut().then(() => {
      window.location.href = "auth.html";
    });
  }

  // Pošlji sporočilo ob pritisku Enter
  messageInput.addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
  });
</script>
</body>
</html>
