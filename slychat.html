<script>  
  
  const firebaseConfig = {  
  
    apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",  
  
    authDomain: "chater-cf682.firebaseapp.com",  
  
    databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",  
  
    projectId: "chater-cf682",  
  
    storageBucket: "chater-cf682.appspot.com",  
  
    messagingSenderId: "233632075480",  
  
    appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"  
  
  };  
  
  
  
  firebase.initializeApp(firebaseConfig);  
  
  const auth = firebase.auth();  
  
  const db = firebase.database();  
  
  
  
  const chatBox = document.getElementById("chatBox");  
  
  const messageInput = document.getElementById("messageInput");  
  
  
  
  let currentChatPartner = null;  
  
  let currentUser = null;  
  
  const userNamesCache = {};  
  
  let userStatusCache = {};  
  
  let isHiddenMode = false;  
  
  let userColorsCache = {}; // Za shranjevanje barv uporabnikov  
  
  
  
  // DODANO: animacija mavrične barve (rainbow)  
  
  const style = document.createElement('style');  
  
  style.textContent = `  
  
    @keyframes rainbow {  
  
      0%, 100% { color: red; }  
  
      15% { color: orange; }  
  
      30% { color: yellow; }  
  
      45% { color: green; }  
  
      60% { color: blue; }  
  
      75% { color: indigo; }  
  
      90% { color: violet; }  
  
    }  
  
    .rainbow {  
  
      animation: rainbow 3s linear infinite;  
  
      font-weight: bold;  
  
    }  
  
  `;  
  
  document.head.appendChild(style);  
  
  
  
  function toggleHidden() {  
  
    isHiddenMode = !isHiddenMode;  
  
    const btn = document.getElementById("hiddenToggleBtn");  
  
    if (isHiddenMode) {  
  
      btn.classList.add("active");  
  
      btn.title = "Skrito vklopljeno";  
  
    } else {  
  
      btn.classList.remove("active");  
  
      btn.title = "Skrito izklopljeno";  
  
    }  
  
  }  
  
  
  
  auth.onAuthStateChanged(async user => {  
  
    if (!user) {  
  
      window.location.href = "auth.html";  
  
      return;  
  
    }  
  
  
  
    currentUser = user;  
  
  
  
    const userStatusRef = db.ref("status/" + user.uid);  
  
    userStatusRef.set({ online: true });  
  
    userStatusRef.onDisconnect().set({ online: false });  
  
  
  
    const usersSnapshot = await db.ref('users').once('value');  
  
    const users = usersSnapshot.val() || {};  
  
    for (const uid in users) {  
  
      userNamesCache[uid] = users[uid].displayName || "Anonimen";  
  
      userColorsCache[uid] = users[uid].color || null;  
  
    }  
  
  
  
    db.ref("status").on("value", snapshot => {  
  
      userStatusCache = snapshot.val() || {};  
  
    });  
  
  
  
    // Potrditev imena  
  
    const userData = users[currentUser.uid];  
  
    if (!userData || !userData.displayName) {  
  
      messageInput.placeholder = "Potrdi ime";  
  
      messageInput.dataset.nameConfirm = "1";  
  
      return;  
  
    } else {  
  
      messageInput.placeholder = "Vnesi sporočilo...";  
  
    }  
  
  
  
    db.ref("messages").on("child_added", snapshot => {  
  
      const msg = snapshot.val();  
  
  
  
      if (msg.system && msg.privateUid === currentUser.uid) {  
  
        const systemDiv = document.createElement("div");  
  
        systemDiv.style.fontStyle = "italic";  
  
        systemDiv.style.color = "#90ee90";  
  
        const senderName = userNamesCache[msg.uid] || "Uporabnik";  
  
        systemDiv.textContent = `${senderName} ${msg.text}`;  
  
        chatBox.appendChild(systemDiv);  
  
        chatBox.scrollTop = chatBox.scrollHeight;  
  
        return;  
  
      }  
  
  
  
      if (msg.invite && msg.privateUid === currentUser.uid) {  
  
        const inviterName = userNamesCache[msg.uid] || "Anonimen";  
  
        const inviteDiv = document.createElement("div");  
  
        inviteDiv.innerHTML = `<strong>${inviterName}</strong> te vabi v zasebni klepet.   
  
          <button onclick="acceptInvite('${msg.uid}')">Sprejmi</button>`;  
  
        chatBox.appendChild(inviteDiv);  
  
        chatBox.scrollTop = chatBox.scrollHeight;  
  
        return;  
  
      }  
  
  
  
      if (currentChatPartner) {  
  
        const isPrivateMatch =  
  
          (msg.uid === currentUser.uid && msg.privateUid === currentChatPartner) ||  
  
          (msg.uid === currentChatPartner && msg.privateUid === currentUser.uid);  
  
        if (!isPrivateMatch) return;  
  
      } else {  
  
        if (msg.privateUid) return;  
  
      }  
  
  
  
      const displayName = userNamesCache[msg.uid] || "Anonimen";  
  
      const isOnline = userStatusCache[msg.uid]?.online;  
  
      const color = userColorsCache[msg.uid] || null;  
  
  
  
      const div = document.createElement("div");  
  
      const senderSpan = document.createElement("span");  
  
      senderSpan.classList.add("sender");  
  
  
  
      // Nastavi barvo in mavrično animacijo  
  
      if (color === "rainbow") {  
  
        senderSpan.classList.add("rainbow");  
  
      } else if (color) {  
  
        senderSpan.style.color = color;  
  
      }  
  
  
  
      if (isOnline) {  
  
        senderSpan.innerHTML = `<span style="color: green; font-size: 1.2em;">●</span> ${displayName}: `;  
  
      } else {  
  
        senderSpan.textContent = displayName + ": ";  
  
      }  
  
  
  
      const realText = document.createElement("span");  
  
      realText.classList.add("realText");  
  
      realText.textContent = msg.text;  
  
  
  
      if (msg.hidden) {  
  
        const hiddenText = document.createElement("span");  
  
        hiddenText.classList.add("hiddenText");  
  
        hiddenText.textContent = "Zasebno sporočilo";  
  
        div.classList.add("hiddenMessage");  
  
        div.appendChild(senderSpan);  
  
        div.appendChild(hiddenText);  
  
        div.appendChild(realText);  
  
      } else {  
  
        div.appendChild(senderSpan);  
  
        div.appendChild(realText);  
  
      }  
  
  
  
      chatBox.appendChild(div);  
  
      chatBox.scrollTop = chatBox.scrollHeight;  
  
    });  
  
  });  
  
  
  
  function acceptInvite(inviterUid) {  
  
    currentChatPartner = inviterUid;  
  
    chatBox.innerHTML = "";  
  
    alert("Sprejel si povabilo. Zdaj si v zasebnem klepetu.");  
  
  
  
    db.ref("messages").push({  
  
      uid: currentUser.uid,  
  
      text: "sprejel je tvoje povabilo v zasebni klepet.",  
  
      system: true,  
  
      privateUid: inviterUid  
  
    });  
  
  }  
  
  
  
  async function sendMessage() {  
  
    if (!currentUser) return;  
  
    const textRaw = messageInput.value.trim();  
  
    if (!textRaw) return;  
 

 
  



  
    // Če še nima imena - potrdi  
  
    if (messageInput.dataset.nameConfirm === "1") {  
  
      await db.ref("users/" + currentUser.uid).update({  
  
        displayName: textRaw  
  
      });  
  
      userNamesCache[currentUser.uid] = textRaw;  
  
      messageInput.placeholder = "Vnesi sporočilo...";  
  
      messageInput.dataset.nameConfirm = "";  
  
      alert("Ime potrjeno: " + textRaw);  
  
      messageInput.value = "";  
  
      return;  
  
    }  
  
  
  
    // Ukaz za spremembo imena: *name*novoime  
  
    if (textRaw.startsWith("*name*")) {  
  
      const newName = textRaw.slice(6).trim();  
  
      if (!newName) {  
  
        alert("Vpiši novo ime za spremembo.");  
  
        messageInput.value = "";  
  
        return;  
  
      }  
  
      await db.ref("users/" + currentUser.uid).update({ displayName: newName });  
  
      userNamesCache[currentUser.uid] = newName;  
  
      alert("Ime je bilo spremenjeno na: " + newName);  
  
      messageInput.value = "";  
  
      return;  
  
    }  
  
  
  
    // Ukaz za spremembo barve imena: *color*barva  
  
    if (textRaw.startsWith("*color*")) {  
  
      const colorVal = textRaw.slice(7).trim().toLowerCase();  
  
      if (!colorVal) {  
  
        alert("Vpiši barvo ali 'rainbow' za mavrično animacijo.");  
  
        messageInput.value = "";  
  
        return;  
  
      }  
  
      if (colorVal === "rainbow") {  
  
        await db.ref("users/" + currentUser.uid).update({ color: "rainbow" });  
  
        userColorsCache[currentUser.uid] = "rainbow";  
  
        alert("Barva imena nastavljena na mavrično (rainbow).");  
  
      } else {  
  
        // Preverimo osnovno veljavnost barve (lahko še izboljšamo)  
  
        const s = new Option().style;  
  
        s.color = colorVal;  
  
        if (s.color === "") {  
  
          alert("Neveljavna barva.");  
  
          messageInput.value = "";  
  
          return;  
  
        }  
  
        await db.ref("users/" + currentUser.uid).update({ color: colorVal });  
  
        userColorsCache[currentUser.uid] = colorVal;  
  
        alert("Barva imena nastavljena na: " + colorVal);  
  
      }  
  
      messageInput.value = "";  
  
      return;  
  
    }  
  
  
  
    if (textRaw === "/public") {  
  
      currentChatPartner = null;  
  
      chatBox.innerHTML = "";  
  
      messageInput.value = "";  
  
      alert("Zdaj si v javnem klepetu.");  
  
      setTimeout(() => location.reload(), 10);  
  
      return;  
  
    }  
  
  
  
    if (textRaw === "/clearchat") {  
  
      db.ref("messages").remove().then(() => {  
  
        alert("Klepetalnica je bila pobrisana.");  
  
        location.reload();  
  
      }).catch(error => alert("Napaka pri brisanju: " + error.message));  
  
      messageInput.value = "";  
  
      return;  
  
    }  
  
  
  
    if (textRaw.startsWith("/@")) {
  
  // Odstranimo začetni "/"
  
  const invitesText = textRaw.slice(1).trim(); // "/@ime1 @ime2" -> "@ime1 @ime2"
  
  // Razdelimo na posamezne uporabniške povabile (npr. "@ime1", "@ime2")
  
  const inviteNames = invitesText.split(" ").filter(n => n.startsWith("@")).map(n => n.slice(1).toLowerCase());
  

  
  if (inviteNames.length === 0) {
  
    alert("Vpiši uporabniška imena za povabilo, npr. /@ime1 @ime2");
  
    messageInput.value = "";
  
    return;
  
  }
  

  
  let notFoundUsers = [];
  
  let invitedUids = [];
  

  
  // Poiščemo Uid za vsako ime
  
  inviteNames.forEach(name => {
  
    let foundUid = null;
  
    for (const uid in userNamesCache) {
  
      if (userNamesCache[uid].toLowerCase() === name) {
  
        foundUid = uid;
  
        break;
  
      }
  
    }
  
    if (foundUid) {
  
      invitedUids.push(foundUid);
  
    } else {
  
      notFoundUsers.push(name);
  
    }
  
  });
  

  
  if (notFoundUsers.length > 0) {
  
    alert("Uporabniki niso najdeni: " + notFoundUsers.join(", "));
  
  }
  

  
  // Pošljemo povabila v bazo za vse najdene uporabnike
  
  invitedUids.forEach(uid => {
  
    db.ref("messages").push({
  
      uid: currentUser.uid,
  
      text: "Povabilo v zasebni klepet",
  
      invite: true,
  
      privateUid: uid
  
    });
  
  });
  

  
  if (invitedUids.length > 0) {
  
    currentChatPartner = invitedUids[0]; // nastavimo prvega kot trenutnega partnerja
  
    chatBox.innerHTML = "";
  
    alert("Vstopil si v zasebni pogovor z: " + invitedUids.map(uid => userNamesCache[uid]).join(", "));
  
  }
  

  
  messageInput.value = "";
  
  return;
  
}
  
  
  
    let hidden = isHiddenMode;  
  
    let text = textRaw;  
  
  
  
    db.ref("messages").push({  
  
      uid: currentUser.uid,  
  
      text: text,  
  
      hidden: hidden,  
  
      privateUid: currentChatPartner  
  
    });  
  
  
  
    messageInput.value = "";  
  
  }  
  
  
  
  function logout() {  
  
    auth.signOut().then(() => {  
  
      window.location.href = "auth.html";  
  
    });  
  
  }  
  
  
  
  messageInput.addEventListener("keydown", function (e) {  
  
    if (e.key === "Enter") {  
  
      sendMessage();  
  
    }  
  
  });  
  
  
  
  let showingActiveUsers = false;  
  
  
  
  function toggleActiveUsers() {  
  
    showingActiveUsers = !showingActiveUsers;  
  
    chatBox.innerHTML = "";  
  
  
  
    if (showingActiveUsers) {  
  
      const activeUsers = Object.entries(userStatusCache)  
  
        .filter(([uid, status]) => status.online && uid !== currentUser.uid);  
  
  
  
      if (activeUsers.length === 0) {  
  
        chatBox.innerHTML = "<i>Ni drugih aktivnih uporabnikov.</i>";  
  
      } else {  
  
        activeUsers.forEach(([uid]) => {  
  
          const name = userNamesCache[uid] || "Anonimen";  
  
          const div = document.createElement("div");  
  
          div.innerHTML = `<span style="color: green; font-size: 1.2em;">●</span> ${name}`;  
  
          chatBox.appendChild(div);  
  
        });  
  
      }  
  
    } else {  
  
      location.reload();  
  
    }  
  
  }   


// === ELEMENTI ===
const btnZ = document.getElementById('privateToggleBtn');
const btnH = document.getElementById('hiddenToggleBtn');
const container = document.querySelector('.message-input-btn-container');


// === SPLOŠNE SPREMENLJIVKE ===
let rotationDegree = 0;
const rotationStep = 12;
let moves = [];
const maxMoves = 8;

let selfDestructActive = false;
let selfDestructEndTimestamp = null;
let selfDestructUnlimited = false;
let masterControlActive = false;
let currentUserId = null;  // trenutno prijavljeni uporabnik

// === FIREBASE REALTIME REFERENCA ===
const database = firebase.database();
const selfDestructRef = database.ref('system/selfDestruct');

// === INICIALIZACIJA DOKUMENTA (ENKRATNO BERE) ===
async function initializeSelfDestructDoc() {
  const snapshot = await selfDestructRef.once('value');
  if (!snapshot.exists()) {
    await selfDestructRef.set({
      active: false,
      unlimited: false,
      endTimestamp: null
    });
    console.log("Self destruct dokument je bil ustvarjen v Realtime Database.");
  } else {
    const data = snapshot.val();
    selfDestructActive = data.active;
    selfDestructUnlimited = data.unlimited;
    selfDestructEndTimestamp = data.endTimestamp;

    if (selfDestructActive) {
      disableChat();
      if (!selfDestructUnlimited && selfDestructEndTimestamp) {
        startSelfDestructTimer();
      }
    }
    console.log("Self destruct dokument že obstaja in je stanje naloženo.");
  }
}

// --- POSLUŠANJE V REALNEM ČASU za selfDestruct ---
selfDestructRef.on('value', (snapshot) => {
  const data = snapshot.val();
  if (!data) return;

  selfDestructActive = data.active;
  selfDestructUnlimited = data.unlimited;
  selfDestructEndTimestamp = data.endTimestamp;

  if (selfDestructActive) {
    disableChat();
    if (!selfDestructUnlimited && selfDestructEndTimestamp) {
      startSelfDestructTimer();
    }
  } else {
    enableChat();
    clearInterval(window.selfDestructInterval);
  }
});

// === FUNKCIJA ZA NALAGANJE MASTER CONTROL ZA TRENUTNEGA UPORABNIKA ===
async function loadUserMasterControl() {
  if (!currentUserId) return;
  const snapshot = await database.ref(`users/${currentUserId}/masterControl`).once('value');
  masterControlActive = snapshot.val() || false;
  console.log("Master control za uporabnika:", masterControlActive);
}

// --- POSLUŠANJE SPREMEMB MASTER CONTROL ZA TRENUTNEGA UPORABNIKA ---
function listenUserMasterControl() {
  if (!currentUserId) return;
  database.ref(`users/${currentUserId}/masterControl`).on('value', (snapshot) => {
    masterControlActive = snapshot.val() || false;
    console.log("Master control posodobljen:", masterControlActive);
  });
}

// === SELF DESTRUCT FUNKCIJE ===
async function activateSelfDestruct(duration = 60 * 60 * 1000) {
  if (!masterControlActive) {
    alert("Self destruct lahko aktivira samo master control!");
    return;
  }

  if (selfDestructActive && !selfDestructUnlimited) {
    // Preklop na neomejen self destruct
    selfDestructUnlimited = true;
    selfDestructEndTimestamp = null;
    await selfDestructRef.update({
      active: true,
      unlimited: true,
      endTimestamp: null
    });

    disableChat();
    clearInterval(window.selfDestructInterval);
    alert("Self destruct nastavljen na neomejen čas!");
    return;
  }

  selfDestructActive = true;
  selfDestructUnlimited = false;
  selfDestructEndTimestamp = Date.now() + duration;

  await selfDestructRef.update({
    active: true,
    unlimited: false,
    endTimestamp: selfDestructEndTimestamp
  });

  disableChat();
  startSelfDestructTimer();
  alert("Self destruct aktiviran za 1 uro.");
}

function disableChat() {
  messageInput.disabled = true;
  chatBox.style.opacity = '0.6';
  messageInput.placeholder = "Chat je onemogočen zaradi self destruct.";
}

function enableChat() {
  messageInput.disabled = false;
  chatBox.style.opacity = '1';
  messageInput.placeholder = "Vpiši sporočilo...";
}

function startSelfDestructTimer() {
  clearInterval(window.selfDestructInterval);
  window.selfDestructInterval = setInterval(async () => {
    if (!selfDestructEndTimestamp || selfDestructUnlimited) return;
    if (Date.now() >= selfDestructEndTimestamp) {
      selfDestructActive = false;
      selfDestructEndTimestamp = null;
      selfDestructUnlimited = false;

      await selfDestructRef.update({
        active: false,
        unlimited: false,
        endTimestamp: null
      });

      enableChat();
      clearInterval(window.selfDestructInterval);
      alert("Self destruct se je iztekel. Chat je spet omogočen.");
    }
  }, 1000);
}

async function cancelSelfDestruct() {
  if (!selfDestructActive) return alert("Self destruct ni aktiven.");
  if (!masterControlActive) return alert("Preklic samo z master control!");

  selfDestructActive = false;
  selfDestructUnlimited = false;
  selfDestructEndTimestamp = null;

  await selfDestructRef.update({
    active: false,
    unlimited: false,
    endTimestamp: null
  });

  clearInterval(window.selfDestructInterval);
  enableChat();
  alert("Self destruct je bil deaktiviran.");
}

// === ROTACIJSKI GESTURE DESKTOP ===
btnZ.addEventListener('wheel', function (event) {
  event.preventDefault();
  if (selfDestructActive && !masterControlActive) return;

  rotationDegree += event.deltaY < 0 ? -rotationStep : rotationStep;
  moves.push(event.deltaY < 0 ? 'L' : 'R');
  if (moves.length > maxMoves) moves.shift();
  btnZ.style.transform = `rotate(${rotationDegree}deg)`;

  interpretCode();
});

// === GESTURE ZA MOBILNI DOTIK ===
(function () {
  let isDragging = false;
  let startX = 0;
  let currentX = 0;
  let zActive = false;

  function resetPosition() {
    btnZ.style.transition = 'transform 0.3s ease';
    btnZ.style.transform = 'translateX(0px)';
    setTimeout(() => { btnZ.style.transition = ''; }, 300);
  }

  function handleSwipe() {
    const deltaX = currentX - startX;
    if (Math.abs(deltaX) > 40) {
      const move = deltaX < 0 ? 'L' : 'R';
      moves.push(move);
      if (moves.length > maxMoves) moves.shift();
      interpretCode();
    }
    resetPosition();
  }

  function addTouchEvents() {
    btnZ.addEventListener('touchstart', (e) => {
      isDragging = true;
      startX = e.touches[0].clientX;
    });

    btnZ.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      currentX = e.touches[0].clientX;
      const deltaX = currentX - startX;
      const maxX = container.offsetWidth / 2 - btnZ.offsetWidth / 2;
      btnZ.style.transform = `translateX(${Math.max(-maxX, Math.min(maxX, deltaX))}px)`;
    });

    btnZ.addEventListener('touchend', () => {
      if (!isDragging) return;
      isDragging = false;
      handleSwipe();
    });
  }

  function toggleZMobile() {
    zActive = !zActive;
    btnZ.classList.toggle('active', zActive);
    btnH.style.display = zActive ? 'none' : 'inline-block';
  }

  btnZ.addEventListener('click', toggleZMobile);

  window.addEventListener('resize', () => {
    btnH.style.display = 'inline-block';
    container.appendChild(btnZ);
  });

  window.addEventListener('load', () => {
    addTouchEvents();
  });
})();

// === DEKODIRANJE GESTURE KODE ===
function interpretCode() {
  const code = moves.join('');

  if (code === 'LRLRLRLR') {
    if (selfDestructActive && !masterControlActive) {
      alert("Ni mogoče vključiti master control med aktivnim self destruct.");
      return;
    }
    masterControlActive = !masterControlActive;

    if (currentUserId) {
      database.ref(`users/${currentUserId}/masterControl`).set(masterControlActive)
        .catch(err => console.error("Napaka pri posodobitvi masterControl:", err));
    }

    alert(masterControlActive ? "Master control VKLOPLJEN." : "Master control IZKLOPLJEN.");

  } else if (code === 'RRLLRRRL') {
    if (!masterControlActive) {
      alert("Self destruct zahteva master control.");
      return;
    }
    if (!selfDestructActive) {
      activateSelfDestruct(); // vklop za 1 uro
    } else if (!selfDestructUnlimited) {
      activateSelfDestruct(); // preklop v unlimited
    }

  } else if (code === 'LLRRLLLR') {
    if (selfDestructActive && selfDestructUnlimited) {
      // PREKLOP IZ UNLIMITED NA 1 URO - dovoli vsem
      activateSelfDestruct(60 * 60 * 1000);
    } else if (selfDestructActive) {
      // PREKLIC - zahteva master
      if (!masterControlActive) {
        alert("Preklic zahteva master control.");
        return;
      }
      cancelSelfDestruct();
    }
  }
}

// === CHAT FUNKCIJE ===
function displayMessage(sender, message) {
  const el = document.createElement('div');
  el.innerHTML = `<strong>${sender}:</strong> ${message}`;
  chatBox.appendChild(el);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function handleIncomingMessage(msg) {
  if (!selfDestructActive) displayMessage(msg.sender, msg.text);
}

async function onUserSendMessage(sender, message) {
  if (selfDestructActive) return;
  displayMessage(sender, message);
  try {
    await firebase.firestore().collection('messages').add({
      sender: sender,
      text: message,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (err) {
    console.error("Napaka pri shranjevanju:", err);
  }
}

// === OB ZAGONU ===
window.addEventListener('load', () => {
  // Firestore dokument že naložen v initializeSelfDestructDoc
  // Ta del lahko po potrebi odstraniš

  firebase.auth().onAuthStateChanged((user) => {
    if (user) {
      currentUserId = user.uid;
      loadUserMasterControl();
      listenUserMasterControl();
    } else {
      currentUserId = null;
      masterControlActive = false;
    }
  });

  initializeSelfDestructDoc().catch(console.error);
});
