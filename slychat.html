<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlyChat</title>
    <style>
        body {
    font-family: 'Roboto', sans-serif;
    margin: 0;
    padding: 0;
    background-color: #2c3e50;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

#chat-container {
    width: 100%;
    max-width: 600px;
    margin: 20px;
    background: #34495e;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    animation: scaleIn 0.5s ease-out;
}

@keyframes scaleIn {
    from {
        transform: scale(0.8);
    }
    to {
        transform: scale(1);
    }
}

#messages {
    padding: 20px;
    height: 300px;
    overflow-y: auto;
    border-bottom: 1px solid #7f8c8d;
    background: #2c3e50;
    color: #ecf0f1;
    font-size: 16px;
    font-weight: 400;
    border-radius: 0;
    animation: fadeIn 0.8s ease-out;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

.message {
    margin-bottom: 15px;
    padding: 12px;
    background-color: #34495e;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    animation: slideIn 0.5s ease-out;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateX(-20px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

.sender {
    font-weight: bold;
    color: #00c6ff;
}

#message-input {
    display: flex;
    padding: 15px;
    background-color: #34495e;
    border-top: 1px solid #7f8c8d;
}

#message-input input {
    flex: 1;
    padding: 12px 15px;
    border: 2px solid #7f8c8d;
    border-radius: 25px;
    margin-right: 12px;
    font-size: 16px;
    background-color: #f4f6f7;
    color: #2c3e50;
    transition: all 0.3s ease-in-out;
}

#message-input input:focus {
    border-color: #00c6ff;
    box-shadow: 0 0 8px rgba(0, 198, 255, 0.7);
    transform: scale(1.05);
}

#message-input button {
    padding: 12px 25px;
    border: none;
    background-color: #00c6ff;
    color: white;
    font-size: 16px;
    border-radius: 25px;
    cursor: pointer;
    transition: background-color 0.3s ease, transform 0.2s ease;
}

#message-input button:hover {
    background-color: #0072ff;
    transform: translateY(-4px);
}

#message-input button:active {
    transform: translateY(2px);
}
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="messages"></div>
        <div id="message-input">
            <input type="text" id="message" placeholder="Enter your message">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.2/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.2/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.2/firebase-database.js"></script>
    <script>
        // Firebase konfiguracija
        const firebaseConfig = {
            apiKey: "AIzaSyA2l2SEcXPrLGpSOiTyyC55l35OMln1VUM",
            authDomain: "slychat-e0a59.firebaseapp.com",
            projectId: "slychat-e0a59",
            storageBucket: "slychat-e0a59.appspot.com",
            messagingSenderId: "462724887870",
            appId: "1:462724887870:web:72d25e58b20af6e2d2286f",
            measurementId: "G-52CMK3FJYW"
        };

        // Inicializacija Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const ownerEmail = "owner@example.com"; // Lastnikov email

        // Pošlji sporočilo
        function sendMessage() {
            const messageInput = document.getElementById('message');
            const message = messageInput.value.trim();
            const user = auth.currentUser;

            if (message && user) {
                db.ref('messages').push({
                    username: user.displayName,
                    message: message
                });
                messageInput.value = '';
            }
        }

        // Poslušaj za nova sporočila
        const messagesDiv = document.getElementById('messages');
        db.ref('messages').on('child_added', (snapshot) => {
            const data = snapshot.val();
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.innerHTML = <span class="sender">${data.username}:</span> ${handleMention(data.message)};
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        // Funkcije za administrativne ukaze
        function adminCommands(command) {
            const [cmd, ...args] = command.split('@');
            const isOwner = auth.currentUser && auth.currentUser.email === ownerEmail;

            if (!isOwner) {
                alert("Only the owner can use these commands.");
                return;
            }

            if (cmd === '/slyclean') {
                db.ref('messages').remove().then(() => {
                    messagesDiv.innerHTML = '';
                    alert("All messages cleared!");
                });
            }

            if (cmd === '/slycolor' && args.length === 2) {
                const username = args[0].trim();
                const color = args[1].trim();

                db.ref('messages').once('value').then((snapshot) => {
                    const data = snapshot.val();
                    messagesDiv.innerHTML = '';
                    for (const key in data) {
                        const message = data[key];
                        const messageDiv = document.createElement('div');
                        messageDiv.className = 'message';

                        if (message.username === username) {
                            messageDiv.innerHTML = <span class="sender" style="color: ${color};">${message.username}:</span> ${message.message};
                        } else {
                            messageDiv.innerHTML = <span class="sender">${message.username}:</span> ${message.message};
                        }

                        messagesDiv.appendChild(messageDiv);
                    }
                });
            }

            if (cmd === '/slypause') {
                document.getElementById('chat-container').style.display = 'none';
                setTimeout(() => {
                    document.getElementById('chat-container').style.display = 'block';
                }, 3600000);
            }
        }

        // Funkcija za obravnavo omemb
        function handleMention(message) {
            const userName = auth.currentUser ? auth.currentUser.displayName : null;
            if (userName && message.includes('@' + userName)) {
                return <b>You were mentioned:</b> ${message};
            }
            return message;
        }

        // Simuliraj prijavo uporabnika
        auth.signInAnonymously().then(() => {
            auth.currentUser.displayName = "User" + Math.floor(Math.random() * 1000);
        });
    </script>
</body>
</html>
