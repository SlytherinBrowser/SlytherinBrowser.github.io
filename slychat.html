<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>Slychat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    /* CSS ostane isti kot prej (za izgled in animacije) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }
    body {
      background: url('slika.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }
    .container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      width: 90%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    h2 {
      text-align: center;
      font-weight: 500;
    }
    #chatBox {
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #chatBox div {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      padding: 10px 15px;
      color: #fff;
      word-wrap: break-word;
      font-size: 0.95em;
      position: relative;
    }
    .sender {
      font-weight: 600;
      color: #ffd700;
      margin-right: 6px;
    }
    .hiddenMessage .realText {
      display: none;
    }
    .hiddenMessage:hover .realText {
      display: inline;
    }
    .hiddenMessage:hover .hiddenText {
      display: none;
    }
    .hiddenText {
      font-style: italic;
      color: #ccc;
    }
    input[type='text'] {
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      color: white;
      outline: none;
    }
    input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }
    .btn {
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn:hover {
      background-color: rgba(255, 255, 255, 0.25);
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    @media (max-width: 480px) {
      .actions {
        flex-direction: column;
      }
    }
    .private-invite {
      color: #90ee90;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="chatTitle">Slychat</h2>
    <div id="chatBox"></div>
    <input type="text" id="messageInput" placeholder="Vpiši sporočilo..." autocomplete="off" />
    <div class="actions">
      <button class="btn" onclick="sendMessage()">Pošlji</button>
      <button class="btn" onclick="logout()">Odjava</button>
    </div>
  </div>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const chatBox = document.getElementById("chatBox");
    const messageInput = document.getElementById("messageInput");
    const chatTitle = document.getElementById("chatTitle");

    let privateChatWith = null;
    const userNamesCache = {};

    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location.href = "auth.html";
      } else {
        loadMessages();
      }
    });

    function loadMessages() {
      chatBox.innerHTML = "";  // počisti ob vsakem nalaganju

      db.ref("messages").off();
      db.ref("messages").on("child_added", async snapshot => {
        const msg = snapshot.val();
        const currentUser = auth.currentUser;
        if (!currentUser) return;

        // Preberi ime pošiljatelja iz cache ali Firebase
        let senderName = userNamesCache[msg.uid];
        if (!senderName) {
          try {
            const snapUser = await db.ref('users/' + msg.uid).once('value');
            senderName = snapUser.val()?.displayName || "Anonimen";
            userNamesCache[msg.uid] = senderName;
          } catch {
            senderName = "Anonimen";
          }
        }

        // Prikaži samo sporočila, ki ustrezajo kontekstu:
        // Če smo v zasebnem klepetu - pokaži samo sporočila med nama
        if (privateChatWith) {
          // Če sporočilo ni niti od nas niti za nas, preskoči
          if (!((msg.uid === currentUser.uid && msg.to === privateChatWith) || 
                (msg.uid === privateChatWith && msg.to === currentUser.uid))) {
            return;
          }
        } else {
          // Javnemu klepetu pokaži:
          // - sporočila brez 'to' (javna sporočila)
          // - omembe, kjer je namenjeni ali pošiljatelj trenutni user (vidno samo jima)
          // - povabila za zasebni klepet (tip "invite"), ki so namenjena trenutnemu user
          if (msg.type === "invite" && msg.to === currentUser.uid) {
            // Prikaži povabilo za zasebni klepet
            const div = document.createElement("div");
            div.innerHTML = `<span class='private-invite'>[Klikni za zasebni klepet s ${senderName}]</span>`;
            div.querySelector(".private-invite").addEventListener("click", () => {
              privateChatWith = msg.uid;
              chatTitle.textContent = "Zasebno s: " + senderName;
              chatBox.innerHTML = "";
              loadMessages();
            });
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return;
          }

          if (msg.to) {
            // če je omemba in smo v javnem klepetu, pokaži samo če smo pošiljatelj ali prejemnik
            if (msg.type === "mention") {
              if (msg.uid !== currentUser.uid && msg.to !== currentUser.uid) {
                return;
              }
            } else {
              // ostala zasebna sporočila naj v javnem klepetu niso vidna
              return;
            }
          }
        }

        // Pripravi div za prikaz sporočila
        const div = document.createElement("div");
        const senderSpan = document.createElement("span");
        senderSpan.classList.add("sender");
        senderSpan.textContent = senderName + ": ";

        if (msg.hidden) {
          div.classList.add("hiddenMessage");
          const hiddenText = document.createElement("span");
          hiddenText.classList.add("hiddenText");
          hiddenText.textContent = "Skrito sporočilo";
          const realText = document.createElement("span");
          realText.classList.add("realText");
          realText.textContent = msg.text;
          div.appendChild(senderSpan);
          div.appendChild(hiddenText);
          div.appendChild(realText);
        } else {
          div.appendChild(senderSpan);
          div.appendChild(document.createTextNode(msg.text));
        }

        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
      });
    }

    function sendMessage() {
      const user = auth.currentUser;
      if (!user) return;

      let text = messageInput.value.trim();
      if (!text) return;

      // Ukaz za zasebni klepet: /@uporabnik
      if (text.startsWith("/@")) {
        const name = text.slice(2).toLowerCase();
        db.ref("users").once("value").then(snapshot => {
          const users = snapshot.val();
          for (const uid in users) {
            if (users[uid].displayName.toLowerCase() === name) {
              // Pošlji povabilo
              db.ref("messages").push({
                uid: user.uid,
                to: uid,
                type: "invite",
                text: "Vabilo v zasebni klepet"
              });

              // Pošiljatelj takoj preklopi na zasebni klepet
              privateChatWith = uid;
              chatTitle.textContent = "Zasebno s: " + users[uid].displayName;
              chatBox.innerHTML = "";
              loadMessages();
              break;
            }
          }
        });
        messageInput.value = "";
        return;
      }

      // Omemba: @uporabnik sporočilo
      if (text.startsWith("@")) {
        const spaceIndex = text.indexOf(" ");
        if (spaceIndex === -1) {
          alert("Prosim, vpiši sporočilo za omembo.");
          return;
        }
        const name = text.slice(1, spaceIndex).toLowerCase();
        const content = text.slice(spaceIndex + 1);
        db.ref("users").once("value").then(snapshot => {
          const users = snapshot.val();
          for (const uid in users) {
            if (users[uid].displayName.toLowerCase() === name) {
              // Pošlji omembo kot zasebno sporočilo (tip mention)
              db.ref("messages").push({
                uid: user.uid,
                text: content,
                to: uid,
                type: "mention"
              });
              break;
            }
          }
        });
        messageInput.value = "";
        return;
      }

      // Preklop nazaj na javni klepet
      if (text === "/public") {
        privateChatWith = null;
        chatTitle.textContent = "Slychat";
        chatBox.innerHTML = "";
        loadMessages();
        messageInput.value = "";
        return;
      }

      // Brisanje klepeta (samo v javnem)
      if (text === "/clearchat") {
        if (privateChatWith) {
          alert("Brisanje klepeta je dovoljeno samo v javnem klepetu.");
          return;
        }
        db.ref("messages").remove().then(() => {
          chatBox.innerHTML = "";
          alert("Klepet je bil pobrisan.");
        }).catch(err => alert("Napaka pri brisanju: " + err.message));
        messageInput.value = "";
        return;
      }

      // Skrito sporočilo (začne z *)
      let isHidden = false;
      if (text.startsWith("*")) {
        isHidden = true;
        text = text.slice(1).trim();
        if (!text) {
          alert("Prosim, vpiši sporočilo za skrito sporočilo.");
          return;
        }
      }

      // Pošlji navadno ali skrito sporočilo, glede na zasebni klepet ali ne
      const messageData = {
        uid: user.uid,
        text: text,
        hidden: isHidden,
        timestamp: Date.now()// Če smo v zasebnem klepetu, dodamo prejemnika (privateChatWith)
      if (privateChatWith) {
        messageData.to = privateChatWith;
        messageData.type = "private";
      } else {
        messageData.type = "public";
      }

      db.ref("messages").push(messageData)
        .then(() => {
          messageInput.value = "";
        })
        .catch(err => alert("Napaka pri pošiljanju: " + err.message));
    }

    function logout() {
      auth.signOut().then(() => {
        window.location.href = "auth.html";
      });
    }
  </script>
</body>
</html>
