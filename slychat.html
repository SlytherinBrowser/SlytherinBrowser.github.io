<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>Slychat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: url('slika.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      width: 90%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    h2 {
      text-align: center;
      font-weight: 500;
    }

    #chatBox {
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #chatBox div {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      padding: 10px 15px;
      color: #fff;
      word-wrap: break-word;
      font-size: 0.95em;
      position: relative;
    }

    .sender {
      font-weight: 600;
      color: #ffd700;
      margin-right: 6px;
    }

    .hiddenMessage .realText {
      display: none;
    }

    .hiddenMessage:hover .realText {
      display: inline;
    }

    .hiddenMessage:hover .hiddenText {
      display: none;
    }

    .hiddenText {
      font-style: italic;
      color: #ccc;
    }

    .message-input-container {
      position: relative;
    }

    #messageInput {
      padding: 10px;
      padding-right: 40px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      color: white;
      outline: none;
      width: 100%;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }
#hiddenToggleBtn.active {
  background-color: rgba(255, 255, 255, 0.6);
  color: black;
}
    #hiddenToggleBtn {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      width: 25px;
      height: 25px;
      border-radius: 50%;
      border: none;
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .btn {
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover {
      background-color: rgba(255, 255, 255, 0.25);
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    @media (max-width: 480px) {
      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Slychat</h2>
    <div id="chatBox"></div>

    <div class="message-input-container">
      <input type="text" id="messageInput" placeholder="Vpiši sporočilo..." />
      <button id="hiddenToggleBtn" title="Skrito sporočilo" onclick="toggleHidden()">H</button>
    </div>

    <div class="actions">
      <button class="btn" onclick="sendMessage()">Pošlji</button>
      <button class="btn" onclick="toggleActiveUsers()">Aktivni uporabniki</button>
      <button class="btn" onclick="logout()">Odjava</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const chatBox = document.getElementById("chatBox");
    const messageInput = document.getElementById("messageInput");

    let currentChatPartner = null;
    let currentUser = null;
    const userNamesCache = {};
    let userStatusCache = {};
    let isHiddenMode = false;

    function toggleHidden() {
  isHiddenMode = !isHiddenMode;
  const btn = document.getElementById("hiddenToggleBtn");
  
  if (isHiddenMode) {
    btn.classList.add("active");
    btn.title = "Skrito vklopljeno";
  } else {
    btn.classList.remove("active");
    btn.title = "Skrito izklopljeno";
  }
}

    auth.onAuthStateChanged(async user => {
      if (!user) {
        window.location.href = "auth.html";
        return;
      }

      currentUser = user;

      const userStatusRef = db.ref("status/" + user.uid);
      userStatusRef.set({ online: true });
      userStatusRef.onDisconnect().set({ online: false });

      const usersSnapshot = await db.ref('users').once('value');
      const users = usersSnapshot.val() || {};
      for (const uid in users) {
        userNamesCache[uid] = users[uid].displayName || "Anonimen";
      }

      db.ref("status").on("value", snapshot => {
        userStatusCache = snapshot.val() || {};
      });

      db.ref("messages").on("child_added", snapshot => {
        const msg = snapshot.val();

        if (msg.system && msg.privateUid === currentUser.uid) {
          const systemDiv = document.createElement("div");
          systemDiv.style.fontStyle = "italic";
          systemDiv.style.color = "#90ee90";
          const senderName = userNamesCache[msg.uid] || "Uporabnik";
          systemDiv.textContent = `${senderName} ${msg.text}`;
          chatBox.appendChild(systemDiv);
          chatBox.scrollTop = chatBox.scrollHeight;
          return;
        }

        if (msg.invite && msg.privateUid === currentUser.uid) {
          const inviterName = userNamesCache[msg.uid] || "Anonimen";
          const inviteDiv = document.createElement("div");
          inviteDiv.innerHTML = `<strong>${inviterName}</strong> te vabi v zasebni klepet. 
            <button onclick="acceptInvite('${msg.uid}')">Sprejmi</button>`;
          chatBox.appendChild(inviteDiv);
          chatBox.scrollTop = chatBox.scrollHeight;
          return;
        }

        if (currentChatPartner) {
          const isPrivateMatch =
            (msg.uid === currentUser.uid && msg.privateUid === currentChatPartner) ||
            (msg.uid === currentChatPartner && msg.privateUid === currentUser.uid);
          if (!isPrivateMatch) return;
        } else {
          if (msg.privateUid) return;
        }

        const displayName = userNamesCache[msg.uid] || "Anonimen";
        const isOnline = userStatusCache[msg.uid]?.online;

        const div = document.createElement("div");
        const senderSpan = document.createElement("span");
        senderSpan.classList.add("sender");

        if (isOnline) {
          senderSpan.innerHTML = `<span style="color: green; font-size: 1.2em;">●</span> ${displayName}: `;
        } else {
          senderSpan.textContent = displayName + ": ";
        }

        const realText = document.createElement("span");
        realText.classList.add("realText");
        realText.textContent = msg.text;

        if (msg.hidden) {
          const hiddenText = document.createElement("span");
          hiddenText.classList.add("hiddenText");
          hiddenText.textContent = "Zasebno sporočilo";
          div.classList.add("hiddenMessage");
          div.appendChild(senderSpan);
          div.appendChild(hiddenText);
          div.appendChild(realText);
        } else {
          div.appendChild(senderSpan);
          div.appendChild(realText);
        }

        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
      });
    });

    function acceptInvite(inviterUid) {
      currentChatPartner = inviterUid;
      chatBox.innerHTML = "";
      alert("Sprejel si povabilo. Zdaj si v zasebnem klepetu.");

      db.ref("messages").push({
        uid: currentUser.uid,
        text: "sprejel je tvoje povabilo v zasebni klepet.",
        system: true,
        privateUid: inviterUid
      });
    }

    function sendMessage() {
      if (!currentUser) return;
      const textRaw = messageInput.value.trim();
      if (!textRaw) return;

      if (textRaw === "/public") {
        currentChatPartner = null;
        chatBox.innerHTML = "";
        messageInput.value = "";
        alert("Zdaj si v javnem klepetu.");
        setTimeout(() => location.reload(), 10);
        return;
      }

      if (textRaw === "/clearchat") {
        db.ref("messages").remove().then(() => {
          alert("Klepetalnica je bila pobrisana.");
          location.reload();
        }).catch(error => alert("Napaka pri brisanju: " + error.message));
        messageInput.value = "";
        return;
      }

      if (textRaw.startsWith("/@")) {
        const invitedName = textRaw.slice(2).toLowerCase();
        let foundUid = null;
        for (const uid in userNamesCache) {
          if (userNamesCache[uid].toLowerCase() === invitedName) {
            foundUid = uid;
            break;
          }
        }
        if (!foundUid) {
          alert("Uporabnik '" + invitedName + "' ni najden.");
          messageInput.value = "";
          return;
        }

        db.ref("messages").push({
          uid: currentUser.uid,
          text: "Povabilo v zasebni klepet",
          invite: true,
          privateUid: foundUid
        });

        currentChatPartner = foundUid;
        chatBox.innerHTML = "";
        alert("Vstopil si v zasebni pogovor z " + userNamesCache[foundUid]);
        messageInput.value = "";
        return;
      }

      let hidden = isHiddenMode;
      let text = textRaw;

      db.ref("messages").push({
        uid: currentUser.uid,
        text: text,
        hidden: hidden,
        privateUid: currentChatPartner
      });

      messageInput.value = "";
    }

    function logout() {
      auth.signOut().then(() => {
        window.location.href = "auth.html";
      });
    }

    messageInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        sendMessage();
      }
    });

    let showingActiveUsers = false;

    function toggleActiveUsers() {
      showingActiveUsers = !showingActiveUsers;
      chatBox.innerHTML = "";

      if (showingActiveUsers) {
        const activeUsers = Object.entries(userStatusCache)
          .filter(([uid, status]) => status.online && uid !== currentUser.uid);

        if (activeUsers.length === 0) {
          chatBox.innerHTML = "<i>Ni drugih aktivnih uporabnikov.</i>";
        } else {
          activeUsers.forEach(([uid]) => {
            const name = userNamesCache[uid] || "Anonimen";
            const div = document.createElement("div");
            div.innerHTML = `<span style="color: green; font-size: 1.2em;">●</span> ${name}`;
            chatBox.appendChild(div);
          });
        }
      } else {
        location.reload();
      }
    }






let peerConnection = null;
let localStream = null;
let remoteAudio = null;
let currentCallPartner = null;

const servers = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

let currentUser = null;

const userNamesCache = {
  "uid1": "Janez",
  "uid2": "Maja",
  // ... tvoja imena uporabnikov
};

// DOM elementi (predvidevam, da so definirani)
const messageInput = document.getElementById("messageInput");
const chatBox = document.getElementById("chatBox");

function displayMessage(message) {
  if (message.systemMessage) {
    return `<div style="text-align:center; font-style: italic; color: gray; margin: 6px 0;">${message.text}</div>`;
  } else {
    return `<div><strong>${userNamesCache[message.uid] || "Uporabnik"}:</strong> ${message.text}</div>`;
  }
}

function refreshChat() {
  db.ref("messages").limitToLast(50).once("value", snapshot => {
    const messages = snapshot.val();
    chatBox.innerHTML = "";
    if (!messages) return;
    Object.values(messages).forEach(msg => {
      chatBox.innerHTML += displayMessage(msg);
    });
    chatBox.scrollTop = chatBox.scrollHeight;
  });
}

function initCallListener() {
  db.ref(`calls/${currentUser.uid}/offer`).on("value", async snapshot => {
    const offer = snapshot.val();
    if (!offer) return;
    if (currentCallPartner) return;

    currentCallPartner = offer.from;

    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      peerConnection = new RTCPeerConnection(servers);

      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      if (!remoteAudio) {
        remoteAudio = document.createElement("audio");
        remoteAudio.autoplay = true;
        document.body.appendChild(remoteAudio);
      }

      peerConnection.ontrack = event => {
        remoteAudio.srcObject = event.streams[0];
      };

      peerConnection.onicecandidate = event => {
        if (event.candidate) {
          db.ref(`calls/${currentCallPartner}/ice`).push(event.candidate.toJSON());
        }
      };

      await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);

      await db.ref(`calls/${currentCallPartner}/answer`).set({
        from: currentUser.uid,
        sdp: answer.sdp,
        type: answer.type
      });

      await db.ref("messages").push({
        uid: currentUser.uid,
        text: `${userNamesCache[currentUser.uid] || "Uporabnik"} se je pridružil klicu.`,
        systemMessage: true,
        timestamp: Date.now()
      });
      refreshChat();

      showCallUI();
      listenForAnswerAndCandidates();

    } catch (err) {
      alert("Napaka pri sprejemanju klica: " + err.message);
      endCall();
    }
  });
}

function startAudioCall(partnerName) {
  if (!partnerName) {
    alert("Nisi vnesel imena uporabnika za klic.");
    return;
  }

  let partnerUid = null;
  for (const uid in userNamesCache) {
    if (userNamesCache[uid].toLowerCase() === partnerName.toLowerCase()) {
      partnerUid = uid;
      break;
    }
  }
  if (!partnerUid) {
    alert("Uporabnik '" + partnerName + "' ni najden.");
    return;
  }

  if (partnerUid === currentUser.uid) {
    alert("Ne moreš poklicati samega sebe.");
    return;
  }

  currentCallPartner = partnerUid;

  navigator.mediaDevices.getUserMedia({ audio: true, video: false }).then(stream => {
    localStream = stream;
    peerConnection = new RTCPeerConnection(servers);

    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

    if (!remoteAudio) {
      remoteAudio = document.createElement("audio");
      remoteAudio.autoplay = true;
      document.body.appendChild(remoteAudio);
    }

    peerConnection.ontrack = event => {
      remoteAudio.srcObject = event.streams[0];
    };

    peerConnection.onicecandidate = event => {
      if (event.candidate) {
        db.ref(`calls/${currentUser.uid}/ice`).push(event.candidate.toJSON());
      }
    };

    peerConnection.createOffer().then(offer => {
      peerConnection.setLocalDescription(offer);

      db.ref(`calls/${partnerUid}/offer`).set({
        from: currentUser.uid,
        sdp: offer.sdp,
        type: offer.type
      });

      db.ref("messages").push({
        uid: currentUser.uid,
        text: `Kličem uporabnika ${partnerName}...`,
        systemMessage: true,
        timestamp: Date.now()
      });
      refreshChat();
    });

    showCallUI();
    listenForAnswerAndCandidates();

  }).catch(err => alert("Napaka pri dostopu do mikrofona: " + err.message));
}

function listenForAnswerAndCandidates() {
  db.ref(`calls/${currentCallPartner}/answer`).on("value", snapshot => {
    const answer = snapshot.val();
    if (!answer || !peerConnection) return;
    const remoteDesc = new RTCSessionDescription(answer);
    peerConnection.setRemoteDescription(remoteDesc);
  });

  db.ref(`calls/${currentCallPartner}/ice`).on("child_added", snapshot => {
    const candidate = snapshot.val();
    if (!candidate || !peerConnection) return;
    peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
  });
}

function showCallUI() {
  messageInput.style.display = "none";

  if (!document.getElementById("btnToggleMute")) {
    const controlsDiv = document.createElement("div");
    controlsDiv.id = "callControls";
    controlsDiv.style.marginTop = "10px";
    controlsDiv.style.display = "flex";
    controlsDiv.style.gap = "10px";

    const btnMute = document.createElement("button");
    btnMute.id = "btnToggleMute";
    btnMute.textContent = "Izklopi mikrofon";
    btnMute.style.padding = "8px 12px";
    btnMute.style.backgroundColor = "#007bff";
    btnMute.style.color = "white";
    btnMute.style.border = "none";
    btnMute.style.borderRadius = "4px";
    btnMute.style.cursor = "pointer";

    btnMute.onclick = () => {
      if (!localStream) return;
      const audioTrack = localStream.getAudioTracks()[0];
      if (!audioTrack) return;
      audioTrack.enabled = !audioTrack.enabled;
      btnMute.textContent = audioTrack.enabled ? "Izklopi mikrofon" : "Vklopi mikrofon";
      btnMute.style.backgroundColor = audioTrack.enabled ? "#007bff" : "#dc3545";
    };

    const btnEnd = document.createElement("button");
    btnEnd.id = "btnEndCall";
    btnEnd.textContent = "Prekini klic";
    btnEnd.style.padding = "8px 12px";
    btnEnd.style.backgroundColor = "#dc3545";
    btnEnd.style.color = "white";
    btnEnd.style.border = "none";
    btnEnd.style.borderRadius = "4px";
    btnEnd.style.cursor = "pointer";

    btnEnd.onclick = () => {
      endCall();
    };

    controlsDiv.appendChild(btnMute);
    controlsDiv.appendChild(btnEnd);

    messageInput.parentNode.appendChild(controlsDiv);
  } else {
    document.getElementById("callControls").style.display = "flex";
  }

  chatBox.innerHTML = `<div style="font-weight:bold; margin-bottom:8px;">
    Pogovor z: ${userNamesCache[currentCallPartner] || "Uporabnik"}
  </div>`;
}

function endCall() {
  if (peerConnection) {
    peerConnection.close();
    peerConnection = null;
  }
  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
    localStream = null;
  }

  if (currentCallPartner) {
    db.ref(`calls/${currentUser.uid}`).remove();
    db.ref(`calls/${currentCallPartner}`).remove();
  }

  currentCallPartner = null;

  messageInput.style.display = "block";
  const controlsDiv = document.getElementById("callControls");
  if (controlsDiv) controlsDiv.style.display = "none";

  chatBox.innerHTML = "";
  refreshChat();
}

function sendMessage() {
  if (!currentUser) return;
  const textRaw = messageInput.value.trim();
  if (!textRaw) return;

  if (textRaw.startsWith("/*")) {
    const partnerName = textRaw.slice(2).trim();
    startAudioCall(partnerName);
    messageInput.value = "";
    return;
  }

  // Pošlji navadno sporočilo v Firebase
  db.ref("messages").push({
    uid: currentUser.uid,
    text: textRaw,
    systemMessage: false,
    timestamp: Date.now()
  });

  messageInput.value = "";
  refreshChat();
}
  </script>
</body>
</html>
