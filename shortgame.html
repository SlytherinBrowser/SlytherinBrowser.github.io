<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spomin</title>
    <style>
        /* Reset */
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #1f4068;
            padding: 1.2rem 0;
            text-align: center;
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: 2px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        #memory-game {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            grid-template-rows: repeat(4, 100px);
            gap: 15px;
        }
        .memory-card {
            width: 100px;
            height: 100px;
            background-color: #34495e;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, background-color 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            font-weight: 700;
            font-size: 0; /* skrijemo tekst, če bo */
        }
        .memory-card.flipped {
            background-color: var(--card-color);
            font-size: 1.5rem;
            box-shadow: 0 6px 15px var(--card-color);
            transform: scale(1.05);
        }
        .memory-card:hover {
            filter: brightness(1.1);
        }
    </style>
</head>
<body>
    <header>
        Spomin
    </header>
    <main>
        <div id="memory-game"></div>
    </main>

    <script>
        // Imamo 8 različnih barv (točno 8 parov)
        const colors = [
            '#e74c3c', // rdeča
            '#3498db', // modra
            '#2ecc71', // zelena
            '#f1c40f', // rumena
            '#9b59b6', // vijolična
            '#e67e22', // oranžna
            '#1abc9c', // turkizna
            '#34495e'  // temno modra
        ];

        // Podvoji barve in premešaj
        const colorPairs = [...colors, ...colors]
            .sort(() => Math.random() - 0.5);

        const gameBoard = document.getElementById('memory-game');

        // Ustvarimo kartice
        colorPairs.forEach(color => {
            const card = document.createElement('div');
            card.classList.add('memory-card');
            card.dataset.color = color;
            card.style.setProperty('--card-color', color);
            card.addEventListener('click', flipCard);
            gameBoard.appendChild(card);
        });

        let firstCard = null;
        let secondCard = null;
        let lockBoard = false;

        function flipCard() {
            if(lockBoard) return;
            if(this === firstCard) return;

            this.classList.add('flipped');

            if(!firstCard) {
                firstCard = this;
                return;
            }

            secondCard = this;
            checkMatch();
        }

        function checkMatch() {
            const isMatch = firstCard.dataset.color === secondCard.dataset.color;

            if(isMatch) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);

            resetBoard();
        }

        function unflipCards() {
            lockBoard = true;

            setTimeout(() => {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');

                resetBoard();
            }, 1000);
        }

        function resetBoard() {
            [firstCard, secondCard] = [null, null];
            lockBoard = false;
        }
    </script>
</body>
</html>
