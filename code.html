<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Code Editor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        h1 {
            font-size: 1.8em;
            color: #444;
        }
        .editor-section {
            width: 90%;
            margin: 10px 0;
        }
        textarea, input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 1em;
            border-radius: 4px;
            border: 1px solid #ccc;
            resize: vertical;
        }
        button {
            background-color: #0078D4;
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            margin: 10px;
        }
        #preview {
            width: 90%;
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <h1>Basic Code Editor</h1>

    <!-- Input for file name -->
    <div class="editor-section">
        <h2>File Name</h2>
        <input type="text" id="fileName" placeholder="Enter file name (e.g., my_code.html)">
    </div>

    <!-- Unified Editor -->
    <div class="editor-section">
        <h2>Code</h2>
        <textarea id="codeEditor" placeholder="Write your code here..."></textarea>
    </div>

    <!-- Buttons -->
    <button onclick="updatePreview()">Show Preview</button>
    <button onclick="saveFile()">Save File</button>

    <!-- Preview Section -->
    <div id="preview"></div>

    <script>
        function updatePreview() {
            const fileName = document.getElementById("fileName").value;
            const codeContent = document.getElementById("codeEditor").value;
            const previewFrame = document.getElementById('preview');

            if (fileName.endsWith(".html")) {
                previewFrame.innerHTML = codeContent;
            } else if (fileName.endsWith(".css")) {
                previewFrame.innerHTML = `<style>${codeContent}</style><p>CSS Preview</p>`;
            } else if (fileName.endsWith(".js")) {
                previewFrame.innerHTML = `<p>JavaScript Preview</p><script>${codeContent}<\/script>`;
            } else {
                previewFrame.innerHTML = "<p>Unsupported file type. Please use .html, .css, or .js</p>";
            }
        }

        function saveFile() {
            const fileName = document.getElementById("fileName").value || "my_code.html"; // Default file name
            const codeContent = document.getElementById("codeEditor").value;

            const blob = new Blob([codeContent], { type: "text/plain" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = fileName;
            link.click();
        }
    </script>
</body>
</html>
