<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Editor s projekti in zavihki</title>
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%;
      font-family: Arial, sans-serif;
      background: #1e1e1e;
      color: white;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    #header {
      padding: 10px;
      background: #007acc;
      font-weight: bold;
      display: flex; justify-content: space-between; align-items: center;
    }
    #tabs {
      display: flex;
      background: #252526;
      border-bottom: 2px solid #007acc;
      user-select: none;
      overflow-x: auto;
      white-space: nowrap;
    }
    .tab {
      padding: 8px 15px;
      cursor: pointer;
      border-right: 1px solid #444;
      color: #bbb;
      transition: background-color 0.2s, color 0.2s;
      display: flex;
      align-items: center;
    }
    .tab.active {
      background: #007acc;
      color: white;
      font-weight: bold;
    }
    .tab .close-btn {
      margin-left: 10px;
      color: #f44336;
      font-weight: bold;
      cursor: pointer;
    }
    .tab:hover {
      background: #005a9e;
      color: white;
    }
    #addTabBtn {
      padding: 8px 15px;
      cursor: pointer;
      color: #0f0;
      font-weight: bold;
      border-left: 1px solid #444;
      user-select: none;
    }
    #container {
      flex: 1;
      display: flex;
      height: 100%;
      overflow: hidden;
      flex-direction: column;
    }
    #editor {
      flex: 1;
      height: 100%;
    }
    #output {
      height: 120px;
      background: #252526;
      color: #d4d4d4;
      padding: 10px;
      font-family: monospace;
      white-space: pre-wrap;
      border-top: 2px solid #007acc;
      overflow-y: auto;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.47.0/min/vs/loader.js"></script>
 
</head>
<body>

<div id="projectModal">
  <div id="projectModalContent" style="background:#1e1e1e; padding:20px 30px; border-radius:8px; box-shadow:0 0 15px #007acc; text-align:center; width:300px; margin:auto; position:fixed; top:40%; left:0; right:0;">
    <div>Vnesi 5-mestno številko projekta:</div>
    <input type="text" id="projectInput" maxlength="5" autofocus autocomplete="off" style="font-size:1.5em; width:100%; padding:10px; border:none; border-radius:5px; text-align:center; margin-top:10px; background:#252526; color:white;" />
    <button id="projectBtn" style="margin-top:15px; padding:10px 20px; font-size:1.2em; border:none; border-radius:5px; background:#007acc; color:white; cursor:pointer; width:100%;">Pridruži se / Ustvari</button>
    <div id="projectError" style="color:#f44336; margin-top:10px; font-weight:bold; height:1.2em;"></div>
  </div>
</div>

<div id="header" style="display:none;">
  <div>
    Napredni Live Code Editor - Projekt <span id="projectIDdisplay"></span>
  </div>
  <div style="display:flex; align-items:center;">
    <div id="status">Povezava: <span id="connStatus" style="color:lime;">● Povezan</span></div>
    <button id="newProjectBtn" title="Ustvari ali se pridruži novemu projektu" style="margin-left:10px;">Novo</button>
  </div>
</div>

<div id="tabs" style="display:none;">
  <!-- Zavihki se dinamično generirajo tukaj -->
  <div id="addTabBtn">+</div>
</div>

<div id="container" style="display:none; flex-direction: column;">
  <div id="editor"></div>
  <div id="output">Rezultat evala in napake se prikažejo tukaj...</div>
</div>
<script type="module">
  // === Firebase importi ===
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-analytics.js";
  import { getDatabase, ref, onValue, set, off, remove, get, child } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

  // === Firebase konfiguracija ===
  const firebaseConfig = {
    apiKey: "AIzaSyCaKT0CCg1xNJanG4-6Pox2UaH_1rSL3M0",
    authDomain: "chater2-fc480.firebaseapp.com",
    databaseURL: "https://chater2-fc480-default-rtdb.firebaseio.com",
    projectId: "chater2-fc480",
    storageBucket: "chater2-fc480.appspot.com",
    messagingSenderId: "623092508370",
    appId: "1:623092508370:web:08cf5d58c6edcfac096f0b",
    measurementId: "G-5W40WP5YEG"
  };

  // === Inicializacija Firebase ===
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const database = getDatabase(app);

  // === Spremenljivke ===
  let editor, model;
  let currentProjectID = null;
  let currentFile = null;
  let files = {};
  let fileRefs = {};
  let ignoreRemote = false;

  // === DOM elementi ===
  const modal = document.getElementById('projectModal');
  const input = document.getElementById('projectInput');
  const btn = document.getElementById('projectBtn');
  const errorDiv = document.getElementById('projectError');
  const header = document.getElementById('header');
  const container = document.getElementById('container');
  const projectIDdisplay = document.getElementById('projectIDdisplay');
  const newProjectBtn = document.getElementById('newProjectBtn');
  const tabsDiv = document.getElementById('tabs');
  const addTabBtn = document.getElementById('addTabBtn');
  const outputDiv = document.getElementById('output');
  const connStatus = document.getElementById('connStatus');

  // === Funkcije ===

  function validateProjectID(id) {
    return /^\d{5}$/.test(id);
  }

  btn.addEventListener('click', () => {
    const val = input.value.trim();
    if (!validateProjectID(val)) {
      errorDiv.textContent = "Številka mora biti točno 5-mestna in samo številke!";
      return;
    }
    errorDiv.textContent = "";
    startEditorForProject(val);
  });

  input.addEventListener('keyup', (e) => {
    if (e.key === "Enter") btn.click();
  });

  newProjectBtn.addEventListener('click', () => {
    modal.style.display = 'flex';
    input.value = '';
    errorDiv.textContent = '';
    input.focus();
  });

  addTabBtn.addEventListener('click', () => {
    const newName = prompt("Vnesi ime nove datoteke (npr. main.js, index.html):");
    if (newName && !files[newName]) {
      addNewFile(newName, '');
    } else if (files[newName]) {
      alert("Datoteka s tem imenom že obstaja!");
    }
  });

  function addNewFile(name, content) {
    files[name] = content;
    const fileRef = ref(database, `/live-editor/projects/${currentProjectID}/files/${name}`);
    fileRefs[name] = fileRef;

    onValue(fileRef, snapshot => {
      const val = snapshot.val() || '';
      if (val !== files[name]) {
        files[name] = val;
        if (currentFile === name && !ignoreRemote) {
          ignoreRemote = true;
          editor.setValue(val);
          ignoreRemote = false;
          runCodeAndShowOutput(val);
        }
      }
    });

    renderTabs();
    switchFile(name);
    if (!content) set(fileRef, '');
  }

  function renderTabs() {
    tabsDiv.innerHTML = '';
    for (const name in files) {
      const tab = document.createElement('div');
      tab.classList.add('tab');
      if (name === currentFile) tab.classList.add('active');
      tab.textContent = name;

      const closeBtn = document.createElement('span');
      closeBtn.textContent = '×';
      closeBtn.classList.add('close-btn');
      closeBtn.title = "Zapri ta zavihek";
      closeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        closeFile(name);
      });

      tab.appendChild(closeBtn);
      tab.addEventListener('click', () => {
        switchFile(name);
      });

      tabsDiv.appendChild(tab);
    }
    tabsDiv.appendChild(addTabBtn);
  }

  function switchFile(name) {
    if (currentFile === name) return;
    if (currentFile) files[currentFile] = editor.getValue();
    currentFile = name;
    editor.setValue(files[name]);
    renderTabs();
    runCodeAndShowOutput(files[name]);
  }

  function closeFile(name) {
    if (currentFile === name) {
      const keys = Object.keys(files);
      const idx = keys.indexOf(name);
      if (keys.length > 1) {
        const nextIdx = idx === 0 ? 1 : idx - 1;
        switchFile(keys[nextIdx]);
      } else {
        currentFile = null;
        editor.setValue('');
      }
    }
    if (fileRefs[name]) {
      off(fileRefs[name]);
      remove(fileRefs[name]);
      delete fileRefs[name];
    }
    delete files[name];
    renderTabs();
  }

  function runCodeAndShowOutput(code) {
    try {
      outputDiv.textContent = '';
      const result = eval(code);
      outputDiv.textContent = result === undefined ? 'Koda izvršena brez napak.' : String(result);
    } catch (e) {
      outputDiv.textContent = 'Napaka: ' + e.message;
    }
  }

  // === Inicializacija Monaco Editorja ===
  require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.47.0/min/vs' }});
  require(['vs/editor/editor.main'], function () {
    editor = monaco.editor.create(document.getElementById('editor'), {
      value: '',
      language: 'javascript',
      theme: 'vs-dark',
      automaticLayout: true,
      minimap: { enabled: false },
    });

    editor.onDidChangeModelContent(() => {
      if (ignoreRemote) return;
      if (!currentFile) return;
      files[currentFile] = editor.getValue();
      if (fileRefs[currentFile]) {
        set(fileRefs[currentFile], files[currentFile]);
      }
      runCodeAndShowOutput(files[currentFile]);
    });
  });

  function startEditorForProject(id) {
    currentProjectID = id;
    modal.style.display = 'none';
    header.style.display = 'flex';
    container.style.display = 'flex';
    tabsDiv.style.display = 'flex';
    projectIDdisplay.textContent = id;

    const filesRef = ref(database, `/live-editor/projects/${id}/files`);
    get(filesRef).then(snapshot => {
      files = snapshot.val() || {};
      if (Object.keys(files).length === 0) {
        addNewFile('main.js', '// Tvoja prva datoteka\nconsole.log("Pozdravljen svet!");');
      } else {
        for (const name in files) {
          addNewFile(name, files[name]);
        }
        switchFile(Object.keys(files)[0]);
      }
    });

    // status povezave
    const connectedRef = ref(database, ".info/connected");
    onValue(connectedRef, snap => {
      const connected = snap.val();
      if (connStatus) {
        connStatus.textContent = connected ? '● Povezan' : '● Ni povezave';
        connStatus.style.color = connected ? 'lime' : 'red';
      }
    });
  }

  // Prikaži modal ob začetku
  modal.style.display = 'flex';
  input.focus();
</script>
</body>
</html>
