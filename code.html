<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Code Editor</title>
    <!-- Povezava do CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
    <style>
        /* Modern Style */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f5f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        h1 {
            font-size: 1.8em;
            color: #222;
            margin-bottom: 10px;
        }
        .editor-section {
            width: 90%;
            margin: 15px 0;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
            transition: box-shadow 0.3s ease;
        }
        .editor-section:hover {
            box-shadow: 0px 6px 16px rgba(0, 0, 0, 0.15);
        }
        textarea {
            display: none;
        }
        .CodeMirror {
            height: 200px;
            border: none;
            font-size: 1em;
        }
        button {
            background-color: #0078D4;
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin: 10px;
        }
        button:hover {
            background-color: #005A9E;
            transform: translateY(-3px);
        }
        button:active {
            transform: translateY(0);
        }
        #preview {
            width: 90%;
            background: #f4f5f7;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <h1>Modern Code Editor</h1>

    <!-- HTML Editor -->
    <div class="editor-section">
        <h2 style="padding: 10px 20px; background: #f4f5f7;">HTML</h2>
        <textarea id="htmlEditor"></textarea>
    </div>

    <!-- CSS Editor -->
    <div class="editor-section">
        <h2 style="padding: 10px 20px; background: #f4f5f7;">CSS</h2>
        <textarea id="cssEditor"></textarea>
    </div>

    <!-- JavaScript Editor -->
    <div class="editor-section">
        <h2 style="padding: 10px 20px; background: #f4f5f7;">JavaScript</h2>
        <textarea id="jsEditor"></textarea>
    </div>

    <!-- Buttons -->
    <button onclick="updatePreview()">Show Preview</button>
    <button onclick="saveFile()">Save File</button>

    <!-- Preview Section -->
    <div id="preview"></div>

    <!-- CodeMirror Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/edit/closetag.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/edit/closebrackets.min.js"></script>

    <script>
        // Initialize CodeMirror editors with autocomplete
        const htmlEditor = CodeMirror.fromTextArea(document.getElementById("htmlEditor"), {
            mode: "xml",
            lineNumbers: true,
            autoCloseTags: true,
            theme: "default"
        });

        const cssEditor = CodeMirror.fromTextArea(document.getElementById("cssEditor"), {
            mode: "css",
            lineNumbers: true,
            autoCloseBrackets: true,
            theme: "default"
        });

        const jsEditor = CodeMirror.fromTextArea(document.getElementById("jsEditor"), {
            mode: "javascript",
            lineNumbers: true,
            autoCloseBrackets: true,
            theme: "default"
        });

        function updatePreview() {
            const htmlContent = htmlEditor.getValue();
            const cssContent = cssEditor.getValue();
            const jsContent = jsEditor.getValue();

            const previewFrame = document.getElementById('preview');
            previewFrame.innerHTML = `
                <style>${cssContent}</style>
                ${htmlContent}
                <script>${jsContent}<\/script>
            `;
        }

        function saveFile() {
            const htmlContent = htmlEditor.getValue();
            const cssContent = cssEditor.getValue();
            const jsContent = jsEditor.getValue();

            const fullContent = `
                <!DOCTYPE html>
                <html lang="en">
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>Saved Code</title>
                    <style>${cssContent}</style>
                </head>
                <body>
                    ${htmlContent}
                    <script>${jsContent}<\/script>
                </body>
                </html>
            `;

            const blob = new Blob([fullContent], { type: "text/html" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "my_code.html";
            link.click();
        }
    </script>
</body>
</html>
