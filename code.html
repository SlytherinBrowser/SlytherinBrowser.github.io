<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Code Editor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/material.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/hint/show-hint.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #282c34;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #fff;
            margin: 0;
            height: 100vh;
        }
        h1 {
            font-size: 1.8em;
            color: #61dafb;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        .button {
            background-color: #61dafb;
            color: #282c34;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            margin: 0 5px;
            transition: transform 0.2s ease;
        }
        .button:hover {
            transform: scale(1.05);
        }
        .editor-section {
            width: 90%;
            height: 60%;
            margin-bottom: 10px;
        }
        #preview {
            width: 90%;
            background: #1e1e1e;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.3);
            color: #ddd;
            overflow-y: auto;
            height: 25%;
        }
    </style>
</head>
<body>
    <h1>Dynamic Code Editor</h1>

    <!-- Controls for file name and buttons -->
    <div class="controls">
        <input type="text" id="fileName" placeholder="Enter file name (e.g., my_code.html)">
        <button class="button" onclick="updatePreview()">Preview</button>
        <button class="button" onclick="saveFile()">Save</button>
    </div>

    <!-- Code Editor -->
    <div class="editor-section">
        <textarea id="codeEditor"></textarea>
    </div>

    <!-- Preview Section -->
    <div id="preview">Your preview will appear here</div>

    <!-- CodeMirror Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/hint/show-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/hint/html-hint.min.js"></script>
    <script>
        // Initialize CodeMirror with syntax highlighting and autocomplete
        const codeEditor = CodeMirror.fromTextArea(document.getElementById("codeEditor"), {
            lineNumbers: true,
            mode: "htmlmixed",
            theme: "material",
            autoCloseTags: true,
            matchBrackets: true,
            extraKeys: { "Ctrl-Space": "autocomplete" },
        });
        codeEditor.setSize("100%", "100%");

        // Enable auto-complete suggestions automatically
        codeEditor.on("inputRead", function(editor, event) {
            if (!editor.state.completionActive && event.text[0].match(/[\w\.\-]/)) {
                CodeMirror.commands.autocomplete(editor);
            }
        });

        // Update preview based on file type
        function updatePreview() {
            const fileName = document.getElementById("fileName").value;
            const codeContent = codeEditor.getValue();
            const previewFrame = document.getElementById('preview');

            if (fileName.endsWith(".html")) {
                previewFrame.innerHTML = codeContent;
            } else if (fileName.endsWith(".css")) {
                previewFrame.innerHTML = `<style>${codeContent}</style><p>CSS Preview</p>`;
            } else if (fileName.endsWith(".js")) {
                previewFrame.innerHTML = `<p>JavaScript Preview</p><script>${codeContent}<\/script>`;
            } else {
                previewFrame.innerHTML = "<p>Unsupported file type. Please use .html, .css, or .js</p>";
            }
        }

        // Save file function
        function saveFile() {
            const fileName = document.getElementById("fileName").value || "my_code.html";
            const codeContent = codeEditor.getValue();
            const blob = new Blob([codeContent], { type: "text/plain" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = fileName;
            link.click();
        }
    </script>
</body>
</html>
