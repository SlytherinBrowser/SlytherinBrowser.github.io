<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>Prijava / Registracija</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
    body{
      background:url('slika.png') no-repeat center center fixed;background-size:cover;
      height:100vh;display:flex;justify-content:center;align-items:center;
    }
    .container{
      background:rgba(255,255,255,.08);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
      padding:30px;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.25);width:90%;max-width:420px;color:white
    }
    h2{text-align:center;margin-bottom:20px;font-weight:500}
    input,button{
      width:100%;padding:10px;margin:8px 0;border:1px solid rgba(255,255,255,.3);
      border-radius:8px;background-color:rgba(255,255,255,.05);color:white;outline:none;transition:border .3s
    }
    input::placeholder{color:rgba(255,255,255,.6)}
    input:focus{border-color:white}
    button{background-color:rgba(255,255,255,.15);border:none;color:white;font-weight:600;cursor:pointer;transition:background .3s}
    button:hover{background-color:rgba(255,255,255,.25)}
    .toggle{text-align:center;margin-top:15px;cursor:pointer;color:#ddd;font-size:.9em;text-decoration:underline}
    .hidden{display:none}
    .row{display:flex;gap:8px}
  </style>
</head>
<body>
  <div class="container">
    <!-- PRIJAVA -->
    <div id="loginForm">
      <h2>Prijava</h2>
      <input type="email" id="logEmail" placeholder="Email (za Loterijo lahko dodaš /admin)" />
      <input type="password" id="logPass" placeholder="Geslo" />

      <!-- Navigacija – ob kliku najprej prijavi, nato odpelje -->
      <div class="row">
        <button onclick="loginAndGo('slychat.html')">Chat</button>
        <button onclick="loginAndGo('blackj.html')">Blackjack</button>
        <button onclick="loginAndGo('teste.html')">Loterija</button>
      </div>

      <button onclick="resetPassword()" style="margin-top:8px;background-color:rgba(255,255,255,.1);font-size:.9em;">Pozabil/a geslo?</button>
      <div class="toggle" onclick="toggleForms()">Še nimaš računa? Registriraj se</div>
    </div>

    <!-- REGISTRACIJA -->
    <div id="registerForm" class="hidden">
      <h2>Registracija</h2>
      <input type="text" id="regName" placeholder="Ime" />
      <input type="email" id="regEmail" placeholder="Email" />
      <input type="password" id="regPass" placeholder="Geslo" />
      <button onclick="register()">Registriraj</button>
      <div class="toggle" onclick="toggleForms()">Že imaš račun? Prijavi se</div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad",
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // NE delaj nobenih auto-preusmeritev tukaj
    auth.onAuthStateChanged(() => { /* namenoma prazno */ });

    function sanitizeEmailForAdmin(raw){
      const isAdmin = raw.endsWith('/admin');
      const email = isAdmin ? raw.replace(/\/admin$/,'') : raw;
      return { email, isAdmin };
    }

    async function register() {
      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const pass = document.getElementById("regPass").value;
      if (!name || !email || !pass) return alert("Prosim, izpolni vsa polja.");

      try{
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        await cred.user.updateProfile({ displayName: name });
        await db.ref("users/" + cred.user.uid).set({
          displayName: name, email: email, coins: 0
        });
        alert("Registracija uspešna! Zdaj klikni, kam želiš iti (Chat/Blackjack/Loterija).");
        // ostanemo na strani – uporabnik izbere destinacijo
      }catch(e){
        alert(e.message);
      }
    }

    async function loginAndGo(dest){
      const raw = document.getElementById("logEmail").value.trim();
      const pass = document.getElementById("logPass").value;
      if(!raw || !pass) return alert("Vnesi email in geslo.");

      const { email, isAdmin } = sanitizeEmailForAdmin(raw);

      try{
        // Če smo že prijavljeni z istim mailom, preskoči login
        const current = auth.currentUser;
        if(!current || current.email !== email){
          // če je prijavljen z drugim računom, ga odjavi
          if(current && current.email !== email){ await auth.signOut(); }
          await auth.signInWithEmailAndPassword(email, pass);
        }

        // Posebno: /admin velja samo za Loterijo
        if(isAdmin && dest === 'teste.html'){
          const adminSnap = await db.ref('lottery/adminUid').once('value');
          const currentAdmin = adminSnap.val();
          const uid = auth.currentUser.uid;
          if (!currentAdmin) {
            await db.ref('lottery/adminUid').set(uid);
            await db.ref('lottery/adminSince').set(Date.now());
            alert("Uspešno nastavljen kot ADMIN loterije.");
          } else if (currentAdmin !== uid) {
            alert("Admin je že nastavljen. Nadaljujem kot navaden igralec.");
          } else {
            // si že admin
          }
        }

        // gremo na ciljno stran
        window.location.href = dest;

      }catch(e){
        alert(e.message);
      }
    }

    async function resetPassword() {
      const raw = document.getElementById("logEmail").value.trim();
      if (!raw) return alert("Vnesi email.");
      const email = raw.replace(/\/admin$/,'');
      try{
        await auth.sendPasswordResetEmail(email);
        alert("Poslali smo povezavo za ponastavitev.");
      }catch(e){
        alert(e.message);
      }
    }

    function toggleForms() {
      document.getElementById("loginForm").classList.toggle("hidden");
      document.getElementById("registerForm").classList.toggle("hidden");
    }
  </script>
</body>
</html>
