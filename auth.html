<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>Prijava / Registracija</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: url('slika.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      width: 90%;
      max-width: 380px;
      color: white;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      background-color: rgba(255, 255, 255, 0.05);
      color: white;
      outline: none;
      transition: border 0.3s;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    input:focus {
      border-color: white;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background-color: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: rgba(255, 255, 255, 0.25);
    }

    .toggle {
      text-align: center;
      margin-top: 15px;
      cursor: pointer;
      color: #dddddd;
      font-size: 0.9em;
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- PRIJAVA -->
    <div id="loginForm">
      <h2>Prijava</h2>
      <input type="email" id="logEmail" placeholder="Email" />
      <input type="password" id="logPass" placeholder="Geslo" />
      <button onclick="login()">Prijavi se</button>
     <button onclick="window.location.href='caller.html'" style="margin-top: 10px; background-color: rgba(0, 150, 136, 0.8); border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; width: 100%;">
  Prijava v klic
</button>
      <button
        onclick="resetPassword()"
        style="margin-top: 8px; background-color: rgba(255,255,255,0.1); font-size: 0.9em;"
      >
        Pozabil/a geslo?
      </button>
      <div class="toggle" onclick="toggleForms()">Še nimaš računa? Registriraj se</div>
    </div>

    <!-- REGISTRACIJA -->
    <div id="registerForm" class="hidden">
      <h2>Registracija</h2>
      <input type="text" id="regName" placeholder="Ime" />
      <input type="email" id="regEmail" placeholder="Email" />
      <input type="password" id="regPass" placeholder="Geslo" />
      <button onclick="register()">Registriraj</button>
      <div class="toggle" onclick="toggleForms()">Že imaš račun? Prijavi se</div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad",
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // ✅ Avtomatska prijava, če je že prijavljen
    auth.onAuthStateChanged((user) => {
      if (user) {
        window.location.href = "slychat.html";
      }
    });

    function register() {
      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const pass = document.getElementById("regPass").value;

      if (!name || !email || !pass) {
        alert("Prosim, izpolni vsa polja.");
        return;
      }

      auth
        .createUserWithEmailAndPassword(email, pass)
        .then((userCredential) => {
          const user = userCredential.user;

          // Nastavi displayName v Firebase auth profilu
          return user
            .updateProfile({
              displayName: name,
            })
            .then(() => {
              // Shrani v bazo
              return db.ref("users/" + user.uid).set({
                displayName: name,
                email: email,
              });
            });
        })
        .then(() => {
          alert("Registracija uspešna!");
          window.location.href = "slychat1.html";
        })
        .catch((error) => alert(error.message));
    }

    function login() {
      const email = document.getElementById("logEmail").value.trim();
      const pass = document.getElementById("logPass").value;
      auth
        .signInWithEmailAndPassword(email, pass)
        .then(() => (window.location.href = "slychat.html"))
        .catch((error) => alert(error.message));
    }

    function resetPassword() {
      const email = document.getElementById("logEmail").value.trim();
      if (!email) {
        alert("Prosimo, vnesite vaš email za ponastavitev gesla.");
        return;
      }

      auth
        .sendPasswordResetEmail(email)
        .then(() => {
          alert("Na vaš email je bilo poslano sporočilo za ponastavitev gesla.");
        })
        .catch((error) => {
          alert("Napaka: " + error.message);
        });
    }

    function toggleForms() {
      document.getElementById("loginForm").classList.toggle("hidden");
      document.getElementById("registerForm").classList.toggle("hidden");
    }
function loginToGame() {
  window.location.href = "gamechat.html";
}
function startReset() {
  const username = document.getElementById("usernameForReset").value.trim();

  if (!username) {
    alert("Vnesi uporabniško ime.");
    return;
  }

  // Poiščemo uporabnika po displayName
  db.ref("users").once("value", (snapshot) => {
    let found = false;
    snapshot.forEach((child) => {
      const user = child.val();
      if (user.displayName === username) {
        found = true;
        // Shranimo email v input (za prikaz ali preverbo)
        document.getElementById("realResetEmail").value = user.email;
        document.getElementById("resetStep2").classList.remove("hidden");
        alert("Uporabnik najden! Vnesi email za ponastavitev.");
      }
    });

    if (!found) {
      alert("Uporabnik s tem imenom ni bil najden.");
    }
  });
}

function confirmReset() {
  const email = document.getElementById("realResetEmail").value.trim();

  if (!email) {
    alert("Vnesi email naslov.");
    return;
  }

  auth
    .sendPasswordResetEmail(email)
    .then(() => {
      alert("Na vpisani e-mail je bila poslana povezava za ponastavitev gesla.");
      document.getElementById("resetStep2").classList.add("hidden");
    })
    .catch((error) => {
      alert("Napaka: " + error.message);
    });
}

  </script>
</body>
</html>
