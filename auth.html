<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>Ready Player Me Avatar v Babylon.js</title>
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    #renderCanvas { width: 100%; height: 100%; display:block; }
    #userLabel {
      position: absolute;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 18px;
      background: rgba(0,0,0,0.5);
      padding: 4px 8px;
      border-radius: 4px;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
      transform: translate(-50%, 0);
    }
    #loginForm {
      position: absolute;
      top: 10px; left: 10px;
      background: rgba(0,0,0,0.7);
      padding: 15px;
      border-radius: 8px;
      color: white;
      font-family: Arial, sans-serif;
      z-index: 1000;
    }
    #loginForm input {
      margin-bottom: 8px;
      width: 200px;
      padding: 5px;
      font-size: 14px;
    }
    #loginForm button {
      padding: 5px 10px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <canvas id="renderCanvas"></canvas>

  <div id="userLabel" style="display:none;"></div>

  <div id="loginForm">
    <div><input type="email" id="email" placeholder="Email" /></div>
    <div><input type="password" id="password" placeholder="Geslo" /></div>
    <button id="btnLogin">Prijavi se</button>
    <div id="loginError" style="color:#f88; margin-top:5px;"></div>
  </div>

  <!-- Babylon.js -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script>
    // Firebase konfiguracija - zamenjaj s svojimi podatki
    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      databaseURL: "https://chater-cf682-default-rtdb.firebaseio.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // Spremenljivke Babylon
    let engine, scene, camera;
    let avatar;
    let userLabel = document.getElementById("userLabel");
    let currentUser;

    // Pridobi avatar URL iz baze
    async function loadUserAvatarURL(uid) {
      try {
        const snapshot = await db.ref(`users/${uid}/avatarURL2`).get();
        if (snapshot.exists()) {
          return snapshot.val();
        }
      } catch (e) {
        console.error("Napaka pri pridobivanju avatarURL2:", e);
      }
      return null;
    }

    // Posodobi pozicijo labela pod avatarjem
    function updateUserLabelPosition() {
      if (!avatar || !userLabel) return;
      const pos = avatar.getBoundingInfo().boundingBox.centerWorld;
      const coords = BABYLON.Vector3.Project(
        pos,
        BABYLON.Matrix.Identity(),
        scene.getTransformMatrix(),
        camera.viewport.toGlobal(
          engine.getRenderWidth(),
          engine.getRenderHeight()
        )
      );
      userLabel.style.left = coords.x + "px";
      userLabel.style.top = (coords.y + 20) + "px";
    }

    async function startGame() {
      const canvas = document.getElementById("renderCanvas");
      engine = new BABYLON.Engine(canvas, true);
      scene = new BABYLON.Scene(engine);

      // Kamera in svetloba
      camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/3, 4, BABYLON.Vector3.Zero(), scene);
      camera.attachControl(canvas, true);
      const light = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0, 1, 0), scene);
      light.intensity = 0.9;

      // Tla
      const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 10, height: 10}, scene);
      ground.position.y = -0.5;

      // Najprej poskusi naložiti avatar iz URL-ja
      const avatarURL = await loadUserAvatarURL(currentUser.uid);

      if (avatarURL) {
        try {
          // Naloži avatar model (glb, gltf)
          const result = await BABYLON.SceneLoader.ImportMeshAsync("", avatarURL, "", scene);
          if (result.meshes.length > 0) {
            avatar = result.meshes[0];
            avatar.position = BABYLON.Vector3.Zero();
            avatar.scaling = new BABYLON.Vector3(1, 1, 1);
          } else {
            throw new Error("Ni bilo naloženih mesh-ov.");
          }
        } catch (e) {
          console.warn("Napaka pri nalaganju avatarja iz URL, prikažem kocko:", e);
          avatar = BABYLON.MeshBuilder.CreateBox("avatar", {size: 1}, scene);
          avatar.position.y = 0.5;
          const mat = new BABYLON.StandardMaterial("mat", scene);
          mat.diffuseColor = new BABYLON.Color3(0.2, 0.6, 1);
          avatar.material = mat;
        }
      } else {
        // Ni URL, naredi default kocko
        avatar = BABYLON.MeshBuilder.CreateBox("avatar", {size: 1}, scene);
        avatar.position.y = 0.5;
        const mat = new BABYLON.StandardMaterial("mat", scene);
        mat.diffuseColor = new BABYLON.Color3(0.2, 0.6, 1);
        avatar.material = mat;
      }

      // Prikaži label z imenom
      userLabel.style.display = "block";
      userLabel.textContent = currentUser.displayName || currentUser.email || "Anonimni";

      engine.runRenderLoop(() => {
        scene.render();
        updateUserLabelPosition();
      });

      window.addEventListener("resize", () => {
        engine.resize();
      });
    }

    // Prijavni gumb in funkcija
    document.getElementById("btnLogin").addEventListener("click", async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorDiv = document.getElementById("loginError");
      errorDiv.textContent = "";

      try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        currentUser = userCredential.user;

        // Skrij login formo
        document.getElementById("loginForm").style.display = "none";

        // Zaženi igro z avatarjem
        startGame();
      } catch (err) {
        errorDiv.textContent = "Napaka pri prijavi: " + err.message;
      }
    });

    // Če želiš avtomatsko prijavo ali testiranje, lahko tukaj nastaviš
    // auth.signInWithEmailAndPassword("test@example.com", "geslo123").then(...)

  </script>
</body>
</html>
