<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <title>Slychat - Prijava / Registracija</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <!-- Stil -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: url('slika.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      width: 90%;
      max-width: 380px;
      color: white;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      background-color: rgba(255, 255, 255, 0.05);
      color: white;
      outline: none;
      transition: border 0.3s;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    input:focus {
      border-color: white;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background-color: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: rgba(255, 255, 255, 0.25);
    }

    .toggle {
      text-align: center;
      margin-top: 15px;
      cursor: pointer;
      color: #dddddd;
      font-size: 0.9em;
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="formTitle">Prijava</h2>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Geslo" />
    <button id="actionBtn" onclick="login()">Prijava</button>
    <div class="toggle" onclick="toggleForm()">Nimaš računa? Registriraj se</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBXOP6VYKpaM0Zwa_l0KPZl6Q1z-xpgzX8",
      authDomain: "chater-cf682.firebaseapp.com",
      projectId: "chater-cf682",
      storageBucket: "chater-cf682.appspot.com",
      messagingSenderId: "233632075480",
      appId: "1:233632075480:web:fbf5101a3fda63fdfb51ad",
      measurementId: "G-32E3BYYLKS",
      databaseURL: "https://chater-cf682-default-rtdb.europe-west1.firebasedatabase.app/"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let isRegister = false;

    function toggleForm() {
      isRegister = !isRegister;
      document.getElementById("formTitle").textContent = isRegister ? "Registracija" : "Prijava";
      document.getElementById("actionBtn").textContent = isRegister ? "Registracija" : "Prijava";
      document.querySelector(".toggle").textContent = isRegister
        ? "Imaš račun? Prijavi se"
        : "Nimaš računa? Registriraj se";
      document.getElementById("actionBtn").setAttribute("onclick", isRegister ? "register()" : "login()");
    }

    function register() {
      const email = document.getElementById("email").value.trim();
      const pass = document.getElementById("password").value.trim();

      if (!email || !pass) return alert("Vnesi email in geslo.");

      auth.createUserWithEmailAndPassword(email, pass)
        .then((userCredential) => {
          const user = userCredential.user;
          const userKey = email.replace(/\./g, "_");

          db.ref(`users/${userKey}`).set({
            email: user.email,
            uid: user.uid
          }).then(() => {
            alert("Registracija uspešna!");
            window.location.href = "slychat.html";
          });
        })
        .catch((error) => alert(error.message));
    }

    function login() {
      const email = document.getElementById("email").value.trim();
      const pass = document.getElementById("password").value.trim();

      if (!email || !pass) return alert("Vnesi email in geslo.");

      auth.signInWithEmailAndPassword(email, pass)
        .then(() => window.location.href = "slychat.html")
        .catch((error) => alert(error.message));
    }
  </script>
</body>
</html>
